e 'thief'.", "hints": ["Who opens doors gently?"]}, {"type": "single", "q": "Effect: Anita avoided responsibility and Anand faced the consequences alone. Cause:", "options": ["She had warned him not to bring her in if there was a shelling", "She was away", "Papa liked her", "She fixed it"], "answer": 0, "explanation": "'If you get a shelling, don't bring me in.'", "hints": ["Her warning."]}, {"type": "single", "q": "Cause: We watched the film 'Back to the Future'. Effect:", "options": ["Anand decided to build a time machine", "Papa bought a TV", "Anand slept", "Ma cooked"], "answer": 0, "explanation": "The film is about a time machine.", "hints": ["Anand's new project."]}, {"type": "single", "q": "Effect: Papa firmly said NO to trying out the time machine. Cause:", "options": ["He feared another disaster after the noise and mess", "He liked it", "He had no time", "He was away"], "answer": 0, "explanation": "Anand had been dismantling the house's gadgets.", "hints": ["Remember the burglar alarm."]}]}, {"type": "text", "title": "📖 Part II: A night with a thief", "md": "Papa and Ma leave by the afternoon train and will be back next evening. Anand falls asleep; Anita stays up to finish a murder-story novel. About 11:30 she hears scratching at the front door, then a **rattle and a click**. Scared, she wakes Anand, who mutters groggily, \"Go and open it then.\" The door swings open and they see a ruffianly fellow with a green scarf: **Boppa**, who had recently begun sweeping the compounds in their row of houses. He knew exactly when the occupants were out. He grins and brandishes his cudgel: \"One squeak out of you and see what happens,\" and backs out, sliding the latch.\n\nHe returns and asks where the father's room is. Anita is about to point upstairs, but Anand quickly says, \"The one next to this one.\" That is Anand's own room with the time machine. Anita scolds him ('silly goose'), but Anand says it gives them time to think and that the man will take a while to find the light switch.\n\nThen there is a crash and a loud scream, followed by muffled thumps, an eerie whine and a low humming. \"My time machine, he's started it!\" gasps Anand. There is a fainter howl and much clattering. The children shout for all they are worth, and soon **Mrs. Sharma, her husband and Dr. Mohan** run up the drive. They unlock the door and the children try to explain. In Anand's room the time machine hums softly, but Boppa is gone. Anand points to the green scarf near the switchboard. A search of the house finds nobody. \"My time machine! He's gone through that!\" says Anand, eyes shining. Mr. Sharma smiles indulgently at the boy's imagination and stays the night.\n\nBoppa is never seen again. Anand insists the time machine worked and sent Boppa into the past. Papa dismantled it, maybe with a niggling suspicion that it did work. Anand is convinced he is a genius and starts a new project: a telephone to contact creatures in outer space.\n\n*Anita Rau Badami*"}, {"type": "quiz", "id": "c7-ch03-quiz-order-inv", "title": "Arrange the events", "questions": [{"type": "order", "q": "Order the events.", "items": ["Anita wakes Anand and says someone is trying to get in", "The door swings open and they see Boppa with an evil grin", "Anand misleads Boppa into his own room", "The Sharmas and Dr. Mohan unlock the door and enter", "Boppa is gone, but his green scarf lies near the time machine"], "explanation": "This is the order in which events occur (the book's items 4, 1, 5, 3, 2).", "hints": ["Anita first hears the scratching."]}]}, {"type": "reveal", "prompt": "II. Do you think Anand kept his promise about the time machine?", "md": "Opinion question. **Yes:** he did not try the machine himself; it was Boppa who started it. **No:** he promised only half-heartedly and had built it to use it; Anand also tricked Boppa into the machine's room. Give your reason."}, {"type": "summary", "points": ["Anand's burglar alarm soaks his own father.", "He builds a time machine; Papa and Ma forbid using it.", "A thief, Boppa, enters while they are alone; Anand sends him to the machine's room.", "Boppa disappears leaving a scarf; Anand believes the machine worked."]}], "minutes": 35, "terms": [{"term": "tinkering", "def": "experimenting or fiddling with machines"}, {"term": "sceptical", "def": "doubtful"}, {"term": "intruder", "def": "a person who enters without permission"}], "source": {"chapter": "ch03", "sections": ["Before we read", "Let us read I–II", "Let us discuss"], "pages": "91–98"}, "id": "c7u3-01-invention-read", "chapter": "c7u3", "kind": "lesson"}, "c7u3-02-invention-reflect": {"title": "My Brother's Great Invention: Reflect", "summary": "Extract questions, character traits and long answers.", "blocks": [{"type": "quiz", "id": "c7-ch03-quiz-inv-ext1", "title": "Extract 1: 'let me put you in the picture'", "questions": [{"type": "single", "q": "When Anita says '…let me put you in the picture', she wants to ______ the situation for the reader.", "options": ["introduce", "summarise"], "answer": 0, "explanation": "She introduces the characters and background.", "hints": ["She is starting the story."]}, {"type": "single", "q": "'Tinkering' means he enjoys ______ gadgets.", "options": ["dismantling and creating", "labelling or naming", "repairing or improving", "collecting and displaying"], "answer": 0, "explanation": "He takes things apart and makes new things.", "hints": ["He takes apart household gadgets."]}, {"type": "single", "q": "Anand's personality is best described as ______.", "options": ["methodical and cautious", "creative and experimental", "energetic and hasty", "shy and reserved"], "answer": 1, "explanation": "He experiments and creates.", "hints": ["Look at his inventions."]}, {"type": "single", "q": "Compare what Anita thinks of Anand with what he thinks of himself.", "options": ["Anita thinks he only imagines he is a scientist and is a nuisance; he thinks he is a genius", "They both think he is a genius", "They both think he is lazy", "Anita admires him; he is shy"], "answer": 0, "explanation": "Anita is amused and doubtful; Anand is full of confidence.", "hints": ["Remember the end of the story."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-inv-ext2", "title": "Extract 2: 'The one next to this one'", "questions": [{"type": "fill", "q": "Anita was angry with Anand because ______.", "answer": ["he sent the thief to his own room", "he misled the thief to his room", "he sent the burglar to his room"], "explanation": "He told the thief that the father's room was his own.", "placeholder": "reason", "hints": ["She called him a 'silly goose'."]}, {"type": "fill", "q": "Which action shows Anand's presence of mind? He ______ (what he told the thief).", "answer": ["misled the thief into his room", "sent the thief to the time machine room", "told the thief the wrong room", "directed the thief to his own room"], "explanation": "He quickly pointed the thief to a different room to gain time.", "placeholder": "action", "hints": ["Quick thinking under pressure."]}, {"type": "single", "q": "What might be the cause of the strange noises from the next room?", "options": ["The intruder moving furniture", "Anand's time machine getting activated", "The intruder locating the light switch", "Anand's invention malfunctioning"], "answer": 1, "explanation": "Anand cries 'My time machine, he's started it!' (the story leaves it a delightful mystery).", "hints": ["The noises come from the room with the machine."]}, {"type": "single", "q": "Which words best describe the atmosphere in this extract?", "options": ["relaxing and sad", "peaceful and joyful", "tense and suspenseful", "only sad"], "answer": 2, "explanation": "Scary noises, a thief and waiting create tension and suspense.", "hints": ["Thief + strange noises."]}]}, {"type": "text", "md": "**Character traits (II).** Pick traits from: creative, curious, careful, responsible, bothersome, confident."}, {"type": "table", "headers": ["Character", "Trait", "Evidence from the text"], "rows": [["Anand", "bothersome", "He has got on Papa's nerves and frightened people half to death."], ["Anand", "creative / curious", "He loves tinkering with gadgets and creates inventions."], ["Anand", "confident", "'Nothing will go wrong this time. I've planned it out carefully.'"], ["Anita", "responsible", "'We're old enough to look after ourselves, Ma.'"], ["Anita", "curious / careful", "'But how does the alarm know that a burglar is opening the door?'"], ["Anita", "careful / responsible", "'Now clean up this mess before anyone gets home.'"]]}, {"type": "text", "md": "**Long answers: models.**"}, {"type": "reveal", "prompt": "1. What prompted Anand to create the burglar alarm?", "md": "A **rush of thefts in the colony**; Anand got it into his head that a burglar alarm was needed."}, {"type": "reveal", "prompt": "2. How did Anand's father become the target?", "md": "The alarm worked only if the door opened gently, and **Papa always opens the door softly**, so he was soaked."}, {"type": "reveal", "prompt": "3. How did Anand's parents and sister react to his ideas?", "md": "Papa gets angry and says NO; Ma is gentle and worried, locks up her kitchen gadgets, sometimes sympathises; Anita is doubtful, warns him and stays out of it."}, {"type": "reveal", "prompt": "4. How did Anand behave on his 'inventing binges'?", "md": "He takes apart gadgets for parts, makes hammering and sawing noises, keeps everyone out, does not comb his hair, and works frantically."}, {"type": "reveal", "prompt": "5. Why did Mr. Sharma not believe Anand?", "md": "He thought it was the **imagination** of a clever boy; also nobody had seen Boppa leave, so he smiled indulgently."}, {"type": "reveal", "prompt": "6. Give an ending explaining what might have happened to Boppa.", "md": "Open task. Example: Boppa, terrified by the noises, jumped from a window, ran out the back door while the neighbours entered by the front, and left the scarf behind; he never returned to the colony."}, {"type": "summary", "points": ["Anand is creative, curious and confident; Anita is responsible and careful.", "Anand's quick lie shows presence of mind.", "The extract mood is tense and suspenseful.", "The story ends with a mystery that Anand explains by time travel."]}], "minutes": 30, "terms": [{"term": "presence of mind", "def": "quick, sensible thinking in a difficult moment"}], "source": {"chapter": "ch03", "sections": ["Let us think and reflect"], "pages": "99–101"}, "id": "c7u3-02-invention-reflect", "chapter": "c7u3", "kind": "lesson"}, "c7u3-03-invention-language": {"title": "My Brother's Great Invention: Words and Grammar", "summary": "Onomatopoeia, binomials, phrasal verbs, idioms and past perfect.", "blocks": [{"type": "text", "md": "In this lesson you learn how stories make sound and speech vivid: **onomatopoeia**, **binomials**, **phrasal verbs**, **idioms** and the **past perfect tense**."}, {"type": "callout", "kind": "key", "md": "**Onomatopoeia** is the use of words that imitate the actual sounds of the thing they describe: the *boom* of a firework, the *ding-dong* of a bell, the *pitter-patter* of rain, the *tick-tock* of a clock."}, {"type": "quiz", "id": "c7-ch03-quiz-onomat", "title": "Match the sound words", "questions": [{"type": "single", "q": "Crash", "options": ["sudden loud sound of breaking", "a continuous low and soothing sound", "whispered angrily", "constant loud construction noises"], "answer": 0, "explanation": "A crash is a sudden loud breaking sound.", "hints": ["Dropping glass."]}, {"type": "single", "q": "Humming", "options": ["a continuous low and soothing sound", "sudden loud sound of breaking", "whispered angrily", "constant loud construction noises"], "answer": 0, "explanation": "Hum is low and continuous.", "hints": ["Think of a machine or a tune."]}, {"type": "single", "q": "Hissed", "options": ["whispered angrily", "a continuous low sound", "sudden crash", "building noise"], "answer": 0, "explanation": "Anita hissed to her brother.", "hints": ["Whisper with anger."]}, {"type": "single", "q": "Hammering, sawing, clattering", "options": ["constant and loud construction noises", "soothing sound", "whispered angrily", "sudden breaking"], "answer": 0, "explanation": "The noise from Anand's room.", "hints": ["Workshop sounds."]}]}, {"type": "text", "md": "**Binomials** are two words joined by 'and' or 'or' that are commonly used together in a fixed order, e.g. *peace and quiet*."}, {"type": "quiz", "id": "c7-ch03-quiz-binomial", "title": "Complete the binomials and use them", "questions": [{"type": "fill", "q": "safe and ______", "answer": ["sound"], "explanation": "safe and sound.", "placeholder": "word", "hints": ["Arrived home without harm."]}, {"type": "fill", "q": "odds and ______", "answer": ["ends"], "explanation": "odds and ends.", "placeholder": "word", "hints": ["Small leftover things."]}, {"type": "fill", "q": "make or ______", "answer": ["break"], "explanation": "make or break.", "placeholder": "word", "hints": ["A decisive moment."]}, {"type": "fill", "q": "pros and ______", "answer": ["cons"], "explanation": "pros and cons.", "placeholder": "word", "hints": ["Advantages and disadvantages."]}, {"type": "fill", "q": "now or ______", "answer": ["never"], "explanation": "now or never.", "placeholder": "word", "hints": ["Final chance."]}, {"type": "fill", "q": "give and ______", "answer": ["take"], "explanation": "give and take.", "placeholder": "word", "hints": ["Balance in friendship."]}, {"type": "single", "q": "This project will be a ______ moment for our team's success.", "options": ["make or break", "give and take", "odds and ends", "safe and sound"], "answer": 0, "explanation": "A decisive moment.", "hints": ["Success or failure."]}, {"type": "single", "q": "After a long journey, we arrived home ______.", "options": ["safe and sound", "now or never", "pros and cons", "make or break"], "answer": 0, "explanation": "Without any harm.", "hints": ["Unhurt."]}, {"type": "single", "q": "This is our final chance to perform: it is ______.", "options": ["now or never", "give and take", "odds and ends", "pros and cons"], "answer": 0, "explanation": "A last chance.", "hints": ["No other chance."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-phrasal-inv", "title": "Phrasal verbs: tripped off, let up, turned out, ran out of, rigged up", "questions": [{"type": "fill", "q": "It had been raining and we ______ time to set up for the function.", "answer": ["ran out of"], "explanation": "ran out of time.", "placeholder": "phrasal verb", "hints": ["Ended our supply."]}, {"type": "fill", "q": "so we quickly ______ some decorations using whatever we had.", "answer": ["rigged up"], "explanation": "rigged up = assembled temporarily.", "placeholder": "phrasal verb", "hints": ["Put together quickly."]}, {"type": "fill", "q": "We accidentally ______ the fire alarm because of the smoke.", "answer": ["tripped off"], "explanation": "tripped off = set off.", "placeholder": "phrasal verb", "hints": ["Activated."]}, {"type": "fill", "q": "Thankfully, the rain ______ just as the guests were arriving.", "answer": ["let up"], "explanation": "let up = stopped or lessened.", "placeholder": "phrasal verb", "hints": ["Stopped."]}, {"type": "fill", "q": "despite all the chaos, the function ______ to be a huge success.", "answer": ["turned out"], "explanation": "turned out = proved to be.", "placeholder": "phrasal verb", "hints": ["Ended up."]}]}, {"type": "text", "md": "**Idioms** are expressions whose meaning differs from the literal meaning of the words, e.g. 'It is raining cats and dogs' = raining very heavily.", "title": "Idioms"}, {"type": "quiz", "id": "c7-ch03-quiz-idioms", "title": "Fill the idioms", "questions": [{"type": "fill", "q": "Shekhar knew he would ______ for breaking his mother's favourite vase. (get a shelling)", "answer": ["get a shelling"], "explanation": "get a shelling = be scolded severely.", "placeholder": "idiom", "hints": ["Be scolded."]}, {"type": "fill", "q": "We ______ trying to help the injured dog. (fell over ourselves)", "answer": ["fell over ourselves"], "explanation": "Eagerly rushed.", "placeholder": "idiom", "hints": ["Over-eager."]}, {"type": "fill", "q": "Faizy distracted Kanchan, ______ for us to get inside. (leaving the coast clear)", "answer": ["leaving the coast clear"], "explanation": "Making it safe to move.", "placeholder": "idiom", "hints": ["No one watching."]}, {"type": "fill", "q": "The constant power fluctuations can ______ during meetings. (get on our nerves)", "answer": ["get on our nerves"], "explanation": "Irritate us.", "placeholder": "idiom", "hints": ["Annoy."]}, {"type": "fill", "q": "When I am alone, any unexpected loud noise at night can ______. (frighten me half to death)", "answer": ["frighten me half to death"], "explanation": "Scare very much.", "placeholder": "idiom", "hints": ["Very afraid."]}]}, {"type": "text", "md": "**Simple past and past perfect.** 'It was indeed the fellow who **had** recently **begun** sweeping…' shows two past actions: the **older action** uses past perfect (had + V3); the later action uses simple past. *Anand had vanished by this time and reappeared only after dinner when Papa had cooled down.* Time words: **before, after, by the time, when**."}, {"type": "quiz", "id": "c7-ch03-quiz-pastperfect", "title": "Simple past or past perfect?", "questions": [{"type": "fill", "q": "After Rohan ______ (finish) his homework, he decided to go for a walk.", "answer": ["had finished"], "explanation": "Finished first: past perfect.", "placeholder": "verb", "hints": ["Older action."]}, {"type": "fill", "q": "He ______ (leave) the house and realised he had forgotten his keys. Fill 'leave' in simple past.", "answer": ["left"], "explanation": "left.", "placeholder": "verb", "hints": ["Simple past."]}, {"type": "fill", "q": "…and realised he ______ (forget) his keys inside.", "answer": ["had forgotten"], "explanation": "had forgotten (earlier action).", "placeholder": "verb", "hints": ["Past perfect."]}, {"type": "fill", "q": "By the time we ______ (reach) the station, the train had already left.", "answer": ["reached"], "explanation": "reached (simple past).", "placeholder": "verb", "hints": ["Later action."]}, {"type": "fill", "q": "By the time we reached the station, the train ______ (already/leave).", "answer": ["had already left"], "explanation": "had already left.", "placeholder": "verb", "hints": ["Earlier action."]}, {"type": "fill", "q": "Combine: Rohan packed his suitcase. + He left for the airport. (before)", "answer": ["rohan had packed his suitcase before he left for the airport", "rohan had packed his suitcase before he left for the airport."], "explanation": "Old action in past perfect.", "placeholder": "sentence", "hints": ["had packed."]}]}, {"type": "exercise", "id": "c7-ch03-ex-combine", "title": "Combine with past perfect", "difficulty": "easy", "minutes": 8, "goal": "Combine each pair using before, after, by the time or when.", "behavior": "Use past perfect for the earlier action. Pairs: (ii) We started work / He arrived in the morning; (iii) They set up the tents / The others brought food and medicine; (iv) The students became quiet / They heard the teacher coming; (v) The villagers left the village / The flood submerged the entire area.", "hints": ["The first-named action happened earlier.", "Past perfect = had + V3."], "checklist": ["Past perfect for the earlier action", "Simple past for the later action", "A time word used"], "solution": "(ii) We had started work by the time he arrived in the morning. (iii) They had set up the tents before the others brought food and medicine. (iv) The students had become quiet when they heard the teacher coming. (v) The villagers had left the village before the flood submerged the entire area.", "solution_lang": "text", "solution_explain": "The earlier event takes 'had + V3'.", "mode": "selfcheck"}, {"type": "summary", "points": ["Onomatopoeic words imitate sounds: crash, hum, hiss, clatter.", "Binomials are fixed pairs: safe and sound, pros and cons.", "Idioms mean something different from their words.", "Past perfect (had + V3) shows the earlier of two past actions."]}], "minutes": 40, "terms": [{"term": "onomatopoeia", "def": "words that imitate sounds"}, {"term": "binomial", "def": "two words joined by and/or in a fixed order"}, {"term": "idiom", "def": "a phrase with a special, non-literal meaning"}, {"term": "past perfect", "def": "had + past participle"}], "source": {"chapter": "ch03", "sections": ["Let us learn I–IV"], "pages": "101–104"}, "id": "c7u3-03-invention-language", "chapter": "c7u3", "kind": "lesson"}, "c7u3-04-invention-skills": {"title": "My Brother's Great Invention: Listen, Speak, Write, Explore", "summary": "Toby the Martian, -ough sounds, writing about a vocation and Indian inventors.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: Anita and Toby the Martian", "md": "**Anita:** Hi, Toby! Do you miss your planet?\n\n**Toby:** Very much, Anita! I miss my people and home.\n\n**Anita:** Oh! I wish I could do something about it! But I am happy to have you as my friend.\n\n**Toby:** Thank you, Anita!\n\n**Anita:** Could you tell me something more about yourself? What do you eat for breakfast?\n\n**Toby:** Well, we Martians don't need to eat anything. We get our energy from the Sun.\n\n**Anita:** Oh! Don't you ever feel like having ice creams and chocolates? I can't think of life without them!\n\n**Toby:** No, Anita! We are made of different stuff.\n\n**Anita:** Okay, tell me one thing. How are you able to see with only one eye? I see only one big eye in the centre of your face.\n\n**Toby:** My friend, we Martians need only one eye to see clearly. In fact, I can see even with my eye closed. I can see beyond mountains and clouds, wood and even metals. I can see that you are carrying a toy in your pocket. It is a blue aeroplane, isn't it? And that apple you just had for breakfast is going round and round in your stomach right now!\n\n**Anita:** Oh my goodness!"}, {"type": "quiz", "id": "c7-ch03-quiz-toby", "title": "Choose the true statements", "questions": [{"type": "truefalse", "q": "Toby misses his school.", "answer": false, "explanation": "He misses his people and home.", "hints": ["First reply."]}, {"type": "truefalse", "q": "Anita accepts Toby as her friend.", "answer": true, "explanation": "'I am happy to have you as my friend.'", "hints": ["Her second line."]}, {"type": "truefalse", "q": "Anita asks Toby about one of his facial features.", "answer": true, "explanation": "She asks about his single eye.", "hints": ["The eye question."]}, {"type": "truefalse", "q": "Toby tells Anita she had a banana for breakfast.", "answer": false, "explanation": "He says an apple.", "hints": ["What did he see in her stomach?"]}, {"type": "truefalse", "q": "Toby shares that he can see much clearer with a closed eye.", "answer": false, "explanation": "He says he can see even with his eye closed, not clearer.", "hints": ["Compare the words."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-toby-fill", "title": "Fill in the exact words", "questions": [{"type": "fill", "q": "I miss my ______ and home.", "answer": ["people"], "explanation": "people", "placeholder": "word", "hints": ["First reply."]}, {"type": "fill", "q": "Well, we ______ don't need to eat anything.", "answer": ["martians"], "explanation": "Martians", "placeholder": "word", "hints": ["Toby's species."]}, {"type": "fill", "q": "We get our ______ from the Sun.", "answer": ["energy"], "explanation": "energy", "placeholder": "word", "hints": ["What the Sun gives."]}, {"type": "fill", "q": "Don't you ever feel like having ice creams and ______?", "answer": ["chocolates"], "explanation": "chocolates", "placeholder": "word", "hints": ["Sweet treat."]}, {"type": "fill", "q": "How are you able to see with only ______ eye?", "answer": ["one"], "explanation": "one", "placeholder": "word", "hints": ["Number."]}, {"type": "fill", "q": "I can see beyond mountains and ______, woods and even ______. (first blank)", "answer": ["clouds"], "explanation": "clouds", "placeholder": "word", "hints": ["Sky."]}, {"type": "fill", "q": "…woods and even ______.", "answer": ["metals"], "explanation": "metals", "placeholder": "word", "hints": ["Hard things."]}]}, {"type": "text", "md": "**Let us speak: the tricky -ough.** 'Though' rhymes with *low*; 'enough' rhymes with *puff*. English has many words ending in **-ough** pronounced very differently. Put each word in the right group (this is your listening-and-speaking drill; ask the teacher to say them aloud).", "title": "Let us speak"}, {"type": "table", "headers": ["Sound", "Words"], "rows": [["'oo'", "through"], ["'off'", "cough, trough"], ["'o'", "though, dough"], ["'ow'", "bough, plough"], ["'aw'", "thought"], ["'uff' (extra)", "enough, tough, rough"]]}, {"type": "text", "md": "Read aloud: *In spite of a nagging cough, the woman continued working in her farm, right through the rough weather. She filled up the trough with water for her cows and ploughed the fields… She plucked raw mangoes from a low bough… Though the day had been tough, she smiled as she had already prepared dough to make enough rotis for dinner.* Tongue twister: *The boy with the tough dough on the rose bough fell in the trough and caught a cough.*"}, {"type": "text", "md": "**Let us write: a vocation.** Think about vocations such as electrician, mechanic, chef, nurse, graphic designer. Choose one and write a paragraph using these hints: why you like it; what training is needed; tools and equipment; who your co-workers would be; the importance of teamwork; how you would deal with customers; how you plan to pursue it with pride.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch03-ex-vocation", "title": "Write about a vocation", "difficulty": "medium", "minutes": 15, "goal": "Write a paragraph of 8–10 sentences on a vocation of your choice.", "behavior": "Cover all seven hints.", "hints": ["Make a note for each hint first.", "Use linking words (also, so, finally).", "Read it aloud."], "checklist": ["Reason for choosing", "Training", "Tools", "Co-workers", "Teamwork", "Customers", "Pride"], "solution": "I would like to be an electrician because I enjoy fixing things. I need training at an industrial institute. My tools are pliers, a tester and wire. I would work with helpers and engineers, and teamwork keeps people safe. I would speak politely to customers and explain the repair. I will do my work honestly and be proud of every safe connection.", "solution_lang": "text", "solution_explain": "A full answer touches every hint in a clear order.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** *Creativity* is thinking new things; *innovation* is doing new things; an *invention* brings ideas or objects together in a novel way to create something that did not exist before. All it takes is a simple idea. Some Indian innovators: **Sushruta** (6th century B.C.), pioneer of surgery; **Dr. Janaki Ammal** (Padma Shri), woman scientist in cytogenetics; **Dr. A.P.J. Abdul Kalam**, under whose directorship ISRO launched the satellite Rohini with SLV-III in 1980; **Dr. Narinder Singh Kapany**, Father of Fibre Optics, named one of seven 'Unsung Heroes of the Twentieth Century'. Find names of more Indian inventors and their inventions.", "title": "Let us explore"}, {"type": "quiz", "id": "c7-ch03-quiz-inventors", "title": "Inventors", "questions": [{"type": "single", "q": "Who is known as the Father of Fibre Optics?", "options": ["Dr. Narinder Singh Kapany", "Sushruta", "Dr. Janaki Ammal", "A.P.J. Abdul Kalam"], "answer": 0, "explanation": "He played a pivotal role in inventing fibre optics.", "hints": ["Padma Vibhushan."]}, {"type": "single", "q": "Sushruta was a pioneer in ______.", "options": ["surgery / medical science", "space travel", "fibre optics", "botany only"], "answer": 0, "explanation": "His innovations paved the way for modern surgery.", "hints": ["Sixth century B.C."]}, {"type": "single", "q": "Under whose directorship did ISRO launch the satellite Rohini in 1980?", "options": ["Dr. A.P.J. Abdul Kalam", "Dr. Janaki Ammal", "Anand", "Dr. Kapany"], "answer": 0, "explanation": "With India's first SLV (SLV-III).", "hints": ["Bharat Ratna."]}]}, {"type": "summary", "points": ["Listening for details: Toby's energy comes from the Sun; he has one eye.", "-ough is pronounced in many ways: through, cough, though, bough, thought.", "A vocation paragraph covers reasons, training, tools, teamwork, customers and pride.", "India has many inventors, from Sushruta to Kalam."]}], "minutes": 40, "terms": [{"term": "vocation", "def": "a career or trade one is trained for"}, {"term": "invention", "def": "something new created by bringing ideas or objects together"}], "source": {"chapter": "ch03", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "105–108, 136"}, "id": "c7u3-04-invention-skills", "chapter": "c7u3", "kind": "lesson"}, "c7u3-05-paperboats-read": {"title": "Paper Boats: Read and Discuss", "summary": "A Tagore poem of a child's dreams floating down a stream.", "blocks": [{"type": "text", "md": "**Before you read.** 1. What comes to mind when you think of 'paper boats'? 2. What might someone hope for when sending a paper boat down a stream? 3. Predict what the poem might be about.\n\n**Word match.** In 'I love to play beside a *running* stream… I love to see it *skipping* along… boats with *bulging* sails… people *lading* things… *burying* my head in my pillow', the meanings are: running = speedily flowing; skipping = bouncing; bulging = swelling; lading = loading; burying = putting."}, {"type": "callout", "kind": "tip", "md": "The poet is **Rabindranath Tagore**. I retell it here; please read the original on p. 110 of your book.", "title": "Reading plan"}, {"type": "text", "title": "📖 Paper Boats (retold)", "md": "Day after day the child floats paper boats, one by one, down the running stream. In big black letters he writes his **name** and the **name of his village** on them, hoping that someone in some strange land will find them and know who he is.\n\nHe loads his little boats with **shiuli flowers** from the garden and hopes that these blooms of the dawn will be carried safely to land in the night.\n\nHe launches his boats and looks up at the sky. Little clouds set white bulging sails there, and he wonders what playmate in the sky sends them down the air to race with his boats.\n\nWhen night comes he buries his face in his arms and dreams that his paper boats float on and on under the **midnight stars**. The fairies of sleep are sailing in them, and their cargo is baskets full of dreams."}, {"type": "quiz", "id": "c7-ch03-quiz-boats-summary", "title": "Let us discuss I: summary", "questions": [{"type": "single", "q": "The poet sends paper boats down a ______ each day.", "options": ["stream", "river"], "answer": 0, "explanation": "A running stream.", "hints": ["First lines."]}, {"type": "single", "q": "…writing his name and the name of his ______ on them.", "options": ["school", "village"], "answer": 1, "explanation": "The name of the village where he lives.", "hints": ["Where he lives."]}, {"type": "single", "q": "He hopes someone in a ______ land will find them.", "options": ["strange", "familiar"], "answer": 0, "explanation": "A strange land.", "hints": ["Far away."]}, {"type": "single", "q": "The poet fills his boats with ______ flowers.", "options": ["rose", "shiuli"], "answer": 1, "explanation": "Shiuli flowers from the garden.", "hints": ["Blooms of the dawn."]}, {"type": "single", "q": "…carried safely to land at ______.", "options": ["night", "morning"], "answer": 0, "explanation": "At night.", "hints": ["Dawn blooms, night landing."]}, {"type": "single", "q": "He imagines the ______ in the sky as friends racing with his boats.", "options": ["clouds", "birds"], "answer": 0, "explanation": "Little clouds with white sails.", "hints": ["White bulging sails."]}, {"type": "single", "q": "At night, the boats continue to ______ under the midnight stars.", "options": ["swim", "float"], "answer": 1, "explanation": "They float on and on.", "hints": ["Boats."]}, {"type": "single", "q": "The fairies' baskets are full of ______.", "options": ["dreams", "fruits"], "answer": 0, "explanation": "Dreams.", "hints": ["Fairies of sleep."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-boats-lit", "title": "Theme, setting, tone, devices", "questions": [{"type": "single", "q": "The theme of the poem is ______.", "options": ["innocence, imagination and playfulness", "ignorance, innocence, imagination", "ignorance, playfulness, travel", "innocence and travel"], "answer": 0, "explanation": "The child is innocent, imaginative and playful.", "hints": ["Look at the child's dreams."]}, {"type": "truefalse", "q": "The setting of the poem is a natural, outdoor environment.", "answer": true, "explanation": "Stream, garden, sky, midnight stars.", "hints": ["Where is the child?"]}, {"type": "single", "q": "The tone is ______ and the mood is ______.", "options": ["gentle and wishful; thoughtful", "sad and serious; boring", "angry; tense", "funny; loud"], "answer": 0, "explanation": "A soft, hopeful voice and a thoughtful mood.", "hints": ["Not sad, not boring."]}, {"type": "fill", "q": "Repetition of the words ______ and ______ emphasises the passage of time. (first word: 'day')", "answer": ["day"], "explanation": "'Day by day' and 'on and on' show time continuing.", "placeholder": "word", "hints": ["Look at the poem's first words."]}, {"type": "multi", "q": "Which are imagery (phrases that paint a picture)?", "options": ["blooms of the dawn", "fairies of sleep", "little clouds setting the white bulging sails", "the price of paper"], "answer": [0, 1, 2], "explanation": "The first three create pictures in the mind.", "hints": ["Which phrases can you picture?"]}]}, {"type": "quiz", "id": "c7-ch03-quiz-boats-symbol", "title": "VII. What do they symbolise?", "questions": [{"type": "single", "q": "The child's innocence, dreams, hopes and messages sent into the world", "options": ["paper boats", "shiuli flowers", "midnight stars"], "answer": 0, "explanation": "The boats carry his messages and hopes.", "hints": ["What does he send out?"]}, {"type": "single", "q": "Purity, beauty and the start of a new day", "options": ["shiuli flowers", "paper boats", "midnight stars"], "answer": 0, "explanation": "Blooms of the dawn.", "hints": ["Fresh flowers."]}, {"type": "single", "q": "The vast universe and the child's dreams continuing through the night", "options": ["midnight stars", "shiuli flowers", "paper boats"], "answer": 0, "explanation": "Under the midnight stars.", "hints": ["Night sky."]}]}, {"type": "text", "md": "**V. Alliteration** appears where nearby words start with the same sound (for example 'big black' and 'bulging'). Spot more in the stanzas about the name-writing and the clouds."}, {"type": "summary", "points": ["A child floats paper boats with his name and flowers, hoping for far-off friends.", "He imagines clouds racing his boats and fairies sailing with baskets of dreams.", "The theme is innocence, imagination and playfulness.", "Paper boats, shiuli flowers and midnight stars are symbols."]}], "minutes": 25, "terms": [{"term": "lading", "def": "loading or the load carried"}, {"term": "symbol", "def": "something that stands for an idea"}], "source": {"chapter": "ch03", "sections": ["Before we read", "Let us read", "Let us discuss I–VII"], "pages": "109–112"}, "id": "c7u3-05-paperboats-read", "chapter": "c7u3", "kind": "lesson"}, "c7u3-06-paperboats-skills": {"title": "Paper Boats: Reflect, Learn, Listen, Speak, Write, Explore", "summary": "Questions, phrases with 'of', times of day, opposites, origami listening, a craft talk, a diary entry and riddles.", "blocks": [{"type": "quiz", "id": "c7-ch03-quiz-boats-ext", "title": "Think and reflect", "questions": [{"type": "single", "q": "Who is most likely the speaker in the extract about midnight stars?", "options": ["a dreaming child", "a sailor", "a teacher", "a fairy"], "answer": 0, "explanation": "The speaker buries his face in his arms and dreams.", "hints": ["Look at the picture clue: a child."]}, {"type": "single", "q": "What does the speaker feel when night comes?", "options": ["calm, dreamy and hopeful", "angry", "scared", "bored"], "answer": 0, "explanation": "He dreams peacefully of his boats.", "hints": ["Soft tone."]}, {"type": "single", "q": "The 'fairies of sleep' are imagined as ______.", "options": ["mischievous", "gentle", "fearsome", "playful"], "answer": 1, "explanation": "Gentle, helping dreams.", "hints": ["They carry baskets of dreams."]}, {"type": "single", "q": "'The lading is their baskets full of dreams' suggests the fairies carefully ______.", "options": ["carrying his dreams", "collecting his wishes"], "answer": 0, "explanation": "They are carrying dreams in baskets.", "hints": ["What are they loading?"]}]}, {"type": "reveal", "prompt": "Long answers: model answers", "md": "1. **Why personal details on boats?** He hopes a stranger will find the boat and know him: a child's wish to connect with the wider world.\n2. **Imagination of a child:** clouds become playmates sending sails; boats carry flowers; fairies sail in them.\n3. **Imagination and reality:** real things (stream, paper boats, flowers, clouds) are mixed with imaginary ones (fairies, dreams) to make the poem charming."}, {"type": "text", "md": "**Let us learn I: phrases with 'of'** like 'blooms of the dawn' and 'fairies of sleep'. Combine: wings of the wind/birds; waves of the ocean; dreams of the children; songs of the birds; glimmers of the stars; cries of the children; tears of the rain; roars of the thunder; shadows of the evening/clouds. Write as many as you can."}, {"type": "quiz", "id": "c7-ch03-quiz-timeofday", "title": "II. Parts of the day", "questions": [{"type": "multi", "q": "Which words belong to MORNING?", "options": ["dawn", "sunrise", "daybreak", "dusk", "sunup", "forenoon"], "answer": [0, 1, 2, 4, 5], "explanation": "Dusk is evening.", "hints": ["Early day."]}, {"type": "multi", "q": "Which belong to AFTERNOON?", "options": ["noon", "noontime", "noonday", "midday", "sunset"], "answer": [0, 1, 2, 3], "explanation": "Sunset is evening.", "hints": ["Middle of the day."]}, {"type": "multi", "q": "Which belong to EVENING?", "options": ["twilight", "dusk", "nightfall", "sunset", "sundown", "midnight"], "answer": [0, 1, 2, 3, 4], "explanation": "Midnight belongs to night.", "hints": ["Sun going down."]}, {"type": "multi", "q": "Which belong to NIGHT?", "options": ["midnight", "night-time", "dawn", "noon"], "answer": [0, 1], "explanation": "Midnight and night-time.", "hints": ["Dark hours."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-boat-opp", "title": "III. Opposites", "questions": [{"type": "single", "q": "strange", "options": ["ordinary", "halt", "dusk", "sink"], "answer": 0, "explanation": "Strange × ordinary.", "hints": ["Normal."]}, {"type": "single", "q": "dawn", "options": ["dusk", "halt", "ordinary", "shrinking"], "answer": 0, "explanation": "Dawn × dusk.", "hints": ["Day's start/end."]}, {"type": "single", "q": "launch", "options": ["halt", "emptying", "sink", "dusk"], "answer": 0, "explanation": "Launch × halt.", "hints": ["Start/stop."]}, {"type": "single", "q": "bulging", "options": ["shrinking", "emptying", "halt", "sink"], "answer": 0, "explanation": "Bulging × shrinking.", "hints": ["Swelling."]}, {"type": "single", "q": "float", "options": ["sink", "halt", "dusk", "ordinary"], "answer": 0, "explanation": "Float × sink.", "hints": ["On water."]}, {"type": "single", "q": "lading", "options": ["emptying", "shrinking", "sink", "halt"], "answer": 0, "explanation": "Lading (loading) × emptying.", "hints": ["Filling."]}]}, {"type": "callout", "kind": "note", "title": "🎧 Listening: Sai and her father on origami", "md": "**Father:** Sai dear! What are you working on there with all that paper?\n\n**Sai:** Baba, I am trying to make an origami crane, but it's a bit tricky. I keep messing up the folds.\n\n**Father:** Ah, origami! I remember doing that when I was your age. Origami has a really interesting history.\n\n**Sai:** Really? I thought it was just something fun to do with paper.\n\n**Father:** It is fun, but it is also an age-old art form. Origami started in Japan over a thousand years ago. Back then paper was really expensive, so it was used only for special occasions like religious ceremonies.\n\n**Sai:** So it wasn't just for crafts?\n\n**Father:** It wasn't until the seventeenth century that people began making animals, flowers and other designs just for fun.\n\n**Sai:** So people have been making paper cranes for hundreds of years?\n\n**Father:** Yes, and the crane is especially important in Japanese culture. It is a symbol of peace and long life. There is even a belief that if you fold a thousand paper cranes, you can make a wish and it will come true.\n\n**Sai:** A thousand cranes? That is a lot! But it sounds like a nice tradition.\n\n**Father:** Origami isn't just about the final shape; it is about the process, the patience and the creativity involved. And over the years it has spread all over the world.\n\n**Sai:** It makes folding this crane feel even more special.\n\n**Father:** Perhaps we can start with something simpler next time. How about an origami paper boat? We can float it in the stream outside.\n\n**Sai:** A boat sounds awesome! But first I want to finish this crane. Can you help me with the last few steps?\n\n**Father:** Of course. After that, we'll sail our paper boat."}, {"type": "quiz", "id": "c7-ch03-quiz-origami", "title": "Select the true statements", "questions": [{"type": "truefalse", "q": "Sai was trying to make an origami boat.", "answer": false, "explanation": "She was making a crane.", "hints": ["First lines."]}, {"type": "truefalse", "q": "Sai's father used to do origami as a child.", "answer": true, "explanation": "'I remember doing that when I was your age.'", "hints": ["His first reply."]}, {"type": "truefalse", "q": "Paper was very expensive so it was used only for special occasions.", "answer": true, "explanation": "Yes, at the beginning of origami.", "hints": ["History part."]}, {"type": "truefalse", "q": "People have been making paper cranes for thousands of years.", "answer": false, "explanation": "The script says hundreds of years; origami began over a thousand years ago.", "hints": ["Sai says 'hundreds'."]}, {"type": "truefalse", "q": "There is a belief that a thousand paper cranes make a wish come true.", "answer": true, "explanation": "Yes.", "hints": ["Crane belief."]}, {"type": "truefalse", "q": "The art of origami is about enjoying the process.", "answer": true, "explanation": "The father says it is about the process, patience and creativity.", "hints": ["His wise words."]}, {"type": "truefalse", "q": "Sai's father suggests a paper bookmark next time.", "answer": false, "explanation": "He suggests a paper boat.", "hints": ["Last lines."]}]}, {"type": "text", "md": "**Let us speak: craft presentation.** Create a craft item using eco-friendly materials and present it. Include: introduction of the item; how you made it; why you like it; a conclusion. Phrases: *Today, I'm going to show you a… I made. / This… is made of… / It's… (colour, shape, size) / It can be used to… / First, I started by… / Then, I used… to… / The most difficult part was… / This… is special to me because… / I hope you enjoyed… Thank you for your attention.*", "title": "Let us speak"}, {"type": "text", "md": "**Let us write: a diary entry.** A diary entry is a personal record of a day, with thoughts, feelings and opinions. Guidelines: mention the day, date and time; begin with a general sentence about the day or your feelings; give details; end with a final remark. Write a diary entry about your joy on a rainy day. Begin: *Friday, 15 July 20XX, 6:30 p.m. Dear Diary, It was quite humid today. On my journey back from school, I wished that it would rain. And it did! …*", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch03-ex-diary", "title": "Diary entry: a rainy day", "difficulty": "easy", "minutes": 12, "goal": "Write a diary entry of 8–10 lines on a rainy day.", "behavior": "Follow the four guidelines.", "hints": ["Describe the smell of wet soil.", "Say how you felt.", "End with a wish or lesson."], "checklist": ["Day, date and time", "Opening sentence about the day or feelings", "Details with senses", "Closing remark"], "solution": "Friday, 15 July 2026, 6:30 p.m.\nDear Diary,\nIt was quite humid today, and on my way back I wished for rain. And it did! Big drops tapped on my umbrella. The air smelt of wet earth. I jumped in puddles with my friends. My shoes are soaked but my heart is happy. I hope it rains again tomorrow.\n", "solution_lang": "text", "solution_explain": "A diary is personal, dated and full of feeling.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. **Shiuli flowers** (night jasmine or parijat) are often mentioned in Tagore's poems. Find what you call them in your language, find more fragrant-flower plants of your locality (names in your language and English), and draw two. II. **Riddles:** answers are 1. the **sea/ocean**, 2. a **pond** (or lake), 3. a **stream**, 4. a **river**."}, {"type": "summary", "points": ["Tagore's paper boats carry the child's name, flowers and dreams.", "Dawn words: dawn, sunrise, daybreak; evening: dusk, twilight, sunset; night: midnight.", "Origami began in Japan over a thousand years ago; the crane symbolises peace and long life.", "A diary entry is dated, personal and ends with a closing remark."]}], "minutes": 40, "terms": [{"term": "origami", "def": "the Japanese art of paper folding"}, {"term": "diary entry", "def": "a personal dated record of a day"}], "source": {"chapter": "ch03", "sections": ["Let us think and reflect", "Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "112–117, 137"}, "id": "c7u3-06-paperboats-skills", "chapter": "c7u3", "kind": "lesson"}, "c7u3-07-nsew-read": {"title": "North, South, East, West: Read and Discuss", "summary": "Shaana's postcards from a journey across India.", "blocks": [{"type": "text", "md": "**Before you read.** I. Discuss a place you enjoyed travelling to: who you went with, how you travelled and what you learnt. II. Write about the State or Union Territory you live in: part of the country (North, East, Northeast, West, South, Centre), capital, language, rivers, tourist attractions and food. III. Recall the states with 'Pradesh' in the name."}, {"type": "table", "headers": ["State", "Part of the country"], "rows": [["Himachal Pradesh", "North"], ["Uttar Pradesh", "North"], ["Madhya Pradesh", "Centre"], ["Arunachal Pradesh", "Northeast"], ["Andhra Pradesh", "South"]]}, {"type": "callout", "kind": "tip", "md": "The text is by **C. G. Salamander** (excerpts from *North, South, East, West*). It is a series of **postcards** written by Shaana from Rameswaram island. Retold below; read the originals on pp. 119–125.", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch03-cards-nsew", "title": "Postcard words", "cards": [{"front": "chirping", "back": "short sharp sound made by birds"}, {"front": "snoring", "back": "making a loud noise while sleeping"}, {"front": "rafting", "back": "travelling down a river in an air-filled rubber boat"}, {"front": "surf", "back": "a water sport of riding a wave on a board"}, {"front": "dive", "back": "swim underwater with special breathing equipment"}, {"front": "pebbles", "back": "small, smooth stones"}]}, {"type": "text", "title": "📖 Shaana's postcards", "md": "**30 April: Thajiwas glacier, Kashmir (far north).** The glaciers are white and blue; Shaana wears four layers. Appa and Amma throw snowballs but say there was more snow last year. Her hands shake without gloves.\n\n**10 May: Himachal Pradesh.** It is quiet with many mountains seen from the train cabin. Colourful birds wake her with chirping at sunrise in the east. She thinks she hears bears growling in the west, but Amma says it is Appa snoring.\n\n**17 May: Arunachal Pradesh (east).** It is far from Himachal; she thought all Pradesh states were next to each other. They walk through a thick forest to a **treehouse**; if you blink or tie your shoelace you get lost. She hopes to see red pandas.\n\n**24 May: Sundarbans, West Bengal.** A boat ride on the river. Amma says it is a **wetland**; mangrove trees grow in seawater. Amma is sad about how much the place floods today. They see crocodiles and a lonely snake; Shaana hopes they won't follow her home.\n\n**30 May: Gujarat (west).** They travelled from east to west in two and a half days. The desert is hot, dry and sandy, like a beach without the sea, but the clothes are pretty and colourful. Amma gave her a surprise test and she scored 88 per cent.\n\n**7 June: Narmada river.** They drove east to the Narmada, which flows to the centre of India, and went **rafting**: wild and scary. Appa says there used to be more water. Appa is so scared that he never wants to go rafting again; Shaana loved it.\n\n**12 June: Goa (southwest).** Awake at night, she loves the plateaus, hills, beaches and the many tunnels; she is no longer afraid of tunnels and hopes the class can tour plateaus in Class 11.\n\n**17 June: Chennai and Puducherry.** They learn to surf; she fell only twice. Amma and Appa splash each other like children. The beaches are rougher and browner than at home.\n\n**22 June: Pamban bridge.** She sees the ocean on both sides as the train crosses the sea; she is almost home.\n\n**24 June: Olaikaadu beach.** No diving suits her size, so she floats and watches fish while her parents dive; she collects pebbles for her friends.\n\n**25 June: Dear Amma and Appa.** She is home. She will miss forests, glaciers, deserts, wetlands, plateaus and mountains, and hearing new languages and meeting different people. She hopes to travel again, maybe with her friends."}, {"type": "table", "headers": ["Place visited", "Interesting descriptions and activities"], "rows": [["Thajiwas glacier, Kashmir", "white and blue glaciers; throwing snowballs"], ["Himachal Pradesh", "quiet; many mountains; birds chirping at sunrise; Appa's snoring sounds like bears"], ["Arunachal Pradesh", "walking through a thick forest to reach the treehouse"], ["Sundarbans, West Bengal", "boat ride; mangroves in seawater; crocodiles and a snake"], ["Gujarat (desert)", "hot, dry, sandy; colourful clothes"], ["Narmada river", "rafting: wild and scary"], ["Goa", "plateaus, hills, beaches, tunnels"], ["Chennai / Puducherry", "learning to surf"], ["Olaikaadu beach", "floating and looking at the fish; parents went for a dive"]]}, {"type": "quiz", "id": "c7-ch03-quiz-nsew-places", "title": "Which place?", "questions": [{"type": "single", "q": "Where did Shaana walk through a thick forest to reach a treehouse?", "options": ["Arunachal Pradesh", "Goa", "Gujarat", "Kashmir"], "answer": 0, "explanation": "Arunachal Pradesh.", "hints": ["In the east."]}, {"type": "single", "q": "Where do mangrove trees grow in seawater?", "options": ["Sundarbans", "Thar", "Himachal", "Pamban"], "answer": 0, "explanation": "The Sundarbans wetlands.", "hints": ["West Bengal."]}, {"type": "single", "q": "Where did she go rafting?", "options": ["Narmada river", "Thajiwas glacier", "Olaikaadu beach", "Goa"], "answer": 0, "explanation": "The Narmada.", "hints": ["Flows to the centre."]}, {"type": "single", "q": "Where did she learn to surf?", "options": ["near Chennai and Puducherry", "Gujarat", "Kashmir", "Himachal"], "answer": 0, "explanation": "On the way to Puducherry.", "hints": ["Beaches."]}, {"type": "single", "q": "Which bridge lets the train cross the sea?", "options": ["Pamban bridge", "Howrah bridge", "Root bridge", "Narmada bridge"], "answer": 0, "explanation": "The Pamban bridge near her island home.", "hints": ["Rameswaram."]}]}, {"type": "summary", "points": ["Shaana travels from Kashmir to Rameswaram, writing postcards to her class.", "She sees glaciers, forests, wetlands, deserts, rivers, plateaus and beaches.", "Her letters show excitement, curiosity and some fears.", "The journey shows India's diversity."]}], "minutes": 30, "terms": [{"term": "wetland", "def": "land that is wet, like the Sundarbans"}, {"term": "plateau", "def": "a high flat area of land"}], "source": {"chapter": "ch03", "sections": ["Before we read", "Let us read", "Let us discuss"], "pages": "118–125"}, "id": "c7u3-07-nsew-read", "chapter": "c7u3", "kind": "lesson"}, "c7u3-08-nsew-reflect-learn": {"title": "North, South, East, West: Reflect and Learn", "summary": "Extract questions, word work and subject-verb agreement.", "blocks": [{"type": "quiz", "id": "c7-ch03-quiz-nsew-ext1", "title": "Extract 1: the Sundarbans", "questions": [{"type": "single", "q": "'I never knew such a place existed…' shows ______.", "options": ["pride", "hope", "relief", "wonder"], "answer": 3, "explanation": "She is amazed by something new: wonder.", "hints": ["Surprise and amazement."]}, {"type": "fill", "q": "Amma is sad about the frequent flooding because ______.", "answer": ["it damages the place", "it harms the place and wildlife", "the place floods too much", "it is harming the Sundarbans"], "explanation": "Flooding harms the wetland and shows environmental change.", "placeholder": "reason", "hints": ["Think of effects of floods."]}, {"type": "fill", "q": "Evidence of slight nervousness (a phrase): 'I hope they don't ______ me home.'", "answer": ["follow"], "explanation": "'I hope they don't follow us home.'", "placeholder": "word", "hints": ["About crocodiles and a snake."]}, {"type": "single", "q": "Assertion: the speaker is missing her friends. Reason: she wishes to know the well-being of her friends. Choose:", "options": ["Both true and the reason explains the assertion", "Both true but the reason does not explain", "Assertion true, reason false", "Both false"], "answer": 0, "explanation": "Her questions 'How is everyone? Are you missing me yet?' show she misses them and cares how they are.", "hints": ["Her closing questions."]}]}, {"type": "quiz", "id": "c7-ch03-quiz-nsew-ext2", "title": "Extract 2: Goa", "questions": [{"type": "fill", "q": "The speaker chooses to stay awake because ______.", "answer": ["she loves looking out of the window", "she loves looking at the view", "she loves watching the scenery"], "explanation": "She loves looking out of the window at the plateaus.", "placeholder": "reason", "hints": ["'I just love looking…'"]}, {"type": "single", "q": "'You won't believe how nice the plateaus look' means ______.", "options": ["the plateaus are very beautiful", "the plateaus are small", "she doubts her parents", "she is sleepy"], "answer": 0, "explanation": "It is an excited way to say very beautiful.", "hints": ["Her excitement."]}, {"type": "single", "q": "Her attitude to tunnels changed", "options": ["from fear to comfort", "from courage to confidence", "from doubt to clarity", "from fascination to delight"], "answer": 0, "explanation": "She used to be afraid but is not any more.", "hints": ["'I used to be afraid…'"]}, {"type": "single", "q": "Her wish to share the tour with friends shows her ______ and the value she places on ______.", "options": ["sense of connection; shared experiences", "ability to communicate; updating information", "sense of humour; money", "pride; speed"], "answer": 0, "explanation": "She wants her friends to join her.", "hints": ["Friendship."]}]}, {"type": "text", "md": "**Long answers: models.**"}, {"type": "reveal", "prompt": "1. Why might Shaana have been afraid of tunnels?", "md": "They are **dark and enclosed**, with loud noises, so a young child may fear being trapped or not seeing."}, {"type": "reveal", "prompt": "2. Did Appa and Amma enjoy themselves like children?", "md": "Yes: they throw snowballs, splash water on each other 'like children', and Appa is excited to hear bears."}, {"type": "reveal", "prompt": "3. What do less snow in glaciers and more flooding in the Sundarbans indicate?", "md": "**Climate change**: warming reduces snow and ice, and rising seas and storms increase flooding."}, {"type": "reveal", "prompt": "4. India's diverse geography: evidence", "md": "Glaciers (Kashmir), mountains (Himachal), forests (Arunachal), wetlands (Sundarbans), desert (Gujarat), rivers (Narmada), plateaus (Goa) and beaches (Chennai/Puducherry)."}, {"type": "reveal", "prompt": "5. How does Shaana's language show feelings?", "md": "Exclamations ('You won't believe…'), questions to friends, words like 'amazing', 'wild and scary', humorous remarks about her parents, and honest mentions of fear."}, {"type": "reveal", "prompt": "6. What might Shaana have learnt?", "md": "The **variety of India's land, people, languages and cultures**, the need to protect nature, and that fear can be overcome."}, {"type": "reveal", "prompt": "7. Why postcards?", "md": "They make the account **personal, short and lively**, like friends chatting, and let each place be a separate snapshot."}, {"type": "quiz", "id": "c7-ch03-quiz-nsew-words", "title": "Let us learn II: choose the word from the text", "questions": [{"type": "fill", "q": "A loud noise made the boy afraid and he couldn't sleep: ______", "answer": ["scary"], "explanation": "scary", "placeholder": "word", "hints": ["Example given in the book."]}, {"type": "fill", "q": "There used to be a bookstore near my house: ______", "answer": ["existed"], "explanation": "existed", "placeholder": "word", "hints": ["Was there in the past."]}, {"type": "fill", "q": "Flashes of light made her close and open her eyes several times: ______", "answer": ["blink"], "explanation": "blink", "placeholder": "word", "hints": ["Eyes."]}, {"type": "fill", "q": "The children jumped into the pool and threw water at each other: ______", "answer": ["splashed"], "explanation": "splashed", "placeholder": "word", "hints": ["Water noise."]}, {"type": "fill", "q": "My grandmother's place is beautiful with green paddy fields: it was a great experience: ______", "answer": ["amazing"], "explanation": "amazing", "placeholder": "word", "hints": ["Wonderful."]}, {"type": "fill", "q": "The clouds were not staying in one place: they were moving across the sky: ______", "answer": ["floating"], "explanation": "floating", "placeholder": "word", "hints": ["Drifting."]}]}, {"type": "text", "md": "**Word grid.** Find six travel words from the lesson in the grid, searching across and down (for example *boat, train, walked, drove*). Also match the six words glaciers, treehouse, wetlands, plateaus, pebbles and rafting with their pictures in your book.\n\n**Subject-verb agreement.** The verb must agree with its subject.\n- Two subjects joined by **and**: plural verb (*Amma and Appa are asleep*).\n- Subject **it**: is/was.\n- Sentence beginning with **there**: the subject comes after the verb (*There are so many hills*).\n- Words between subject and verb do not change agreement.\n- **Every / each / either / neither / much**: singular.\n- Collective nouns (team, class) are singular when acting as one unit.\n- Subjects like *mathematics, news* that end in s are singular.\n- **A pair of** scissors/glasses: singular (pair is the subject).\n- With **or / nor**, the verb agrees with the subject closer to it.", "title": "Subject-verb agreement"}, {"type": "quiz", "id": "c7-ch03-quiz-sva", "title": "Choose the correct verb", "questions": [{"type": "single", "q": "A pair of sunglasses ______ essential when travelling.", "options": ["is", "are"], "answer": 0, "explanation": "'Pair' is the subject.", "hints": ["Pair of."]}, {"type": "single", "q": "Either the tour guide or the tourists ______ to arrive first.", "options": ["has", "have"], "answer": 1, "explanation": "Closer subject: tourists.", "hints": ["Plural."]}, {"type": "single", "q": "The information on travel expenses ______ useful.", "options": ["is", "are"], "answer": 0, "explanation": "Information is uncountable.", "hints": ["Singular."]}, {"type": "single", "q": "Neither the flight crew nor the pilot ______ aware of the delay.", "options": ["was", "were"], "answer": 0, "explanation": "Closer subject: pilot.", "hints": ["Singular."]}, {"type": "single", "q": "The news about heavy rains ______ many people reconsider.", "options": ["makes", "make"], "answer": 0, "explanation": "News is singular.", "hints": ["Ends in s but singular."]}, {"type": "single", "q": "A pair of binoculars ______ useful for spotting wildlife.", "options": ["is", "are"], "answer": 0, "explanation": "Pair.", "hints": ["Singular."]}, {"type": "single", "q": "The hill stations in India ______ a popular destination.", "options": ["remains", "remain"], "answer": 1, "explanation": "Subject: stations (plural).", "hints": ["Ignore 'in India'."]}, {"type": "single", "q": "Keeping accounts ______ important.", "options": ["is", "are"], "answer": 0, "explanation": "A gerund phrase is singular.", "hints": ["One activity."]}, {"type": "single", "q": "Either the ticket or the bus passes ______ to be used.", "options": ["need", "needs"], "answer": 0, "explanation": "Closer subject: passes.", "hints": ["Plural."]}, {"type": "single", "q": "Neither the passengers nor the taxi driver ______ aware of the best route.", "options": ["was", "were"], "answer": 0, "explanation": "Closer subject: driver.", "hints": ["Singular."]}]}, {"type": "summary", "points": ["Shaana's wonder, nervousness and love of travel are shown through her words.", "Less snow and more flooding point to climate change.", "Scary, existed, blink, splashed, amazing and floating all describe moments in the text.", "The verb must agree with its subject; with or/nor it agrees with the nearer subject."]}], "minutes": 40, "terms": [{"term": "subject-verb agreement", "def": "matching the verb to its subject"}, {"term": "wetland", "def": "land that is wet like a marsh"}], "source": {"chapter": "ch03", "sections": ["Let us think and reflect", "Let us learn I–V"], "pages": "126–131"}, "id": "c7u3-08-nsew-reflect-learn", "chapter": "c7u3", "kind": "lesson"}, "c7u3-09-nsew-skills": {"title": "North, South, East, West: Listen, Speak, Write, Explore", "summary": "Agartala and agar, preferences, a leave application, crosswords and heritage.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: how Agartala got its name", "md": "**Girl:** Hi everyone. We all know Agartala is the capital of Tripura. But did you know how it got its name? It is made up of two words: 'agar', a type of tree, and 'tala', meaning underneath. So Agartala means 'under the agar tree'. These trees are also called aloeswood, eaglewood or gharuwood. It is also referred to as the 'wood of the gods'.\n\nAgarwood, the wood from these trees, is really special. It smells amazing, like a mix of woody and flowery scents. It is one of the rarest and most expensive woods in the world. People have used it for thousands of years in medicines, perfumes and rituals. It was described as early as 1400 BCE in the Vedas, and the Egyptians are believed to have used agarwood incense more than 3,000 years ago.\n\nHere is something remarkable: agarwood only forms when the tree is hurt or infected with a bug or virus. Instead of dying, the tree creates a dark, sticky, sweet-smelling substance called agar oil, which protects it from further infection.\n\nAgarwood is very important to people in Agartala. It is used to make perfumes, incense and the hand carvings which Tripura is famous for. And the best part: the tree was once almost extinct, but now, thanks to people taking care of it, you can find it in almost every house in northern Tripura. How great is that!"}, {"type": "quiz", "id": "c7-ch03-quiz-agar", "title": "Listening questions", "questions": [{"type": "single", "q": "What does 'Agartala' mean?", "options": ["under the agar tree", "beside the agar tree", "around the agar tree"], "answer": 0, "explanation": "'Tala' means underneath.", "hints": ["Agar + tala."]}, {"type": "single", "q": "Another name for agarwood trees:", "options": ["gharuwood", "sandalwood", "rosewood"], "answer": 0, "explanation": "Aloeswood, eaglewood, gharuwood.", "hints": ["The speaker lists three."]}, {"type": "single", "q": "What kind of smell does agarwood have?", "options": ["woody and citrusy", "woody and flowery", "fresh and citrusy"], "answer": 1, "explanation": "A mix of woody and flowery scents.", "hints": ["Listen to the smell description."]}, {"type": "single", "q": "How is agarwood formed?", "options": ["when the tree dries", "when the tree dies", "when the tree gets infected"], "answer": 2, "explanation": "Only when the tree is hurt or infected.", "hints": ["Defence of the tree."]}, {"type": "single", "q": "Agarwood is used to make:", "options": ["incense and edible oil", "perfumes and wood carvings", "gum and candies"], "answer": 1, "explanation": "Perfumes, incense and hand carvings.", "hints": ["Tripura's crafts."]}]}, {"type": "text", "md": "**Let us speak: which do you prefer?** Choose and explain: 1. bus or train; 2. family trip or school trip; 3. beaches or mountains; 4. adventure activities or sightseeing; 5. winter or summer; 6. historic monuments or wildlife sanctuaries; 7. short or long trip. Phrases: *I prefer… to… because… / I would rather… than… because… / I like… better than… as… / … is better than… because… / … appeals to me more than… as… / I am alright with both, but I prefer… because… / Given a choice, I would go for… over… as…*", "title": "Let us speak"}, {"type": "text", "md": "**Let us write: a leave application.** Imagine you must travel to your hometown for a family event. Write an application to the Principal requesting leave. Include the duration, the reason and how you will complete your school work. Format: sender's address (house number, street, city, state) and date; **The Principal**, school name, city, state; **Subject:** Request for leave for … days; **Dear Madam/Sir,**; *I am writing to request … days' leave with effect from … to … in order to attend … I would like to assure you that I would … I would be grateful if you could grant me the leave.* **Yours sincerely,** name, class, section and roll number.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch03-ex-leave", "title": "Write the leave application", "difficulty": "medium", "minutes": 15, "goal": "Write a formal leave application to your Principal.", "behavior": "Use the format and include duration, reason and plan for completing work.", "hints": ["Use formal language.", "Name the dates.", "Promise to copy notes."], "checklist": ["Sender's address and date", "Receiver's address", "Subject line", "Salutation", "Body: request, reason, assurance", "Closing and name with class/roll number"], "solution": "12, Gandhi Street\nChengalpattu\nTamil Nadu\n10 August 2026\n\nThe Principal\nGreen Valley School\nChengalpattu\nTamil Nadu\n\nSubject: Request for leave for 3 days\n\nDear Madam,\nI am writing to request 3 days' leave from 12 to 14 August 2026 in order to attend my cousin's wedding in my hometown. I would like to assure you that I would complete all my homework and copy the notes from my classmates. I would be grateful if you could grant me the leave.\n\nYours sincerely,\nMeena\nClass 7-B, Roll No. 24", "solution_lang": "text", "solution_explain": "A formal letter is polite, clear and complete.", "mode": "selfcheck"}, {"type": "quiz", "id": "c7-ch03-quiz-cross", "title": "Let us explore I: States and Union Territories", "questions": [{"type": "fill", "q": "Pangong Lake", "answer": ["ladakh"], "explanation": "Ladakh.", "placeholder": "state/UT", "hints": ["Union Territory in the far north."]}, {"type": "fill", "q": "Thar Desert", "answer": ["rajasthan"], "explanation": "Rajasthan.", "placeholder": "state/UT", "hints": ["Western state."]}, {"type": "fill", "q": "Serenity Beach", "answer": ["puducherry"], "explanation": "Puducherry.", "placeholder": "state/UT", "hints": ["Union Territory."]}, {"type": "fill", "q": "Hampi", "answer": ["karnataka"], "explanation": "Karnataka.", "placeholder": "state/UT", "hints": ["Vijayanagara ruins."]}, {"type": "fill", "q": "Nagarjuna Sagar Dam", "answer": ["telangana", "andhra pradesh"], "explanation": "Telangana (and Andhra Pradesh).", "placeholder": "state/UT", "hints": ["Krishna river."]}, {"type": "fill", "q": "Thangka Paintings", "answer": ["sikkim"], "explanation": "Sikkim.", "placeholder": "state/UT", "hints": ["Northeast Himalaya."]}, {"type": "fill", "q": "Rann of Kutch", "answer": ["gujarat"], "explanation": "Gujarat.", "placeholder": "state/UT", "hints": ["Salt desert."]}, {"type": "fill", "q": "Nalanda University", "answer": ["bihar"], "explanation": "Bihar.", "placeholder": "state/UT", "hints": ["Ancient university."]}, {"type": "fill", "q": "Dampa Tiger Reserve", "answer": ["mizoram"], "explanation": "Mizoram.", "placeholder": "state/UT", "hints": ["Northeast."]}, {"type": "fill", "q": "Cellular Jail", "answer": ["andaman and nicobar islands", "andaman and nicobar", "andaman"], "explanation": "Andaman and Nicobar Islands.", "placeholder": "state/UT", "hints": ["Port Blair."]}, {"type": "fill", "q": "Double Decker Living Root Bridge", "answer": ["meghalaya"], "explanation": "Meghalaya.", "placeholder": "state/UT", "hints": ["Cherrapunji area."]}, {"type": "fill", "q": "Dudhsagar Falls", "answer": ["goa"], "explanation": "Goa.", "placeholder": "state/UT", "hints": ["Milky waterfalls."]}, {"type": "fill", "q": "Gangotri Glacier", "answer": ["uttarakhand"], "explanation": "Uttarakhand.", "placeholder": "state/UT", "hints": ["Source of the Ganga."]}, {"type": "fill", "q": "Chilika Lake", "answer": ["odisha"], "explanation": "Odisha.", "placeholder": "state/UT", "hints": ["Brackish lagoon."]}, {"type": "fill", "q": "Chota Nagpur Plateau", "answer": ["jharkhand"], "explanation": "Jharkhand.", "placeholder": "state/UT", "hints": ["Mineral-rich plateau."]}, {"type": "fill", "q": "Kurukshetra", "answer": ["haryana"], "explanation": "Haryana.", "placeholder": "state/UT", "hints": ["Mahabharata battlefield."]}]}, {"type": "text", "md": "**Explore II.** Ancient places: the **Kailasa temple** at Ellora (cave temples carved out of vertical basalt cliffs of the Sahyadri hills, a UNESCO World Heritage site) and **Rani-ki-Vav** (the Queen's Stepwell) at Patan, Gujarat, also a UNESCO site. Stepwells were water storage systems that evolved from a pit in sandy soil into multi-storey works of art. Find unique places in your village, region or state and share.\n\n**Explore III.** The **Hornbill Festival** is held annually at Kisama village near Kohima, Nagaland. In groups of four, find out when it is held, who participates, its purpose and its events."}, {"type": "summary", "points": ["Agartala means 'under the agar tree'; agarwood forms when the tree is infected.", "Preference phrases: I prefer… to…, I would rather… than….", "A leave application states the duration, the reason and the plan to complete work.", "India's states and heritage sites show great diversity."]}], "minutes": 40, "terms": [{"term": "agarwood", "def": "a rare fragrant wood formed when an agar tree is infected"}, {"term": "stepwell", "def": "a water storage well with steps"}], "source": {"chapter": "ch03", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "131–138"}, "id": "c7u3-09-nsew-skills", "chapter": "c7u3", "kind": "lesson"}, "c7u3-99-test": {"title": "Test: Unit 3 – Dreams and Discoveries", "kind": "test", "summary": "Check what you learned in this whole unit.", "blocks": [{"type": "quiz", "id": "c7-ch03-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Anand's burglar alarm worked only when the door was opened ______.", "options": ["gently", "forcefully", "at night", "twice"], "answer": 0, "explanation": "That is why Papa was soaked.", "hints": ["Thief tries stealthily."]}, {"type": "single", "q": "Which action of Anand shows presence of mind?", "options": ["He told the thief his own room was his father's", "He fell asleep", "He built the alarm", "He hid"], "answer": 0, "explanation": "He misled Boppa quickly.", "hints": ["Boppa asks where Papa's room is."]}, {"type": "single", "q": "'Crash' and 'hum' are examples of ______.", "options": ["onomatopoeia", "binomials", "idioms", "metaphors"], "answer": 0, "explanation": "Sound-imitating words.", "hints": ["They sound like what they mean."]}, {"type": "single", "q": "'Pros and cons' is a ______.", "options": ["binomial", "idiom about eyes", "phrasal verb", "simile"], "answer": 0, "explanation": "Two words joined by 'and' in a fixed order.", "hints": ["Fixed pair."]}, {"type": "fill", "q": "'The train had already left when we reached' uses the ______ perfect tense.", "answer": ["past"], "explanation": "had + V3.", "placeholder": "word", "hints": ["Earlier past action."]}, {"type": "single", "q": "In 'Paper Boats' the shiuli flowers symbolise ______.", "options": ["purity, beauty and the start of a new day", "the stars", "a river", "a storm"], "answer": 0, "explanation": "Blooms of the dawn.", "hints": ["Dawn."]}, {"type": "single", "q": "Origami started in ______.", "options": ["Japan", "India", "Egypt", "Italy"], "answer": 0, "explanation": "Over a thousand years ago in Japan.", "hints": ["Father's talk."]}, {"type": "single", "q": "The tone of 'Paper Boats' is ______.", "options": ["gentle and wishful", "angry and loud", "sad and serious", "funny and loud"], "answer": 0, "explanation": "A child's soft hope.", "hints": ["Not sad."]}, {"type": "single", "q": "Which shows climate change in Shaana's postcards?", "options": ["less snow in glaciers and more flooding in the Sundarbans", "her test score", "colourful clothes", "a treehouse"], "answer": 0, "explanation": "Both observations point to a changing climate.", "hints": ["Shaana notices differences."]}, {"type": "single", "q": "'Either the tourists or the guide ______ ready.'", "options": ["is", "are"], "answer": 0, "explanation": "Closer subject: guide.", "hints": ["Singular nearest."]}, {"type": "single", "q": "Agartala means ______.", "options": ["under the agar tree", "beside a river", "city of oil", "tiger place"], "answer": 0, "explanation": "agar + tala (underneath).", "hints": ["Listening."]}, {"type": "truefalse", "q": "A leave application should include the duration and reason for leave.", "answer": true, "explanation": "Yes, and how you will complete your work.", "hints": ["Format."]}, {"type": "single", "q": "Who is known as the Father of Fibre Optics?", "options": ["Dr. Narinder Singh Kapany", "Sushruta", "Kalam", "Janaki Ammal"], "answer": 0, "explanation": "Named an Unsung Hero of the 20th century.", "hints": ["Explore."]}], "mode": "test"}], "id": "c7u3-99-test", "chapter": "c7u3", "minutes": 10}, "c7u4-01-tunnel-read": {"title": "The Tunnel: Read and Discuss", "summary": "Suraj meets Sunder Singh, the tunnel watchman, and a leopard.", "blocks": [{"type": "text", "md": "**Before you read.** What kind of adventure activity would you like? Choose the options that suit you: 1. weekends (new activities / reading / friends / learning); 2. places (dense forests and streams / magical lands / busy cities / quiet places to create); 3. activities (climbing / hidden treasure / puzzles / making models); 4. teamwork (leading / working with others / sharing ideas / working alone). Which suits you best: **Bold Explorer, Imaginative Dreamer, Energetic Planner, Thoughtful Creator**? You may add to the list. Discuss with classmates."}, {"type": "callout", "kind": "tip", "md": "The story is by **Ruskin Bond**. Retold below; the original is on pp. 140–148.", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch04-cards-tunnel", "title": "Words from the story", "cards": [{"front": "shimmered", "back": "shone with a light that appears to move"}, {"front": "railway embankment", "back": "a stone wall that carries the railway over low ground"}, {"front": "cutting", "back": "a narrow valley cut through a hill for a railway"}, {"front": "scrub-covered", "back": "covered with short trees and bushes"}, {"front": "instinctively", "back": "without thought or plan"}, {"front": "flinch", "back": "make a quick movement"}, {"front": "contemplation", "back": "deep thought"}, {"front": "reassure", "back": "comfort, calm"}, {"front": "scuttled", "back": "ran hurriedly"}, {"front": "dazzled", "back": "blinded by bright light"}, {"front": "obstacles", "back": "things that block the way"}, {"front": "night mail", "back": "a train that runs at night"}, {"front": "quaint", "back": "unusual"}, {"front": "lithe", "back": "thin, graceful"}, {"front": "sinewy", "back": "lean and muscular"}, {"front": "snarling", "back": "growling"}, {"front": "defying", "back": "opposing"}]}, {"type": "text", "title": "📖 Part I: The train and the tunnel", "md": "It is almost noon and the jungle is still and silent. Heat waves shimmer along the railway embankment cut through tall evergreen trees; the rails are two straight black serpents disappearing into a tunnel in the hillside.\n\n**Suraj** waits near the cutting to watch the midday steam engine roar out of the tunnel. It is not a station and he is not catching a train. He had cycled out of town, taken a jungle path to a small village, left the cycle and walked over a low scrub-covered hill to the tunnel exit. He hears the shrill whistle, then a sound like distant thunder, and the engine shoots out snorting and puffing like a **green, black and gold dragon**, showering sparks. Suraj steps back; hot steam strikes his face; even the trees seem to flinch. Then only a plume of smoke drifts over the tall shisham trees and the jungle is still.\n\nHe walks into the tunnel. After about twenty yards it is pitch dark and he looks back to reassure himself that there is daylight. The tunnel is full of smoke, but it will be hours before another train. He doesn't stop; he only wants to know what the inside of a tunnel is like. The walls are damp and sticky; a bat flies past; a lizard scuttles between the lines.\n\nOut in the light he is dazzled, and sees on the hillside **a flash of orange and gold and a long swishing tail**, gone in a second.\n\nNear the entrance is the **watchman's hut**, with marigolds in front and a vegetable patch behind. The watchman's duty is to inspect the tunnel and keep it clear of obstacles. Every day before the train comes he walks the length of the tunnel; if all is well he naps; if something is wrong he walks up the line waving a **red flag** and the driver slows down. At night he lights an oil lamp and does the same; if there is danger he waves his lamp to the approaching engine; if all is well he hangs the lamp at his hut door and sleeps.\n\nHe is about to nap when Suraj emerges. \"Welcome, welcome. I don't often have visitors. Tell me why you were inspecting my tunnel.\" \"Is it your tunnel?\" \"It is truly my tunnel, since no one else will have anything to do with it. I have only lent it to the Government.\" Suraj says he saw an animal on the hill. \"It was a leopard,\" says the watchman. \"**My leopard.** It minds its own business and comes to this range for a few days every month.\" His name is **Sunder Singh**, and he has been here many years. He invites Suraj to watch the **night mail** at about nine. \"It is safer in the jungle than in the town. Last month I was almost run over by a bus.\" He naps under a banana leaf: \"The animals also rest in the heat of the day. It is only the tribe of boys who cannot, or will not, rest.\" Suraj walks back to the village."}, {"type": "table", "headers": ["Time", "No danger", "Danger"], "rows": [["Daytime (before the train)", "returns to his hut and takes a nap", "walks back up the line and waves a red flag; the driver slows down"], ["Ni
