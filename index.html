After thoroughly wiping his shoes, he stepped ______. (adverb)", "answer": ["in", "inside", "forward"], "explanation": "He stepped in.", "placeholder": "word", "hints": ["Into the house."]}, {"type": "fill", "q": "She drove slowly ______ the sharp curve. (preposition)", "answer": ["around", "round", "through", "along"], "explanation": "For example around or through.", "placeholder": "word", "hints": ["A road bend."]}, {"type": "fill", "q": "He placed the keys ______ the mat before leaving. (preposition)", "answer": ["on", "under", "beside", "near"], "explanation": "For example on or under.", "placeholder": "word", "hints": ["Where do you put keys on a mat?"]}]}, {"type": "summary", "points": ["A common noun like 'River' takes a capital letter when it is personified.", "Sound words (shrieked, splashed, murmuring, rustle, rattling, wailed) make writing vivid.", "Many English words are borrowed from Indian languages, for example catamaran, guru and jungle.", "Prepositions are followed by an object; adverbs describe the verb; words like on, off, up and down can be both."]}], "minutes": 30, "terms": [{"term": "preposition", "def": "a word that shows the relationship between a noun/pronoun and another word, e.g. on, over"}, {"term": "personification", "def": "giving human qualities to a non-human thing"}, {"term": "adverb", "def": "a word that tells more about a verb"}], "source": {"chapter": "ch01", "sections": ["Let us learn I–VII"], "pages": "8–12"}, "id": "c7u1-03-river-language", "chapter": "c7u1", "kind": "lesson"}, "c7u1-04-river-skills": {"title": "The River: Listen, Speak, Write, Explore", "summary": "Listen to five speakers on school life, give advice, write a nature paragraph and explore.", "blocks": [{"type": "text", "md": "This lesson trains your four skills. Start with **listening**: press the button and keep the script hidden. Then **speak**, **write** and **explore**."}, {"type": "callout", "kind": "note", "title": "🎧 Listening: five people talk about school life", "md": "**Father:** Should girls go to school? Yes, of course. I try to give my son and my daughter the same chances. I look forward to their successful careers and happy lives. Education gives freedom to choose in life. Whether my daughter wants to work in an organisation or be a homemaker, it should be her own choice, and the same goes for my son.\n\n**Grandmother:** I went to school, but many girls of my time could not. Some elders in the village felt that girls should help at home and look after their little brothers and sisters. I am happy that things have changed today.\n\n**Teacher:** School prepares students for useful work in the world. They learn hands-on skills, develop equal respect for head, hands and heart, value the dignity of labour and learn about choices of work for the future.\n\n**Student:** I like going to school. When I read books, I learn about things from all over the world. I also have friends there with whom I can share my feelings.\n\n**Principal:** Everyone should attend school. You must have noticed that the girls are doing very well, but all students can work hard. My message is: come to school regularly and take part in every activity without worrying whether it is meant for girls or boys. The idea is to focus on learning."}, {"type": "callout", "kind": "note", "md": "The listening script above is a **close retelling** of the book's recording (teacher's transcript, p. 39–40). Your original recording words may differ slightly. Use the button to hear it, then try the questions."}, {"type": "quiz", "id": "c7-ch01-quiz-river-listen", "title": "Who said it?", "questions": [{"type": "single", "q": "Who says education gives the freedom to make choices in life?", "options": ["Father", "Grandmother", "Teacher", "Principal"], "answer": 0, "explanation": "The father says his daughter may work in an organisation or be a homemaker; it should be her choice.", "hints": ["Think of careers and choices."]}, {"type": "single", "q": "Who remembers that many girls of the past could not go to school?", "options": ["Student", "Grandmother", "Principal", "Teacher"], "answer": 1, "explanation": "The grandmother says some elders wanted girls to help at home.", "hints": ["An older person looking back."]}, {"type": "single", "q": "Who says school also means friends to share feelings with?", "options": ["Student", "Father", "Principal", "Teacher"], "answer": 0, "explanation": "The student mentions friends and sharing feelings.", "hints": ["The speaker who loves reading books."]}, {"type": "single", "q": "Who talks about equal respect for head, hands and heart?", "options": ["Grandmother", "Principal", "Teacher", "Student"], "answer": 2, "explanation": "The teacher speaks about hands-on skills and the dignity of labour.", "hints": ["Skills and work."]}, {"type": "single", "q": "Who promotes taking part in every school activity, whether for girls or boys?", "options": ["Principal", "Father", "Grandmother", "Student"], "answer": 0, "explanation": "The principal's message is to take part in every activity and focus on learning.", "hints": ["The head of the institution."]}, {"type": "multi", "q": "Which of these words do you hear in the script?", "options": ["homemaker", "careers", "books", "lawyer"], "answer": [0, 1, 2], "explanation": "The words homemaker, careers and books are all used; 'lawyer' is not.", "hints": ["Listen again and tick each word."]}], "intro": "Listen once more if you need to. In the book you also circle words (such as *homemaker, careers, books*) from a box and match seven statements to the five speakers."}, {"type": "exercise", "id": "c7-ch01-ex-river-match", "title": "Match the statements (as in the book)", "difficulty": "medium", "minutes": 8, "goal": "Match each statement with a speaker (i)–(v). Two statements are not needed.", "behavior": "Speakers: (i) Father, (ii) Grandmother, (iii) Teacher, (iv) Student, (v) Principal. Statements: 1 promotes active participation for all in school activities; 2 comments on how school makes Mathematics joyful; 3 believes in education that leads to freedom of choice; 4 says school also means companionship; 5 understands that boys and girls have different abilities; 6 persuades the parent to grant permission; 7 believes learning skills is not gender-based.", "hints": ["Statement 3 is about freedom of choice.", "Statement 4 is about friends.", "Statement 1 is about activities for all."], "checklist": ["I matched 1, 3 and 4 with a speaker", "I decided which statements do not fit", "I checked my answers with the teacher"], "solution": "Suggested: 1 → Principal (v), 3 → Father (i), 4 → Student (iv), 7 → a speaker who says girls and boys should not be separated (Principal / Teacher); 2, 5 and 6 are not matched in the script above. Check your own recording with the teacher.", "solution_lang": "text", "solution_explain": "Statements 2, 5 and 6 do not appear in the recording, so they are the extras.", "mode": "selfcheck"}, {"type": "text", "md": "**Speaking I: change the voice.** The River spoke to Jahnavi in a sleepy voice: \"Dear, dear! What's the matter? … You shouldn't cry, you know. And you really shouldn't be scared, when you have been coming here to see me every day, well, almost every day.\" Work in pairs and take turns to speak the same lines in other voices: **happy, surprised, angry, scared, sad, worried**.", "title": "Let us speak"}, {"type": "callout", "kind": "tip", "md": "Change your **tone**, **speed** and **volume**: scared = quick and quiet; angry = loud and sharp; sad = slow and soft."}, {"type": "text", "md": "**Speaking II: ask for and give advice.** Jahnavi asks the River for advice and the River gives it. Work in pairs. Take turns to **ask for** and **give** advice for these situations:\n\n1. You wish to play football at school but it has an all-boys' team only.\n2. You cannot score well in Mathematics because of nervousness during exams.\n3. You enjoy music classes but do not get enough time to practise.\n4. You cannot see the blackboard clearly from the last bench.\n\n**Asking for advice:** \"I have a problem with … What do you think I should do?\" / \"Do you think I should…?\" / \"What would you do in my position?\" / \"I'd appreciate your advice on this issue.\"\n\n**Giving advice:** \"I think you should…\" / \"Why don't you…?\" / \"The best thing to do is…\" / \"If I were you, I would / wouldn't…\""}, {"type": "exercise", "id": "c7-ch01-ex-river-advice", "title": "Give advice", "difficulty": "easy", "minutes": 6, "goal": "Give advice for Situation (ii): nervousness in Mathematics exams.", "behavior": "Write or say 3 pieces of advice using at least two different phrases from the box.", "hints": ["Start with 'I think you should…'", "Think of practice, sleep and breathing.", "Use 'If I were you, I would…' as a second phrase."], "checklist": ["I used two different advice phrases", "My advice is practical", "I was polite"], "solution": "I think you should practise past papers so the exam feels familiar. Why don't you take three slow, deep breaths before you start? If I were you, I would also sleep well the night before.", "solution_lang": "text", "solution_explain": "Good advice uses a gentle phrase and a clear, doable step.", "mode": "selfcheck"}, {"type": "text", "md": "**Writing: Observing Nature.** Over the next few days, watch the colours, shapes, patterns and textures in nature: plants, trees, flowers, birds, even the sky. Notice textures, movements and how light plays with them: the soft ripple of water, the flutter of a butterfly, the colour of a bird. Make detailed notes, then write a **descriptive paragraph** with a **title**.", "title": "Let us write"}, {"type": "table", "headers": ["Ideas", "Prompts"], "rows": [["What do you observe?", "Every day, I see… / I find it very interesting that…"], ["How do you feel? Why?", "I like… because… / I feel… as…"], ["What is your message to everyone around you?", "I want to tell you that… / My advice to all is…"]]}, {"type": "exercise", "id": "c7-ch01-ex-river-nature", "title": "Observing Nature paragraph", "difficulty": "medium", "minutes": 15, "goal": "Write a descriptive paragraph (6–8 sentences) with a title about something you observed in nature.", "behavior": "Include colours, shapes, textures, one feeling and one message to others.", "hints": ["Go outside for five minutes and take notes.", "Use the prompts in the table.", "Read it aloud to check it flows."], "checklist": ["I gave a title", "I used at least 3 describing words (colours, shapes, textures)", "I said how I feel and why", "I ended with a message"], "solution": "**The Dancing Neem Tree.** Every day, I see a tall neem tree outside my window. Its leaves are small, bright green and shaped like feathers. When the wind blows, the branches sway like dancers. I find it very interesting that tiny birds hide in its cool shade. I like this tree because it makes the afternoon calm. My advice to all is: look at nature closely, and you will never feel alone.", "solution_lang": "text", "solution_explain": "The model paragraph has a title, specific details, a feeling and a message.", "mode": "selfcheck"}, {"type": "text", "md": "**Explore I.** Discuss why rivers in India are considered sacred and most of them are referred to as female (for example Ganga, Yamuna, Godavari, Kaveri). A few rivers are referred to as male, for example the **Brahmaputra** and the **Sone**.\n\n**Explore II (whole class).** India is a multilingual country and many of us can speak two to three languages easily. Make a list of the languages everyone in your class can speak and display it on a chart paper. Then discuss: in which language do you enjoy reading and learning the most?", "title": "Let us explore"}, {"type": "text", "md": "**Explore III: read the poster.** The poster shows smiling girls writing in notebooks with the words *'The Happiness of a Nation lies in the Dignity of its Daughters'*. Answer in your notebook:\n\n1. What are the things you can observe in the poster?\n2. Why do you think the girls look happy?\n3. Dignity means 'self-respect'. What is the relation between dignity and happiness?\n4. How does a Nation prosper when its daughters are happy?\n\n**Explore IV.** The Government has launched many schemes for the education of the girl child, such as **Beti Bachao Beti Padhao**, **Balika Samriddhi Yojana** and the **Samagra Shiksha Scheme–Kasturba Gandhi Balika Vidyalayas**. Find out more such schemes from the internet or your teacher and spread awareness in your neighbourhood."}, {"type": "reveal", "prompt": "Poster questions: model answers", "md": "1. Girls in bright clothes writing and smiling, the slogan, a classroom.\n2. They feel safe, respected and happy to learn.\n3. When people are treated with respect and given choices, they feel proud and happy.\n4. Educated, confident daughters become skilled citizens, support families and add to the country's growth."}, {"type": "summary", "points": ["Listening for who says what helps you follow different viewpoints.", "Voice, tone and speed change the meaning of the same sentence.", "Advice phrases: 'I think you should…', 'Why don't you…?', 'If I were you…'.", "A descriptive paragraph needs a title, specific details, feelings and a message."]}], "minutes": 35, "source": {"chapter": "ch01", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "12–15, 39–40"}, "id": "c7u1-04-river-skills", "chapter": "c7u1", "kind": "lesson"}, "c7u1-05-tryagain-read": {"title": "Try Again: Read the Poem and Discuss", "summary": "Follow the story of King Bruce and the spider and complete the discussion tasks.", "blocks": [{"type": "text", "md": "Now the second selection: a poem named **Try Again** by **Eliza Cook**. It is a narrative poem, which means it tells a story. First, warm up!"}, {"type": "text", "md": "**Before you read.** I. Who inspires you to do your best? II. Work in pairs and look at the six pictures in your book: **1. a beehive with bees, 2. a spider on a web, 3. geese flying in a V, 4. a bird at its hanging nest, 5. a line of ants, 6. a tree full of apples.** What can we learn from them? (Think: teamwork, patience, hard work, never giving up.) Share with the class.", "title": "Warm-up"}, {"type": "table", "headers": ["Picture", "What we can learn"], "rows": [["Bees at the hive", "Teamwork and hard work"], ["Spider on web", "Patience and trying again"], ["Geese flying in a V", "Helping each other, sharing the effort"], ["Bird at its nest", "Careful building and determination"], ["Ants in a line", "Working together and discipline"], ["Apple tree", "Growing slowly bears fruit; patience pays off"]]}, {"type": "callout", "kind": "tip", "md": "**Poem and copyright.** I cannot print the poem word for word here. Please read it in your book (pp. 17–18) and use this meaning-by-meaning retelling beside it. The Read aloud button reads my retelling, not Eliza Cook's words.", "title": "Reading plan"}, {"type": "text", "title": "📖 The story of King Bruce and the spider", "md": "**Stanzas 1–3 (King Bruce is sad).** King Bruce of Scotland flings himself down alone to think. He is a king with a crown, but his heart is sinking. He has been trying to do a great deed to make his people glad. He tried and tried but could not succeed, so he feels very sad. He lies in low despair, as grieved as a man could be, and after a while he thinks: \"I will give it all up.\"\n\n**Stanzas 4–5 (A spider drops).** At that very moment a spider drops down on its fine, silky thread. The king stops thinking and watches what the spider will do. It is a long way up to the ceiling where its web is, and the rope is very thin. The king cannot guess how it will get home.\n\n**Stanzas 6–9 (The spider tries and falls).** The spider begins to cling and crawl upwards with strong effort, but it falls with a slippery sprawl, as near the ground as before. It runs up again without complaining, but falls even lower and lies there a little dizzy and faint. Its head becomes steady and it climbs again, half a yard higher, on a delicate thread where its feet grow tired. Again it falls and swings below, again it climbs. Up and down, fast and slow, **nine brave attempts** are counted.\n\n**Stanzas 10–12 (The king doubts, the spider wins).** The king says, \"That foolish thing will not climb again, it works so hard and tumbles every time.\" But up the insect goes once more. It is an anxious moment: it is only a foot from its cobweb door. Will it lose or win? Steadily, inch by inch, higher and higher, and with a bold little run at the very last moment it reaches its home.\n\n**Stanzas 13–14 (The king is inspired).** \"Bravo!\" cries the king. All honour to those who try; the spider defied despair and conquered, so why should he not? Bruce of Scotland steadies his mind, and the story goes that he tried once more, as he had tried before, and this time he did **not fail**."}, {"type": "flashcards", "id": "c7-ch01-cards-poem", "title": "Key ideas of the poem", "cards": [{"front": "narrative poem", "back": "a poem that tells a story"}, {"front": "despair", "back": "a feeling of having lost all hope"}, {"front": "perseverance", "back": "trying again and again without giving up"}, {"front": "nine attempts", "back": "how many times the spider tried before it succeeded"}, {"front": "bravo", "back": "an exclamation of praise (an interjection)"}, {"front": "monarch", "back": "a king or queen"}]}, {"type": "quiz", "id": "c7-ch01-quiz-poem-summary", "title": "Let us discuss I: complete the summary", "questions": [{"type": "fill", "q": "King Bruce was feeling ______ after failing multiple times. (low / despair / tried / mounted / attempts / great / conquered / strive)", "answer": ["low"], "explanation": "'Feeling low' means sad and discouraged.", "placeholder": "word", "hints": ["Not 'despair' (that is used in blank 3)."]}, {"type": "fill", "q": "…to achieve something ______ for his people.", "answer": ["great"], "explanation": "His aim was a *great* deed.", "placeholder": "word", "hints": ["Adjective before 'deed'."]}, {"type": "fill", "q": "In a moment of ______, he observed a spider.", "answer": ["despair"], "explanation": "He was in low despair.", "placeholder": "word", "hints": ["Feeling hopeless."]}, {"type": "fill", "q": "The spider ______ every time it fell after getting close to its goal.", "answer": ["mounted"], "explanation": "'Mounted' means climbed again.", "placeholder": "word", "hints": ["It climbed back up."]}, {"type": "fill", "q": "It made nine ______ and finally succeeded.", "answer": ["attempts"], "explanation": "Nine attempts.", "placeholder": "word", "hints": ["Tries."]}, {"type": "fill", "q": "The king said that the spider had ______ and so would he.", "answer": ["conquered"], "explanation": "The spider conquered (won).", "placeholder": "word", "hints": ["It reached its goal."]}, {"type": "fill", "q": "King Bruce decided to ______.", "answer": ["strive"], "explanation": "'Strive' means try very hard.", "placeholder": "word", "hints": ["Not 'tried' (past)."]}, {"type": "fill", "q": "When he ______ this time, he ultimately succeeded.", "answer": ["tried"], "explanation": "Past of try.", "placeholder": "word", "hints": ["Past tense."]}]}, {"type": "text", "md": "**II. Complete the sentences.** 1. We can say that the poet uses the narrative style because ______. 2. The central idea of the poem is ______.\n\n**III. Pick three examples** of (1) lines that describe the spider's efforts, and (2) alliteration (repetition of the same consonant sound at the start of nearby words). Look at stanzas 6–11 in your book. For example, hunt for the repeated **c** sounds in the spider's first climb, the repeated **s** sounds in the slow climb, and the repeated **b** sounds in the final run.\n\n**IV.** Why does the poet repeat 'tried and tried', 'steadily, steadily' and 'up, up'?"}, {"type": "reveal", "prompt": "Model answers: II and IV", "md": "**II.1** The poem tells a story with characters (the king and the spider), events in order, and an ending. **II.2** The central idea is **perseverance**: if we keep trying, we will succeed.\n\n**IV.** Repetition shows **continuous effort**, builds rhythm and stresses the idea that success comes through persistence (many tries, slow steady climbing, upward motion)."}, {"type": "quiz", "id": "c7-ch01-quiz-poem-rhyme", "title": "Let us discuss V: rhyme and interjection", "questions": [{"type": "single", "q": "The rhyme scheme of the poem is ______.", "options": ["AABB", "ABBA", "ABAB"], "answer": 2, "explanation": "In stanza 1, down/crown rhyme (lines 1 and 3) and think/sink rhyme (lines 2 and 4): ABAB.", "hints": ["Match the end sounds of lines 1–4 of a stanza."]}, {"type": "single", "q": "'Bravo' is an example of ______.", "options": ["conjunction", "interjection", "adjective"], "answer": 1, "explanation": "It is an exclamation of praise.", "hints": ["Words like 'Wow!' and 'Hurray!'."]}, {"type": "single", "q": "The poet uses 'twas and 'tis for the sake of ______.", "options": ["rhythm", "rhyme", "contraction"], "answer": 0, "explanation": "Shortened forms keep the beat (number of syllables) of the line steady.", "hints": ["What do these short forms keep even?"]}]}, {"type": "summary", "points": ["King Bruce, sad after many failures, watches a spider make nine attempts and succeed.", "He is inspired, tries again and succeeds.", "The poem is narrative, rhymes ABAB and uses repetition to show perseverance.", "Words to know: despair, strive, conquered, attempts."]}], "minutes": 25, "terms": [{"term": "narrative poem", "def": "a poem that tells a story"}, {"term": "perseverance", "def": "trying again and again without giving up"}, {"term": "interjection", "def": "a word of sudden feeling, e.g. Bravo!"}], "source": {"chapter": "ch01", "sections": ["Before we read", "Let us read", "Let us discuss I–V"], "pages": "16–19"}, "id": "c7u1-05-tryagain-read", "chapter": "c7u1", "kind": "lesson"}, "c7u1-06-tryagain-metaphor": {"title": "Try Again: Metaphors, Similes and Reflection", "summary": "Learn metaphor and simile, then answer the think-and-reflect questions.", "blocks": [{"type": "text", "md": "A poem often compares one thing to another. In *Try Again*, the spider's climbing is compared to King Bruce's own struggle: just as the spider tries again and again to reach its web, Bruce tries to achieve a great deed. This poetic device is called **metaphor** and it strengthens the message of perseverance: keep trying till we succeed."}, {"type": "callout", "kind": "key", "md": "A **metaphor** is an implied comparison between two unlike things *without* using 'like', 'as' or 'as…as'. It says one thing **is** another. A **simile** uses 'like' or 'as'.", "title": "Definition"}, {"type": "reveal", "prompt": "Which is a metaphor: 'He ran as fast as a cheetah' or 'The world is a stage'?", "md": "'The world is a stage' is the metaphor: it says one thing **is** another. 'As fast as a cheetah' is a simile because of **as…as**."}, {"type": "quiz", "id": "c7-ch01-quiz-metaphor", "title": "Write M for metaphor or S for simile", "questions": [{"type": "single", "q": "He ran as fast as a cheetah.", "options": ["M", "S"], "answer": 1, "explanation": "'as…as' makes it a simile.", "hints": ["Look for 'as…as'."]}, {"type": "single", "q": "The world is a stage.", "options": ["M", "S"], "answer": 0, "explanation": "Direct statement without like/as: metaphor.", "hints": ["No comparison word."]}, {"type": "single", "q": "The night was as dark as coal.", "options": ["M", "S"], "answer": 1, "explanation": "'as dark as'.", "hints": ["as…as."]}, {"type": "single", "q": "He sang like an angel.", "options": ["M", "S"], "answer": 1, "explanation": "'like'.", "hints": ["Comparison word."]}, {"type": "single", "q": "Her voice was music to his ears.", "options": ["M", "S"], "answer": 0, "explanation": "It says voice *was* music.", "hints": ["No like/as."]}, {"type": "single", "q": "The classroom was a zoo.", "options": ["M", "S"], "answer": 0, "explanation": "Direct comparison.", "hints": ["No like/as."]}, {"type": "single", "q": "The baby slept like a log.", "options": ["M", "S"], "answer": 1, "explanation": "'like'.", "hints": ["Comparison word."]}, {"type": "single", "q": "Her smile was as bright as the sun.", "options": ["M", "S"], "answer": 1, "explanation": "'as…as'.", "hints": ["as…as."]}, {"type": "single", "q": "The lake was a mirror, reflecting the sky.", "options": ["M", "S"], "answer": 0, "explanation": "Direct comparison.", "hints": ["No like/as."]}]}, {"type": "text", "md": "**Transform them.** Change similes to metaphors and metaphors to similes. Two examples are given in the book:\n\n- *Knowledge spreads like the branches of a mighty tree.* → *Knowledge is a spreading branch of a mighty tree.*\n- *His courage was a beacon, guiding us through the storm.* → *His courage was like a beacon guiding us through the storm.* (or *as bright as a beacon…*)"}, {"type": "quiz", "id": "c7-ch01-quiz-transform", "title": "Transform the sentences", "questions": [{"type": "single", "q": "'The book was a treasure chest, filled with endless adventures.' as a simile:", "options": ["The book was like a treasure chest, filled with endless adventures.", "The book is a treasure chest.", "The book was filled with adventures.", "The treasure chest was a book."], "answer": 0, "explanation": "Add 'like' (or 'as…as') to change a metaphor into a simile.", "hints": ["Add a comparison word."]}, {"type": "single", "q": "'Her laughter was a melody that brightened the darkest days.' as a simile:", "options": ["Her laughter was like a melody that brightened the darkest days.", "Her laughter melted the days.", "A melody was her laughter.", "She laughed in the dark."], "answer": 0, "explanation": "Same idea with 'like'.", "hints": ["Add like."]}, {"type": "single", "q": "'The mountain stood as a guard, watching over the valley below.' as a metaphor:", "options": ["The mountain was a guard watching over the valley below.", "The mountain looked like a guard.", "The guard stood by the mountain.", "The mountain was tall."], "answer": 0, "explanation": "Remove 'as' and say it *was* a guard.", "hints": ["Say one thing IS another."]}, {"type": "single", "q": "'The night was like a velvet cloak, wrapping the world in mystery.' as a metaphor:", "options": ["The night was a velvet cloak, wrapping the world in mystery.", "The night was dark.", "The cloak was the night.", "Velvet is soft."], "answer": 0, "explanation": "Delete 'like'.", "hints": ["Remove like."]}, {"type": "single", "q": "'Her thoughts were like butterflies in a summer meadow.' as a metaphor:", "options": ["Her thoughts were butterflies in a summer meadow.", "Her thoughts were as light as butterflies.", "Butterflies thought in a meadow.", "Her thoughts flew."], "answer": 0, "explanation": "Delete 'like'.", "hints": ["Remove like."]}]}, {"type": "text", "md": "**Let us think and reflect: Extract 1.** *He flings himself down in low despair… 'I'll give it all up'… Now just at that moment a spider dropped, with its silken, filmy clue.*"}, {"type": "quiz", "id": "c7-ch01-quiz-poem-ext1", "title": "Extract 1", "questions": [{"type": "fill", "q": "Select the phrase that shows the physical expression of the King's emotional state. (two words)", "answer": ["flung himself down", "flung himself"], "explanation": "His body language (throwing himself down) shows how sad he is.", "placeholder": "phrase", "hints": ["What does the king do with his body?"]}, {"type": "single", "q": "Why does the poet use the word 'low' before despair?", "options": ["It shows the depth of sadness", "It describes a small room", "It means quiet", "It means cheap"], "answer": 0, "explanation": "'Low' suggests being at the lowest point of feeling.", "hints": ["Think of 'feeling low'."]}, {"type": "single", "q": "'And after a while he pondered there': 'pondered' means ______.", "options": ["paused", "thought", "noticed", "rested"], "answer": 1, "explanation": "To ponder is to think carefully.", "hints": ["What do people do while 'wondering'?"]}, {"type": "single", "q": "The phrase 'silken filmy clue' creates the image of something that is ______.", "options": ["long and light", "very delicate and soft"], "answer": 1, "explanation": "'Silken' and 'filmy' stress fine and soft.", "hints": ["Think of silk."]}]}, {"type": "text", "md": "**Extract 2.** *…it toils so hard to reach and cling, and tumbles every time. But up the insect went once more, ah me! 'tis an anxious minute; he's only a foot from his cobweb door, oh say, will he lose or win it?*"}, {"type": "quiz", "id": "c7-ch01-quiz-poem-ext2", "title": "Extract 2", "questions": [{"type": "single", "q": "Complete the analogy: toil : hard :: ______ : ______", "options": ["roll : tumble", "tumble : circle", "compress : roll", "jump : tumble"], "answer": 0, "explanation": "Toil is working hard; tumble is a rough, tough kind of rolling: each pair joins a verb with a stronger or intense form. (Talk about this one with your teacher too.)", "hints": ["Look for a pair of related actions."]}, {"type": "multi", "q": "Two characteristics of the spider in 'But up the insect went once more':", "options": ["determined", "lazy", "persevering", "afraid"], "answer": [0, 2], "explanation": "It keeps going after falls: determination and perseverance.", "hints": ["What does it do after a fall?"]}, {"type": "single", "q": "'Ah me!' indicates a sense of ______.", "options": ["happiness", "stress", "relief", "loneliness"], "answer": 1, "explanation": "It is an anxious minute, so stress.", "hints": ["The poet calls it 'an anxious minute'."]}, {"type": "single", "q": "Readers relate to this extract because ______.", "options": ["we all face failures and still want to try again", "spiders are common", "kings are rich", "poems are short"], "answer": 0, "explanation": "Everyone knows the feeling of failing and trying again.", "hints": ["Think about your own life."]}]}, {"type": "text", "md": "**Long answers.** Think first, then open the model answers."}, {"type": "reveal", "prompt": "1. How does the first stanza help in setting the mood?", "md": "It shows a **lonely, sad king** with a sinking heart even though he wears a crown, which makes the mood gloomy and sets up the later change."}, {"type": "reveal", "prompt": "2. How does King Bruce's attitude change?", "md": "At the start he feels despair and wants to **give up**. After watching the spider, he feels hope and determination and **tries again and succeeds**."}, {"type": "reveal", "prompt": "3. The poet describes every action of the spider in detail. What does this tell us about his attitude?", "md": "The poet **admires and respects** the spider and wants us to notice every effort; he sees even a tiny creature as a teacher."}, {"type": "reveal", "prompt": "4. How does the spider inspire us to overcome despair?", "md": "It falls nine times but never stops. It shows that **failure is not the end**, and patient, steady effort leads to success."}, {"type": "reveal", "prompt": "5. Failures are stepping stones to success. Explain.", "md": "Each fall teaches the spider something and brings it nearer. In the same way, mistakes teach us what not to do and make us stronger."}, {"type": "reveal", "prompt": "6. Anyone can be a source of inspiration. Elaborate.", "md": "The teacher here is a tiny spider, not a famous person. Inspiration can come from anyone: a child, an ant, a neighbour, if we are ready to **learn from what we see**."}, {"type": "summary", "points": ["A metaphor says one thing is another; a simile uses like or as.", "Change a simile into a metaphor by removing 'like/as' and using 'is/was'.", "'Flung himself down' shows physical expression; 'low despair' shows depth of sadness.", "The spider's persistence is the heart of the poem, and the poet admires it."]}], "minutes": 30, "terms": [{"term": "metaphor", "def": "an implied comparison without like or as"}, {"term": "simile", "def": "a comparison using like or as"}, {"term": "alliteration", "def": "repeating the same consonant sound at the start of nearby words"}], "source": {"chapter": "ch01", "sections": ["Let us discuss VI", "Let us think and reflect"], "pages": "20–22"}, "id": "c7u1-06-tryagain-metaphor", "chapter": "c7u1", "kind": "lesson"}, "c7u1-07-tryagain-skills": {"title": "Try Again: Words, Listening, Speaking, Writing", "summary": "Opposites, word meanings, distance words, tongue twisters, an ant story, a personal narration, a letter and a spider web.", "blocks": [{"type": "text", "md": "This lesson covers everything after the poem: **Let us learn I–IV**, **Let us listen**, **Let us speak**, **Let us write** and **Let us explore**."}, {"type": "text", "md": "**I. Opposites.** Write the opposite of each word taken from the poem.", "title": "Let us learn I"}, {"type": "quiz", "id": "c7-ch01-quiz-opposites", "title": "Opposites", "questions": [{"type": "fill", "q": "up ×", "answer": ["down"], "explanation": "Up and down.", "placeholder": "opposite", "hints": ["Direction."]}, {"type": "fill", "q": "fast ×", "answer": ["slow"], "explanation": "Fast and slow.", "placeholder": "opposite", "hints": ["Speed."]}, {"type": "fill", "q": "glad ×", "answer": ["sad", "unhappy"], "explanation": "Glad and sad.", "placeholder": "opposite", "hints": ["Feeling."]}, {"type": "fill", "q": "win ×", "answer": ["lose"], "explanation": "Win and lose.", "placeholder": "opposite", "hints": ["Result."]}, {"type": "fill", "q": "succeed ×", "answer": ["fail"], "explanation": "Succeed and fail.", "placeholder": "opposite", "hints": ["Result."]}]}, {"type": "text", "md": "**II. Words about effort.** Match each underlined word with its meaning: **1.** work very hard and/or for a long time; **2.** prepared themselves for something difficult; **3.** an attempt to do something new or difficult; **4.** to try very hard to achieve something.", "title": "Let us learn II"}, {"type": "quiz", "id": "c7-ch01-quiz-effort-words", "title": "Meanings", "questions": [{"type": "single", "q": "Please make every **endeavour** to arrive on time.", "options": ["an attempt to do something new or difficult", "work very hard for a long time", "prepared themselves", "to try very hard"], "answer": 0, "explanation": "An endeavour is an attempt or serious effort.", "hints": ["Noun: effort."]}, {"type": "single", "q": "Ants **toil** tirelessly to save food for the rainy season.", "options": ["an attempt", "work very hard and/or for a long time", "prepared themselves for something difficult", "to try very hard to achieve something"], "answer": 1, "explanation": "Toil = hard work over a long time.", "hints": ["Ants work all day."]}, {"type": "single", "q": "We encourage all students to **strive** to do their best.", "options": ["to try very hard to achieve something", "work hard", "an attempt", "prepared"], "answer": 0, "explanation": "Strive = try very hard to achieve something.", "hints": ["Verb about trying."]}, {"type": "single", "q": "The sailors **braced** themselves against the strong wind.", "options": ["prepared themselves for something difficult", "an attempt", "work very hard", "to try very hard"], "answer": 0, "explanation": "Braced = got ready for something hard.", "hints": ["Getting ready for the wind."]}]}, {"type": "exercise", "id": "c7-ch01-ex-own-sentences", "title": "My own sentences", "difficulty": "easy", "minutes": 8, "goal": "Frame one sentence of your own for each word: endeavour, toil, strive, braced.", "behavior": "Write four sentences, one for each word, showing its meaning clearly.", "hints": ["Use the school or sports for ideas.", "Check whether the word is a noun or a verb."], "checklist": ["Each sentence has the target word", "The meaning is clear from the sentence", "The spelling and grammar are correct"], "solution": "My team made an endeavour to clean the park. Farmers toil in the fields from dawn. I strive to improve my handwriting. We braced ourselves before the cold wave came.", "solution_lang": "text", "solution_explain": "Good sentences show the meaning by their context.", "mode": "selfcheck"}, {"type": "text", "md": "**III. Distance words.** The poem uses words that show distance (for example *a long way up*, *inch by inch*, *higher and higher*, *half-yard higher*). Sort the words in the box into **Far** and **Near** (use a dictionary).\n\nproximity · middle of nowhere · vicinity · adjacent · remoteness · yonder · afar · a stone's throw · light year · hairline · farther", "title": "Let us learn III"}, {"type": "quiz", "id": "c7-ch01-quiz-distance", "title": "Far or near?", "questions": [{"type": "multi", "q": "Which words mean FAR?", "options": ["remoteness", "yonder", "vicinity", "afar", "light year", "adjacent"], "answer": [0, 1, 3, 4], "explanation": "Remoteness, yonder, afar and light year all describe a long distance; vicinity and adjacent mean near.", "hints": ["These are words for 'a long way off'."]}, {"type": "multi", "q": "Which words mean NEAR?", "options": ["proximity", "vicinity", "adjacent", "a stone's throw", "hairline", "afar"], "answer": [0, 1, 2, 3, 4], "explanation": "They show closeness. 'Afar' is far.", "hints": ["Which are about nearness or tiny gaps?"]}]}, {"type": "text", "md": "**IV. Tongue twister.** Say 'Twas a delicate thread it had to tread' (the line of the poem about the spider's thread) five to six times quickly. Can you say it clearly? Make up more tongue twisters of your own.", "title": "Let us learn IV"}, {"type": "callout", "kind": "note", "title": "🎧 Listening: a story about an ant", "md": "**Narrator:** Hello everyone. I am sure you have enjoyed learning about King Bruce and the spider. Let me share another story with you. In a thick green forest there lived a little ant. She was known for her determination and her never-give-up attitude. One sunny day she found a delicious piece of roti that was too big for her to carry alone.\n\n**Ant:** This piece is huge, but I must get it back to the anthill. My family will be so happy!\n\n**Narrator:** She tried to lift it with all her might, but it was too heavy. She tried pushing, pulling and even rolling it, but nothing worked. Tired and sad, she sat down and began to cry. Then she noticed a small bird nearby, trying to build a nest. The bird picked up twigs and leaves, but every time it tried to place them, the wind blew them away. Yet the bird did not give up. It kept trying again and again until it built a strong nest.\n\n**Ant:** If that bird can keep trying and succeed, then I should not give up either.\n\n**Narrator:** Feeling inspired, the ant gathered her strength and called her fellow ants for help. Together they formed a chain and lifted the roti, and slowly but surely they carried it back to the anthill.\n\n**Ant:** We did it! Thank you everyone! With teamwork and never giving up, we can achieve anything!\n\n**Narrator:** She and her friends celebrated. We too should learn from the ant never to give up, no matter how difficult things seem. Thank you!"}, {"type": "quiz", "id": "c7-ch01-quiz-ant", "title": "Listening questions (guess first, then listen)", "questions": [{"type": "single", "q": "What was the ant known for?", "options": ["determination", "strength", "wisdom"], "answer": 0, "explanation": "She was known for determination and a never-give-up attitude.", "hints": ["Look at the first lines."]}, {"type": "single", "q": "Why was the ant unable to take the roti home?", "options": ["It was stuck under a rock", "It was too heavy to carry", "It was pulled by other ants"], "answer": 1, "explanation": "It was too big and heavy for her alone.", "hints": ["She tried lifting, pushing, pulling, rolling."]}, {"type": "single", "q": "What was the bird doing?", "options": ["playing with the ant", "searching for food", "picking up leaves (to build a nest)"], "answer": 2, "explanation": "It collected twigs and leaves to build a nest.", "hints": ["Think of the wind blowing things away."]}, {"type": "single", "q": "How did the bird make the ant feel?", "options": ["proud", "inspired", "relaxed"], "answer": 1, "explanation": "The ant felt inspired to try again.", "hints": ["She decided to try again."]}, {"type": "single", "q": "How did the fellow ants help?", "options": ["by advising the ant continuously", "by standing still near the ant", "by joining the ant in her efforts"], "answer": 2, "explanation": "They formed a chain and lifted the roti.", "hints": ["Teamwork."]}]}, {"type": "text", "md": "**Let us speak: narrate a personal experience.** Tell the class about a time when you were motivated by someone or something to carry on and never give up, and your perseverance helped you. Use the prompts below as a guide: 1 Introduction, 2 the challenge, 3 feeling disheartened, 4 the source of motivation, 5 taking action, 6 the result, 7 reflection.", "title": "Let us speak"}, {"type": "table", "headers": ["Step", "Sentence starters"], "rows": [["1. Introduction", "I remember a time when I felt like giving up. It was when… / There was a moment in my life when I faced a big challenge…"], ["2. Describe the challenge", "The challenge I faced was… / I was struggling with… / The problem seemed too big because…"], ["3. Feeling disheartened", "At first I felt discouraged… / I didn't think I could succeed because…"], ["4. Source of motivation", "But then I saw/heard/read about… / I remembered the poem… do not quit…"], ["5. Taking action", "After feeling inspired I decided to… / I gathered my strength and… / I asked for help from…"], ["6. The result", "In the end I was able to… / I felt proud because… / It was worth it because…"], ["7. Reflection", "This experience taught me that… / The lesson I learnt from this is…"]]}, {"type": "exercise", "id": "c7-ch01-ex-narrate", "title": "Narrate your never-give-up story", "difficulty": "medium", "minutes": 10, "goal": "Tell a 1-minute story (or write 8 sentences) about a time you did not give up.", "behavior": "Use at least one starter from each of the seven steps.", "hints": ["Pick a small real event (a hard exercise, a race, learning to swim).", "Write one sentence for each step.", "Practise aloud once."], "checklist": ["I used the 7 steps in order", "I said how I felt", "I ended with a lesson"], "solution": "I remember a time when I felt like giving up. It was when I could not ride a bicycle. I fell many times. I remembered the spider in the poem and decided to try again. My brother held the seat and I practised daily. In the end I rode alone. This experience taught me that perseverance is the key.", "solution_lang": "text", "solution_explain": "Seven small steps make a clear, complete story.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us write: a letter to your cousin.** King Bruce was inspired by the spider that kept trying till it succeeded. Think about the steps you can take to overcome a difficult situation and write them down. Then write a letter to your cousin about how you plan to overcome any difficult situation, and advise them **not to quit** and to persevere. Use transition words: *To begin with…, Next…, After that…, Then…, Finally…* to share the steps of your plan.\n\n**Begin this way:**\n\n20, Rajendra Nagar\nJeevanpur\n23 August 20XX\n\nDear Monika,\nThank you for your letter asking me about…\n\n**End this way:** Yours affectionately, Deepa", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch01-ex-cousin-letter", "title": "Letter to a cousin", "difficulty": "medium", "minutes": 15, "goal": "Write an informal letter of 8–10 lines to your cousin about overcoming a difficult situation.", "behavior": "Include your address, date, greeting, the plan with the transition words, advice not to quit, and a closing.", "hints": ["Write the plan as 5 steps first.", "Keep the tone friendly.", "Mention the spider or the ant if you like."], "checklist": ["Address and date at the top", "Greeting 'Dear …'", "Steps with To begin with / Next / After that / Then / Finally", "Advice to persevere", "Closing 'Yours affectionately,' and name"], "solution": "20, Rajendra Nagar\nJeevanpur\n23 August 2026\n\nDear Monika,\nThank you for your letter. To begin with, I make a small plan. Next, I do one part every day. After that, I ask a teacher for help. Then I check my mistakes. Finally, I try again. Please don't quit; remember the spider. Yours affectionately,\nDeepa", "solution_lang": "text", "solution_explain": "An informal letter is friendly, clear and ordered with transition words.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. Collect **folk songs** in your own language that connect us with nature and compile them as a class project.\n\nII. Did you know that **spiders are not insects**? They belong to a group called **arachnids**. Observe a spider and an ant from a distance and note the differences between them. Share your observations with classmates, and ask your Science teacher for more information.\n\nIII. **Weave a spider web.** Take three sticks (about eight inches each) and a roll of old wool. Tie the sticks together in the centre with wool (Fig. 1). Start weaving by putting a loop around every stick (Figs. 2 and 3). Complete the web and tie the thread in a knot on the stick where the web is complete (Fig. 4). Decorate it with words and phrases you learnt about the spider in the poem, or anything else you like.", "title": "Let us explore"}, {"type": "table", "headers": ["Feature", "Spider", "Ant"], "rows": [["Group", "Arachnid", "Insect"], ["Body parts", "2 (head-chest part and abdomen)", "3 (head, chest, abdomen)"], ["Legs", "8", "6"], ["Antennae", "None", "Two"]]}, {"type": "summary", "points": ["Opposites: up/down, fast/slow, glad/sad, win/lose, succeed/fail.", "Endeavour, toil, strive and braced all describe effort or preparation.", "The ant story shows determination, learning from a bird, and teamwork.", "A letter to a cousin is informal: friendly tone, plan with transition words, advice to persevere."]}], "minutes": 40, "source": {"chapter": "ch01", "sections": ["Let us learn I–IV", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "22–27, 40–41"}, "id": "c7u1-07-tryagain-skills", "chapter": "c7u1", "kind": "lesson"}, "c7u1-08-three-days-read": {"title": "Three Days to See: Read and Discuss", "summary": "Helen Keller imagines three days with sight.", "blocks": [{"type": "text", "md": "The third selection is an essay by **Helen Keller**, who was blind and deaf. She imagines what she would most like to see if she could have sight for just three days."}, {"type": "text", "md": "**Before you read.** I. Work in pairs. Recall a visit to a place you liked. Write: 1. name of the place; 2. the person(s) you went with; 3. things you could **see, hear, smell, taste, touch and feel**. II. How does this memory make you feel? III. Do you think your experience would be different if you could not see or hear? Share with the class. Our **five senses** are essential for us to experience and make sense of the world.", "title": "Warm-up"}, {"type": "flashcards", "id": "c7-ch01-cards-keller1", "title": "Words from the essay (Part 1)", "cards": [{"front": "symmetry", "back": "evenness"}, {"front": "birch", "back": "a slender tree with thin peeling bark"}, {"front": "shaggy", "back": "hairy"}, {"front": "quiver", "back": "shiver"}, {"front": "behold", "back": "see"}, {"front": "panorama", "back": "scene"}]}, {"type": "text", "title": "📖 Three Days to See (retold)", "md": "**Touch tells her a lot.** The writer cannot see, but she finds hundreds of things to interest her through touch. She feels the delicate **symmetry of a leaf**. She runs her hands over the smooth skin of a silver birch and the rough, shaggy bark of a pine. In spring she touches tree branches hoping to find a bud, the first sign of nature waking from her winter sleep. Sometimes she is lucky enough to place her hand on a small tree and feel the happy **quiver of a bird** in full song.\n\n**A wish to see.** At times her heart cries out with longing to see all this. If she gets so much pleasure from touch, how much more beauty must sight reveal! She imagines what she would like to see if she had her eyes for just **three days**.\n\n**Day 1: friends.** She would first see the people whose kindness and companionship made her life worth living. She does not know what it is to see into the heart of a friend through the 'window of the soul', the eye. She can only 'see' the outline of a face with her fingertips. She can detect laughter, sorrow and other obvious emotions, and she knows her friends from the feel of their faces.\n\n**Day 2: dawn and the museums.** The next day she would rise with the dawn and see the thrilling miracle by which night turns into day, the magnificent **panorama** of light with which the sun awakens the sleeping earth. She would give the day to a hasty **glimpse** of the world, past and present: she would go to the museums to see the **pageant** of man's progress and the condensed history of the earth, animals and races of men in their native surroundings, the gigantic remains of dinosaurs and mastodons that roamed before man appeared with his tiny stature and powerful brain to conquer the animal kingdom.\n\n**Day 3: the busy city.** Again she greets the dawn, eager to find new delights. She would spend the third day in the workaday world among the haunts of men going about the business of life, and the city would be her destination. She would stand at a busy corner, merely looking at people to understand something of their daily lives. She sees smiles and is happy; she sees serious determination and is proud; she sees suffering and feels compassion.\n\n**Midnight.** At midnight permanent night would close in again. She would not have seen all she wanted, and only when darkness fell would she realise how much she had left unseen.\n\n**Her hint to us.** She who is blind gives one hint to those who can see: **use your eyes as if tomorrow you would be struck blind.** The same applies to all senses. Hear the music of voices, the song of a bird, the mighty strains of an orchestra as if you would be deaf tomorrow. Touch every object as if your sense of touch would fail. Smell the perfume of flowers and taste each morsel with relish as if you could never smell and taste again. Make the most of every sense and glory in every aspect of pleasure and beauty that nature offers. But of all the senses, she is sure that **sight must be the most delightful**.\n\n*Helen Keller. Read the original on pp. 29–31 of your book.*"}, {"type": "flashcards", "id": "c7-ch01-cards-keller2", "title": "Words from the essay (Part 2)", "cards": [{"front": "glimpse", "back": "brief look"}, {"front": "pageant", "back": "display"}, {"front": "condensed", "back": "brief"}, {"front": "carcasses", "back": "remains"}, {"front": "mastodons", "back": "large animals like elephants, with fur"}, {"front": "stature", "back": "physique, build"}, {"front": "haunts", "back": "regular meeting places"}, {"front": "merely", "back": "just"}, {"front": "strains", "back": "tunes"}, {"front": "tactile sense", "back": "sense of touch"}, {"front": "morsel", "back": "a small piece of food"}, {"front": "facets", "back": "aspects"}]}, {"type": "quiz", "id": "c7-ch01-quiz-keller-true", "title": "Let us discuss I: which statements are true?", "questions": [{"type": "truefalse", "q": "The author expresses a deep longing to experience the world through the sense of hearing.", "answer": false, "explanation": "Her longing is to *see*.", "hints": ["Her wish is for three days of sight."]}, {"type": "truefalse", "q": "The author would like to explore the city only to observe how people are suffering.", "answer": false, "explanation": "She would see smiles, determination and suffering, not only suffering.", "hints": ["How many things does she mention?"]}, {"type": "truefalse", "q": "The author would spend the first day seeing the people whose kindness and friendship enriched her life.", "answer": true, "explanation": "That is Day 1.", "hints": ["Day 1."]}, {"type": "truefalse", "q": "The author acknowledges that even in three days she would not be able to see everything.", "answer": true, "explanation": "She says she would not have seen all she wanted.", "hints": ["Midnight."]}, {"type": "truefalse", "q": "The author feels that everyone can find the greatest joy merely by the sense of touch.", "answer": false, "explanation": "She says sight must be the most delightful of all senses.", "hints": ["Her final sentence."]}, {"type": "truefalse", "q": "The author advises those who can see to appreciate every moment as if they might lose their senses tomorrow.", "answer": true, "explanation": "Yes: use your senses as if you would lose them tomorrow.", "hints": ["Her 'hint'."]}, {"type": "truefalse", "q": "On the third day the author would like to observe people in their daily lives and understand their experiences.", "answer": true, "explanation": "She would stand at a busy corner and look at people.", "hints": ["Day 3."]}]}, {"type": "table", "headers": ["Day 1", "Day 2", "Day 3"], "rows": [["see the people, know her friends from the feel of their faces, see into the heart of a friend through the eye", "arise with the dawn and see night turn into day (a panorama of light); go to the museums to see the history of the earth, dinosaurs, mastodons and man's progress", "spend the day in the workaday world; the city is her destination; stand at a busy corner to watch people: smiles, determination, suffering"]]}, {"type": "callout", "kind": "tip", "md": "The book's **table activity (II)** asks you to complete what Helen Keller wanted to do on each of the three days. The table above is a model; try writing it in your own words first.", "title": "Table"}, {"type": "reveal", "prompt": "III. The author calls the eye the 'window of the soul'. How is the narrator able to understand the feelings of a person?", "md": "She uses **touch**: with her fingertips she feels the outline of a face and can detect laughter, sorrow and other obvious emotions. She knows her friends from the feel of their faces, though she cannot see into the 'heart' through the eyes."}, {"type": "summary", "points": ["Helen Keller finds great interest in nature through touch.", "Her three imagined days: friends; dawn and museums; the busy city.", "She admits three days would not be enough.", "Her advice: use every sense fully as if you might lose it tomorrow."]}], "minutes": 30, "terms": [{"term": "symmetry", "def": "evenness"}, {"term": "panorama", "def": "a wide scene"}, {"term": "compassion", "def": "sympathy for someone who suffers"}], "source": {"chapter": "ch01", "sections": ["Before we read", "Let us read", "Let us discuss I–III"], "pages": "28–32"}, "id": "c7u1-08-three-days-read", "chapter": "c7u1", "kind": "lesson"}, "c7u1-09-three-days-language": {"title": "Three Days to See: Reflect and Learn", "summary": "Extract questions, long answers, sensory words and modal verbs.", "blocks": [{"type": "text", "md": "In this lesson: **Let us think and reflect** (two extracts, six long answers) and **Let us learn** (sensory words and modal verbs)."}, {"type": "quiz", "id": "c7-ch01-quiz-keller-ext1", "title": "Extract 1: touching nature", "questions": [{"type": "single", "q": "What does the 'delicate symmetry of a leaf' symbolise?", "options": ["The fine balance and beauty of nature that she can feel", "A scary insect", "The winter season", "A closed door"], "answer": 0, "explanation": "The leaf's even, balanced shape stands for the careful beauty of nature.", "hints": ["Think about evenness."]}, {"type": "multi", "q": "Two phrases that describe the texture of objects in nature:", "options": ["smooth skin of a silver birch", "rough, shaggy bark of a pine", "bird in full song", "winter's sleep"], "answer": [0, 1], "explanation": "Smooth skin and rough, shaggy bark describe textures.", "hints": ["Which words describe how things feel?"]}, {"type": "single", "q": "'Awakening Nature after her winter's sleep' refers to ______.", "options": ["the arrival of spring", "the end of the day", "the sunrise", "a bird's song"], "answer": 0, "explanation": "After winter, spring brings new buds.", "hints": ["What is the first sign she looks for in spring?"]}, {"type": "single", "q": "What is the tone of the writer in this extract?", "options": ["nostalgic", "proud", "admiring", "celebratory"], "answer": 2, "explanation": "She speaks lovingly and respectfully about nature: admiring.", "hints": ["She 'lovingly' passes her hands…"]}]}, {"type": "quiz", "id": "c7-ch01-quiz-keller-ext2", "title": "Extract 2: Day 2 at the museums", "questions": [{"type": "single", "q": "Which word does NOT match 'thrilling'?", "options": ["experience", "tale", "knowledge", "adventure"], "answer": 2, "explanation": "We say a thrilling experience, tale or adventure, not 'thrilling knowledge'.", "hints": ["Which one is not exciting by nature?"]}, {"type": "single", "q": "Why does the writer call the earth 'sleeping earth'?", "options": ["Because at night the world is dark and still, and the sun awakens it", "Because earth is lazy", "Because people sleep on it", "Because it is cold"], "answer": 0, "explanation": "This is personification: the earth is shown as asleep until sunrise.", "hints": ["Think of the world at night."]}, {"type": "single", "q": "The writer wishes to dedicate the day to a brief look at the present and past world because ______.", "options": ["she has only three days and wants to see man's progress and the history of the earth", "she dislikes museums", "she is tired", "she cannot walk"], "answer": 0, "explanation": "With limited time she wants a quick but wide view.", "hints": ["Look at the word 'hasty'."]}, {"type": "single", "q": "Why does the writer use 'should' multiple times?", "options": ["Because her wish is imaginary, not real; she cannot actually see", "Because she is giving orders", "Because she is rude", "Because she is angry"], "answer": 0, "explanation": "'I should…' is used for an imagined situation.", "hints": ["Does she really have sight?"]}]}, {"type": "text", "md": "**Long answers: model answers**"}, {"type": "reveal", "prompt": "1. The sense of touch makes up for the loss of sight and hearing. Explain.", "md": "She feels the shape of a leaf, the bark of a tree, the quiver of a singing bird and the outline of a friend's face; through touch she even detects laughter and sorrow. So touch gives her much of the world's pleasure."}, {"type": "reveal", "prompt": "2. Why does the author believe sight is the most wonderful?", "md": "Because through sight we can see colour, light, faces, the dawn, the museums and the city. Touch gives pleasure, but sight 'reveals' much more beauty."}, {"type": "reveal", "prompt": "3. How might her opinion guide us to be kinder towards people with special abilities?", "md": "It makes us realise how precious each sense is, and that people without a sense still have rich inner lives. We should respect them, help without pity, and include them."}, {"type": "reveal", "prompt": "4. What is the significance of imagining the loss of a sense?", "md": "It makes us **value** what we have. If we imagine losing sight or hearing tomorrow, we look and listen more carefully today."}, {"type": "reveal", "prompt": "5. How does the author encourage people to approach everyday sensory experiences?", "md": "To use each sense fully, with attention and joy: see, hear, touch, smell and taste as if it were the last time."}, {"type": "reveal", "prompt": "6. What do her choices for the three days tell us about her values?", "md": "She values **people and relationships** (Day 1), **nature and knowledge** (Day 2) and **understanding human life and compassion** (Day 3)."}, {"type": "text", "md": "**Let us learn I: sensory words.** Sensory words describe how we experience the world: how we see, hear, smell, taste or feel something. Complete the table with words from the text (Column 2) and add new words of your own (Column 3).", "title": "Sensory words"}, {"type": "table", "headers": ["What you…", "From the text", "Your own words (examples)"], "rows": [["see", "panorama", "glittering, golden, dazzling"], ["hear", "music", "chirping, rumbling, whisper"], ["smell", "perfume", "fragrant, smoky, fresh"], ["taste", "relish", "sweet, sour, spicy"], ["feel", "rough", "soft, smooth, prickly"]]}, {"type": "quiz", "id": "c7-ch01-quiz-sensory", "title": "Which sense?", "questions": [{"type": "single", "q": "'The shaggy bark of a pine' appeals to the sense of ______.", "options": ["touch", "taste", "smell", "hearing"], "answer": 0, "explanation": "Rough, shaggy texture: touch.", "hints": ["How do you feel bark?"]}, {"type": "single", "q": "'The perfume of flowers' appeals to ______.", "options": ["smell", "touch", "sight", "hearing"], "answer": 0, "explanation": "Perfume is a smell.", "hints": ["Use your nose."]}, {"type": "single", "q": "'The mighty strains of an orchestra' appeals to ______.", "options": ["hearing", "sight", "taste", "touch"], "answer": 0, "explanation": "Music: hearing.", "hints": ["You listen to an orchestra."]}]}, {"type": "text", "md": "**II. Modal verbs.** Read these sentences from the text: *I should divide the period into three parts. On the first day, I should want to see… The next day I should arise with the dawn… I should behold with awe…* In each, **should** is the modal verb and the second verb (divide, want, arise, behold) is the main verb.", "title": "Modal verbs"}, {"type": "callout", "kind": "key", "md": "**Modal verbs** are auxiliary verbs that express necessity, possibility, permission or ability. They come before the main verb. Common modals: can, could, may, might, shall, should, will, would, must, ought to."}, {"type": "quiz", "id": "c7-ch01-quiz-modal", "title": "III. Identify the function of the modal", "questions": [{"type": "single", "q": "You **can** learn a lot from this experience.", "options": ["possibility", "necessity", "polite request", "ability", "moral obligation"], "answer": 3, "explanation": "'Can' shows ability. (It could also express possibility.)", "hints": ["Are you able to learn?"]}, {"type": "single", "q": "They **might** arrive late due to traffic.", "options": ["possibility", "necessity", "polite request", "ability", "moral obligation"], "answer": 0, "explanation": "'Might' shows a possibility.", "hints": ["Maybe, maybe not."]}, {"type": "single", "q": "She **must** finish her homework before dinner.", "options": ["possibility", "necessity", "polite request", "ability", "moral obligation"], "answer": 1, "explanation": "'Must' shows necessity.", "hints": ["She has to."]}, {"type": "single", "q": "They **ought to** apologise for their mistake.", "options": ["possibility", "necessity", "polite request", "ability", "moral obligation"], "answer": 4, "explanation": "'Ought to' is a moral duty.", "hints": ["Right thing to do."]}, {"type": "single", "q": "He **would** like to have some lassi, please.", "options": ["possibility", "necessity", "polite request", "ability", "moral obligation"], "answer": 2, "explanation": "'Would like' is a polite request.", "hints": ["Please."]}]}, {"type": "quiz", "id": "c7-ch01-quiz-modal2", "title": "IV. Fill in the modal verb", "questions": [{"type": "fill", "q": "(permission) ______ I leave early today if I finish all my tasks?", "answer": ["can", "could", "may"], "explanation": "Asking permission: may / can / could.", "placeholder": "modal", "hints": ["Asking leave."]}, {"type": "fill", "q": "(obligation) I ______ finish this report by tomorrow.", "answer": ["must", "have to"], "explanation": "A deadline: must.", "placeholder": "modal", "hints": ["Necessity."]}, {"type": "fill", "q": "(advice) You ______ consider all the pros and cons before making a decision.", "answer": ["should", "ought to"], "explanation": "Advice: should.", "placeholder": "modal", "hints": ["Advice."]}, {"type": "fill", "q": "(possibility) It ______ rain later today.", "answer": ["might", "may", "could"], "explanation": "Dark clouds: possibility.", "placeholder": "modal", "hints": ["Maybe."]}, {"type": "fill", "q": "(polite request) ______ you pass the salt, please?", "answer": ["could", "would", "can", "will"], "explanation": "Polite request: could / would / can.", "placeholder": "modal", "hints": ["Asking at the table."]}, {"type": "fill", "q": "(moral obligation) You ______ apologise for the mistake you made.", "answer": ["ought to", "should", "must"], "explanation": "Moral duty: ought to / should.", "placeholder": "modal", "hints": ["Right thing to do."]}, {"type": "fill", "q": "(suggestion) We ______ go to any park nearby for a picnic.", "answer": ["can", "could", "may"], "explanation": "Suggestion: can / could.", "placeholder": "modal", "hints": ["A possible plan."]}]}, {"type": "summary", "points": ["Touch lets the writer experience the leaf, bark and birdsong.", "'Should' marks an imagined wish; Helen Keller does not actually have sight.", "Sensory words appeal to sight, hearing, smell, taste and touch.", "Modal verbs: can (ability), might (possibility), must (necessity), ought to (moral duty), would (polite request)."]}], "minutes": 35, "terms": [{"term": "modal verb", "def": "a helping verb such as can, should or must that shows ability, advice, necessity, etc."}, {"term": "sensory words", "def": "words that describe what we see, hear, smell, taste or feel"}], "source": {"chapter": "ch01", "sections": ["Let us think and reflect", "Let us learn I–IV"], "pages": "32–35"}, "id": "c7u1-09-three-days-language", "chapter": "c7u1", "kind": "lesson"}, "c7u1-10-three-days-skills": {"title": "Three Days to See: Listen, Speak, Write, Explore", "summary": "A talk about Braille, speaking about a sense, a descriptive paragraph, and Braille activities.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: Anuj and his mother", "md": "**Anuj:** Ma, we have a new student in our class, Tara. She is quite talkative and pleasant. You know, the writing in her books doesn't look like ours. It is different. She told us it is called Braille.\n\n**Mother:** It is great to know that your school has facilities for the visually impaired. Thanks to the Digital India Initiative, which is paving the way for their inclusion.\n\n**Anuj:** Oh, Digital India! That is about being computer literate, isn't it?\n\n**Mother:** Well, Digital India is about more than that. It aims to include everyone, including people with disabilities, by providing digital infrastructure and services. For people who are visually impaired it means assistive technology like screen readers, voice-over smartphones and apps that make daily life easier.\n\n**Anuj:** Interesting. What is a screen reader, Ma?\n\n**Mother:** I knew you would ask! A screen reader is a software application that helps people who are visually impaired use computers and smartphones. It reads out the text on the screen and gives audio feedback.\n\n**Anuj:** That is amazing! So Tara can use a computer just like us?\n\n**Mother:** Yes, she can.\n\n**Anuj:** So it makes a big difference in daily life.\n\n**Mother:** It certainly does. People can use digital services independently, which improves their quality of life, and it opens more jobs in IT, banking and so on, where they can work as efficiently as anybody else.\n\n**Anuj:** Wow! So people who are visually impaired can work and do things on their own? I am so proud of my school.\n\n**Mother:** Yes. Remember, inclusion is not just about having the right tools, but also about having the right mindset."}, {"type": "quiz", "id": "c7-ch01-quiz-anuj", "title": "Select the true statements", "questions": [{"type": "truefalse", "q": "Anuj finds the concept of Braille fascinating and wants to learn more about it.", "answer": false, "explanation": "He mentions Braille only as something new that Tara told him; he asks about Digital India and screen readers next.", "hints": ["What does he ask about next?"]}, {"type": "truefalse", "q": "Mother is unsure of the school's efforts to include students with visual impairment.", "answer": false, "explanation": "She says it is great and praises the Digital India Initiative.", "hints": ["Her first reaction."]}, {"type": "truefalse", "q": "Anuj initially thinks that Digital India is only about learning how to use computers.", "answer": true, "explanation": "'That's about being computer literate, isn't it?'", "hints": ["His first guess."]}, {"type": "truefalse", "q": "Mother believes that screen readers are very effective for persons who are visually impaired.", "answer": true, "explanation": "She says they allow independent use and improve quality of life.", "hints": ["What does she say about independence?"]}, {"type": "truefalse", "q": "Anuj already knew that persons who are visually impaired can use computers and smartphones.", "answer": false, "explanation": "He says 'That's amazing!', which shows he did not know.", "hints": ["His reaction."]}, {"type": "truefalse", "q": "Anuj wants to know about the effectiveness of assistive technologies.", "answer": true, "explanation": "He asks, 'So it makes a big difference in their daily lives?'", "hints": ["He asks about the difference it makes."]}, {"type": "truefalse", "q": "Mother believes a right mindset is the best support for persons who are visually impaired.", "answer": true, "explanation": "She says inclusion is not just about tools but also about having the right mindset.", "hints": ["Her last line."]}], "intro": "The book asks for four true statements from seven. In this script statements 3, 4, 6 and 7 are the closest matches; check with your teacher."}, {"type": "text", "md": "**Let us speak.** Work in pairs. Take turns to speak for a **minute** on any one of the senses you value most. Prompts: *I value my sense of sight/sound/touch/smell/taste the most because… One of my favourite experiences is… This is so because… I appreciate being able to see/hear/touch/smell/taste… God forbid, if I were to lose the sense of…, it would make me feel… I would not be able to… I thank God that I am able to…*\n\n**Remember to:** speak clearly and confidently; glance at notes rather than reading; make eye contact; use gestures if you wish; pronounce words clearly and avoid mumbling; speak at a steady, moderate pace.", "title": "Let us speak"}, {"type": "exercise", "id": "c7-ch01-ex-sense-talk", "title": "A one-minute talk on a sense", "difficulty": "easy", "minutes": 10, "goal": "Prepare 6–8 sentences for a one-minute talk about the sense you value most.", "behavior": "Use at least four prompts from the list.", "hints": ["Pick a sense and a memory.", "Practise with a timer.", "Use short sentences."], "checklist": ["I chose one sense", "I used four prompts", "I gave a favourite experience", "I spoke at a steady pace"], "solution": "I value my sense of smell the most because it connects me to my memories. One of my favourite experiences is the smell of rain on dry soil. This is so because it reminds me of my village. I appreciate being able to smell my grandmother's cooking. If I were to lose it, I would feel sad. I thank God that I am able to smell.", "solution_lang": "text", "solution_explain": "A clear structure with prompts makes a good one-minute talk.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us write: a descriptive paragraph.** A descriptive paragraph describes a person, place, object or event to create a memorable experience for the reader. Write one about a place you visited recently.\n\n1. **Opening line:** start with something interesting to catch attention; introduce the place.\n2. **Supporting lines:** describe with adjectives and details for the five senses: sight, sound, smell, taste, touch. You may use alliteration, similes and personification.\n3. **Concluding lines:** summarise to leave a final impression; say what was most important about the place that others should also experience.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch01-ex-place-paragraph", "title": "Describe a place", "difficulty": "medium", "minutes": 15, "goal": "Write a descriptive paragraph (8–10 lines) about a place you visited recently.", "behavior": "Use the three-part structure and at least one detail for each of the five senses.", "hints": ["Begin with a question or a sound.", "List one detail per sense first.", "End with 'You must experience…'"], "checklist": ["Interesting opening line", "Details for all five senses", "At least one simile or personification", "Concluding line with a final impression"], "solution": "Have you ever heard a hill sing? At Yercaud, the wind hummed through the pines. The mist felt cool and damp on my face, and the air smelt of coffee blossoms. We tasted hot, sweet tea and fried pakoras. The road curled like a sleeping snake. Everyone should see the sunrise there: it paints the sky orange and gold.", "solution_lang": "text", "solution_explain": "Five senses plus a strong start and finish make a memorable paragraph.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. **Braille** is a code of raised dots that represents the letters of the alphabet. People with visual challenges read through touch. This tactile code was developed over **nine years** by **Louis Braille**, who became blind at a very young age due to an accident. Study the Braille code in your book and **write your name** with it, using bindis or grains of daal for the dots.\n\nII. Have you heard of the **International Day of Persons with Disabilities** (observed every year on **3 December**)? Find out how it is observed in India and put your findings on the class board.\n\nIII. Learn about the **Indian Sign Language** at https://ncert.nic.in/pdf/accessibility/ISL_200word_v15.pdf", "title": "Let us explore"}, {"type": "quiz", "id": "c7-ch01-quiz-braille", "title": "Braille facts", "questions": [{"type": "single", "q": "Braille is a code of ______.", "options": ["raised dots", "colours", "sounds", "pictures"], "answer": 0, "explanation": "It is read by touch.", "hints": ["Tactile."]}, {"type": "single", "q": "Who developed Braille?", "options": ["Louis Braille", "Helen Keller", "Kamala Nair", "Ruskin Bond"], "answer": 0, "explanation": "Louis Braille, who became blind very young, developed it over nine years.", "hints": ["Name matches the code."]}, {"type": "single", "q": "International Day of Persons with Disabilities is observed on ______.", "options": ["3 December", "15 August", "2 October", "1 January"], "answer": 0, "explanation": "It is observed every year on 3 December.", "hints": ["The first week of December."]}]}, {"type": "summary", "points": ["Screen readers and Braille help people with visual impairment learn and work independently.", "Inclusion needs the right tools and the right mindset.", "A one-minute talk follows a simple prompt structure.", "A descriptive paragraph appeals to all five senses."]}], "minutes": 35, "terms": [{"term": "Braille", "def": "a tactile code of raised dots used to read and write by people who are blind"}, {"term": "screen reader", "def": "software that reads out the text on a screen"}], "source": {"chapter": "ch01", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "36–38, 41–42"}, "id": "c7u1-10-three-days-skills", "chapter": "c7u1", "kind": "lesson"}, "c7u1-99-test": {"title": "Test: Unit 1 – Learning Together", "kind": "test", "summary": "Check what you learned in this whole unit.", "blocks": [{"type": "quiz", "id": "c7-ch01-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Why is 'River' written with a capital letter in the story?", "options": ["It is personified", "It is a proper noun by name", "It starts a sentence", "It is a big river"], "answer": 0, "explanation": "Because the River is given human qualities.", "hints": ["Think personification."]}, {"type": "single", "q": "What is Jahnavi's dream?", "options": ["To go to school and learn", "To sail a ship", "To teach the River", "To become a queen"], "answer": 0, "explanation": "She wants to go to school and read.", "hints": ["Her wish."]}, {"type": "single", "q": "The River's advice to Jahnavi is to ______.", "options": ["go and listen in class", "run away", "ask her brothers", "wait till next year"], "answer": 0, "explanation": "It advises her to slip in and listen.", "hints": ["What is the first step?"]}, {"type": "single", "q": "'Little girls can do as much as little boys because they swim as fast' shows the River's belief in ______.", "options": ["equality of girls and boys", "speed", "water", "sports"], "answer": 0, "explanation": "It argues girls are equal.", "hints": ["The message."]}, {"type": "fill", "q": "A word that means 'a low continuous background noise' is ______.", "answer": ["murmuring", "murmur"], "explanation": "Murmuring.", "placeholder": "word", "hints": ["Sound word from the story."]}, {"type": "single", "q": "'The world is a stage' is a ______.", "options": ["metaphor", "simile", "alliteration", "rhyme"], "answer": 0, "explanation": "It says one thing is another.", "hints": ["No like/as."]}, {"type": "single", "q": "'He sang like an angel' is a ______.", "options": ["simile", "metaphor", "personification", "interjection"], "answer": 0, "explanation": "It uses 'like'.", "hints": ["Comparison word."]}, {"type": "single", "q": "The rhyme scheme of 'Try Again' is ______.", "options": ["ABAB", "AABB", "ABBA"], "answer": 0, "explanation": "Lines 1/3 and 2/4 rhyme.", "hints": ["Check stanza 1."]}, {"type": "order", "q": "Order King Bruce's story.", "items": ["He is sad and wants to give up", "A spider drops down", "The spider falls nine times", "The spider finally reaches its web", "Bruce tries again and succeeds"], "explanation": "This is the order in the poem.", "hints": ["Beginning, middle, end."]}, {"type": "single", "q": "Which sense does Helen Keller say is the most delightful?", "options": ["sight", "touch", "hearing", "smell"], "answer": 0, "explanation": "She is sure that sight is the most delightful.", "hints": ["Her last sentence."]}, {"type": "single", "q": "'They ought to apologise' expresses ______.", "options": ["moral obligation", "ability", "polite request", "possibility"], "answer": 0, "explanation": "'Ought to' is moral duty.", "hints": ["Right thing."]}, {"type": "single", "q": "'Excited ______ the new adventure': choose the preposition.", "options": ["about", "for", "in", "with"], "answer": 0, "explanation": "'Excited about'.", "hints": ["Common collocation."]}, {"type": "truefalse", "q": "Louis Braille developed the Braille code over nine years.", "answer": true, "explanation": "He became blind young and developed it over nine years.", "hints": ["Explore section."]}], "mode": "test"}], "id": "c7u1-99-test", "chapter": "c7u1", "minutes": 10}, "c7u2-01-dolittle-read": {"title": "Animals, Birds, and Dr. Dolittle: Read and Discuss", "summary": "Follow Doctor Dolittle as he learns animal language and becomes famous.", "blocks": [{"type": "text", "md": "**Before you read.** I. Do you have a pet or a domestic animal? Why or why not? How do people spend time with them? II. If you could talk to one animal or bird, who would it be and why? III. Animals show feelings through **body language**. Work in pairs and study the four animal pictures in your book: what emotion is each animal showing? (Tail wagging = happy; ears back = scared; puffed feathers = angry or cold; head bowed = sad.)", "title": "Warm-up"}, {"type": "callout", "kind": "tip", "md": "The story is by **Hugh Lofting**. It is retold here in simple words (original: textbook pp. 44–49). Use **Read aloud** to hear it.", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch02-cards-dolittle", "title": "Words from the story", "cards": [{"front": "scholar", "back": "a learned person"}, {"front": "cracker", "back": "a thin, dry biscuit usually eaten with cheese"}, {"front": "Birds' A.B.C.",
