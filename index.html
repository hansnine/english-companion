<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Companion by Hans</title>
<style>
/* Book-to-course player styles. Light + dark, responsive, motion respects prefers-reduced-motion. */
:root {
  --bg: #f7f7fb; --surface: #ffffff; --surface-2: #f0f1f8; --text: #1d2033; --muted: #636b86;
  --border: #dfe2ee; --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e4e9ff;
  --ok: #1f9d55; --ok-soft: #e1f6ea; --bad: #d64545; --bad-soft: #fde8e8; --warn: #c27c0e; --warn-soft: #fff3da;
  --code-bg: #14172a; --code-text: #e7e9f6; --code-head: #1e2240;
  --tok-kw: #ff7ab2; --tok-str: #8fd18f; --tok-num: #f6b26b; --tok-com: #7f87a8; --tok-fn: #7fb7ff; --tok-lit: #c79bff; --tok-bi: #6ad6d6;
  --shadow: 0 1px 2px rgba(20,24,60,.06), 0 6px 20px rgba(20,24,60,.06);
  --radius: 14px; --sidebar-w: 304px; --topbar-h: 56px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
:root[data-theme="dark"] {
  --bg: #0f1120; --surface: #181b30; --surface-2: #20243d; --text: #e8eaf8; --muted: #9aa2c4;
  --border: #2b3052; --accent: #7c93ff; --accent-ink: #0f1120; --accent-soft: #232a55;
  --ok: #4cd08a; --ok-soft: #14301f; --bad: #ff7a7a; --bad-soft: #3a1b1f; --warn: #f0b34a; --warn-soft: #382c10;
  --code-bg: #0b0d1a; --code-head: #151932; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.65; font-size: 17px; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .12em .4em; border-radius: 6px; }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; text-decoration: none; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
.topbar-progress { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 80px; max-width: 460px; margin-left: auto; font-size: .85rem; color: var(--muted); }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #8a6bff); border-radius: 99px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.save-state { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.icon-btn:hover { background: var(--surface-2); }
#menuBtn { display: none; }

/* Layout */
.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
.sidebar { position: sticky; top: var(--topbar-h); align-self: start; height: calc(100vh - var(--topbar-h)); overflow-y: auto; padding: 16px 12px 40px; border-right: 1px solid var(--border); background: var(--surface); }
.content { padding: 32px clamp(16px, 4vw, 56px) 96px; outline: none; }
.content > * { max-width: 820px; margin-left: auto; margin-right: auto; }
.scrim { display: none; }

/* Sidebar */
.nav-home, .nav-gloss { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--text); font-weight: 600; font-size: .95rem; }
.nav-home:hover, .nav-gloss:hover, .nav-lesson:hover { background: var(--surface-2); }
.nav-home.active, .nav-gloss.active { background: var(--accent-soft); }
.nav-ch { margin-top: 10px; }
.nav-ch > summary { cursor: pointer; list-style: none; padding: 8px 10px; border-radius: 10px; font-weight: 700; font-size: .92rem; display: flex; gap: 8px; align-items: baseline; }
.nav-ch > summary::-webkit-details-marker { display: none; }
.nav-ch > summary::before { content: "▸"; color: var(--muted); transition: transform .2s; display: inline-block; }
.nav-ch[open] > summary::before { transform: rotate(90deg); }
.nav-ch .ch-pct { margin-left: auto; font-weight: 500; color: var(--muted); font-size: .8rem; }
.nav-lesson { display: flex; gap: 10px; align-items: flex-start; padding: 6px 10px 6px 26px; border-radius: 10px; text-decoration: none; color: var(--text); font-size: .9rem; line-height: 1.4; }
.nav-lesson.active { background: var(--accent-soft); font-weight: 600; }
.nav-lesson .st { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); margin-top: 2px; display: grid; place-items: center; font-size: .7rem; color: var(--accent-ink); }
.nav-lesson.done .st { background: var(--ok); border-color: var(--ok); }
.nav-lesson.started .st { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.nav-lesson.is-test .t::after { content: " 🏁"; }

/* Content typography */
h1, h2, h3, h4, h5 { line-height: 1.25; margin: 1.6em 0 .5em; }
h1 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); margin-top: 0; letter-spacing: -.01em; }
.crumb { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; margin-bottom: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-size: .8rem; font-weight: 600; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.lead { font-size: 1.12rem; color: var(--muted); margin-top: 6px; margin-bottom: 24px; }
.block { margin: 22px auto; }
.block > h3:first-child, .block > h4:first-child { margin-top: 0; }
.text p, .text li { margin: .6em 0; }
.text ul, .text ol { padding-left: 1.4em; }
.text blockquote, .frombook blockquote { margin: .8em 0; padding: .2em 1em; border-left: 4px solid var(--accent); color: var(--muted); }

/* Math */
math { line-height: 1.2; }
/* overflow-x alone makes overflow-y compute to auto, and tall formulas (roots, fractions) overflow by a few px */
.mathblock { overflow-x: auto; overflow-y: hidden; padding: .3em 0; margin: 1rem 0; }
.math-err { font-family: var(--mono); color: var(--bad); border-bottom: 1px dotted var(--bad); cursor: help; }
.math-raw { font-family: var(--mono); color: var(--muted); cursor: help; }
.mathml-warn { background: var(--warn-soft); color: var(--warn); text-align: center; padding: 8px 16px; font-size: .85rem; font-weight: 600; }

/* Scroll reveal */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .55s ease, transform .55s ease; }
.rv.in { opacity: 1; transform: none; }

/* Callouts */
.callout { padding: 14px 18px; border-radius: var(--radius); border: 1px solid var(--border); border-left-width: 5px; background: var(--surface); box-shadow: var(--shadow); }
.callout .c-title { font-weight: 700; margin-bottom: 2px; display: flex; gap: 8px; align-items: center; }
.callout p { margin: .4em 0; }
.callout.tip { border-left-color: var(--ok); } .callout.note { border-left-color: var(--accent); }
.callout.warning { border-left-color: var(--warn); background: var(--warn-soft); } .callout.analogy { border-left-color: #a45bd8; }
.callout.key { border-left-color: var(--bad); } .callout.example { border-left-color: #1ba5b8; }

/* Code */
.code-wrap { background: var(--code-bg); color: var(--code-text); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.code-head { display: flex; justify-content: space-between; align-items: center; background: var(--code-head); padding: 6px 12px; font-family: var(--mono); font-size: .78rem; color: #aab1d6; }
.code-wrap pre { margin: 0; padding: 14px 0; overflow-x: auto; font-family: var(--mono); font-size: .9rem; line-height: 1.55; tab-size: 4; }
.code-wrap code { background: none; padding: 0; font-size: inherit; color: inherit; }
.ln { display: block; min-height: 1.55em; padding: 0 16px; white-space: pre; border-left: 3px solid transparent; transition: background .3s, border-color .3s; }
.ln.hl { background: rgba(124,147,255,.18); border-left-color: #7c93ff; }
.tk-kw { color: var(--tok-kw); } .tk-str { color: var(--tok-str); } .tk-num { color: var(--tok-num); } .tk-com { color: var(--tok-com); font-style: italic; }
.tk-fn { color: var(--tok-fn); } .tk-lit { color: var(--tok-lit); } .tk-bi { color: var(--tok-bi); }
.copy-btn { background: transparent; border: 1px solid #3a4070; color: #c6cbe9; border-radius: 8px; padding: 2px 10px; cursor: pointer; font-size: .75rem; }
.copy-btn:hover { background: #2a3060; }
.code-caption { color: var(--muted); font-size: .88rem; margin: 6px 4px 0; }
.term { background: #0b0d1a; color: #cfe8cf; font-family: var(--mono); font-size: .85rem; padding: 12px 16px; border-radius: 10px; overflow-x: auto; white-space: pre-wrap; margin: 8px 0 0; max-height: 360px; }
.out-label { font-size: .8rem; color: var(--muted); margin: 10px 0 2px; font-weight: 600; }

/* Buttons */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: transform .1s, filter .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.08); } .btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 12px; font-size: .88rem; }
.btn.ok { background: var(--ok); border-color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Stepper */
.stepper, .derivation, .flow, .quiz, .exercise, .flash, .reveal, .summary, .svgfig, .tablewrap, .frombook { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.block-title { margin: 0 0 10px; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.stepper-stage { min-height: 120px; }
.stepper-stage.anim-next { animation: slideNext .35s ease; } .stepper-stage.anim-prev { animation: slidePrev .35s ease; }
@keyframes slideNext { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes slidePrev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
.step-title { font-weight: 700; font-size: 1.05rem; margin: 0 0 6px; }
.dots { display: flex; gap: 6px; margin: 12px 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .25s, transform .25s; border: 0; padding: 0; cursor: pointer; }
.dot.on { background: var(--accent); transform: scale(1.35); } .dot.past { background: color-mix(in srgb, var(--accent) 45%, var(--border)); }

/* Derivation */
.dv-rows { display: grid; gap: 8px; margin: 10px 0; }
.dv-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 4px 14px; padding: 8px 10px; border-radius: 10px; overflow-x: auto; transition: opacity .3s, background .3s; }
.dv-row .dv-lhs { text-align: right; } .dv-row .dv-rel { text-align: center; color: var(--muted); } .dv-row .dv-rhs { text-align: left; }
.dv-row .dv-why { grid-column: 1 / -1; font-size: .88rem; color: var(--muted); }
.dv-row.cur { background: var(--accent-soft); animation: fadeUp .4s ease; }
.dv-row.cur .dv-why { color: var(--text); font-weight: 500; margin-top: 2px; }
.dv-row.past { opacity: .6; }
.dv-row.hidden { display: none; }
.dv-result { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--ok-soft); }

/* Flow */
.flow-track { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
.flow-node { padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface-2); color: var(--muted); font-weight: 600; transition: all .35s; cursor: pointer; }
.flow-node.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); transform: translateY(-2px); box-shadow: var(--shadow); }
.flow-node.cur { animation: pulse 1.2s ease 2; }
.flow-arrow { color: var(--border); font-size: 1.3rem; transition: color .35s; } .flow-arrow.on { color: var(--accent); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,91,219,.4); } 50% { box-shadow: 0 0 0 8px rgba(59,91,219,0); } }
.flow-detail { min-height: 3em; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); }

/* Reveal / from book / table / svg */
.reveal .prompt { font-weight: 600; } .reveal .answer { margin-top: 10px; animation: fadeUp .4s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.frombook { border-left: 5px solid #a45bd8; } .fb-label { font-size: .82rem; font-weight: 700; color: #a45bd8; text-transform: uppercase; letter-spacing: .04em; }
.tablewrap { overflow-x: auto; padding: 0; } table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; } th { background: var(--surface-2); font-weight: 700; }
.svgfig { text-align: center; } .svgfig svg { max-width: 100%; height: auto; }
.svgfig figcaption { color: var(--muted); font-size: .9rem; margin-top: 8px; }

/* Quiz */
.question { padding: 14px 0; border-top: 1px dashed var(--border); } .question:first-of-type { border-top: 0; }
.q-head { display: flex; gap: 12px; align-items: flex-start; } .q-text p { margin: 0 0 .3em; } .q-text { font-weight: 600; }
.q-num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.opts { display: grid; gap: 8px; margin: 12px 0 8px 40px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--surface); transition: border-color .2s, background .2s; }
.opt:hover { border-color: var(--accent); } .opt input { accent-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.good { border-color: var(--ok); background: var(--ok-soft); } .opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.fill-in { margin: 12px 0 8px 40px; } .fill-in input { width: min(420px, 100%); padding: 9px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-family: var(--mono); }
.fill-in input:focus { outline: none; border-color: var(--accent); } .fill-in.good input { border-color: var(--ok); } .fill-in.bad input { border-color: var(--bad); }
.order-list { list-style: none; margin: 12px 0 8px 40px; padding: 0; display: grid; gap: 8px; }
.order-list li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 10px; background: var(--surface); transition: transform .25s, border-color .2s; }
.order-list li .txt { flex: 1; } .order-list.good li { border-color: var(--ok); } .order-list.bad li { border-color: var(--bad); }
.q-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 40px; }
.q-feedback { margin: 10px 0 0 40px; } .q-feedback .fb { padding: 10px 14px; border-radius: 10px; animation: fadeUp .35s ease; }
.fb.good { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); } .fb p { margin: .3em 0; }
.hints { margin: 8px 0 0 40px; } .hint { background: var(--warn-soft); padding: 8px 12px; border-radius: 10px; margin-top: 6px; } .pop { animation: fadeUp .3s ease; }
.scorebar { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); animation: fadeUp .4s ease; }
.scorebar.pass { background: var(--ok-soft); } .scorebar.fail { background: var(--bad-soft); }
.scorebar .big { font-size: 1.4rem; font-weight: 800; }
.quiz-foot { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Exercise */
.exercise { border-top: 5px solid var(--accent); }
.exercise h4 { margin: 14px 0 6px; font-size: .95rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.exercise details { margin: 10px 0; border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; } .exercise summary { cursor: pointer; font-weight: 600; }
.exercise details > .code-wrap { margin: 10px 0; }
.cmdline { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-family: var(--mono); font-size: .88rem; overflow-x: auto; }
.cmdline code { background: none; flex: 1; white-space: pre; }
.checklist { list-style: none; padding: 0; margin: 8px 0; } .checklist li { margin: 6px 0; } .checklist label { display: flex; gap: 10px; cursor: pointer; } .checklist input { accent-color: var(--ok); width: 18px; height: 18px; margin-top: 4px; }
.run-status { margin-top: 10px; font-weight: 600; } .run-status.good { color: var(--ok); } .run-status.bad { color: var(--bad); }
.note-small { color: var(--muted); font-size: .88rem; }

/* Flashcards */
.flash-stage { perspective: 1000px; margin: 12px 0; }
.card { position: relative; height: 190px; cursor: pointer; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
.card.flipped { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; backface-visibility: hidden; display: grid; place-items: center; padding: 18px; text-align: center; border-radius: 14px; border: 2px solid var(--border); background: var(--surface-2); font-size: 1.1rem; overflow: auto; }
.card .back { transform: rotateY(180deg); background: var(--accent-soft); border-color: var(--accent); }
.flash-meta { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }

/* Summary / terms */
.summary { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.summary li { margin: .5em 0; list-style: none; position: relative; padding-left: 28px; opacity: 0; transform: translateX(-10px); }
.summary.in li { animation: itemIn .45s ease forwards; } .summary li::before { content: "✓"; position: absolute; left: 0; color: var(--ok); font-weight: 800; }
@keyframes itemIn { to { opacity: 1; transform: none; } }
.summary ul { padding: 0; margin: 8px 0 0; }
.terms { border-top: 1px solid var(--border); margin-top: 36px; padding-top: 4px; } .terms dt { font-weight: 700; margin-top: 10px; } .terms dd { margin: 2px 0 0 0; color: var(--muted); }

/* Completion + nav */
.finish { margin-top: 36px; padding: 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.finish h3 { margin: 0 0 8px; } .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.pager a { flex: 1 1 220px; display: block; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); text-decoration: none; color: var(--text); transition: border-color .2s, transform .15s; }
.pager a:hover { border-color: var(--accent); transform: translateY(-2px); } .pager small { color: var(--muted); display: block; } .pager .nx { text-align: right; }

/* Home */
.hero { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; margin-bottom: 28px; }
.hero-text { flex: 1 1 320px; } .hero-text h1 { margin-bottom: 6px; }
.ring { position: relative; width: 132px; height: 132px; } .ring svg { transform: rotate(-90deg); } .ring .bg { stroke: var(--surface-2); } .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1); }
.ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 1.6rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; margin-bottom: 28px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); } .stat b { font-size: 1.5rem; display: block; } .stat span { color: var(--muted); font-size: .88rem; }
.ch-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; margin-top: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
.ch-card h3 { margin: 0 0 4px; display: flex; gap: 10px; align-items: center; } .ch-num { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 0 10px; font-size: .9rem; }
.ch-card ul { list-style: none; padding: 0; margin: 10px 0 0; } .ch-card li a { display: flex; gap: 10px; padding: 5px 0; text-decoration: none; color: var(--text); } .ch-card li a:hover { color: var(--accent); }
.ch-card .st { color: var(--ok); width: 1.2em; }
.footer-tools { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: .88rem; }

/* Glossary */
.gloss-search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); font: inherit; margin-top: 10px; margin-bottom: 20px; }
.gloss-item { padding: 12px 0; border-bottom: 1px solid var(--border); } .gloss-item b { font-size: 1.05rem; } .gloss-item a { font-size: .82rem; margin-left: 8px; }

/* Confetti */
.confetti { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; font-size: 1.6rem; will-change: transform, opacity; }

/* Responsive */
@media (max-width: 900px) {
  .shell { display: block; } #menuBtn { display: inline-block; }
  /* align-self: auto undoes the desktop "start": newer Chrome applies it to fixed boxes, so the drawer grows to its content and cannot scroll */
  .sidebar { position: fixed; top: var(--topbar-h); left: 0; bottom: 0; width: min(88vw, 340px); height: auto; align-self: auto; overscroll-behavior: contain; z-index: 40; transform: translateX(-102%); transition: transform .28s ease; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; } body.nav-open .scrim { display: block; position: fixed; inset: var(--topbar-h) 0 0 0; background: rgba(10,12,30,.45); z-index: 35; }
  .save-state { display: none; } .opts, .fill-in, .order-list, .q-actions, .q-feedback, .hints { margin-left: 0; } body { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .rv { opacity: 1; transform: none; } .summary li { opacity: 1; transform: none; }
}
.dlg-ov { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--surface); color: var(--text); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dlg p { margin: 0 0 16px; }
.dlg-act { display: flex; gap: 10px; justify-content: flex-end; }

/* ───── English Companion by Hans — additions ───── */
.side-toggle, .te-toggle { width: auto; padding: 4px 10px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
body.side-hidden .shell { grid-template-columns: 0 minmax(0, 1fr); }
body.side-hidden .sidebar { display: none; }
body.side-hidden .content { max-width: 980px; margin-left: auto; margin-right: auto; }
@media (max-width: 900px) { .side-toggle { display: none; } }
.sidebar .grp { margin: 14px 4px 6px; padding: 6px 10px; border-radius: 8px; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: var(--accent-soft, rgba(80,90,220,.12)); color: var(--accent, #4a4fd6); }
h2.grp-big { margin: 26px 0 8px; font-size: 1.25rem; border-bottom: 2px solid var(--border); padding-bottom: 4px; }
.te-hint { font-family: "Noto Sans Telugu", "Nirmala UI", "Gautami", "Mandali", system-ui, sans-serif; font-size: .93rem; line-height: 1.7; margin: 6px 0 10px; padding: 8px 12px; border-left: 4px solid #e08a1e; border-radius: 6px; background: rgba(224,138,30,.10); }
.te-home { border-left-width: 5px; } .te-home ul { margin: 6px 0 0 18px; padding: 0; } .te-home h3 { margin: 0 0 4px; }
.te-inline { font-family: "Noto Sans Telugu", "Nirmala UI", "Gautami", "Mandali", system-ui, sans-serif; font-weight: 500; opacity: .9; }
body.te-off .te-hint, body.te-off .te-inline { display: none !important; }
body.te-off .te-toggle { opacity: .6; }

/* ───── landing page (class selection) ───── */
body.landing-open { overflow: hidden; }
#landing { position: fixed; inset: 0; z-index: 1000; overflow-y: auto; background: var(--bg, #f6f7fb); color: var(--text, #1c1f33); padding: 28px 16px 40px; }
#landing .lc-inner { max-width: 1040px; margin: 0 auto; text-align: center; }
#landing h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); margin: 18px 0 4px; } #landing h1 span { color: var(--accent, #4a4fd6); }
#landing h2 { margin: 26px 0 4px; font-size: 1.5rem; }
#landing .lc-sub, #landing .lc-foot { color: var(--muted, #667); margin: 0; }
#landing .lc-te-line { font-family: "Noto Sans Telugu", "Nirmala UI", "Gautami", system-ui, sans-serif; margin: 0 0 18px; }
#landing .lc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; margin: 10px 0 24px; }
#landing .lc-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 18px 18px; text-align: center; border-radius: 18px; background: var(--surface, #fff); border: 2px solid var(--border, #dde); box-shadow: 0 4px 14px rgba(20,24,60,.08); transition: transform .15s, border-color .15s, box-shadow .15s; }
#landing .lc-card:hover, #landing .lc-card:focus-visible { transform: translateY(-4px); border-color: var(--cc); box-shadow: 0 10px 26px rgba(20,24,60,.16); }
#landing .lc-num { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; font-weight: 800; color: #fff; background: var(--cc); }
#landing .lc-en { font-size: 1.4rem; font-weight: 700; margin-top: 6px; }
#landing .lc-te { font-family: "Noto Sans Telugu", "Nirmala UI", "Gautami", system-ui, sans-serif; font-size: 1.1rem; color: var(--cc); font-weight: 600; }
#landing .lc-meta { font-size: .88rem; color: var(--muted, #667); margin: 4px 0 6px; line-height: 1.6; }
#landing .lc-list { list-style: none; padding: 0; margin: 4px 0 10px; font-size: .85rem; text-align: left; width: 100%; max-height: 150px; overflow-y: auto; }
#landing .lc-list li { padding: 3px 0; border-top: 1px dashed var(--border, #dde); }
#landing .lc-go { margin-top: auto; padding: 8px 18px; border-radius: 999px; background: var(--cc); color: #fff; font-weight: 700; }
.class-btn { width: auto; padding: 4px 10px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
@media (max-width: 900px) { .class-btn { padding: 4px 8px; font-size: .75rem; } }
.change-class.cc-side { display: block; width: calc(100% - 8px); margin: 6px 4px 10px; text-align: center; font-weight: 700; }
.change-class.cc-home { margin-top: 12px; }
@media (max-width: 900px) { .class-btn { max-width: 44vw; overflow: hidden; text-overflow: ellipsis; } }

e forms", "Listen to a talk with a Martian, practise silent letters and giving advice", "Write a conversation and an article"], "lessons": ["c8u5c1-01-warm-up", "c8u5c1-02-read-listen", "c8u5c1-03-reflect", "c8u5c1-04-learn", "c8u5c1-05-listen-speak", "c8u5c1-06-write-explore", "c8u5c1-99-test"]}, {"id": "c8u5c2", "title": "Magnifying Glass", "summary": "A poem about how a round lens turns small things into wonders.", "goals": ["Read a poem by Walter de la Mare", "Identify simile, metaphor, alliteration, personification", "Learn collective nouns, eye idioms and the suffix -ish", "Listen to a talk on Indian inventions, practise /v/ and /f/, write a conversation"], "lessons": ["c8u5c2-01-warm-up", "c8u5c2-02-read-listen", "c8u5c2-03-discuss", "c8u5c2-04-learn", "c8u5c2-05-listen-speak", "c8u5c2-06-write-explore", "c8u5c2-99-test"]}, {"id": "c8u5c3", "title": "Bibha Chowdhuri", "summary": "India’s first woman physicist — the beam of light who lit the path for women in Indian science.", "goals": ["Read a biographical essay", "Use antonyms, suffixes, acronyms, clipping and passive voice", "Listen to an AI podcast, hold a panel discussion, write a report", "Explore AR/VR, science awards and women pioneers"], "lessons": ["c8u5c3-01-warm-up", "c8u5c3-02-read-listen", "c8u5c3-03-reflect", "c8u5c3-04-learn", "c8u5c3-05-listen-speak", "c8u5c3-06-write-explore", "c8u5c3-99-test"]}], "lessons": {"c6u1-01-bottle-of-dew": {"title": "A Bottle of Dew: hard work is the real magic", "summary": "Retell the story of Rama Natha, explain its message, and use homophones and connecting words.", "source": {"chapter": "ch01", "sections": ["A Bottle of Dew"], "pages": "1-12"}, "blocks": [{"type": "text", "md": "Imagine someone tells you a secret trick that will make you rich. Would you believe them? In this lesson you meet **Rama Natha**, who did. By the end you will be able to retell his story in order, explain what it teaches, and use new vocabulary, homophones and linking words correctly."}, {"type": "callout", "kind": "analogy", "md": "Think of a shortcut on a map. It looks quicker, but sometimes the long road is the one that actually gets you home. Rama Natha is hunting for a shortcut to wealth.", "title": "Picture this"}, {"type": "text", "md": "Rama Natha is the son of a rich landlord. He inherits large areas of land but ignores them. He is sure a **magic potion** exists that can turn anything into gold, and he spends his days chasing the secret. His wife **Madhumati** is worried, because he keeps spending money on the search.", "title": "The beginning"}, {"type": "text", "md": "A famous sage, **Mahipati**, comes to town. He tells Rama Natha: plant banana plants, water them with your own hands, collect the morning **dew** from the leaves in winter, and bring five litres of dew. Then the sage will chant magic words. Rama Natha worries it will take years — and the sage says: plant as many plants as you like, but do it all yourself.", "title": "The sage's task"}, {"type": "reveal", "prompt": "Predict: what do you think happens after six years of work?", "md": "Rama Natha gets his five litres of dew, but the sage's words change nothing: the drops do not turn a copper vessel into gold. Madhumati, meanwhile, has been selling the bananas and saving the money in a box of gold coins. The sage explains that the **wealth came from hard work**, not magic. He played a trick to make Rama Natha work."}, {"type": "text", "md": "**Story order:** (1) Rama Natha chases the potion → (2) the sage gives a task → (3) six years of work → (4) nothing turns to gold → (5) Madhumati's box of coins and the sage's explanation. Retelling in this order is the first step in understanding any story."}, {"type": "quiz", "id": "c6-ch01-quiz-dew", "title": "Check the story", "questions": [{"type": "order", "q": "Put these events in the order they happen in the story.", "items": ["Rama Natha chases the magic potion and spends money", "The sage tells him to collect banana-leaf dew", "Rama Natha plants banana plants for six years", "The dew does not turn the copper vessel into gold", "Madhumati shows a box of gold coins"], "explanation": "The story moves from the problem to the sage's task, the long work, the surprise and finally the lesson.", "hints": ["Start with what Rama Natha does before meeting the sage."]}, {"type": "single", "q": "Why did the sage ask Rama Natha to do everything with his own hands?", "options": ["Magic only works with clean hands", "So that Rama Natha would really work and learn that effort creates wealth", "Because the sage was too busy to help", "Because bananas are hard to buy"], "answer": 1, "explanation": "The sage was teaching, not cheating. The plantation and the money came from work; the 'potion' was only a trick to get him started. The wrong options treat the magic as real.", "hints": ["Think about what Rama Natha actually ended up with after six years."]}, {"type": "truefalse", "q": "Rama Natha earned the gold only because of the magic words.", "answer": false, "explanation": "Madhumati sold the bananas in the market. Their hard work created the money.", "hints": ["Who sold the bananas?"]}]}, {"type": "callout", "kind": "key", "md": "The story's message: **hard work, not magic, creates wealth.**"}, {"type": "text", "md": "Words you will meet: **tracts of land** (large areas of land), **potion** (a liquid with magic properties), **tended** (looked after), **precious** (valuable) and **wisdom** (deep understanding). Try to use each in a sentence of your own.", "title": "Vocabulary"}, {"type": "flashcards", "id": "c6-ch01-cards-dew", "title": "Story words", "cards": [{"front": "potion", "back": "a liquid with magical properties"}, {"front": "dew", "back": "small drops of water on leaves that form at night"}, {"front": "chant", "back": "to repeat or sing a word or phrase"}, {"front": "tended", "back": "looked after"}, {"front": "precious", "back": "valuable"}, {"front": "wisdom", "back": "deep understanding"}]}, {"type": "text", "md": "**Homophones** are words that sound the same but have different spellings and meanings. The book lists pairs from the story such as *dew / due*, *son / sun*, *one / won*, *ate / eight*, *see / sea*, *I / eye*, *your / you're*. Example sentence: *I ate eight bananas.* Both homophones in one sentence!", "title": "Language: homophones"}, {"type": "quiz", "id": "c6-ch01-quiz-homophones", "title": "Homophones", "questions": [{"type": "single", "q": "Choose the right word: *The ___ shines brightly in the sky.*", "options": ["son", "sun", "sum", "soon"], "answer": 1, "explanation": "'Sun' is the star we see in the day. 'Son' is a boy who is someone's child; they sound alike but mean different things.", "hints": ["Which one is in the sky?"]}, {"type": "fill", "q": "Fill in: *Our team ___ the match yesterday.* (past of win, sounds like 'one')", "answer": ["won"], "explanation": "'Won' is the past tense of win; 'one' is the number.", "hints": ["It sounds like the number 1."]}, {"type": "single", "q": "Which pair are homophones?", "options": ["ate – eight", "big – bag", "dew – dry", "sea – sky"], "answer": 0, "explanation": "'Ate' and 'eight' sound alike but are spelled differently. The other pairs only share a letter or a theme.", "hints": ["The words must sound the same."]}]}, {"type": "text", "md": "**Connecting words** join two parts of a sentence and answer *when?* or *why?* Examples: **because** (why), **before** (when), **as soon as** (when), **as** (why). *The children ran towards the gate as soon as the bell rang.*  *Nitin was late because there was a traffic jam.*", "title": "Language: connecting words"}, {"type": "quiz", "id": "c6-ch01-quiz-connect", "title": "Connectors", "questions": [{"type": "single", "q": "*He did not want to try rock climbing ___ of his fear of heights.* Choose the best connector.", "options": ["because", "before", "as soon as", "so"], "answer": 0, "explanation": "The fear of heights is the reason, so 'because' fits. 'Before' and 'as soon as' tell us about time.", "hints": ["Does the sentence give a reason?"]}, {"type": "single", "q": "*The children submitted their work ___ the deadline.* (when?)", "options": ["because", "before", "although", "due to"], "answer": 1, "explanation": "'Before' tells us when: earlier than the deadline.", "hints": ["They finished earlier than the deadline."]}]}, {"type": "exercise", "id": "c6-ch01-ex-retell", "title": "Tell Rama Natha's story in five sentences", "difficulty": "easy", "minutes": 10, "goal": "Write a five-sentence retelling of 'A Bottle of Dew' and state its message.", "behavior": "Use each connector at least once: **because**, **before**, **as soon as**. End with the message of the story in your own words.", "hints": ["Start with who Rama Natha was.", "Use 'because' for why he ignored his land.", "Finish with: what created the wealth?"], "checklist": ["My sentences are in the right order", "I used because, before and as soon as correctly", "I named Rama Natha, Madhumati and the sage", "I stated the message about hard work"], "solution": "Rama Natha was the son of a rich landlord, but he ignored his land because he wanted a magic potion. The sage told him to plant bananas and collect dew. Before he got five litres of dew, six years had passed. As soon as he tried the 'potion', nothing happened, so he felt cheated. Madhumati then showed the gold coins she earned selling the bananas, and the sage explained that hard work creates wealth.", "solution_lang": "text", "solution_explain": "The example keeps the order beginning → task → work → surprise → message, and each connector answers a 'when' or 'why' question.", "mode": "selfcheck"}, {"type": "summary", "points": ["Rama Natha learns that hard work, not a magic potion, creates wealth.", "Retelling a story means putting events in the order they happen.", "Homophones sound the same but are spelled differently (sun/son, ate/eight).", "Connectors like because, before and as soon as answer 'why' and 'when'."]}], "terms": [{"term": "potion", "def": "a liquid with magical properties"}, {"term": "homophones", "def": "words that sound the same but have different spellings and meanings"}, {"term": "connector", "def": "a word that joins two parts of a sentence, such as 'because' or 'before'"}], "id": "c6u1-01-bottle-of-dew", "chapter": "c6u1", "kind": "lesson", "minutes": 20}, "c6u1-02-raven-and-fox": {"title": "The Raven and the Fox: how flattery fools us", "summary": "Explain the moral of a fable poem, and spot rhyme, alliteration and opposites.", "source": {"chapter": "ch01", "sections": ["The Raven and the Fox"], "pages": "13-19"}, "blocks": [{"type": "text", "md": "A **fable** is a short story, often about animals, that teaches a lesson. *The Raven and the Fox* is a fable told as a poem. After this lesson you can explain its message and name two sound tricks poets use: **rhyme** and **alliteration**."}, {"type": "callout", "kind": "analogy", "md": "Flattery is like bait on a fishing hook. It looks tasty, but it is there to catch you.", "title": "Picture this"}, {"type": "text", "md": "Mr Raven sits on a branch holding a small piece of food in his beak. Reynard the Fox wants it. So he praises the Raven's feathers and says the birds would call him king — *if only he would sing*. But a raven's voice is just a croak. Proud of the praise, the Raven opens his beak to sing, and the food drops. The Fox laughs and says: ignore sweet words, because pride is unwise.", "title": "What happens"}, {"type": "reveal", "prompt": "Why did the Raven forget that his voice is a croak?", "md": "Because the Fox's flattery made him feel proud. When we are proud of ourselves, we stop thinking clearly. The poem says that **pride is unwise** and that we should be careful with sweet words."}, {"type": "quiz", "id": "c6-ch01-quiz-raven", "title": "Check the poem", "questions": [{"type": "order", "q": "Order the events in the poem.", "items": ["The Raven sits on a branch with food", "The Fox praises the Raven's feathers", "The Fox asks the Raven to sing", "The Raven opens his beak and the food falls", "The Fox laughs and gives the lesson"], "explanation": "The poem follows a clear chain: situation → flattery → request → mistake → lesson.", "hints": ["The Fox speaks twice before the food falls."]}, {"type": "single", "q": "What does the Fox really want?", "options": ["To hear the Raven sing", "To make the Raven king", "The Raven's food", "To be friends"], "answer": 2, "explanation": "The praise is just a trick to get the food. Wrong options take the Fox's words at face value.", "hints": ["Look at what falls to the ground."]}, {"type": "single", "q": "Which word best describes the Raven in this poem?", "options": ["cunning", "proud", "brave", "careless about food"], "answer": 1, "explanation": "The Raven is proud; the Fox is the cunning one. Fox : clever :: Raven : foolish.", "hints": ["Which feeling made him open his beak?"]}]}, {"type": "flashcards", "id": "c6-ch01-cards-raven", "title": "Poem words", "cards": [{"front": "perched", "back": "sat on a branch"}, {"front": "morsel", "back": "a small piece of food"}, {"front": "seek", "back": "to look for something"}, {"front": "pride", "back": "feeling that you are better than others"}, {"front": "eyed", "back": "looked with interest at something"}, {"front": "limb", "back": "branch of a tree"}, {"front": "woods", "back": "a smaller area of forest with similar trees"}]}, {"type": "text", "md": "**Rhyme** means words end with the same sound. In the first stanza *limb* rhymes with *him* (the book asks you to find more pairs such as *word* and its partner in stanza 2). Rhymes make a poem musical and easy to remember. **Alliteration** is the repetition of the same starting consonant sound in nearby words, as in *great big beak* (big and beak both start with the /b/ sound).", "title": "Sound tricks in poems"}, {"type": "quiz", "id": "c6-ch01-quiz-sound", "title": "Rhyme and alliteration", "questions": [{"type": "single", "q": "Which phrase shows alliteration?", "options": ["slowly and surely", "busy brown bear", "cold winter night", "a very tall tree"], "answer": 1, "explanation": "'Busy brown bear' repeats /b/. In the others the first sounds are different.", "hints": ["Look at the first sounds of the words."]}, {"type": "single", "q": "Which pair rhymes?", "options": ["limb – him", "beak – bird", "food – fox", "sing – king's"], "answer": 0, "explanation": "'Limb' and 'him' end alike. Beak/bird only share a starting letter.", "hints": ["Rhymes share the ending sound."]}]}, {"type": "text", "md": "**Opposites (antonyms)** help you grow your vocabulary. From the poem: *forgot ↔ remembered*, *foolish ↔ wise*, *pride ↔ humility*, *ignore ↔ notice*, *glow ↔ dim*, *laughed ↔ cried*, *perched ↔ flew*."}, {"type": "quiz", "id": "c6-ch01-quiz-opposites", "title": "Antonyms", "questions": [{"type": "single", "q": "The opposite of *foolish* is…", "options": ["silly", "wise", "proud", "angry"], "answer": 1, "explanation": "'Wise' is the opposite; 'silly' is a synonym.", "hints": ["It means sensible."]}, {"type": "fill", "q": "The opposite of *ignore* (starts with n): n_____", "answer": ["notice"], "explanation": "'Notice' means pay attention to.", "hints": ["What do you do to something you pay attention to?"]}]}, {"type": "exercise", "id": "c6-ch01-ex-praise", "title": "Retell the poem as a conversation", "difficulty": "easy", "minutes": 10, "goal": "Write a short dialogue between Reynard and Mr Raven that ends in a lesson.", "behavior": "Mr Raven has food in his beak, so he cannot speak. Write his actions in brackets, e.g. (Mr Raven nods).", "hints": ["Begin with the Fox's greeting.", "Use brackets for the Raven's actions.", "End with the Fox's lesson."], "checklist": ["The Fox speaks and flatters", "The Raven only has actions in brackets", "The food falls at the end", "The Fox gives a lesson"], "solution": "Reynard: Good morning, Mr Raven! What beautiful feathers you have!\n(Mr Raven puffs out his chest.)\nReynard: If only you would sing, the birds would call you king!\n(Mr Raven opens his beak and the food falls.)\nReynard: Ha-ha! Remember, pride makes us unwise.", "solution_lang": "text", "solution_explain": "A good dialogue keeps the Raven silent until the moment he opens his beak, just as in the poem.", "mode": "selfcheck"}, {"type": "summary", "points": ["A fable is a short story with a lesson; this one teaches that flattery and pride lead to mistakes.", "Rhyme is the same ending sound; alliteration is the same starting consonant sound.", "Opposites (antonyms) such as foolish/wise help build vocabulary."]}], "terms": [{"term": "fable", "def": "a short story, often with animals, that teaches a lesson"}, {"term": "alliteration", "def": "repetition of the same starting consonant sound in nearby words"}, {"term": "rhyme", "def": "words that end with the same sound"}, {"term": "antonym", "def": "a word with the opposite meaning"}], "id": "c6u1-02-raven-and-fox", "chapter": "c6u1", "kind": "lesson", "minutes": 20}, "c6u1-03-rama-to-the-rescue": {"title": "Rama to the Rescue: quick thinking in a tricky night", "summary": "Map a story, then use contractions, the present progressive tense, adverbs and exclamatory/interrogative sentences.", "source": {"chapter": "ch01", "sections": ["Rama to the Rescue"], "pages": "20-35"}, "blocks": [{"type": "text", "md": "This tale is told as a comic. A husband and wife are woken by a sound — a thief is breaking into their house. Instead of panicking, they think fast. After this lesson you can map a story (setting, characters, problem, solution) and use four grammar tools from the unit."}, {"type": "callout", "kind": "analogy", "md": "A story map is like a floor plan: it shows where everything is, so you do not get lost in the plot.", "title": "Picture this"}, {"type": "table", "headers": ["Part", "In 'Rama to the Rescue'"], "rows": [["Setting", "A house in a village, at night"], ["Main characters", "The husband and wife"], ["Other characters", "The thief and Rama, the village kotwal (policeman)"], ["Problem", "A thief has dug his way in"], ["Solution", "The couple pretend to choose a name for a baby, calling 'Rama' ever louder; the kotwal hears and catches the thief"]]}, {"type": "reveal", "prompt": "Why does the thief wish the couple would stop?", "md": "He wants them to fall asleep, or to talk about their money, so he can steal. The couple, however, are tricking him: they talk about naming a child *Rama* and say they will call the name softly in the house, louder in the yard and very loudly in the street. The village kotwal is also called Rama, so he comes running."}, {"type": "quiz", "id": "c6-ch01-quiz-rama", "title": "Story check", "questions": [{"type": "single", "q": "What is the couple's plan?", "options": ["To fight the thief", "To call out 'Rama' so the kotwal hears and comes", "To hide in the yard", "To give the thief their jewels"], "answer": 1, "explanation": "They use the kotwal's own name to call for help without scaring the thief off. Wrong options ignore the trick.", "hints": ["Whose name do they keep calling?"]}, {"type": "truefalse", "q": "The thief wants to know where the family keeps its money.", "answer": true, "explanation": "The thief wonders where they keep their money.", "hints": ["Check what he wonders in the picture."]}, {"type": "single", "q": "Which quality helps the couple most?", "options": ["strength", "quick thinking", "anger", "patience only"], "answer": 1, "explanation": "Cleverness solved the problem, not force.", "hints": ["They solved the problem with an idea."]}]}, {"type": "text", "md": "**Contractions** shorten words with an apostrophe (') where letters are missing: *I'm* = I am, *it's* = it is, *they're* = they are, *what's* = what is, *I'll* = I will, *I'd* = I would/had, *don't* = do not, *must've* = must have. We use contractions in speech and the full forms in formal writing.", "title": "Grammar 1: contractions"}, {"type": "quiz", "id": "c6-ch01-quiz-contractions", "title": "Contractions", "questions": [{"type": "fill", "q": "Expand *we're*:", "answer": ["we are"], "explanation": "The apostrophe replaces 'a' in 'are'.", "hints": ["Which letter does the apostrophe replace?"]}, {"type": "single", "q": "*That's a good name.* — 'That's' means…", "options": ["that has", "that is", "that was", "that will"], "answer": 1, "explanation": "'That is a good name' makes sense; 'that has a good name' does not here.", "hints": ["Replace the apostrophe-s with a full word that fits."]}]}, {"type": "text", "md": "**Present progressive tense** describes an action happening right now: *am/is/are + verb-ing*. Examples: *I am studying. My friend is reading a story book. We are playing a board game.* In the story the husband says: somebody **is trying** to get in.", "title": "Grammar 2: present progressive"}, {"type": "quiz", "id": "c6-ch01-quiz-pp", "title": "Present progressive", "questions": [{"type": "fill", "q": "Complete: *My mother ___ food in the kitchen.* (cook)", "answer": ["is cooking"], "explanation": "Singular 'mother' takes 'is'.", "hints": ["Use is/are/am + verb-ing."]}, {"type": "single", "q": "Which sentence is in the present progressive?", "options": ["I studied yesterday.", "They are talking about money.", "She will call the kotwal.", "He ate eight bananas."], "answer": 1, "explanation": "'They are talking' is happening now.", "hints": ["Look for are/is/am plus -ing."]}]}, {"type": "text", "md": "**Adverbs** tell us how, when or where something happens. *I'd better listen closely.* *I'll call out softly.* *Then I'll call out very loudly.* The words **closely, softly, loudly** all describe how the action is done. Quick test: if you can ask 'How?' after the verb, the answer is probably an adverb.", "title": "Grammar 3: adverbs"}, {"type": "quiz", "id": "c6-ch01-quiz-adverb", "title": "Adverbs", "questions": [{"type": "single", "q": "*Shobha danced gracefully.* Which word is the adverb?", "options": ["Shobha", "danced", "gracefully", "none"], "answer": 2, "explanation": "'Gracefully' answers 'how'.", "hints": ["Ask: How did she dance?"]}, {"type": "fill", "q": "Fill in with an adverb: *The tortoise moved ___ but won the race.* (slow → ?)", "answer": ["slowly"], "explanation": "'Slowly' describes how the tortoise moved.", "hints": ["Add -ly to slow."]}]}, {"type": "text", "md": "**Exclamatory sentences** show strong feeling and end with **!** (*Wow, what an intelligent man he is!*). **Interrogative sentences** ask questions and end with **?** (*What should we name our child?*). Punctuation tells the reader what feeling or purpose you intend.", "title": "Grammar 4: exclamatory vs interrogative"}, {"type": "quiz", "id": "c6-ch01-quiz-excl", "title": "Sentence types", "questions": [{"type": "single", "q": "Which needs a question mark?", "options": ["Oh how big the hole is", "Do you like comic books", "Wow what a story", "Ah at last"], "answer": 1, "explanation": "'Do you like comic books' is a question; the others show feeling.", "hints": ["Which one asks something?"]}, {"type": "truefalse", "q": "'Oh, how big the hole is!' is an interrogative sentence.", "answer": false, "explanation": "It expresses surprise, so it is exclamatory.", "hints": ["Is it asking something or showing strong feeling?"]}]}, {"type": "exercise", "id": "c6-ch01-ex-neighbour", "title": "Tell the neighbour what happened", "difficulty": "medium", "minutes": 12, "goal": "Write what happened last night as the husband. Include when, where, what, how and why.", "behavior": "Use at least two contractions in speech marks and one adverb ending in -ly.", "hints": ["Begin: 'My wife and I were about to go to sleep when…'", "Use contractions only inside speech marks.", "Finish with how the kotwal helped."], "checklist": ["I answer when, where, what, how and why", "I used two contractions", "I used one -ly adverb", "My sentences are in order"], "solution": "Last night, at home in the village, my wife and I heard a noise. A thief had dug his way in, so we pretended to choose a name for a baby. \"I'll call out 'Rama' softly,\" I said, then loudly. The kotwal, whose name is Rama, heard us and caught the thief because we thought quickly.", "solution_lang": "text", "solution_explain": "The answer covers the five W's and mixes contractions with an adverb.", "mode": "selfcheck"}, {"type": "summary", "points": ["A story map has setting, characters, problem and solution.", "Contractions use an apostrophe for missing letters; the present progressive is am/is/are + verb-ing.", "Adverbs tell how, when or where; exclamatory sentences end in ! and interrogative ones in ?."]}], "terms": [{"term": "contraction", "def": "a shortened word with an apostrophe, like 'I'm'"}, {"term": "present progressive", "def": "tense for an action happening now: am/is/are + verb-ing"}, {"term": "adverb", "def": "a word that tells how, when or where an action happens"}, {"term": "exclamatory sentence", "def": "a sentence that shows strong feeling and ends with !"}, {"term": "interrogative sentence", "def": "a sentence that asks a question and ends with ?"}], "id": "c6u1-03-rama-to-the-rescue", "chapter": "c6u1", "kind": "lesson", "minutes": 25}, "c6u1-99-test": {"title": "Test: Fables and Folk Tales", "summary": "Check what you learnt in Unit 1.", "kind": "test", "blocks": [{"type": "quiz", "id": "c6-ch01-test", "title": "Unit 1 test", "questions": [{"type": "single", "q": "What is the main message of 'A Bottle of Dew'?", "options": ["Magic potions exist", "Hard work creates wealth", "Bananas are valuable", "Sages always lie"], "answer": 1, "explanation": "The money came from the plantation and the market, i.e. from work.", "hints": ["Think about where the gold came from."]}, {"type": "single", "q": "Who sold the bananas in the market?", "options": ["Rama Natha", "The sage", "Madhumati", "A boy"], "answer": 2, "explanation": "Madhumati sold the fruit.", "hints": ["Who opened the box of coins?"]}, {"type": "fill", "q": "Homophone of 'dew' that means 'expected at a time': d__", "answer": ["due"], "explanation": "'Due' sounds like 'dew'.", "hints": ["Same sound, different spelling."]}, {"type": "single", "q": "Which connector shows a reason? *He stayed home ___ he was ill.*", "options": ["before", "because", "as soon as", "after"], "answer": 1, "explanation": "'Because' gives the reason.", "hints": ["The second part explains why."]}, {"type": "single", "q": "In 'The Raven and the Fox', why does the Fox praise the Raven?", "options": ["He admires him", "He wants the food", "He wants a song", "He is afraid"], "answer": 1, "explanation": "The praise is a trick.", "hints": ["What falls to the ground?"]}, {"type": "single", "q": "Which is alliteration?", "options": ["great big beak", "cold dark night", "slow and steady", "a wise bird"], "answer": 0, "explanation": "'Big' and 'beak' both start with /b/.", "hints": ["Same first sound."]}, {"type": "order", "q": "Order the events in 'Rama to the Rescue'.", "items": ["A thief digs into the house", "The couple pretend to name a child", "They call 'Rama' louder each time", "The kotwal Rama hears", "The thief is caught"], "explanation": "Cause and effect link each step.", "hints": ["The plan comes before the kotwal arrives."]}, {"type": "fill", "q": "Expand *they're*:", "answer": ["they are"], "explanation": "The apostrophe replaces 'a'.", "hints": ["Which letter is replaced?"]}, {"type": "single", "q": "Which is in the present progressive?", "options": ["She ran home", "She is running home", "She will run home", "She had run home"], "answer": 1, "explanation": "'Is running' shows now.", "hints": ["am/is/are + -ing"]}, {"type": "multi", "q": "Which are adverbs?", "options": ["softly", "loudly", "kotwal", "closely"], "answer": [0, 1, 3], "explanation": "Softly, loudly, closely tell how. 'Kotwal' is a noun.", "hints": ["Ask 'how?' after the verb."]}], "mode": "test"}], "id": "c6u1-99-test", "chapter": "c6u1", "minutes": 10}, "c6u2-01-unlikely-best-friends": {"title": "The Unlikely Best Friends: Gajaraj and Buntee", "summary": "Retell the elephant-and-dog story, and choose correct past tense forms.", "source": {"chapter": "ch02", "sections": ["The Unlikely Best Friends"], "pages": "39-51"}, "blocks": [{"type": "text", "md": "Can an elephant and a stray dog be best friends? This story, from the Jataka tradition, says yes. You will learn what 'unlikely' means, follow the story step by step, and then practise the three past tenses the author uses."}, {"type": "callout", "kind": "analogy", "md": "'Unlikely' is like a surprising pair in a game of snap: you do not expect them to match, yet they do.", "title": "Picture this"}, {"type": "text", "md": "**Gajaraj** is a royal elephant with comforts but no friends; the **mahout** (elephant trainer) feeds and bathes him, but is a caretaker, not a friend. One evening a hungry stray dog enters the stable and Gajaraj pushes some of his food towards him. They become companions: the dog goes along to the bath, gets splashed by the elephant's trunk, and rides on his back.", "title": "Part 1: a friendship begins"}, {"type": "text", "md": "A farmer spots the dog — his lost dog **Buntee** — and takes him home with a rope. Both friends are sad. Gajaraj refuses his food. The mahout worries; Buntee refuses food at the farmer's house too. The farmer understands, unties the rope, and Buntee runs back to the stable. At the end the farmer and the mahout also become friends.", "title": "Part 2: separation and reunion"}, {"type": "reveal", "prompt": "What is 'unlikely' about this friendship?", "md": "An elephant and a dog are very different animals, and we do not expect them to be friends. Their friendship shows that care matters more than being alike."}, {"type": "quiz", "id": "c6-ch02-quiz-gajaraj", "title": "Story check", "questions": [{"type": "single", "q": "Why was Gajaraj sad before meeting the dog?", "options": ["He was hungry", "He had no friends, only a caretaker", "The king was angry", "He lost his food"], "answer": 1, "explanation": "The mahout cared for him, but caring for and being a friend are different.", "hints": ["Read about the mahout."]}, {"type": "single", "q": "Why did the farmer remove the rope?", "options": ["He was tired", "He realised Buntee was missing his friend", "The dog bit him", "He wanted to sell the dog"], "answer": 1, "explanation": "The farmer saw Buntee's sadness and put his feelings first.", "hints": ["The farmer asked a question about missing a friend."]}, {"type": "truefalse", "q": "The mahout and the farmer became friends too.", "answer": true, "explanation": "The mahout says he has found a friend as well.", "hints": ["Think about the story's ending."]}]}, {"type": "text", "md": "**Three kinds of past tense** appear in the story. **Simple past** (verb + -d/-ed, or irregular like *gave*, *went*) tells what happened: *He pushed the food.* **Past progressive** (was/were + verb-ing) shows an action that was going on: *The elephant was munching.* **Past perfect** (had + third form) shows an action completed before another: *The king had ordered care.*", "title": "Grammar: past tenses"}, {"type": "table", "headers": ["Tense", "Pattern", "Example"], "rows": [["Simple past", "verb + -ed / 2nd form", "looked, gave, went"], ["Past progressive", "was/were + verb-ing", "was looking, was missing"], ["Past perfect", "had + 3rd form", "had ordered, had followed"]]}, {"type": "quiz", "id": "c6-ch02-quiz-past", "title": "Past tense practice", "questions": [{"type": "single", "q": "Which is past perfect?", "options": ["was munching", "had remained", "looked", "hated"], "answer": 1, "explanation": "'Had remained' = had + third form.", "hints": ["Look for 'had'."]}, {"type": "single", "q": "Choose: *The farmer came back and ___ that Buntee was sad.*", "options": ["noticed", "was noticing", "had noticed", "notices"], "answer": 0, "explanation": "'Noticed' is simple past. The sentence only needs the main action.", "hints": ["One completed action in the past."]}, {"type": "single", "q": "*He ___ Buntee with a rope the day before.*", "options": ["tied", "was tying", "had tied", "ties"], "answer": 2, "explanation": "Earlier than another past action → past perfect.", "hints": ["'The day before' marks an earlier action."]}]}, {"type": "text", "md": "**Opposites with prefixes.** Add letters in front to form an opposite: *un-* (kind → unkind), *in-* (correct → incorrect), *dis-* (appear → disappear), *mis-* (use → misuse). In the story: unkind, disappeared, untouched, unhappy. Remember: spelling may need care, and not every word can take every prefix.", "title": "Vocabulary: prefixes"}, {"type": "quiz", "id": "c6-ch02-quiz-prefix", "title": "Opposites", "questions": [{"type": "fill", "q": "The opposite of *appeared* (dis___):", "answer": ["disappeared"], "explanation": "'Disappeared' means no longer seen.", "hints": ["Add dis- to the front."]}, {"type": "single", "q": "The opposite of *awake* is…", "options": ["unawake", "asleep", "dissleep", "misawake"], "answer": 1, "explanation": "'Asleep' is the opposite.", "hints": ["Not every opposite uses a prefix."]}]}, {"type": "text", "md": "**Neither … nor** joins two negative choices: *Neither Rohit nor I want to play football.* **Either … or** joins two possible choices: *Rohit wants to play either cricket or kho-kho.* In the story, neither the farmer nor the mahout noticed the friends' tears.", "title": "Grammar: neither–nor, either–or"}, {"type": "quiz", "id": "c6-ch02-quiz-neither", "title": "Either–or", "questions": [{"type": "single", "q": "*___ Meena nor Ravi likes spinach.*", "options": ["Either", "Neither", "Both", "Not"], "answer": 1, "explanation": "'Neither' goes with 'nor'.", "hints": ["'nor' pairs with…"]}, {"type": "single", "q": "*She wants ___ tea or juice.*", "options": ["neither", "either", "both", "nor"], "answer": 1, "explanation": "'Either' goes with 'or'.", "hints": ["'or' pairs with…"]}]}, {"type": "exercise", "id": "c6-ch02-ex-friend", "title": "Write about your friend", "difficulty": "medium", "minutes": 12, "goal": "Write six sentences about how you and a friend are similar and different.", "behavior": "Use at least: both, but, neither … nor or either … or.", "hints": ["Make a list of likes first.", "Use 'both' for likes you share.", "Use 'but' for differences."], "checklist": ["I wrote six sentences", "I showed one similarity and one difference", "I used either-or or neither-nor correctly"], "solution": "My friend and I like to play. Both of us want to win a game of cricket. I like to read, but my friend likes to draw. Neither of us likes spicy food. We are different because she is tall and I am short. Either of us can bring snacks.", "solution_lang": "text", "solution_explain": "The answer mixes similar and different facts with the required connectors.", "mode": "selfcheck"}, {"type": "summary", "points": ["Gajaraj and Buntee show that care, not likeness, makes friendship.", "Simple past, past progressive and past perfect show different time relationships.", "Prefixes un-, in-, dis-, mis- form opposites; neither–nor and either–or link choices."]}], "terms": [{"term": "unlikely", "def": "not expected"}, {"term": "mahout", "def": "an elephant trainer"}, {"term": "past perfect", "def": "had + third form, for an earlier completed action"}, {"term": "prefix", "def": "letters added at the start of a word, e.g. un-"}], "id": "c6u2-01-unlikely-best-friends", "chapter": "c6u2", "kind": "lesson", "minutes": 25}, "c6u2-02-a-friends-prayer": {"title": "A Friend's Prayer: words of care", "summary": "Summarise a poem about friendship and use words that describe a good friend.", "source": {"chapter": "ch02", "sections": ["A Friend's Prayer"], "pages": "52-58"}, "blocks": [{"type": "text", "md": "A **prayer** is a wish made with a full heart. *A Friend's Prayer* is a poem in which the speaker wishes to be a good friend. By the end you can explain the poem in a few sentences and describe friends with strong words."}, {"type": "callout", "kind": "analogy", "md": "A prayer for a friend is like a birthday wish: you hope good things for them, whether or not you can make them happen yourself.", "title": "Picture this"}, {"type": "text", "md": "The speaker prays that friendship will always matter most to her. She feels **blessed** with special friends and wants to give her very best. She promises to try everything a friend can to make friends' wishes come true. She also wishes to use her heart to understand friends, avoid judging them from far away, and love them as they are.", "title": "What the poem says"}, {"type": "reveal", "prompt": "Why can we call this poem a prayer?", "md": "The speaker asks for good things (a hope, not a command): 'let me', 'may my friendships'. She is wishing, not ordering."}, {"type": "quiz", "id": "c6-ch02-quiz-prayer", "title": "Poem check", "questions": [{"type": "single", "q": "What does the speaker want about friendship?", "options": ["It should be the most important thing", "It should be quick", "It should be secret", "It should be competitive"], "answer": 0, "explanation": "She asks that friendships stay the most important thing.", "hints": ["See the first lines."]}, {"type": "single", "q": "What does 'love my friends the way they are' mean?", "options": ["Change your friends", "Accept friends with all their qualities", "Love only some friends", "Give gifts"], "answer": 1, "explanation": "It means accepting people as they are.", "hints": ["Think about 'no judgements'."]}, {"type": "multi", "q": "Which words are close in meaning to *blessed*?", "options": ["grateful", "thankful", "excited", "relaxed"], "answer": [0, 1], "explanation": "Grateful and thankful match blessed.", "hints": ["Think about feeling lucky and thankful."]}]}, {"type": "text", "md": "Good friends have many qualities: **loyal** (always faithful), **helpful**, **kind**, **caring**, **honest** (tells the truth). Examples: *My friend is loyal even when I make a mistake. She shares things, so she is generous.*", "title": "Words for good friends"}, {"type": "flashcards", "id": "c6-ch02-cards-qualities", "title": "Friend qualities", "cards": [{"front": "loyal", "back": "stays faithful to you even when you make mistakes"}, {"front": "helpful", "back": "ready to help"}, {"front": "kind", "back": "gentle and thoughtful"}, {"front": "caring", "back": "shows concern for others"}, {"front": "honest", "back": "tells the truth"}, {"front": "blessed", "back": "feeling lucky and thankful"}]}, {"type": "quiz", "id": "c6-ch02-quiz-qualities", "title": "Which quality?", "questions": [{"type": "single", "q": "My friend never lies. She is…", "options": ["honest", "helpful", "loyal", "careless"], "answer": 0, "explanation": "Honest means truthful.", "hints": ["Which quality is about the truth?"]}, {"type": "single", "q": "He supports me even when I am wrong. He is…", "options": ["loyal", "rude", "shy", "lazy"], "answer": 0, "explanation": "Loyal means faithful.", "hints": ["Think about staying on someone's side."]}]}, {"type": "exercise", "id": "c6-ch02-ex-prayer", "title": "Write your own prayer for a friend", "difficulty": "easy", "minutes": 10, "goal": "Write 4 lines wishing good things for a friend.", "behavior": "Use 'May my friend…' or 'Let me…'. Add one quality word.", "hints": ["Start with 'May'.", "Pick one quality word."], "checklist": ["I used 'May' or 'Let me'", "I mentioned a wish", "I used a quality word"], "solution": "May my friend always be happy and well.\nLet me be loyal when she needs help.\nMay we share every game and tiffin.\nLet me love her just as she is.", "solution_lang": "text", "solution_explain": "The lines are wishes, not orders.", "mode": "selfcheck"}, {"type": "summary", "points": ["The poem is a prayer: wishes to be a good friend and to accept friends as they are.", "Blessed means feeling lucky and thankful.", "Qualities like loyal, helpful, kind, caring and honest describe good friends."]}], "terms": [{"term": "prayer", "def": "a wish made with a full heart"}, {"term": "blessed", "def": "feeling lucky and thankful"}, {"term": "loyal", "def": "faithful to someone"}], "id": "c6u2-02-a-friends-prayer", "chapter": "c6u2", "kind": "lesson", "minutes": 15}, "c6u2-03-the-chair": {"title": "The Chair: finding real friends", "summary": "Explain the magic chair test, and use root words, suffixes and adjectives.", "source": {"chapter": "ch02", "sections": ["The Chair"], "pages": "59-70"}, "blocks": [{"type": "text", "md": "Mario loves telling people how many friends he has. His grandfather offers a bet: he says Mario's 'friends' might only be companions. The tool? An invisible chair. You will follow the story, then learn **root words**, **suffixes** and **adjectives**."}, {"type": "callout", "kind": "analogy", "md": "A real friend is like a safety net — they do not laugh when you fall; they catch you.", "title": "Picture this"}, {"type": "text", "md": "Mario takes the invisible chair to school and tries to sit on it in front of everyone. He falls again and again. Most classmates laugh. Eventually he does not fall: three friends — Guneet, Asma and Deepa — are holding him up. Mario realises that **true friends care for us and do not enjoy our bad luck**. His grandfather's bet is won, and the four enjoy fruit chaat.", "title": "The story"}, {"type": "reveal", "prompt": "Was the magic chair test a good one? Why?", "md": "The test shows who helps when someone is in trouble. Other ways to find real friends: see who helps when you are sad, who tells the truth, who stays loyal."}, {"type": "quiz", "id": "c6-ch02-quiz-chair", "title": "Story check", "questions": [{"type": "single", "q": "What did the grandfather give Mario?", "options": ["A real chair", "An invisible chair", "A bet ticket", "A book"], "answer": 1, "explanation": "The chair was invisible.", "hints": ["It was tricky to sit on."]}, {"type": "truefalse", "q": "Mario sat on the chair successfully on his first attempt.", "answer": false, "explanation": "He fell repeatedly.", "hints": ["He fell several times."]}, {"type": "single", "q": "What does the story teach?", "options": ["Win bets", "True friends care when we struggle", "Never ask for help", "Laugh at mistakes"], "answer": 1, "explanation": "Only three friends supported him.", "hints": ["Who held him up?"]}]}, {"type": "text", "md": "A **root word** is the main part of a word; a **suffix** is letters added at the end. *friend + -ly = friendly*; *care + -ful = careful*; *magic + -al = magical*; *friend + -ship = friendship*; *courage + -ous = courageous*. Watch for spelling changes: *celebrate + -tion = celebration*.", "title": "Language: root words and suffixes"}, {"type": "quiz", "id": "c6-ch02-quiz-suffix", "title": "Suffixes", "questions": [{"type": "fill", "q": "friend + ship =", "answer": ["friendship"], "explanation": "Friendship.", "hints": ["Just join them."]}, {"type": "single", "q": "Which is the root word in *helpful*?", "options": ["help", "ful", "helpf", "hel"], "answer": 0, "explanation": "'Help' is the root.", "hints": ["What remains if you remove -ful?"]}]}, {"type": "text", "md": "**Adjectives** describe a person or thing: *brave soldier, clever plan, tasty peanuts, heavy rain, slight cold, true friends.* Mario is **brave** and **determined**; the chair is **special** and **invisible**.", "title": "Language: adjectives"}, {"type": "quiz", "id": "c6-ch02-quiz-adj", "title": "Adjectives", "questions": [{"type": "single", "q": "*Mario, brave and determined, took the invisible chair.* Which are adjectives?", "options": ["took, invisible", "brave, determined", "Mario, chair", "school, took"], "answer": 1, "explanation": "Brave, determined (and invisible) describe nouns.", "hints": ["Which words describe a noun?"]}, {"type": "fill", "q": "Fill in: *a ___ friend* who always stays with you (true/trues)", "answer": ["true"], "explanation": "'True friends' appears in the story.", "hints": ["Which adjective suits 'friends'?"]}]}, {"type": "exercise", "id": "c6-ch02-ex-message", "title": "Write a message to your best friend", "difficulty": "easy", "minutes": 10, "goal": "Write a short thank-you note.", "behavior": "Use two adjectives and one suffix word (like friendship or helpful).", "hints": ["Start with Dear …", "Thank them for a specific thing."], "checklist": ["I used two adjectives", "I used a suffix word", "I thanked my friend"], "solution": "Dear Meera,\nI feel so lucky to have a true friend like you. You are always helpful and kind. Thank you for our wonderful friendship.\nBest wishes,\nAnu", "solution_lang": "text", "solution_explain": "The note uses adjectives (true, helpful, kind) and a suffix word (friendship).", "mode": "selfcheck"}, {"type": "summary", "points": ["Real friends care for us and do not enjoy our bad luck.", "A root word plus a suffix makes a new word (friend + ship).", "Adjectives describe people or things."]}], "terms": [{"term": "root word", "def": "the main part of a word"}, {"term": "suffix", "def": "letters added at the end of a word"}, {"term": "adjective", "def": "a word that describes a noun"}], "id": "c6u2-03-the-chair", "chapter": "c6u2", "kind": "lesson", "minutes": 15}, "c6u2-99-test": {"title": "Test: Friendship", "summary": "Check what you learnt in Unit 2.", "kind": "test", "blocks": [{"type": "quiz", "id": "c6-ch02-test", "title": "Unit 2 test", "questions": [{"type": "single", "q": "Who held Mario up?", "options": ["Guneet, Asma and Deepa", "His grandfather", "The teacher", "The whole class"], "answer": 0, "explanation": "Three friends.", "hints": ["Three names."]}, {"type": "single", "q": "Why was Gajaraj sad at the start?", "options": ["No friends", "Too much food", "No bath", "Cold weather"], "answer": 0, "explanation": "He had no friends.", "hints": ["Read the first paragraph."]}, {"type": "single", "q": "Which is past perfect?", "options": ["had followed", "followed", "was following", "follows"], "answer": 0, "explanation": "'Had followed' is past perfect.", "hints": ["had + third form"]}, {"type": "fill", "q": "Opposite of *kind* using un-:", "answer": ["unkind"], "explanation": "Unkind.", "hints": ["Add un-."]}, {"type": "single", "q": "Neither the farmer ___ the mahout noticed.", "options": ["or", "nor", "and", "but"], "answer": 1, "explanation": "'Nor' goes with neither.", "hints": ["Pairs with neither."]}, {"type": "multi", "q": "Which are qualities of a good friend?", "options": ["loyal", "caring", "honest", "rude"], "answer": [0, 1, 2], "explanation": "Loyal, caring, honest.", "hints": ["Pick the good ones."]}, {"type": "single", "q": "friend + ship =", "options": ["friendship", "friendly", "friends", "friendful"], "answer": 0, "explanation": "Friendship.", "hints": ["Join the pieces."]}, {"type": "single", "q": "Which is an adjective?", "options": ["brave", "ran", "quickly", "and"], "answer": 0, "explanation": "Brave.", "hints": ["Does it describe a noun?"]}, {"type": "single", "q": "What does the poem 'A Friend's Prayer' mainly wish?", "options": ["To be a good friend", "To win a race", "To be rich", "To be famous"], "answer": 0, "explanation": "She wishes to be a good friend.", "hints": ["Check the first lines."]}], "mode": "test"}], "id": "c6u2-99-test", "chapter": "c6u2", "minutes": 5}, "c6u3-01-neem-baba": {"title": "Neem Baba: a tree that talks", "summary": "Collect facts about the neem tree, and understand compound words and personification.", "source": {"chapter": "ch03", "sections": ["Neem Baba"], "pages": "1-12"}, "blocks": [{"type": "text", "md": "A girl named Amber sits under a neem tree in her courtyard and feels it whisper. She starts talking to it — and the tree answers. You will gather facts about the neem, and learn two language ideas: **compound words** and **personification**."}, {"type": "callout", "kind": "analogy", "md": "A fact sheet is like a school ID card for a topic: name, where it comes from, what it is known for — all in one place.", "title": "Picture this"}, {"type": "text", "md": "Neem Baba says he is very old, born in North India or Myanmar millions of years ago, and his family spread over many Asian and African countries and parts of America. His Sanskrit names include **Arishta** ('the one who cures diseases'), **Nimba** and **Nimbaca**; **'Neem'** came from the Iranians; in Hindi he is **Nimb**. Scientists praise him as 'nature's gift to man' and the 'tree of the twentieth century'.", "title": "Facts: name and home"}, {"type": "table", "headers": ["Fact sheet item", "From the text"], "rows": [["Hindi name", "Nimb"], ["Name given by Iranians", "Neem"], ["Born", "North India or Myanmar, millions of years ago"], ["Found in", "Many Asian and African countries and parts of America"], ["Names by scientists", "e.g. 'nature's gift to man', 'tree of the twentieth century'"]]}, {"type": "text", "md": "**Uses of neem**: leaves have chemical properties that destroy germs, so doctors suggest neem leaves for someone with measles (they comfort itching and stop germs growing). Bark, flowers, fruits and roots make medicines. For farmers, neem seed powder mixed with water protects plants from locusts, helps stop mosquitoes breeding in standing water, protects crops from termites and stored grain from insects. Neem oil goes into soaps and toothpaste, neem wood is not eaten by termites, and neem purifies the air.", "title": "Facts: uses"}, {"type": "callout", "kind": "warning", "md": "Neem remedies must only be used by people who are well trained and experienced — Neem Baba says so himself. Never try a medicine without a trained adult.", "title": "Safety"}, {"type": "quiz", "id": "c6-ch03-quiz-neem", "title": "Fact check", "questions": [{"type": "single", "q": "Who gave the name 'Neem'?", "options": ["Sanskrit scholars", "The Iranians", "Amber", "Scientists"], "answer": 1, "explanation": "The Iranians. Sanskrit names are Arishta, Nimba and Nimbaca.", "hints": ["Read the name story."]}, {"type": "single", "q": "Why are neem leaves put on a measles patient's bed?", "options": ["They are soft only", "They destroy germs and comfort itching", "They smell nice", "They stop fever fully"], "answer": 1, "explanation": "The leaves comfort and do not let germs breed.", "hints": ["Think about itching and germs."]}, {"type": "multi", "q": "Which are uses for farmers?", "options": ["Stops locusts eating plants", "Helps stop mosquito breeding in rice fields", "Saves stored grain", "Makes tea"], "answer": [0, 1, 2], "explanation": "Seed powder protects crops and stored grains.", "hints": ["Think about seed powder."]}]}, {"type": "text", "md": "A **compound word** joins two words. **Open**: spaces (*neem oil, seed powder, well known*). **Closed**: no space (*grandmother, childhood, something*). **Hyphenated**: hyphen (*thought-provoking, cleanliness-parting, well-trained*). Check a dictionary when unsure.", "title": "Language: compound words"}, {"type": "quiz", "id": "c6-ch03-quiz-compound", "title": "Compound words", "questions": [{"type": "single", "q": "*grandmother* is a ___ compound word.", "options": ["open", "closed", "hyphenated", "not compound"], "answer": 1, "explanation": "No space: closed.", "hints": ["Is there a space or hyphen?"]}, {"type": "single", "q": "*thought-provoking* is…", "options": ["open", "closed", "hyphenated", "a prefix word"], "answer": 2, "explanation": "It has a hyphen.", "hints": ["Look for the hyphen."]}]}, {"type": "text", "md": "**Personification** gives human qualities to non-human things. Amber speaks to Neem Baba as to a person. More examples: *The leaves whispered in the wind. The flowers danced merrily in the breeze.*", "title": "Language: personification"}, {"type": "quiz", "id": "c6-ch03-quiz-person", "title": "Personification", "questions": [{"type": "single", "q": "Which sentence uses personification?", "options": ["The tree is tall.", "The tree waved to the children.", "The tree has leaves.", "The tree grows slowly."], "answer": 1, "explanation": "'Wav
