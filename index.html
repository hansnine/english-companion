can be as powerful as strength. A clever idea can win where muscles cannot. Speaker three: I like how witty characters stay calm in tricky situations. They use humour instead of fighting, and so they teach me to keep my head. Speaker four: A clever character keeps me hooked on the page. I want to find out what they will say or do next, so I stay engaged until the last line.", "listen": true}, {"type": "quiz", "id": "u1c3-q-match", "title": "Match speaker to statement", "questions": [{"type": "single", "q": "Speaker (i)", "options": ["Witty characters can deactivate tense situations with their cleverness.", "Witty characters add excitement by extraordinary deeds.", "Witty characters show ways to make learning enjoyable."], "answer": 0, "explanation": "Lighter tense moments.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Speaker (ii)", "options": ["Witty characters prove cleverness is as powerful as strength.", "Witty characters teach me tricky situations can be managed calmly.", "Witty characters in a story keep the reader involved."], "answer": 0, "explanation": "Sharp mind = strength.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Speaker (iii)", "options": ["Witty characters teach me that tricky situations can be managed calmly.", "Witty characters add excitement.", "Witty characters prove cleverness equals strength."], "answer": 0, "explanation": "Calm in tricky situations.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Speaker (iv)", "options": ["Witty characters in a story keep the reader involved.", "Witty characters show ways to make learning enjoyable.", "Witty characters add excitement by extraordinary deeds."], "answer": 0, "explanation": "Keeps the reader engaged.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Sentence stress:** the word you stress changes the meaning. *Look there, friends* (look, not do something else); *Look **there**, friends* (there, not here); *Look there, **friends*** (talking to friends). **Statements and exclamations** usually end with a **falling tone**: *Very well. We shall go to the king.* *Yes, yes, it is!*", "title": "Let us speak"}, {"type": "quiz", "id": "u1c3-q-stress", "title": "Stress changes meaning", "questions": [{"type": "single", "q": "**I** take my dog for a walk in the evening.", "options": ["It is me, not someone else.", "The walk is in the evening.", "It is my dog."], "answer": 0, "explanation": "Stressing I = I, nobody else.", "hints": ["Think about the text again."]}, {"type": "single", "q": "I take **my dog** for a walk in the evening.", "options": ["It is my dog, not another.", "I take someone else.", "I am walking fast."], "answer": 0, "explanation": "Stress on *my dog*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "I take my dog for a walk **in the evening**.", "options": ["the time is the evening", "the place is a park", "I walk alone"], "answer": 0, "explanation": "Stress on time.", "hints": ["Think about the text again."]}]}, {"type": "exercise", "id": "u1c3-ex-speak", "title": "Practise falling tone", "difficulty": "easy", "minutes": 10, "goal": "Read aloud with the right intonation.", "behavior": "Say with falling tone: ‘Good day, kind sirs.’ ‘We regret to inform you that we do not know where it is.’ ‘You describe it perfectly!’ ‘You shall come with me to face the King!’", "hints": ["Say it slowly first.", "Make your voice go down at the end.", "Record yourself."], "checklist": ["Falling tone at the end", "Clear stress on important words", "Natural pace"], "solution": "Good day, kind sirs. ↘  You describe it perfectly! ↘", "solution_lang": "text", "solution_explain": "Statements and exclamations fall.", "mode": "selfcheck"}, {"type": "summary", "points": ["Different speakers like witty characters for different reasons.", "Stress changes meaning.", "Statements and exclamations fall at the end."]}], "source": {"chapter": "u1c3", "pages": "42-43, 48"}, "id": "c8u1c3-05-listen-speak", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-06-write-explore": {"title": "Let us write and explore", "summary": "Write a letter of complaint and plan to stage the play.", "minutes": 30, "blocks": [{"type": "text", "md": "**Situation:** the kutcha road to your colony is bad after heavy rains. Potholes are dangerous and stagnant water breeds mosquitoes. Write a letter of complaint to the Commissioner, Municipal Corporation, or the Sarpanch, Gram Panchayat.", "title": "Let us write: a formal letter"}, {"type": "table", "headers": ["Paragraph", "What to write", "Useful phrases"], "rows": [["1", "State the purpose and issue", "I would like to bring to your attention… / I am writing to draw your attention towards…"], ["2", "Details and consequences", "The problems that we face are… / …is causing inconvenience as… / As a result… / Consequently…"], ["3", "Suggestions and request for swift action", "Firstly, I would like to suggest… Secondly… / I request you to look into this matter and… / I look forward to your prompt response…"]]}, {"type": "exercise", "id": "u1c3-ex-letter", "title": "Write the complaint letter", "difficulty": "medium", "minutes": 20, "goal": "Draft a formal letter on the damaged road.", "behavior": "Use formal letter format: sender’s address, date, receiver’s address, salutation, subject, body (3 paragraphs), closing and name.", "hints": ["What is the problem?", "What are the consequences?", "What do you want done?"], "checklist": ["Format correct", "Three paragraphs", "Formal language", "Request for action"], "solution": "Sender, date, To: The Commissioner, Municipal Corporation. Subject: Complaint about the damaged road. Respected Sir/Madam, I would like to bring to your attention the poor condition of the kutcha road leading to our colony… The potholes are dangerous and stagnant water breeds mosquitoes. Consequently residents face accidents and illness. Firstly I suggest filling the potholes; secondly, drain the water. I request you to look into this matter. I look forward to your prompt response. Yours faithfully, Name.", "solution_lang": "text", "solution_explain": "Clear, polite, specific.", "mode": "selfcheck"}, {"type": "text", "md": "**Staging a play — 13 steps.** (1) Choose a play; (2) choose director, stage manager, light and sound in-charge, props manager, costume designer, makeup artist; (3) hold auditions; (4) read the script and plan movements; (5) schedule rehearsals; (6) design set and props; (7) prepare costumes; (8) plan makeup and hairstyles; (9) check light and sound; (10) dress rehearsal; (11) promote through posters and pamphlets; (12) organise backstage; (13) present the play. Now present ‘Wisdom Paves the Way’ with correct intonation and stress.", "title": "Let us explore"}, {"type": "quiz", "id": "u1c3-q-stage", "title": "Staging a play", "questions": [{"type": "order", "q": "Order these steps.", "items": ["Choose a play", "Hold auditions", "Plan rehearsal schedule", "Hold dress rehearsal", "Present the play"], "explanation": "Choose → audition → rehearse → dress rehearsal → show.", "hints": ["Start with choosing the play."]}, {"type": "single", "q": "Who handles costumes?", "options": ["costume designer", "stage manager", "props manager"], "answer": 0, "explanation": "The costume designer.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Library task:** read stories about Vikramaditya and Betal, Tenali Rama, Gopal the Jester, and Panchatantra Tales. Two thoughts from the book: Savitribai Phule urged that knowledge be a beacon that clears the darkness of ignorance; Rabindranath Tagore said the highest education makes life harmonious with all existence, not just giving information.", "title": "Stories and quotes"}, {"type": "summary", "points": ["A complaint letter has three clear paragraphs.", "Staging a play needs teamwork and planning.", "Read more wit-and-wisdom stories."]}], "source": {"chapter": "u1c3", "pages": "44-45"}, "id": "c8u1c3-06-write-explore", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-99-test": {"title": "Test: Wisdom Paves the Way", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u1c3-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "The four young men travelled to…", "options": ["Ujjain", "Delhi", "Vijayanagara"], "answer": 0, "explanation": "Ujjain.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The camel was blind in its…", "options": ["left eye", "right eye", "both eyes"], "answer": 1, "explanation": "Right eye.", "hints": ["Think about the text again."]}, {"type": "single", "q": "How did Har Datt know about the short tail?", "options": ["Blood drops from mosquito bites", "Footprints", "He asked the merchant"], "answer": 0, "explanation": "Mosquitoes bit the camel.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "The king punished the four men.", "answer": false, "explanation": "He made them advisers.", "hints": ["Re-read the story."]}, {"type": "fill", "q": "______ is using knowledge with good judgement.", "answer": ["wisdom"], "explanation": "Wisdom.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "deduce → ______ (noun)", "answer": ["deduction"], "explanation": "Deduction.", "hints": ["Look for the exact word."]}, {"type": "single", "q": "‘You must have stolen it’ expresses…", "options": ["logical conclusion", "willingness", "wish"], "answer": 0, "explanation": "Logical conclusion.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘May your wisdom shine’ expresses…", "options": ["wish or hope", "possibility", "command"], "answer": 0, "explanation": "Wish.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘taken aback’ means…", "options": ["surprised", "angry", "happy"], "answer": 0, "explanation": "Surprised.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Which paragraph asks for action in a complaint letter?", "options": ["Paragraph 3", "Paragraph 1", "Neither"], "answer": 0, "explanation": "Paragraph 3.", "hints": ["Think about the text again."]}, {"type": "multi", "q": "Qualities shown by the young men:", "options": ["observant", "careless", "logical", "calm"], "answer": [0, 2, 3], "explanation": "Observant, logical, calm.", "hints": ["Check each option against the text."]}], "mode": "test"}], "kind": "test", "id": "c8u1c3-99-test", "chapter": "c8u1c3"}, "c8u5c1-01-warm-up": {"title": "Before we read: feathered and furry friends", "summary": "Talk about pets and complete space-related words.", "minutes": 10, "blocks": [{"type": "text", "md": "Unit 5 is **Science and Curiosity**. Discuss with a partner: Who can a ‘feathered’ friend be? Which feathered friend do you like? Would you choose a feathered or a furry friend? Could either go to space with astronauts?"}, {"type": "reveal", "prompt": "Model answers", "md": "A feathered friend is a bird: parrot, canary, sparrow, hen. A cat is furry; a canary is feathered and needs little food, which is useful in a small space station. Opinions vary — give a reason with *because*."}, {"type": "quiz", "id": "u5c1-q-vowels", "title": "Insert the missing vowels", "questions": [{"type": "fill", "q": "official rule that controls how something is done: R_G_L_T__N", "answer": ["regulation"], "explanation": "regulation", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "to not allow something: F_RB_D", "answer": ["forbid"], "explanation": "forbid", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "join or blend to form a single entity: F_S_", "answer": ["fuse"], "explanation": "fuse", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "suddenly: _BR_PTLY", "answer": ["abruptly"], "explanation": "abruptly", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "admit one’s mistake: C_NF_SS", "answer": ["confess"], "explanation": "confess", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "a person who advises what to eat to keep healthy: D__T_T__N", "answer": ["dietitian"], "explanation": "dietitian", "hints": ["Look for the exact word."]}]}, {"type": "summary", "points": ["A feathered friend is a bird.", "Learn six new words before reading."]}], "terms": [{"term": "regulation", "def": "an official rule"}, {"term": "abruptly", "def": "suddenly"}, {"term": "dietitian", "def": "a person who advises on healthy eating"}], "source": {"chapter": "u5c1", "pages": "205-206"}, "id": "c8u5c1-01-warm-up", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-02-read-listen": {"title": "Read and listen: Feathered Friend (retold)", "summary": "Follow the story of Sven, Claribel and the failing air alarm.", "minutes": 30, "blocks": [{"type": "text", "md": "*Feathered Friend* is by **Arthur C. Clarke** and is copyrighted. Read it in your textbook (pages 207–211). Here it is told in simple words; press 🔊 Listen on each part.", "title": "About this lesson"}, {"type": "text", "md": "The narrator says no rule ever forbade pets in a space station, and even if one existed, Sven Olsen would have ignored it. Like most early space workers Sven was thin but strong, so he easily met the 150-pound limit that kept many of them on a diet. He was one of the best construction men, skilled at collecting loose girders floating in free fall, moving them into place as in a slow three-dimensional ballet, and fusing them together while wearing an awkward space suit. His team had one advantage over builders on Earth: they could step back and admire their work without gravity pulling them away.", "title": "Part I (1) — Sven and his job"}, {"type": "text", "md": "Nobody knows why Sven wanted a pet, but his choice was sensible. Claribel, a small yellow canary, weighed almost nothing, ate very little, and did not mind having no gravity.", "title": "Part I (2) — The pet"}, {"type": "text", "md": "The narrator first noticed Claribel while checking technical supplies in his tiny office. He heard a musical whistle by his ear and thought it came from the intercom. A long melody followed, and he jerked up so fast that he hit his head on an angle beam. Then he saw a small yellow canary hanging motionless in the air like a hummingbird, but with folded wings. She did a backward loop no earth-bound canary could do and left lazily. She had already learned to move without gravity and did not like doing unnecessary work.", "title": "Part I (3) — Meeting Claribel"}, {"type": "text", "md": "Sven did not admit she was his for several days, by which time she was everyone’s pet. He had smuggled her up on the last ferry from Earth, partly out of scientific curiosity: he wanted to see how a bird behaves when it has no weight but can still use its wings. Claribel grew fat and happy. The crew hid her from visitors from Earth; there were many hiding places, but she got noisy when upset, so they had to explain odd whistles from the ventilation shafts. There were a few narrow escapes — but who would look for a canary on a space station?", "title": "Part I (4) — A secret guest"}, {"type": "quiz", "id": "u5c1-q-p1", "title": "Part I discussion", "questions": [{"type": "single", "q": "Why did Sven sneak a bird aboard, according to him?", "options": ["Out of scientific curiosity to see how a bird behaves with no weight", "To sell her on Earth", "Because he was lonely only", "To win a prize"], "answer": 0, "explanation": "He wanted to see how a bird operates when weightless but with working wings.", "hints": ["Think about the text again."]}, {"type": "single", "q": "What made the narrator think the whistle came from the intercom?", "options": ["It sounded musical, right beside his ear, like a announcement signal", "He saw a speaker", "It was loud", "Sven told him"], "answer": 0, "explanation": "He assumed it was a station announcement.", "hints": ["Think about the text again."]}, {"type": "single", "q": "How did Claribel adjust?", "options": ["She learned zero-gravity moves, did loops and thrived", "She stayed in the cage", "She refused food", "She slept all day"], "answer": 0, "explanation": "She quickly mastered flying without gravity.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Would a hidden canary cause trouble? (opinion)", "options": ["Possibly — noise could reveal her", "No trouble at all"], "answer": 0, "explanation": "Either answer can work. A reasonable view: it could cause trouble if officials found out, but the crew hid her skilfully.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "The station works in twelve-hour watches. One ‘morning’ the narrator woke with a nagging headache and dream-filled sleep and found breakfast unusually quiet with one empty seat. Sven came in, said Claribel was missing, and opened his hand: a tiny yellow bundle with claws stuck up. Jock Duncan, the cook-doctor-dietitian, listened for a heartbeat but heard nothing and cautiously said that did not prove she was dead. Someone suggested oxygen from the green emergency cylinder, and Claribel was put in a face mask. She revived immediately, hopped on Sven’s finger, trilled happily — and then keeled over again.", "title": "Part II (1) — Claribel collapses"}, {"type": "text", "md": "The narrator felt slow, as if still half asleep. Suddenly he remembered that miners used to carry canaries underground to warn them of gas. He told the duty engineer Jim there was something wrong with the air. Jim said that was nonsense, as there were duplicate alarm circuits working independently. His assistant mumbled that the second circuit wasn’t connected yet. That shook Jim and he hurried away while the crew argued and passed the oxygen bottle around like a pipe of peace.", "title": "Part II (2) — The warning"}, {"type": "text", "md": "Ten minutes later Jim returned looking sheepish. During a rare eclipse by Earth’s shadow that night, part of the air purifier had frozen and the single alarm had failed. Half a million dollars’ worth of equipment had let them down. The narrator says that without Claribel they would soon have been ‘slightly dead’. So if you hear a bit of birdsong on a space station, you are being doubly safeguarded at almost no extra cost.", "title": "Part II (3) — The reason"}, {"type": "flashcards", "id": "u5c1-cards", "title": "Words from the story", "cards": [{"front": "wiry", "back": "thin but strong"}, {"front": "assorted", "back": "of various types mixed together"}, {"front": "girders", "back": "long thick pieces of steel that support a structure"}, {"front": "precisely", "back": "exactly"}, {"front": "dovetailed", "back": "fitted together"}, {"front": "garbs", "back": "clothing of a special kind"}, {"front": "handiwork", "back": "creation"}, {"front": "abruptly", "back": "suddenly"}, {"front": "aboard", "back": "on a ship, aircraft or space station"}, {"front": "cubbyhole", "back": "a small enclosed room"}, {"front": "ceased", "back": "stopped"}, {"front": "canary", "back": "a small yellow pet bird"}, {"front": "wits", "back": "ability to think quickly"}, {"front": "flicks", "back": "quick light movements"}, {"front": "concealing", "back": "hiding"}, {"front": "ventilating shafts", "back": "ducts that let air in"}, {"front": "bulkheads", "back": "dividing walls"}, {"front": "nagging", "back": "persistently painful"}, {"front": "snugly", "back": "cosily"}, {"front": "keeled", "back": "collapsed or fainted"}, {"front": "sluggish", "back": "inactive"}, {"front": "retort", "back": "answer"}, {"front": "clenched", "back": "pressed tightly"}, {"front": "hushed", "back": "quiet"}, {"front": "sheepish", "back": "embarrassed"}, {"front": "inexplicable", "back": "unexplainable"}, {"front": "safeguarded", "back": "protected"}]}, {"type": "quiz", "id": "u5c1-q-tf", "title": "True or false (parts I and II)", "questions": [{"type": "truefalse", "q": "The second alarm circuit wasn’t connected, and the working alarm also failed.", "answer": true, "explanation": "The assistant says the second circuit wasn’t connected, and the single alarm failed because of the frozen purifier.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Claribel was brought for an official experiment.", "answer": false, "explanation": "Sven smuggled her.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "The canary’s collapse helped the crew find the air purifier problem.", "answer": true, "explanation": "Her fainting warned them.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "The air purifier froze because of an eclipse by Earth’s shadow.", "answer": true, "explanation": "A rare eclipse.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Claribel could do loops in the air.", "answer": true, "explanation": "A backward loop.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "The crew ignored Claribel.", "answer": false, "explanation": "She was everyone’s pet.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Claribel fainted and was revived with oxygen.", "answer": true, "explanation": "Yes — twice.", "hints": ["Re-read the story."]}]}, {"type": "summary", "points": ["Sven smuggled a canary aboard out of curiosity.", "Claribel’s fainting warned the crew of an air problem.", "The alarm failed because the purifier froze during an eclipse."]}], "source": {"chapter": "u5c1", "pages": "207-211"}, "id": "c8u5c1-02-read-listen", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-03-reflect": {"title": "Let us think and reflect", "summary": "Study extracts and answer long questions.", "minutes": 30, "blocks": [{"type": "text", "md": "**Extract 1** is about Sven’s job (collecting girders in free fall, a slow three-dimensional ballet, working in a space suit).", "title": "Extract 1"}, {"type": "quiz", "id": "u5c1-q-e1", "title": "Extract 1", "questions": [{"type": "single", "q": "(i) What can be inferred about Sven’s abilities?", "options": ["He lacks creativity", "He has a strong understanding of working in space", "He struggles with construction", "He prefers simple tasks"], "answer": 1, "explanation": "He does skilled, difficult work: B.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iii) (A) Sven’s job required girders to perform a ‘three-dimensional ballet’. (R) In zero gravity objects float, making precise positioning harder.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 0, "explanation": "A is a description of the job; R explains why it needs such skill.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "(iv) Replace ‘outfits’: During the festival people wore colourful ______ that represented their culture. (one word from the extract)", "answer": ["garbs"], "explanation": "*Garbs* = clothing of a special kind.", "hints": ["Look for the exact word."]}]}, {"type": "reveal", "prompt": "(ii) How can we conclude Sven was working in zero gravity?", "md": "Girders ‘float around in free fall’, move in slow motion, and builders can step back without being pulled away by gravity."}, {"type": "text", "md": "**Extract 2**: ‘Jim! There’s something wrong with the air! That’s why Claribel’s passed out. I’ve just remembered miners used to carry canaries down to warn them of gas.’ — ‘Nonsense! The alarms would have gone off. We’ve got duplicate circuits.’ — ‘The second alarm circuit isn’t connected up yet.’ That shook Jim… passing the oxygen bottle around like a pipe of peace.", "title": "Extract 2"}, {"type": "quiz", "id": "u5c1-q-e2", "title": "Extract 2", "questions": [{"type": "fill", "q": "(i) The narrator mentions canaries and miners to ______. (highlight the historical use of canaries as warning systems / explain the reason that caused Claribel to faint suddenly)", "answer": ["highlight the historical use of canaries as warning systems"], "explanation": "He links Claribel to the old use of canaries as gas detectors.", "hints": ["Look for the exact word."]}, {"type": "single", "q": "(iii) ‘shook Jim’ means he was…", "options": ["physically pushed", "startled by unexpected information", "cold", "shaking off sleep"], "answer": 1, "explanation": "B: startled.", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "(ii) Why does Jim dismiss the warning? (iv) What does passing the oxygen bottle ‘like a pipe of peace’ suggest?", "md": "(ii) He believes duplicate, independent alarms would have gone off.\n\n(iv) The crew shares the bottle calmly, like friends smoking a peace pipe: tension is eased, they stay together and cooperate while the danger is checked."}, {"type": "text", "md": "Answer the long questions.", "title": "Part II"}, {"type": "reveal", "prompt": "1. What was the purpose of the alarm? What caused its failure?", "md": "The alarm was meant to warn of dangerous air. It failed because the air purifier froze during an eclipse by Earth’s shadow and the single working alarm circuit failed; the second one was not connected yet."}, {"type": "reveal", "prompt": "2. How does the crew’s reaction to Claribel change?", "md": "First she is a hidden surprise guest and a general pet; at the end she is a hero who saved their lives."}, {"type": "reveal", "prompt": "3. What does the end tell about unusual ways of problem solving?", "md": "Simple, unexpected ideas can succeed where expensive technology fails; a living creature warned them."}, {"type": "reveal", "prompt": "4. Justify the title.", "md": "Claribel is a feathered friend — a bird, and a friend who saves the crew."}, {"type": "reveal", "prompt": "5. ‘Without Claribel, we should soon have been slightly dead.’ What does this suggest about uncertainty of life in space?", "md": "Space is dangerous; even tiny faults can be fatal, and safety depends on luck and many safeguards."}, {"type": "reveal", "prompt": "6. How is science fiction presented with humour?", "md": "Through understatement (‘slightly dead’), playful phrases like ‘pipe of peace’, and funny situations like hiding a canary and an engineer’s sheepish face."}, {"type": "reveal", "prompt": "7. How would Sven reflect on almost losing Claribel and saving the crew?", "md": "He would feel relief and pride, and thankful that his secret act of curiosity turned into a life-saving one; he would never regret bringing her."}, {"type": "summary", "points": ["Extracts show Sven’s skill and the crew’s reaction.", "The canary reference links the past to the future.", "The story mixes science and humour."]}], "source": {"chapter": "u5c1", "pages": "212-213"}, "id": "c8u5c1-03-reflect", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-04-learn": {"title": "Let us learn: adjectives, merged words and the future", "summary": "Match adjectives, build merged words and use future forms.", "minutes": 30, "blocks": [{"type": "text", "md": "In this lesson you will match adjectives with nouns, form merged words and use different ways to talk about the future.", "title": "Goal"}, {"type": "quiz", "id": "u5c1-q-adj", "title": "Choose the adjective", "questions": [{"type": "single", "q": "______ path", "options": ["narrow", "vague", "delighted"], "answer": 0, "explanation": "A narrow path.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ worry", "options": ["nagging", "sluggish", "hushed"], "answer": 0, "explanation": "A nagging worry.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ plan", "options": ["vague", "sheepish", "narrow"], "answer": 0, "explanation": "A vague plan.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ look", "options": ["delighted", "nagging", "hushed"], "answer": 0, "explanation": "A delighted look.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ reason", "options": ["inexplicable", "sluggish", "narrow"], "answer": 0, "explanation": "An inexplicable reason.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ traffic", "options": ["sluggish", "vague", "hushed"], "answer": 0, "explanation": "Sluggish traffic.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ voices", "options": ["hushed", "narrow", "delighted"], "answer": 0, "explanation": "Hushed voices.", "hints": ["Think about the text again."]}, {"type": "single", "q": "______ expression", "options": ["sheepish", "nagging", "vague"], "answer": 0, "explanation": "A sheepish expression.", "hints": ["Think about the text again."]}], "intro": "Box: nagging, vague, delighted, narrow, sluggish, hushed, inexplicable, sheepish"}, {"type": "text", "md": "A **merged word** (blend) combines parts of two words: *intercom* = internal + communication; *brunch* = breakfast + lunch.", "title": "Merged words"}, {"type": "table", "headers": ["Column 1", "Column 2", "Merged word", "Meaning"], "rows": [["breakfast", "lunch", "brunch", "a meal between breakfast and lunch"], ["motor", "hotel", "motel", "a hotel for people travelling by car"], ["smoke", "fog", "smog", "smoky fog in the air"], ["situation", "comedy", "sitcom", "a funny TV series about a situation"], ["video", "log", "vlog", "a video blog"], ["spoon", "fork", "spork", "a spoon with fork prongs"], ["web", "seminar", "webinar", "a seminar held on the internet"]]}, {"type": "quiz", "id": "u5c1-q-merge", "title": "Merged words", "questions": [{"type": "fill", "q": "smoke + fog = ______", "answer": ["smog"], "explanation": "smog", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "web + seminar = ______", "answer": ["webinar"], "explanation": "webinar", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "motor + hotel = ______", "answer": ["motel"], "explanation": "motel", "hints": ["Look for the exact word."]}]}, {"type": "text", "md": "**Talking about the future.** In *It will mean that you’re being doubly safeguarded*, ‘will’ shows **future** time.", "title": "Future time"}, {"type": "table", "headers": ["Form", "Use", "Example"], "rows": [["will", "information, predictions, offers, promises", "I think the Kailash House will win."], ["simple present", "timetable or fixed schedule", "My school reopens on 3 January."], ["present progressive", "personal arrangements", "I am visiting my grandparents."], ["going to", "informal plans", "We’re going to get a new motorbike."], ["future perfect (will have + past participle)", "finished by a future time", "She will have completed the portions by next month."], ["future progressive (will be + -ing)", "in progress at a future moment", "This time tomorrow I will be relaxing at home."], ["future in the past", "future seen from the past", "I was leaving for Chennai in an hour."]]}, {"type": "quiz", "id": "u5c1-q-fut", "title": "Future forms", "questions": [{"type": "fill", "q": "Our flight ______ (leave) at 10.00 a.m. tomorrow.", "answer": ["leaves"], "explanation": "Timetable → simple present.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "They ______ (finish) the project by the end of this week. (will + verb)", "answer": ["will finish"], "explanation": "Prediction.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "The weather forecast says it ______ (rain) later today.", "answer": ["will rain", "is going to rain"], "explanation": "Prediction.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "We ______ (move) into our new house next month.", "answer": ["are moving"], "explanation": "Fixed arrangement.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "I ______ (start) my new hobby class next Monday.", "answer": ["am starting", "start"], "explanation": "Arrangement.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "She ______ (go) to the mall this afternoon.", "answer": ["is going", "is going to go"], "explanation": "Plan.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "The team ______ (have) a meeting at 3.00 p.m. tomorrow.", "answer": ["has"], "explanation": "Scheduled → simple present.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "I ______ (help) you with your homework after dinner.", "answer": ["will help"], "explanation": "Promise.", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u5c1-q-fut2", "title": "AI in the future", "questions": [{"type": "fill", "q": "By 2040, AI ______ (revolutionise) medical treatments.", "answer": ["will have revolutionised", "will revolutionise"], "explanation": "Future perfect or will.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Researchers ______ (develop) AI-powered diagnostic tools.", "answer": ["will develop", "are developing"], "explanation": "Future.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "tools that ______ (transform) healthcare by the end of this decade.", "answer": ["will transform", "will have transformed"], "explanation": "Future.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Next week the Science Congress ______ (open).", "answer": ["opens"], "explanation": "Scheduled.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "In the coming years robots ______ (assist) surgeons.", "answer": ["will assist", "will be assisting"], "explanation": "Future.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "now … this ______ (be) our new reality.", "answer": ["is"], "explanation": "Present.", "hints": ["Look for the exact word."]}]}, {"type": "summary", "points": ["Adjectives describe nouns precisely.", "Merged words blend two words.", "English has many ways to talk about the future."]}], "source": {"chapter": "u5c1", "pages": "214-217"}, "id": "c8u5c1-04-learn", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-05-listen-speak": {"title": "Let us listen and speak", "summary": "Listen to Monika and Toby, practise silent letters and advice phrases.", "minutes": 25, "blocks": [{"type": "text", "md": "Toby is a Martian stranded on Earth and Monika’s friend. Press **🎧 Play audio**. Then mark true or false.", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 Monika and Toby (listen first)", "md": "Monika asks Toby whether he misses his planet. Toby says he misses his people and his home very much. Monika says she is happy to have him as a friend. She asks what he eats for breakfast, and Toby says Martians do not need to eat anything; they get their energy from the Sun. Monika asks whether he never wants ice creams and chocolates. Toby says no, because Martians are made of different stuff. Monika then asks how he can see with only one eye in the centre of his face. Toby says Martians need only one eye. He can see even with the eye closed. He can see beyond mountains and clouds, wood and even metals. He sees the toy aeroplane in her pocket and tells her that the apple she had for breakfast is going round and round in her stomach. Monika gasps in disbelief.", "listen": true}, {"type": "quiz", "id": "u5c1-q-tf2", "title": "True or false", "questions": [{"type": "truefalse", "q": "Toby misses his school.", "answer": false, "explanation": "He misses his people and home.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Monika accepts Toby as her friend.", "answer": true, "explanation": "She is happy to have him as a friend.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Monika asks Toby about one of his facial features.", "answer": true, "explanation": "His single eye.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Toby tells Monika she had a banana for breakfast.", "answer": false, "explanation": "An apple.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "Toby can see much clearer with a closed eye.", "answer": false, "explanation": "He can see *even* with his eye closed.", "hints": ["Re-read the story."]}, {"type": "fill", "q": "I miss my ______ and home.", "answer": ["people"], "explanation": "people", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "we ______ don’t need to eat. We get our ______ from the Sun. (first)", "answer": ["martians"], "explanation": "Martians", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "ice creams and ______!", "answer": ["chocolates", "chocolate"], "explanation": "chocolates", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "How can you see with only ______ eye?", "answer": ["one"], "explanation": "one", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "I can see beyond mountains and ______, woods and even metals.", "answer": ["clouds"], "explanation": "clouds", "hints": ["Look for the exact word."]}]}, {"type": "text", "md": "**Silent letters** are written but not pronounced: *ballet* (t), *whistle* (t), *alarm*, *psychologist* (p). More: *receipt* (p), *debris* (s), *pneumonia* (p), *almond* (l), *foreign* (g), *island* (s), *wreck* (w), *aisle* (s), *campaign* (g), *fasten* (t).", "title": "Let us speak — silent letters"}, {"type": "quiz", "id": "u5c1-q-silent", "title": "Which letter is silent?", "questions": [{"type": "single", "q": "receipt", "options": ["p", "c", "t"], "answer": 0, "explanation": "The p is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "island", "options": ["s", "l", "d"], "answer": 0, "explanation": "The s is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "wreck", "options": ["w", "r", "c"], "answer": 0, "explanation": "The w is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "campaign", "options": ["g", "m", "p"], "answer": 0, "explanation": "The g is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "fasten", "options": ["t", "s", "n"], "answer": 0, "explanation": "The t is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "pneumonia", "options": ["p", "n", "m"], "answer": 0, "explanation": "The p is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "almond", "options": ["l", "m", "d"], "answer": 0, "explanation": "The l is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "foreign", "options": ["g", "r", "n"], "answer": 0, "explanation": "The g is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "debris", "options": ["s", "d", "b"], "answer": 0, "explanation": "The s is silent.", "hints": ["Think about the text again."]}, {"type": "single", "q": "aisle", "options": ["s", "a", "l"], "answer": 0, "explanation": "The s is silent.", "hints": ["Think about the text again."]}]}, {"type": "table", "headers": ["Asking for advice", "Giving advice"], "rows": [["What should I do…?", "I feel you should…"], ["How can I…?", "You should ensure…"], ["What are the best ways…?", "It’s good to prepare yourself…"], ["How can I make sure…?", "If you have an issue…, try…"], ["What should I…?", "It is best to use…"]]}, {"type": "exercise", "id": "u5c1-ex-advice", "title": "Pair role-play: asking for advice", "difficulty": "easy", "minutes": 15, "goal": "Practise asking for and giving advice.", "behavior": "(1) You need to make a model of the solar system for the Science Exhibition but don’t know the materials. (2) You need to prepare for a quiz on Chandrayaan-3. Ask your friend for advice.", "hints": ["Ask clearly.", "Give two pieces of advice.", "Say thank you."], "checklist": ["Used a phrase for asking advice", "Friend used phrases for giving advice", "Natural conversation"], "solution": "— What should I do for my solar-system model? — I feel you should use thermocol balls and paint them. It is best to use wire to hold them.\n— How can I prepare for the Chandrayaan-3 quiz? — You should read about the mission and note key dates. It’s good to prepare yourself with flashcards.", "solution_lang": "text", "solution_explain": "Use the phrases from the table.", "mode": "selfcheck"}, {"type": "text", "md": "**Speak:** If you could travel to space, which planet would you visit? Why? What would you prepare, and which five things would you take? And: If you could invent something, what would you invent and why? Speak for one minute on each.", "title": "Speaking tasks"}, {"type": "summary", "points": ["Listening for specific words gets accurate answers.", "Silent letters are written but not pronounced.", "Use phrases to ask for and give advice."]}], "source": {"chapter": "u5c1", "pages": "217-218, 249"}, "id": "c8u5c1-05-listen-speak", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-06-write-explore": {"title": "Let us write and explore", "summary": "Write a conversation and an article, and explore bird and space facts.", "minutes": 35, "blocks": [{"type": "text", "md": "In a written **conversation** you show who is speaking, where and when; choose formal or informal tone; include agreement and disagreement; use brackets for emotions or actions, e.g. *(hesitatingly)*; fillers like *Uff*, *Er…* are allowed.", "title": "Let us write — conversation"}, {"type": "exercise", "id": "u5c1-ex-conv", "title": "Deepa and Asma’s science fair model", "difficulty": "medium", "minutes": 15, "goal": "Write a conversation between two Science Club members who decide on a model for the fair.", "behavior": "Begin: Deepa: Hi Asma! … Asma: (hesitatingly) Yes, I do. But I’m not sure… Deepa: (encouragingly) Don’t worry…", "hints": ["Who speaks first?", "Add a worry.", "Settle it together."], "checklist": ["Setting/people clear", "Tone fits friends", "Contains agreement and disagreement", "Brackets for emotions", "Ends with a decision"], "solution": "Deepa: Hi Asma! Our teacher said you have a wonderful idea. Asma: (hesitatingly) Yes… I want to make a working model of a water purifier. Deepa: (encouragingly) That’s brilliant! Asma: Er… but it may be expensive. Deepa: (thinking) We can use bottles and charcoal. Asma: (smiling) Then let’s do it!", "solution_lang": "text", "solution_explain": "Natural speech, short lines, emotions in brackets.", "mode": "selfcheck"}, {"type": "text", "md": "Complete the social media web with uses of the internet — for example: music, videos, maps and navigation, social networking (Facebook, X), email, online profiles, shopping, learning, news. Then write the article **‘The Importance of Internet’**: title, writer’s name; paragraph 1 introduction; paragraph 2 uses and why it is important with examples; paragraph 3 a comment or a thoughtful idea or quote.", "title": "Let us write — article"}, {"type": "exercise", "id": "u5c1-ex-article", "title": "Write: The Importance of Internet", "difficulty": "medium", "minutes": 20, "goal": "Write a three-paragraph article.", "behavior": "Use the points above.", "hints": ["List the uses first.", "Add one example each.", "End with a quote or advice."], "checklist": ["Title and name", "Introduction", "Uses with examples", "Thoughtful ending"], "solution": "The Importance of Internet — By Meera. The internet connects the world in seconds… It helps us learn, send email, find maps, watch videos and stay in touch… Used wisely, it is the greatest library ever built.", "solution_lang": "text", "solution_explain": "Intro → body with examples → ending thought.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** (I) ‘A canary in the coal mine’ means an early warning. Miners (for example in Arunachal Pradesh) used canaries to detect carbon monoxide, because the birds are sensitive to it and could prevent accidents.\n\n(II) Astronauts adapt routines: a **Space Pen** with pressurised ink and resin works in all positions and extreme conditions; they exercise with resistance equipment and strapped-down treadmills; they eat dried, canned, vacuum-packed and frozen foods; they sleep in sleeping bags or compartments so they do not float away.\n\n(III) Animals can sense calamities: before the 2004 tsunami elephants ran for higher ground and flamingos left nesting areas; before the Naples quake of 1805 oxen, sheep, dogs and geese made alarm calls; migratory birds avoid storms; sharks swim deeper before hurricanes. Scientists think ultra-low frequency electromagnetic waves before earthquakes are sensed by animals.\n\n(IV) **Salim Ali**, the ‘Birdman of India’, was the first Indian to conduct systematic bird surveys and wrote many books; Padma Bhushan 1958, Padma Vibhushan 1976.\n\n(V) Make a bird feeder in groups with cardboard and chart paper, following the four designs in your book.", "title": "Let us explore"}, {"type": "quiz", "id": "u5c1-q-explore", "title": "Explore check", "questions": [{"type": "single", "q": "What does ‘a canary in the coal mine’ mean?", "options": ["an early warning of danger", "a pet", "a mining tool"], "answer": 0, "explanation": "Early warning.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Salim Ali is known as…", "options": ["Birdman of India", "Rocket Man", "Missile Man"], "answer": 0, "explanation": "Birdman.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Why do astronauts sleep in sleeping bags?", "options": ["to avoid floating away", "to keep warm only", "for fun"], "answer": 0, "explanation": "There is no up or down.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["A conversation shows tone, emotions and ideas.", "An article has title, three paragraphs and a thought.", "Birds and animals can warn us of danger."]}], "source": {"chapter": "u5c1", "pages": "219-221"}, "id": "c8u5c1-06-write-explore", "chapter": "c8u5c1", "kind": "lesson"}, "c8u5c1-99-test": {"title": "Test: Feathered Friend", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u5c1-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "The story is by…", "options": ["Arthur C. Clarke", "R.K. Narayan", "Ruskin Bond"], "answer": 0, "explanation": "Clarke.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Claribel is a…", "options": ["canary", "parrot", "sparrow"], "answer": 0, "explanation": "Canary.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The air alarm failed because…", "options": ["the purifier froze during an eclipse", "a crew member switched it off", "it was old"], "answer": 0, "explanation": "The purifier froze.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "Sven brought Claribel for an official experiment.", "answer": false, "explanation": "He smuggled her.", "hints": ["Re-read the story."]}, {"type": "single", "q": "‘Pipe of peace’ suggests…", "options": ["calm sharing while tension eased", "war", "a party"], "answer": 0, "explanation": "Calming.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "smoke + fog = ______", "answer": ["smog"], "explanation": "smog", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "breakfast + lunch = ______", "answer": ["brunch"], "explanation": "brunch", "hints": ["Look for the exact word."]}, {"type": "single", "q": "‘Our flight leaves at 10 a.m.’ uses…", "options": ["simple present for a schedule", "going to", "will have"], "answer": 0, "explanation": "Timetable.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Which has a silent letter?", "options": ["island", "table", "cat"], "answer": 0, "explanation": "Silent s.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘Without Claribel, we should soon have been slightly dead’ is an example of…", "options": ["humour through understatement", "anger", "fear"], "answer": 0, "explanation": "Humour.", "hints": ["Think about the text again."]}, {"type": "multi", "q": "Choose adjectives from the story:", "options": ["sheepish", "sluggish", "hushed", "thunder"], "answer": [0, 1, 2], "explanation": "Thunder is a noun.", "hints": ["Check each option against the text."]}], "mode": "test"}], "kind": "test", "id": "c8u5c1-99-test", "chapter": "c8u5c1"}, "c8u5c2-01-warm-up": {"title": "Before we read: seeing close up", "summary": "Look at people using magnifying glasses and talk about your own.", "minutes": 10, "blocks": [{"type": "text", "md": "The book shows pictures of people using magnifying glasses — a detective following footprints, a man studying a leaf, a girl looking at tiny things on the ground, a scientist looking at an insect and a man examining a hand."}, {"type": "quiz", "id": "u5c2-q-warm", "title": "Think and answer", "questions": [{"type": "single", "q": "What is common in all the pictures?", "options": ["People look closely at small things with a magnifying glass", "They are all in a park", "They are all alone"], "answer": 0, "explanation": "All of them use a magnifying glass to see tiny details.", "hints": ["What tool does everyone hold?"]}, {"type": "single", "q": "Why do people need a magnifying glass?", "options": ["To see tiny details clearly", "To make things heavier", "To hear better"], "answer": 0, "explanation": "It makes small things look bigger.", "hints": ["Think about the text again."]}, {"type": "multi", "q": "Which instruments also magnify objects?", "options": ["microscope", "telescope", "binoculars", "thermometer"], "answer": [0, 1, 2], "explanation": "Microscopes, telescopes and binoculars magnify; a thermometer measures temperature.", "hints": ["Check each option against the text."]}]}, {"type": "reveal", "prompt": "If you had a magnifying glass, what would you use it for?", "md": "Possible answers: to study insects, leaves, fingerprints, a coin, or the tiny hairs on a plant — because you would discover details your eyes miss. Give your own reason."}, {"type": "summary", "points": ["A magnifying glass makes small things look larger.", "Microscopes and telescopes also magnify."]}], "source": {"chapter": "u5c2", "pages": "222"}, "id": "c8u5c2-01-warm-up", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-02-read-listen": {"title": "Read and listen: the poem", "summary": "Understand each stanza of the poem.", "minutes": 15, "blocks": [{"type": "text", "md": "*Magnifying Glass* is by **Walter de la Mare** and is copyrighted. Read the poem in your textbook (pages 222–223). Below it is explained in simple words with 🔊 Listen.", "title": "About this lesson"}, {"type": "text", "md": "**Stanzas 1–2.** With a round glass, the speaker says he can make ‘magic talk’. A tiny bit of chalk shows countless shells. An inch of moss becomes a forest of flowers and trees. A drop of water looks like a hive of bees.", "title": "Stanzas 1 and 2"}, {"type": "text", "md": "**Stanzas 3–4.** The speaker waits and watches a clever spider spin its web-silk from its spinnerets. He notices the spider’s tiger-like claws and says the silly flies stumble into the net even with all those eyes.", "title": "Stanzas 3 and 4"}, {"type": "text", "md": "**Stanzas 5–6.** Not even the tiniest thing escapes: the glass makes it more marvellous, and even surpasses itself. With lenses like it, looking at the moon, it would seem you could walk there in an afternoon.", "title": "Stanzas 5 and 6"}, {"type": "quiz", "id": "u5c2-q-read", "title": "Poem check", "questions": [{"type": "single", "q": "What does the speaker see in a scrap of chalk?", "options": ["many shells", "a forest", "bees"], "answer": 0, "explanation": "A myriad shells.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A drop of water seems like…", "options": ["a hive of bees", "a forest", "a spider’s web"], "answer": 0, "explanation": "A hive of bees.", "hints": ["Think about the text again."]}, {"type": "single", "q": "What does the speaker watch the spider do?", "options": ["spin web-silk", "hunt a bird", "jump high"], "answer": 0, "explanation": "Spin web-silk.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["A magnifying glass reveals hidden wonders.", "The poem moves from tiny objects to the moon."]}], "source": {"chapter": "u5c2", "pages": "222-223"}, "id": "c8u5c2-02-read-listen", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-03-discuss": {"title": "Let us discuss, think and reflect", "summary": "Summaries, devices, imagery and answers.", "minutes": 30, "blocks": [{"type": "quiz", "id": "u5c2-q-sum", "title": "Complete the summary with words from the poem", "questions": [{"type": "fill", "q": "seeing the world through a ______", "answer": ["glass", "magnifying glass"], "explanation": "round glass", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "tiny things like ______ and chalk (one word)", "answer": ["shells", "moss"], "explanation": "shells or moss", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "and ______ (another)", "answer": ["moss", "shells"], "explanation": "moss", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "a ______ of water", "answer": ["drop"], "explanation": "drop", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "like a hive of ______", "answer": ["bees"], "explanation": "bees", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "the spider spins its ______", "answer": ["web-silk", "web silk", "silk"], "explanation": "web-silk", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "from its ______", "answer": ["spinnerets"], "explanation": "spinnerets", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "the ______ could seem within reach", "answer": ["moon"], "explanation": "moon", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u5c2-q-mc", "title": "Choose the correct answer", "questions": [{"type": "single", "q": "The main idea is the transformative power of…", "options": ["wonders in nature", "close observation"], "answer": 1, "explanation": "Close observation through the glass.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The tone is…", "options": ["wonder and curiosity", "peaceful and emotional"], "answer": 0, "explanation": "Wonder and curiosity.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The poem has ___ stanzas with ___ lines each, so it is a quatrain.", "options": ["four; six", "six; four"], "answer": 1, "explanation": "Six stanzas of four lines.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The rhyme scheme is…", "options": ["ABCD", "ABCB"], "answer": 1, "explanation": "Lines 2 and 4 rhyme: talk/chalk, trees/bees.", "hints": ["Think about the text again."]}]}, {"type": "quiz", "id": "u5c2-q-dev", "title": "Poetic devices", "questions": [{"type": "single", "q": "Simile", "options": ["A drop of water like hive of bees", "With this round glass", "I lie in wait"], "answer": 0, "explanation": "A simile uses *like* or *as*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Alliteration", "options": ["woven web-silk", "tiniest thing", "scrap of chalk"], "answer": 0, "explanation": "Repeated w sound (also ‘lie in wait and watch’).", "hints": ["Think about the text again."]}, {"type": "single", "q": "Metaphor (calls one thing another)", "options": ["Of but an inch of moss a forest", "The tigerish claws he has!", "Eyeing the moon"], "answer": 0, "explanation": "Moss is described as a forest.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘Magic talk’ is…", "options": ["personification", "simile", "alliteration"], "answer": 0, "explanation": "The glass is given a human ability (talk).", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Imagery and reasons.** (IV-1) ‘A myriad shells show in a scrap of chalk’ — the glass reveals tiny hidden shells. (IV-2) ‘A forest—flowers and trees’ — nature’s hidden richness in small things. (V-1) Exclamation marks show wonder and excitement. (V-2) ‘Magic talk’ is personification because it makes the glass seem alive and powerful. (V-3) The repeating pattern supports the theme of close observation, as the speaker reveals hidden wonders in ordinary things. (V-4) The shift to the moon shows imagination and wonder reaching beyond the earth.", "title": "Answers to imagery and reasoning"}, {"type": "quiz", "id": "u5c2-q-ext", "title": "Extract questions (first two stanzas)", "questions": [{"type": "truefalse", "q": "The poet uses magical powers to make the glass powerful.", "answer": false, "explanation": "He uses a real glass; ‘magic’ is figurative.", "hints": ["Re-read the story."]}, {"type": "single", "q": "The line that expresses intricate patterns in ordinary objects:", "options": ["A myriad shells show in a scrap of chalk", "With this round glass", "A drop of water"], "answer": 0, "explanation": "Myriad shells in a bit of chalk.", "hints": ["Think about the text again."]}, {"type": "single", "q": "How does the poet feel about the glass revealing hidden wonders?", "options": ["Satisfied", "Fascinated", "Grateful", "Determined"], "answer": 1, "explanation": "Fascinated (B).", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "What does comparing an inch of moss to a forest suggest?", "md": "Through the glass the speaker sees small things as grand worlds; ordinary things hide great wonders."}, {"type": "text", "md": "Long questions.", "title": "Answer the following"}, {"type": "reveal", "prompt": "1. Significance of the spider", "md": "It shows nature’s skill and drama up close — the web-spinning, claws and trapped flies — all visible through the glass."}, {"type": "reveal", "prompt": "2. How might the view of nature change without the glass?", "md": "The speaker would see only ordinary, small things and miss hidden beauty and detail."}, {"type": "reveal", "prompt": "3. Why does the poem end with the moon within reach?", "md": "Lenses (like telescopes) bring far objects near; it shows imagination and curiosity going beyond the small to the huge."}, {"type": "reveal", "prompt": "4. The speaker’s attitude", "md": "Curious, amazed, respectful of nature; he values careful observation."}, {"type": "reveal", "prompt": "5. Your favourite part", "md": "Your own opinion with a reason, e.g. ‘The spider stanza, because it feels like watching a tiny adventure.’"}, {"type": "summary", "points": ["Simile, metaphor, alliteration and personification appear in the poem.", "The theme is close observation.", "The tone is wonder and curiosity."]}], "source": {"chapter": "u5c2", "pages": "223-225"}, "id": "c8u5c2-03-discuss", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-04-learn": {"title": "Let us learn: vocabulary, collective nouns, idioms and -ish", "summary": "Use poem words, collective nouns, eye idioms and the suffix -ish.", "minutes": 25, "blocks": [{"type": "text", "md": "Fill the blanks with: woven, myriad, deft, stumble, surpass, marvellous.", "title": "Goal and words"}, {"type": "quiz", "id": "u5c2-q-vocab", "title": "Fill the blanks", "questions": [{"type": "fill", "q": "With his ______ description…", "answer": ["deft"], "explanation": "deft = skilful.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "written beautifully ______ with fascinating details", "answer": ["woven"], "explanation": "woven", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "the ______ storytelling technique", "answer": ["marvellous"], "explanation": "marvellous", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "describing the ______ emotions and feelings", "answer": ["myriad"], "explanation": "myriad = countless", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "The reader will ______ upon unexpected twists", "answer": ["stumble"], "explanation": "stumble upon = find by chance", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "twists that ______ all our understanding", "answer": ["surpass"], "explanation": "surpass = go beyond", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u5c2-q-coll", "title": "Collective nouns", "questions": [{"type": "single", "q": "a swarm of…", "options": ["locusts", "ships", "trees"], "answer": 0, "explanation": "locusts", "hints": ["Think about the text again."]}, {"type": "single", "q": "a constellation of…", "options": ["stars", "dancers", "soldiers"], "answer": 0, "explanation": "stars", "hints": ["Think about the text again."]}, {"type": "single", "q": "a grove of…", "options": ["trees", "ships", "stars"], "answer": 0, "explanation": "trees", "hints": ["Think about the text again."]}, {"type": "single", "q": "a troupe of…", "options": ["dancers", "locusts", "soldiers"], "answer": 0, "explanation": "dancers", "hints": ["Think about the text again."]}, {"type": "single", "q": "a battalion of…", "options": ["soldiers", "trees", "ships"], "answer": 0, "explanation": "soldiers", "hints": ["Think about the text again."]}, {"type": "single", "q": "a fleet of…", "options": ["ships", "locusts", "stars"], "answer": 0, "explanation": "ships", "hints": ["Think about the text again."]}]}, {"type": "quiz", "id": "u5c2-q-idiom", "title": "Eye idioms", "questions": [{"type": "single", "q": "apple of one’s eye", "options": ["a person who is very precious", "watch closely"], "answer": 0, "explanation": "A beloved person.", "hints": ["Think about the text again."]}, {"type": "single", "q": "in the blink of an eye", "options": ["very quickly", "slowly"], "answer": 0, "explanation": "Very fast.", "hints": ["Think about the text again."]}, {"type": "single", "q": "keep an eye on", "options": ["watch closely", "ignore"], "answer": 0, "explanation": "Watch.", "hints": ["Think about the text again."]}, {"type": "single", "q": "turn a blind eye", "options": ["act as if you do not notice", "look carefully"], "answer": 0, "explanation": "Ignore on purpose.", "hints": ["Think about the text again."]}, {"type": "single", "q": "see eye to eye", "options": ["agree", "argue"], "answer": 0, "explanation": "Agree.", "hints": ["Think about the text again."]}, {"type": "single", "q": "bird’s-eye view", "options": ["an overall look", "a close look"], "answer": 0, "explanation": "Overview.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "The suffix **-ish** makes adjectives: *tiger → tigerish*, *girl → girlish*, *boy → boyish*, *book → bookish*. (Words like *waterish* exist but are rare; *glassish*, *silkish* and *scrappish* are not standard.)", "title": "Suffix -ish"}, {"type": "quiz", "id": "u5c2-q-ish", "title": "Add -ish", "questions": [{"type": "fill", "q": "boy + ish = ______", "answer": ["boyish"], "explanation": "boyish", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "girl + ish = ______", "answer": ["girlish"], "explanation": "girlish", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "book + ish = ______", "answer": ["bookish"], "explanation": "bookish", "hints": ["Look for the exact word."]}]}, {"type": "summary", "points": ["Learn the poem’s words in context.", "Collective nouns name groups.", "Idioms with eye have fixed meanings."]}], "source": {"chapter": "u5c2", "pages": "225-226"}, "id": "c8u5c2-04-learn", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-05-listen-speak": {"title": "Let us listen and speak", "summary": "Listen to a father and daughter on Indian inventions and practise /v/ and /f/.", "minutes": 20, "blocks": [{"type": "text", "md": "Press **🎧 Play audio** and mark the four true statements. *(Original script.)*", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 Father and daughter (listen first)", "md": "Daughter: Papa, everyone knows yoga and the concept of zero came from India, but there are more lesser-known inventions. Radio broadcasting has roots in India. Jagadish Chandra Bose, a Bengali scientist, did an experiment with microwaves before Marconi. Father: Really? I did not know. That is incredible. I remember something about fibre optics. Daughter: Yes, you are right, Papa! It was pioneered by Narinder Kapany from Punjab, known as the father of fibre optics. And another one: Snakes and Ladders, invented to teach children values — ladders for virtues, snakes for evil. Father: Even a simple game had deep roots. I can tell you one too: the USB port was invented by Ajay Bhatt, an Indian-born engineer. Daughter: That is amazing! Father: I learned a lot from this conversation.", "listen": true}, {"type": "quiz", "id": "u5c2-q-listen", "title": "Mark the true statements", "questions": [{"type": "multi", "q": "Which four are true?", "options": ["The father is surprised that India was involved in radio broadcasting and fibre optics.", "The daughter appears indifferent about the USB port.", "The father shows little interest in snakes and ladders.", "The father agrees with the facts the daughter shares.", "The daughter expresses pride and admiration for India’s role in global inventions.", "The daughter is excited as she shares new discoveries."], "answer": [0, 3, 4, 5], "explanation": "Statements 2 and 3 are false: she says the USB origin is amazing, and he says even the simple game had deep roots.", "hints": ["Which two are clearly wrong?"]}]}, {"type": "text", "md": "**/f/ and /v/.** Both are made with the lower lip lightly touching the upper teeth. /v/ **vibrates** (voiced); /f/ does not (unvoiced). Read aloud: **f** — forest, flowers, from, deft, afternoon, of, itself. **v** — vase, valour, victory, woven, even, marvellous, hive.", "title": "Let us speak"}, {"type": "quiz", "id": "u5c2-q-vf", "title": "Which sound?", "questions": [{"type": "single", "q": "hive ends with…", "options": ["/v/", "/f/"], "answer": 0, "explanation": "The final e makes /v/.", "hints": ["Think about the text again."]}, {"type": "single", "q": "itself has…", "options": ["/f/", "/v/"], "answer": 0, "explanation": "/f/", "hints": ["Think about the text again."]}, {"type": "single", "q": "marvellous has…", "options": ["/v/", "/f/"], "answer": 0, "explanation": "/v/", "hints": ["Think about the text again."]}, {"type": "single", "q": "deft has…", "options": ["/f/", "/v/"], "answer": 0, "explanation": "/f/", "hints": ["Think about the text again."]}]}, {"type": "exercise", "id": "u5c2-ex-space", "title": "Space talk and invention talk", "difficulty": "easy", "minutes": 15, "goal": "Speak for one minute on two topics.", "behavior": "(1) If you could travel to space, which planet would you visit, why, what preparations, and five things to take? (2) If you could invent something, what, how and why?", "hints": ["Choose one planet.", "List five things.", "End with a wish."], "checklist": ["Clear opening", "Reasons given", "Five items named", "Spoke for about a minute"], "solution": "I would visit Mars because it is called the red planet… I would prepare by training and learning about oxygen… I would take food packets, a camera, a notebook, a torch and a family photo.", "solution_lang": "text", "solution_explain": "Give reasons using because.", "mode": "selfcheck"}, {"type": "summary", "points": ["Voiced /v/ vibrates; /f/ does not.", "Listening for attitudes reveals feelings."]}], "source": {"chapter": "u5c2", "pages": "227-228, 250"}, "id": "c8u5c2-05-listen-speak", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-06-write-explore": {"title": "Let us write and explore", "summary": "Write a conversation and explore telescopes, scholars and observatories.", "minutes": 25, "blocks": [{"type": "text", "md": "Remember: where, when and with whom; formal or informal tone; key information with agreement and disagreement; emotions in brackets; filler words allowed.", "title": "Let us write"}, {"type": "exercise", "id": "u5c2-ex-conv", "title": "Deepa and Asma’s conversation", "difficulty": "easy", "minutes": 15, "goal": "Create a dialogue about a Science Fair model.", "behavior": "Begin: Deepa: Hi Asma! Our Science teacher mentioned your wonderful idea…", "hints": ["Ask about the idea.", "Show doubt.", "Decide together."], "checklist": ["Brackets used", "Agreement/disagreement", "Ends with a decision"], "solution": "Deepa: Hi Asma! Asma: (hesitatingly) I’m not sure my idea is good. Deepa: (encouragingly) Tell me! Asma: A model of a magnifying lens showing how it enlarges. Deepa: (excitedly) Great! Let’s ask the teacher.", "solution_lang": "text", "solution_explain": "Natural, friendly.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** (I) Low-vision aids: magnifying spectacles for close tasks such as reading or threading a needle, stand magnifiers that rest above the object and are hands-free, hand-held magnifiers (with or without lights) for printed material, telescopes for far objects.\n\n(II) Telescopes use lenses too: the largest telescope in India for celestial objects is in Nainital, Uttarakhand (ARIES, commissioned 2016); the Indian Astronomical Observatory is at Hanle, Ladakh, at about 4,500 m; the James Webb Space Telescope (launched on 25 December 2021) orbits the Sun about 1.5 million km from Earth; Mauna Kea Observatory in Hawaii has world-famous telescopes at about 4,205 m because of its high elevation, dry environment and stable airflow.\n\n(III) Ancient Indian scholars: **Āryabhaṭa** (*Āryabhaṭīyam*; heliocentric idea; explained eclipses), **Varāmihira** (*Pañchasiddhāntika*), **Bhāskarāchārya II** (*Siddhāntaśiromaṇi*, *Karaṇakutūhala*).\n\n(IV) **Jantar Mantar**, New Delhi, built in 1724 by Maharaja Sawai Jai Singh II, has large instruments for measuring celestial movement; four other observatories are in Ujjain, Mathura, Varanasi and Jaipur.", "title": "Let us explore"}, {"type": "quiz", "id": "u5c2-q-explore", "title": "Explore check", "questions": [{"type": "single", "q": "Who built Jantar Mantar in 1724?", "options": ["Sawai Jai Singh II", "Akbar", "Shah Jahan"], "answer": 0, "explanation": "Maharaja Sawai Jai Singh II.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Where is the Indian Astronomical Observatory?", "options": ["Hanle, Ladakh", "Nainital", "Hawaii"], "answer": 0, "explanation": "Hanle.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Which scholar wrote the Āryabhaṭīyam?", "options": ["Āryabhaṭa", "Varāmihira", "Bhāskarāchārya II"], "answer": 0, "explanation": "Āryabhaṭa.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["Lenses power magnifiers and telescopes.", "India has a long tradition of astronomy."]}], "source": {"chapter": "u5c2", "pages": "229-232"}, "id": "c8u5c2-06-write-explore", "chapter": "c8u5c2", "kind": "lesson"}, "c8u5c2-99-test": {"title": "Test: Magnifying Glass", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u5c2-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "The poet is…", "options": ["Walter de la Mare", "Toru Dutt", "Reginald Arkell"], "answer": 0, "explanation": "Walter de la Mare.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The poem has…", "options": ["six stanzas of four lines", "four stanzas of six lines", "five of three"], "answer": 0, "explanation": "Six quatrains.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Rhyme scheme:", "options": ["ABCB", "AABB", "ABAB"], "answer": 0, "explanation": "ABCB.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘A drop of water like hive of bees’ is a…", "options": ["simile", "metaphor", "pun"], "answer": 0, "explanation": "Simile.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘Magic talk’ is…", "options": ["personification", "irony", "refrain"], "answer": 0, "explanation": "Personification.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "a ______ of locusts", "answer": ["swarm"], "explanation": "swarm", "hints": ["Look for the exact word."]}, {"type": "single", "q": "‘see eye to eye’ means…", "options": ["agree", "stare", "fight"], "answer": 0, "explanation": "Agree.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "tiger + ish = ______", "answer": ["tigerish"], "explanation": "tigerish", "hints": ["Look for the exact word."]}, {"type": "single", "q": "/v/ is…", "options": ["voiced (vibrates)", "unvoiced"], "answer": 0, "explanation": "Voiced.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Who built Jantar Mantar in 1724?", "options": ["Sawai Jai Singh II", "Birbal", "Aryabhata"], "answer": 0, "explanation": "Jai Singh II.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "Hanle observatory is in Ladakh.", "answer": true, "explanation": "Yes.", "hints": ["Re-read the story."]}], "mode": "test"}], "kind": "test", "id": "c8u5c2-99-test", "chapter": "c8u5c2"}, "c8u5c3-01-warm-up": {"title": "Before we read: scientists and their qualities", "summary": "Think of qualities of scientists and women scientists you know.", "minutes": 10, "blocks": [{"type": "text", "md": "Work in pairs: What qualities do you associate with a scientist? Complete a word web around *Qualities of a scientist*. Then look at the pictures of women scientists (ISRO’s Chandrayaan and Mars missions) and say what you know about their work."}, {"type": "quiz", "id": "u5c3-q-qual", "title": "Qualities of a scientist", "questions": [{"type": "multi", "q": "Choose qualities of a good scientist.", "options": ["curious", "patient", "careless", "observant", "persistent"], "answer": [0, 1, 3, 4], "explanation": "Scientists ask questions, wait and test patiently, notice details and keep trying.", "hints": ["Which words are positive?"]}]}, {"type": "reveal", "prompt": "Name two women scientists and what they did", "md": "Examples: Dr. Ritu Karidhal (ISRO’s Mars Orbiter Mission and Chandrayaan-2 and 3 leadership), Bibha Chowdhuri (cosmic rays). Share anything you know from news or school."}, {"type": "summary", "points": ["Scientists are curious, patient and persistent."]}], "terms": [{"term": "trailblazer", "def": "a person who is first to do something that others follow"}], "source": {"chapter": "u5c3", "pages": "233"}, "id": "c8u5c3-01-warm-up", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-02-read-listen": {"title": "Read and listen: Bibha Chowdhuri (retold)", "summary": "Follow Bibha’s life and legacy.", "minutes": 25, "blocks": [{"type": "text", "md": "The essay about **Bibha Chowdhuri** is in your textbook (pages 234–236). Here is the story in simple words; press 🔊 Listen.", "title": "About this lesson"}, {"type": "text", "md": "Women’s potential in science, technology, engineering and mathematics (STEM) is now recognised. Today women behind ISRO’s Mars Orbiter Mission and Chandrayaan-3 are celebrated. But the foundation was laid by trailblazers like Bibha Chowdhuri, India’s first woman physicist, in a male-dominated field.", "title": "Part 1 — Trailblazers"}, {"type": "text", "md": "Bibha was born in 1913 in Kolkata, in a traditional society where women struggled to get an education. She defied the odds and became a beam of light for others. She rose despite social expectations and among famous male scientists whose names the world celebrated while hers was known only to those who recognised her brilliance. Her persistence earned her a place at the Bose Institute and she became the first Indian woman to excel in high-energy particle physics.", "title": "Part 2 — Early life"}, {"type": "text", "md": "In 1945 Bibha went to the University of Manchester, where she studied cosmic rays under Nobel Laureate Patrick M.S. Blackett. Her Ph.D. thesis earned local recognition and newspapers called her ‘India’s New Woman Scientist — She has an eye for Cosmic Rays’. She discovered a subatomic particle, the pi-meson, and in 1950 Erwin Schrödinger nominated her for the Nobel Prize, though it did not succeed. She never received any awards in her lifetime but continued working tirelessly.", "title": "Part 3 — Breaking boundaries"}, {"type": "text", "md": "In 1949 she returned to India and became the first woman faculty member at the Tata Institute of Fundamental Research, personally chosen by Homi J. Bhabha. She worked at the Physical Research Laboratory in Ahmedabad and the Saha Institute of Nuclear Physics in Kolkata, studying cosmic rays and subatomic particles, from the Kolar Gold Mines to research under Vikram Sarabhai. She passed away in 1991, her name largely forgotten.", "title": "Part 4 — Her career"}, {"type": "text", "md": "In 2019 the International Astronomical Union renamed a star in the constellation Leo, HD 86081, as ‘Bibha’, meaning beam of light. In 2020 the Government of India announced a chair professorship in her name. Today women lead ISRO missions. Dr. Ritu Karidhal Srivastava, the ‘Rocket Woman of India’, had a pivotal role in the Mars Orbiter Mission and led Chandrayaan-2 and Chandrayaan-3. Over fifty women contributed to Chandrayaan-3. The journey from Bibha’s era has been long and tough, but inspiring, and Bibha remains a beacon for young women.", "title": "Part 5 — Legacy"}, {"type": "flashcards", "id": "u5c3-cards", "title": "Words from the essay", "cards": [{"front": "trailblazers", "back": "people who are first to do something others later follow"}, {"front": "equitable", "back": "fair to everyone"}, {"front": "defied the odds", "back": "achieved something despite difficulties"}, {"front": "towering", "back": "very high or great"}, {"front": "persistence", "back": "the ability to keep doing something difficult"}, {"front": "delved", "back": "examined in detail"}, {"front": "sceptical", "back": "doubtful"}, {"front": "notable", "back": "remarkable"}, {"front": "periphery", "back": "boundary or edge"}, {"front": "acclaim", "back": "praise"}, {"front": "tenacity", "back": "determination to continue"}, {"front": "ignite", "back": "arouse"}, {"front": "autonomous", "back": "independent"}, {"front": "arduous", "back": "difficult, needing much effort"}, {"front": "stark", "back": "clear"}, {"front": "beacon", "back": "a good example that gives hope"}]}, {"type": "quiz", "id": "u5c3-q-order", "title": "Arrange Bibha’s life events", "questions": [{"type": "order", "q": "Order them.", "items": ["Bibha was born in pre-independent India", "She joined the University of Manchester under Patrick Blackett", "She became the first woman faculty member at TIFR", "She was nominated for a Nobel Prize by Erwin Schrödinger", "The IAU renamed a star ‘Bibha’", "The Government declared a chair professorship in her name"], "explanation": "Born 1913 → Manchester 1945 → TIFR 1949 → nomination 1950 → star 2019 → chair 2020.", "hints": ["Check the years."]}]}, {"type": "summary", "points": ["Bibha Chowdhuri was India’s first woman physicist.", "She studied cosmic rays and discovered pi-mesons.", "A star and a chair professorship honour her.", "Today women lead ISRO missions."]}], "source": {"chapter": "u5c3", "pages": "234-237"}, "id": "c8u5c3-02-read-listen", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-03-reflect": {"title": "Let us think and reflect", "summary": "Answer extract questions and long questions.", "minutes": 30, "blocks": [{"type": "text", "md": "**Extract 1** — Bibha goes to Manchester in 1945 and studies cosmic rays under Nobel Laureate Blackett; her thesis earns local recognition and newspapers introduce her as ‘India’s New Woman Scientist’.", "title": "Extract 1"}, {"type": "quiz", "id": "u5c3-q-e1", "title": "Extract 1", "questions": [{"type": "single", "q": "(ii) What can be inferred about public perception of women scientists in the 1940s?", "options": ["Women scientists were widely accepted", "The world was still doubtful about women scientists’ capabilities", "Women were as renowned as men", "Women were not allowed to study science"], "answer": 1, "explanation": "B: ‘New Woman Scientist’ shows surprise and doubt.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iii) ‘celebrated’ refers to all of the following EXCEPT someone who is…", "options": ["famous and respected", "frequently seen in public", "renowned for achievements", "well-regarded in field"], "answer": 1, "explanation": "B is not the meaning of ‘celebrated’.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iv) ‘She has an eye for Cosmic Rays’ suggests
