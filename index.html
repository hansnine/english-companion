ed' is a human action.", "hints": ["Trees cannot wave."]}]}, {"type": "exercise", "id": "c6-ch03-ex-tree", "title": "Write about a tree you like", "difficulty": "easy", "minutes": 10, "goal": "Write a short paragraph about a tree near you.", "behavior": "Say where it is, how it looks, and why you like it. Use one compound word and one personification line. Give a title.", "hints": ["Where is it?", "Describe its trunk, leaves.", "Why do you like it?"], "checklist": ["Has a title", "Says where it is and how it looks", "Gives a reason", "Contains a compound word and personification"], "solution": "My Friendly Banyan\nA big banyan stands near my school playground. Its trunk is thick and its branches reach out like arms. Children play in its shade, and the leaves whisper to us at noon. I like it because it gives shade and shelters birds.", "solution_lang": "text", "solution_explain": "'Whisper' is personification; 'playground' is a closed compound word.", "mode": "selfcheck"}, {"type": "summary", "points": ["Neem is an old, useful tree with many names and uses, but remedies need trained guidance.", "Compound words can be open, closed or hyphenated.", "Personification gives human qualities to non-human things."]}], "terms": [{"term": "compound word", "def": "a word made from two words"}, {"term": "personification", "def": "giving human qualities to non-human things"}, {"term": "neem", "def": "a tree used in medicine, farming and daily life"}], "id": "c6u3-01-neem-baba", "chapter": "c6u3", "kind": "lesson", "minutes": 20}, "c6u3-02-what-a-bird-thought": {"title": "What a Bird Thought: a growing world", "summary": "Follow how a baby bird's idea of its world grows, and practise rhyme and describing words.", "source": {"chapter": "ch03", "sections": ["What a Bird Thought"], "pages": "13-25"}, "blocks": [{"type": "text", "md": "A baby bird lives in a shell, then in a nest, then flies out. Each time it thinks it knows what the world is. In this poem the bird learns that the world is bigger than it thought. You will match each stanza to its idea and use describing words."}, {"type": "callout", "kind": "analogy", "md": "It is like going from your room, to your house, to your street, to a city: each step makes your world larger.", "title": "Picture this"}, {"type": "table", "headers": ["Stanza", "The bird's idea of the world"], "rows": [["1", "The world is small and round, a pale blue shell"], ["2", "The world is made of straw, warm beside its mother"], ["3", "The world is made of leaves — then it realises it was blind to more"], ["4", "It flies beyond the tree, grown-up, and admits it still does not know how the world is made"]]}, {"type": "reveal", "prompt": "Why does the bird say 'I have been very blind'?", "md": "Because in the nest it could only see leaves. When it flew out it discovered more. It means: I could not see beyond what was around me."}, {"type": "quiz", "id": "c6-ch03-quiz-bird", "title": "Poem check", "questions": [{"type": "order", "q": "Order the bird's homes.", "items": ["A pale blue shell", "A straw nest with its mother", "Among the leaves", "Beyond the tree"], "explanation": "The world grows step by step.", "hints": ["Start from the smallest."]}, {"type": "single", "q": "Why did the bird think the world was made of straw?", "options": ["It ate straw", "Its nest was made of straw", "It lived in a hut", "There was straw everywhere"], "answer": 1, "explanation": "Its nest was straw.", "hints": ["Its home."]}, {"type": "truefalse", "q": "The bird knows exactly how the world is made at the end.", "answer": false, "explanation": "It says it does not know, and neither do its neighbours.", "hints": ["Read the last two lines."]}]}, {"type": "text", "md": "**Rhyme** helps a poem sing. Pairs from stanza 1: *well – shell*; new rhyming words: *fell, bell, tell*. Practise: *I fly high and I fly low, But one thing I surely know…* Rhyming words end alike.", "title": "Rhyme"}, {"type": "quiz", "id": "c6-ch03-quiz-rhyme", "title": "Rhyme", "questions": [{"type": "fill", "q": "Complete the rhyme: *I fly high and I fly low, but one thing I surely k___* (rhymes with low)", "answer": ["know"], "explanation": "'Know'.", "hints": ["Think: 'low – ?'"]}, {"type": "single", "q": "Which word rhymes with *shell*?", "options": ["well", "wall", "shall", "shape"], "answer": 0, "explanation": "'Well'.", "hints": ["Same ending sound."]}]}, {"type": "text", "md": "Describing words (**adjectives**) help us picture things: *pale, blue, round, straw, little* are used for the nest. Others: *pointed, green, thin, brown, small, wooden, hanging, round*. Example about a birdhouse: *a small wooden house with a round hole*.", "title": "Describing words"}, {"type": "quiz", "id": "c6-ch03-quiz-desc", "title": "Adjectives", "questions": [{"type": "single", "q": "Which phrase uses a describing word well?", "options": ["a wooden house", "house a", "go house", "the and house"], "answer": 0, "explanation": "'Wooden' describes the house.", "hints": ["Which phrase makes sense?"]}]}, {"type": "exercise", "id": "c6-ch03-ex-world", "title": "How would a fish see the world?", "difficulty": "easy", "minutes": 10, "goal": "Write five sentences as a fish describing its world, like the bird did.", "behavior": "Begin: 'My world is…'. Use describing words.", "hints": ["Think of colours, water.", "Use 'I' or 'my'."], "checklist": ["Five sentences", "Describing words used", "Written as 'I' the fish"], "solution": "My world is wet and cool. The water is clear and blue. I swim past green plants. Bubbles rise above me. The bright surface seems like the sky.", "solution_lang": "text", "solution_explain": "It copies the poem's pattern of 'my world is…' with new details.", "mode": "selfcheck"}, {"type": "summary", "points": ["The bird's world grows from shell to nest to leaves to the sky.", "Rhyming words end with the same sound.", "Describing words make pictures in the mind."]}], "terms": [{"term": "stanza", "def": "a group of lines in a poem"}, {"term": "rhyme", "def": "words with the same ending sound"}], "id": "c6u3-02-what-a-bird-thought", "chapter": "c6u3", "kind": "lesson", "minutes": 15}, "c6u3-03-spices-that-heal": {"title": "Spices that Heal Us: a letter from Daadi", "summary": "Read a letter about spices and use modal verbs.", "source": {"chapter": "ch03", "sections": ["Spices that Heal Us"], "pages": "26-34"}, "blocks": [{"type": "text", "md": "Daadi (grandmother) writes to Vikram and Vaibhavi about kitchen spices. A **spice** is any part of a plant used to give taste or colour to food. You will read her letter and learn the helpers called **modal verbs**."}, {"type": "callout", "kind": "analogy", "md": "Spices are like tiny medicine cabinets in the kitchen — but, like all medicine, they need an elder's advice.", "title": "Picture this"}, {"type": "table", "headers": ["Spice (Hindi)", "English", "Daadi's note"], "rows": [["haldi", "turmeric", "energy, digestion, body pain"], ["methi", "fenugreek", "sugar and weight (soak seeds overnight)"], ["jeera", "cumin", "digestion, sleeplessness"], ["heeng", "asafoetida", "gas in babies' tummies, cough and cold"], ["dalchini, laung", "cinnamon, clove", "toothache relief until a dentist visit"], ["adrak", "ginger", "cough, cold, pain"], ["kali mirch", "black pepper", "digestion, body pain"], ["saunf, ajwain", "fennel, carom", "digestion after meals"], ["elaichi", "cardamom", "digestion, breathing, bad breath"]]}, {"type": "callout", "kind": "warning", "md": "Daadi ends: identify the spices, but **consult an elder before you use them**.", "title": "Remember"}, {"type": "quiz", "id": "c6-ch03-quiz-spices", "title": "Letter check", "questions": [{"type": "single", "q": "Which spice is used for toothache relief?", "options": ["turmeric", "clove", "fenugreek", "fennel"], "answer": 1, "explanation": "Clove (and cinnamon).", "hints": ["Dalchini and laung."]}, {"type": "single", "q": "What was Daadi's final advice?", "options": ["Eat more", "Identify the spices and consult an elder", "Sell spices", "Buy medicine"], "answer": 1, "explanation": "Consult an elder.", "hints": ["The last paragraph."]}, {"type": "single", "q": "Which spice is NOT mentioned as useful for body pain?", "options": ["turmeric", "ginger", "fennel seeds", "black pepper"], "answer": 2, "explanation": "Fennel is for digestion.", "hints": ["Check each one."]}]}, {"type": "text", "md": "**Modal verbs** are helping verbs that show function. **may** = permission/possibility, **should** = advice, **can** = ability, **must** = compulsion (strong duty), **need to** = necessity, **used to** = past habit. Examples from the letter: *You may share them. You should try to remember. It can help. You must consult an elder. I need to soak methi. I used to put heeng water on your tummy.*", "title": "Grammar: modals"}, {"type": "table", "headers": ["Modal", "Function"], "rows": [["may", "suggestion/permission"], ["should", "advice"], ["can", "ability"], ["must", "compulsion"], ["need to", "necessity"], ["used to", "past habit"]]}, {"type": "quiz", "id": "c6-ch03-quiz-modal", "title": "Modal verbs", "questions": [{"type": "single", "q": "*You must consult an elder.* — 'must' shows…", "options": ["ability", "compulsion", "past habit", "suggestion"], "answer": 1, "explanation": "Compulsion.", "hints": ["Is it strongly necessary?"]}, {"type": "single", "q": "*I used to play kho-kho.* — 'used to' shows…", "options": ["ability", "past habit", "advice", "permission"], "answer": 1, "explanation": "Past habit.", "hints": ["Something you did often earlier."]}, {"type": "fill", "q": "Fill in: Anand had a fever. He ___ take rest. (advice)", "answer": ["should"], "explanation": "'Should'.", "hints": ["Advice modal."]}]}, {"type": "text", "md": "**Riddles** describe something without naming it. Example: *Brownish-yellow in colour, bitter to taste, I help everyone control their weight. Who am I?* Answer: fenugreek (methi). Try writing a riddle with three clues about a spice.", "title": "Riddles"}, {"type": "exercise", "id": "c6-ch03-ex-riddle", "title": "Write a spice riddle", "difficulty": "easy", "minutes": 10, "goal": "Write a four-line riddle about a spice and ask someone at home to guess.", "behavior": "Mention colour, taste or use. End with 'Who am I?'", "hints": ["Choose a spice.", "Give two clues."], "checklist": ["Four lines", "Clues given", "Ends with Who am I?"], "solution": "I am small and round and black,\nIn your food I give a spicy attack.\nI help digestion and ease some pain.\nWho am I? (Black pepper)", "solution_lang": "text", "solution_explain": "The riddle uses clues and a final question.", "mode": "selfcheck"}, {"type": "summary", "points": ["Daadi's letter lists spices and their benefits, but advice from elders comes first.", "Modals: may, should, can, must, need to, used to.", "Riddles give clues instead of the answer."]}], "terms": [{"term": "spice", "def": "plant part used to give taste or colour to food"}, {"term": "modal verb", "def": "a helping verb such as may, should, can, must"}, {"term": "herb", "def": "a plant used for flavour or medicine"}], "id": "c6u3-03-spices-that-heal", "chapter": "c6u3", "kind": "lesson", "minutes": 15}, "c6u3-99-test": {"title": "Test: Nurturing Nature", "summary": "Check what you learnt in Unit 3.", "kind": "test", "blocks": [{"type": "quiz", "id": "c6-ch03-test", "title": "Unit 3 test", "questions": [{"type": "single", "q": "Who named the tree 'Neem'?", "options": ["Iranians", "Amber", "Sanskrit poets", "Doctors"], "answer": 0, "explanation": "Iranians.", "hints": ["Name story."]}, {"type": "single", "q": "A compound word with a hyphen is…", "options": ["thought-provoking", "grandmother", "neem oil", "something"], "answer": 0, "explanation": "Thought-provoking.", "hints": ["Look for the hyphen."]}, {"type": "single", "q": "Which is personification?", "options": ["The flowers danced in the breeze.", "The flowers are red.", "Flowers grow.", "I like flowers."], "answer": 0, "explanation": "Flowers cannot dance.", "hints": ["Human action."]}, {"type": "order", "q": "Order the bird's homes.", "items": ["shell", "straw nest", "among leaves", "beyond the tree"], "explanation": "The world widens.", "hints": ["Smallest to largest."]}, {"type": "single", "q": "Which word rhymes with 'well'?", "options": ["shell", "wall", "wool", "wail"], "answer": 0, "explanation": "Shell.", "hints": ["Same ending."]}, {"type": "single", "q": "Which spice helps with toothache?", "options": ["clove", "fenugreek", "ginger", "fennel"], "answer": 0, "explanation": "Clove.", "hints": ["Dalchini and laung."]}, {"type": "single", "q": "'You should try to remember' shows…", "options": ["advice", "ability", "past habit", "compulsion"], "answer": 0, "explanation": "Advice.", "hints": ["Modal 'should'."]}, {"type": "single", "q": "'I used to put heeng water' shows…", "options": ["past habit", "ability", "permission", "advice"], "answer": 0, "explanation": "Past habit.", "hints": ["Used to."]}, {"type": "truefalse", "q": "Daadi says anyone can use remedies without asking.", "answer": false, "explanation": "Consult an elder.", "hints": ["Her last advice."]}, {"type": "single", "q": "Which is an adjective?", "options": ["wooden", "wrote", "quickly", "and"], "answer": 0, "explanation": "Wooden.", "hints": ["Describes a noun."]}], "mode": "test"}], "id": "c6u3-99-test", "chapter": "c6u3", "minutes": 10}, "c6u4-01-change-of-heart": {"title": "Change of Heart: learning to enjoy the game", "summary": "Follow Prabhat's change in attitude, and use past perfect and polite expressions.", "source": {"chapter": "ch04", "sections": ["Change of Heart"], "pages": "1-28"}, "blocks": [{"type": "text", "md": "Prabhat can't bear to lose — not even at marbles. A new student, Surya, changes how he sees games. After this lesson you can explain the 'change of heart', use the **past perfect tense**, and say please, thank you and sorry in the right way."}, {"type": "callout", "kind": "analogy", "md": "Playing only to win is like eating only for the prize at the end of the meal — you miss the taste.", "title": "Picture this"}, {"type": "text", "md": "Prabhat only plays games when he is sure of winning, like badminton. In the Friday friendly match against Surya, Prabhat keeps score. Surya jokes, laughs and plays brilliantly, but Prabhat changes the scoreboard when Surya looks away. He wins by **cheating**, yet Surya is not upset: 'It's been fun.'", "title": "Part 1"}, {"type": "text", "md": "That night Prabhat can't sleep; he does not feel happy. Next day he sees Surya playing basketball badly but enjoying it. Prabhat watches for days and realises that you do not need a scoreboard to enjoy a game: **trying to do well and enjoying every moment matters**. Soon he laughs and plays freely, and others say he has a great **sporting spirit**.", "title": "Part 2"}, {"type": "reveal", "prompt": "Why is the story called 'Change of Heart'?", "md": "Because Prabhat's feelings change: from needing to win to enjoying the game for itself."}, {"type": "quiz", "id": "c6-ch04-quiz-prabhat", "title": "Story check", "questions": [{"type": "single", "q": "What did Prabhat do to win?", "options": ["Played better", "Cheated by changing the scoreboard", "Asked for help", "Practised"], "answer": 1, "explanation": "He changed the scoreboard.", "hints": ["Read what he did while Surya looked away."]}, {"type": "single", "q": "Why couldn't Prabhat sleep that night?", "options": ["He lost", "His win did not make him happy", "He was hungry", "He was ill"], "answer": 1, "explanation": "He did not feel as happy as usual.", "hints": ["He won but…"]}, {"type": "single", "q": "What does 'sporting spirit' mean?", "options": ["Winning always", "Being fair and respecting each player", "Following only some rules", "Playing alone"], "answer": 1, "explanation": "Fair play and respect.", "hints": ["Check the pre-reading task."]}]}, {"type": "text", "md": "**Past perfect** = *had + third form of the verb*. It shows the **first** (older) action when two past actions are linked: *He had won the game but he did not feel as happy.* (First: had won. Second: did not feel.) Practice: *Prabhat had already finished his homework before going to the match.*", "title": "Grammar: past perfect"}, {"type": "table", "headers": ["First action (past perfect)", "Second action"], "rows": [["had played", "was discussing"], ["had won", "did not feel"], ["had not felt", "What was more surprising…"]]}, {"type": "quiz", "id": "c6-ch04-quiz-pp", "title": "Past perfect", "questions": [{"type": "fill", "q": "Fill in: *By the time Prabhat arrived, Surya ___ already ___ several matches.* (win)", "answer": ["had won", "had already won"], "explanation": "'Had already won' shows an earlier action.", "hints": ["had + third form."]}, {"type": "single", "q": "Which is past perfect?", "options": ["had played", "was playing", "plays", "will play"], "answer": 0, "explanation": "Had played.", "hints": ["Look for had."]}, {"type": "fill", "q": "Surya ___ never ___ Prabhat before coming to school. (meet)", "answer": ["had met", "had never met"], "explanation": "Had never met.", "hints": ["had + third form."]}]}, {"type": "text", "md": "**Polite language.** Request: *Could you please…* *Please can you help me with…* Apology for rude behaviour: *I'm very sorry for the way I behaved.* For a mistake: *I'm sorry, that was my fault.* Gratitude: *Thank you. It means so much to me that you…* *I truly appreciate your help.*", "title": "Speaking: please, sorry, thank you"}, {"type": "quiz", "id": "c6-ch04-quiz-polite", "title": "Polite words", "questions": [{"type": "single", "q": "Sumit spilled water on Nupur's desk. Best sentence?", "options": ["Oops.", "I'm sorry, that was my fault.", "Not my problem.", "Why is your desk there?"], "answer": 1, "explanation": "Accepting blame is polite.", "hints": ["Which accepts blame politely?"]}]}, {"type": "exercise", "id": "c6-ch04-ex-diary", "title": "Write Prabhat's diary", "difficulty": "medium", "minutes": 12, "goal": "Write six sentences as Prabhat the night after the match.", "behavior": "Mention what you did, how Surya reacted, and how you feel. Use at least one past perfect form.", "hints": ["Start: 'Today I defeated Surya but…'.", "Say how you feel."], "checklist": ["Six sentences", "One past perfect", "My feelings clear"], "solution": "Today I defeated Surya at badminton, but I do not feel happy. I had changed the scoreboard while he was looking elsewhere. He still said it had been fun. I do not understand why he was not upset. I feel I did something wrong.", "solution_lang": "text", "solution_explain": "'Had changed' shows the earlier action.", "mode": "selfcheck"}, {"type": "summary", "points": ["Prabhat learns to enjoy games instead of only winning.", "Past perfect = had + third form, for the earlier of two past actions.", "Please, thank you and sorry help us be respectful."]}], "terms": [{"term": "sporting spirit", "def": "being fair and respecting each player"}, {"term": "past perfect", "def": "had + third form"}, {"term": "opponent", "def": "someone you compete with"}], "id": "c6u4-01-change-of-heart", "chapter": "c6u4", "kind": "lesson", "minutes": 20}, "c6u4-02-the-winner": {"title": "The Winner: when night wins", "summary": "Read a poem about evening play, decode its images, and use pattern and personification.", "source": {"chapter": "ch04", "sections": ["The Winner"], "pages": "29-38"}, "blocks": [{"type": "text", "md": "*The Winner* is a short poem about children playing ball until evening. The poem is full of pictures made from few words. You will decode lines, and see how the poet uses **pattern** and **personification**."}, {"type": "callout", "kind": "analogy", "md": "A poem is like a snapshot with sounds — it gives you a moment, not a whole film.", "title": "Picture this"}, {"type": "text", "md": "Children play ball next to a creek (a small body of water) in a neighbour's field. They run so fast the speaker can't catch her breath. As evening falls, the blue sky turns dark, the grass becomes cold, the trees seem to creep closer, the game is over — and **night wins**.", "title": "What the poem says"}, {"type": "table", "headers": ["Line idea", "Meaning"], "rows": [["creek", "a small body of water"], ["can't even catch my breath", "has been running so hard"], ["blue dark turns to black", "sky changes as night comes"], ["trees creep close", "in dim light, trees look closer"]]}, {"type": "quiz", "id": "c6-ch04-quiz-winner", "title": "Poem check", "questions": [{"type": "single", "q": "Why does the speaker need to catch her breath?", "options": ["Running fast", "Singing", "Sleeping", "Swimming"], "answer": 0, "explanation": "Running fast makes you breathless.", "hints": ["Look at the pattern lines."]}, {"type": "single", "q": "Why does 'night win'?", "options": ["Time for play has ended", "Children are tired", "Time to play at home begins", "Night follows day"], "answer": 0, "explanation": "Darkness ends the game.", "hints": ["What stops the game?"]}, {"type": "truefalse", "q": "The speaker is alone.", "answer": false, "explanation": "The poem uses 'we', so friends play together.", "hints": ["Words like 'we'."]}]}, {"type": "text", "md": "**Pattern poetry**: the poet puts words on separate lines — *I / can't / even / catch / my / breath* — to show breathlessness. **Personification**: 'Night wins!' treats night as a player who wins. Another example: *The sun played hide-and-seek with the clouds.*", "title": "Poet's tools"}, {"type": "quiz", "id": "c6-ch04-quiz-tools", "title": "Poet's tools", "questions": [{"type": "single", "q": "What does the one-word-per-line pattern show?", "options": ["Being out of breath", "Anger", "Joy", "Sleep"], "answer": 0, "explanation": "It slows the reader like gasping.", "hints": ["Read it aloud."]}, {"type": "single", "q": "Which is personification?", "options": ["The wind shouted at the trees.", "The wind is cold.", "I felt the wind.", "The wind stopped."], "answer": 0, "explanation": "Human action.", "hints": ["Wind can't shout."]}]}, {"type": "text", "md": "**Water bodies** (word web): creek, river, lake, pond, sea, ocean, stream, waterfall. Riddles in the unit: football, kho-kho, swimming and yoga/breathing exercise.", "title": "Word web"}, {"type": "exercise", "id": "c6-ch04-ex-pattern", "title": "Write a pattern line and a personification", "difficulty": "easy", "minutes": 10, "goal": "Write one pattern line and one personification line.", "behavior": "Pattern: break a sentence into one word per line. Personification: give a thing a human action.", "hints": ["Pick an action.", "Think of the sun, wind or moon."], "checklist": ["One pattern line", "One personification line"], "solution": "The leaves are\nfalling,\nfalling,\nfalling.\nThe sun played hide-and-seek with the clouds.", "solution_lang": "text", "solution_explain": "The pattern repeats 'falling' to show motion.", "mode": "selfcheck"}, {"type": "summary", "points": ["The poem pictures evening play and the arrival of night.", "Pattern lines show feelings like breathlessness.", "Personification gives human actions to non-human things."]}], "terms": [{"term": "creek", "def": "a small body of water"}, {"term": "personification", "def": "giving human qualities to non-human things"}], "id": "c6u4-02-the-winner", "chapter": "c6u4", "kind": "lesson", "minutes": 15}, "c6u4-03-yoga-way-of-life": {"title": "Yoga — A Way of Life", "summary": "Read an informational text on yoga and use practice/practise and advice/advise.", "source": {"chapter": "ch04", "sections": ["Yoga — A Way of Life"], "pages": "39-50"}, "blocks": [{"type": "text", "md": "Yoga is a physical, mental and spiritual practice that began in ancient India. You will learn what the word means, its benefits, and how to spell two tricky pairs of words."}, {"type": "callout", "kind": "analogy", "md": "Yoga is like tuning a musical instrument: you align body, breath and mind so that everything works together.", "title": "Picture this"}, {"type": "text", "md": "The word 'yoga' comes from the Sanskrit root *yuj*, meaning 'to join' or 'to unite' — mind and body, thought and action, humans and nature. Sage Patanjali organised yoga in the *Yoga Sutras*, describing it as a way to quieten the mind and free it from distractions. 21 June is **International Yoga Day**; the UN General Assembly accepted the proposal on 11 December 2014.", "title": "What is yoga?"}, {"type": "table", "headers": ["Benefit", "How"], "rows": [["Fitness", "asanas stretch and strengthen muscles; improve flexibility, endurance, balance"], ["Calm mind", "breathing and meditation reduce stress and anxiety; improve sleep"], ["Health", "boosts immunity; helps heart health"], ["Weight", "burns calories and maintains health"]]}, {"type": "quiz", "id": "c6-ch04-quiz-yoga", "title": "Text check", "questions": [{"type": "single", "q": "What does 'yuj' mean?", "options": ["to join or unite", "to run", "to relax", "to sing"], "answer": 0, "explanation": "To join.", "hints": ["Sanskrit root."]}, {"type": "single", "q": "Which app did WHO launch for yoga?", "options": ["WHO mYoga", "Yoga Plus", "Fit India", "Asana"], "answer": 0, "explanation": "WHO mYoga.", "hints": ["Launched in June 2021."]}, {"type": "truefalse", "q": "Yoga should be practised without distractions.", "answer": true, "explanation": "The mind must be with the body.", "hints": ["Mind with body."]}]}, {"type": "text", "md": "**practice vs practise.** *Practice* is a **noun** (a regular practice of stretching). *Practise* is a **verb** (I practise yoga every day). Similarly *advice* (noun) and *advise* (verb): *My coach gave good advice. She advised me to rest.* Trick: n**o**un has **c**; verb has **s** — noun 'c', verb 's' ('c' comes before 's' just as noun comes before verb in a sentence).", "title": "Spelling: practice/practise"}, {"type": "quiz", "id": "c6-ch04-quiz-spell", "title": "Practice or practise?", "questions": [{"type": "single", "q": "It is important to have a regular ___ of stretching.", "options": ["practice", "practise"], "answer": 0, "explanation": "Noun → practice.", "hints": ["Noun."]}, {"type": "single", "q": "I ___ deep breathing when I feel stressed.", "options": ["practice", "practise"], "answer": 1, "explanation": "Verb → practise.", "hints": ["Verb."]}, {"type": "single", "q": "The doctor gave me good ___.", "options": ["advice", "advise"], "answer": 0, "explanation": "Advice.", "hints": ["Noun."]}]}, {"type": "exercise", "id": "c6-ch04-ex-yoga", "title": "The Benefits of Yoga", "difficulty": "easy", "minutes": 10, "goal": "Write a short paragraph.", "behavior": "Use: 'Yoga is important because…', one benefit, and 'Finally, yoga can be a great way to…'.", "hints": ["Use the sentence starters.", "Check practise (verb)."], "checklist": ["Opening line", "One benefit", "Concluding line", "practice/practise used correctly"], "solution": "Yoga is important because it joins the mind and the body. One benefit that interests me is calm: breathing exercises reduce stress. I practise a few asanas every morning. Finally, yoga can be a great way to stay healthy.", "solution_lang": "text", "solution_explain": "The paragraph follows the book's opening-supporting-closing structure.", "mode": "selfcheck"}, {"type": "summary", "points": ["Yoga means to unite; it helps body and mind.", "Practice/advice are nouns; practise/advise are verbs.", "International Yoga Day is 21 June."]}], "terms": [{"term": "yoga", "def": "a practice that joins body, mind and spirit"}, {"term": "asana", "def": "a yoga posture"}, {"term": "practise", "def": "verb: do repeatedly to improve"}], "id": "c6u4-03-yoga-way-of-life", "chapter": "c6u4", "kind": "lesson", "minutes": 15}, "c6u4-99-test": {"title": "Test: Sports and Wellness", "summary": "Check what you learnt in Unit 4.", "kind": "test", "blocks": [{"type": "quiz", "id": "c6-ch04-test", "title": "Unit 4 test", "questions": [{"type": "single", "q": "How did Prabhat win the match?", "options": ["By cheating", "By luck", "By skill only", "By a trophy"], "answer": 0, "explanation": "By changing it.", "hints": ["Scoreboard."]}, {"type": "single", "q": "What did Prabhat realise?", "options": ["Enjoying the game matters", "Winning is everything", "Cheating works", "Badminton is hard"], "answer": 0, "explanation": "Enjoyment matters.", "hints": ["Watching Surya."]}, {"type": "single", "q": "Past perfect form of win:", "options": ["had won", "was winning", "wins", "will win"], "answer": 0, "explanation": "Had won.", "hints": ["had + third form"]}, {"type": "single", "q": "*It means so much to me that you…* is used for…", "options": ["thanking", "apologising", "requesting", "refusing"], "answer": 0, "explanation": "Thanking.", "hints": ["Gratitude."]}, {"type": "single", "q": "Why does 'night win' in the poem?", "options": ["Play must end", "Night is stronger", "Children hide", "Trees move"], "answer": 0, "explanation": "Play ends.", "hints": ["Darkness."]}, {"type": "single", "q": "Which shows personification?", "options": ["Night wins!", "I run fast", "The grass is cold", "We play ball"], "answer": 0, "explanation": "Night wins.", "hints": ["Night is not a player."]}, {"type": "single", "q": "'Yoga' comes from a root meaning…", "options": ["to join", "to run", "to sit", "to eat"], "answer": 0, "explanation": "To join.", "hints": ["Sanskrit."]}, {"type": "single", "q": "Noun: I need more ___.", "options": ["practice", "practise"], "answer": 0, "explanation": "Practice.", "hints": ["Noun."]}, {"type": "single", "q": "Verb: She ___ every morning.", "options": ["practices", "practises"], "answer": 1, "explanation": "Practises.", "hints": ["Verb (British)."]}, {"type": "single", "q": "International Yoga Day is on…", "options": ["21 June", "11 December", "20 June", "1 January"], "answer": 0, "explanation": "21 June.", "hints": ["Month of June."]}], "mode": "test"}], "id": "c6u4-99-test", "chapter": "c6u4", "minutes": 10}, "c6u5-01-hamara-bharat": {"title": "Hamara Bharat: art forms and 'Ek Bharat, Shreshtha Bharat'", "summary": "Describe four Indian art forms and use sequencing words and the simple present.", "source": {"chapter": "ch05", "sections": ["Hamara Bharat", "Kalakritiyon ka Bharat"], "pages": "1-31"}, "blocks": [{"type": "text", "md": "India (Bharat) has many languages, foods, festivals and arts. In this lesson children from different states each present an art form. You will learn what each needs, how it is made, and the words used to show **order**: *to begin, first, then, after that, next, finally, at last*."}, {"type": "callout", "kind": "analogy", "md": "Describing how a craft is made is like giving directions: you must say what happens first, next, and last.", "title": "Picture this"}, {"type": "table", "headers": ["Child", "State", "Art form", "What it is"], "rows": [["Aakansha", "Uttarakhand", "Aipan", "folk art drawn with white rice-flour paste on floors and walls coloured with geru; made by women at festivals"], ["Priyaranjan", "Odisha", "Dhokra", "4000-year-old metal craft: clay figure, wax layer, carve details, clay cover, fire, melted brass poured in"], ["Chitra", "Kerala", "Coconut shell craft", "clean, smooth, shape, add a base, polish; biodegradable"], ["Balamurali", "Andhra Pradesh", "Kondapalli toys", "400-year-old; soft wood carved, joined with makku (tamarind seed paste + sawdust), coloured"]]}, {"type": "callout", "kind": "note", "md": "**Ek Bharat, Shreshtha Bharat** pairs states and union territories so that people learn about each other's cultures and feel united in diversity.", "title": "The programme"}, {"type": "quiz", "id": "c6-ch05-quiz-art", "title": "Art check", "questions": [{"type": "single", "q": "Which art uses rice-flour paste?", "options": ["Aipan", "Dhokra", "Kondapalli", "Coconut shell craft"], "answer": 0, "explanation": "Aipan.", "hints": ["Uttarakhand."]}, {"type": "single", "q": "Why is coconut shell craft called biodegradable?", "options": ["It does not harm the environment", "It is expensive", "It is made of metal", "It is old"], "answer": 0, "explanation": "Biodegradable things do not harm the environment.", "hints": ["Check the vocabulary note."]}, {"type": "order", "q": "Order the Dhokra steps (start).", "items": ["Make a clay figure and dry it", "Cover with wax", "Carve fine details on the wax", "Cover with clay and heat; wax melts", "Pour melted brass; remove clay"], "explanation": "The 'lost wax' method.", "hints": ["Clay and wax come first."]}]}, {"type": "text", "md": "**Sequencing words** show order: *To begin, first, then, after that, next, finally, at last.* Use each only once in a paragraph. Example: *First I get up. Then I wear my uniform. After that I eat. Next I wear my shoes. Finally I pick up my bag.*", "title": "Sequencing words"}, {"type": "quiz", "id": "c6-ch05-quiz-seq", "title": "Sequence", "questions": [{"type": "single", "q": "Which word best ends a list of steps?", "options": ["First", "Then", "At last", "To begin"], "answer": 2, "explanation": "'At last' or 'finally'.", "hints": ["Which signals the end?"]}]}, {"type": "text", "md": "**Simple present tense** shows regular actions. With *he, she, it* add **-s/-es**: *He speaks very loudly. She draws beautiful flowers.* With *I, you, we, they* use the base verb: *I know how to dance. They practise spellings on Friday.*", "title": "Grammar: present tense"}, {"type": "quiz", "id": "c6-ch05-quiz-present", "title": "Present tense", "questions": [{"type": "single", "q": "*She ___ paintings in free periods.*", "options": ["draw", "draws", "drawing", "drew"], "answer": 1, "explanation": "She draws.", "hints": ["She → add -s."]}, {"type": "single", "q": "*We ___ questions to understand.*", "options": ["asks", "ask", "asking", "asked"], "answer": 1, "explanation": "We ask.", "hints": ["We → base form."]}]}, {"type": "exercise", "id": "c6-ch05-ex-art", "title": "Describe a local art form", "difficulty": "easy", "minutes": 10, "goal": "Speak or write about an art form of your region.", "behavior": "Include its name, what is needed, and the steps using first, then, next, finally.", "hints": ["Choose one art.", "List materials first."], "checklist": ["Name", "Things needed", "Steps with sequencing words"], "solution": "I know about the art form called rangoli. People need coloured powder or rice flour. To begin, they clean the floor. Then they draw dots. Next they join the dots. Finally they fill in colours.", "solution_lang": "text", "solution_explain": "It follows name → materials → ordered steps.", "mode": "selfcheck"}, {"type": "summary", "points": ["Indian art forms are shaped by materials, place and tradition.", "Sequencing words make steps clear.", "The simple present takes -s/-es with he, she, it."]}], "terms": [{"term": "folk art", "def": "art made by ordinary people from a region's traditions"}, {"term": "biodegradable", "def": "something that will not harm the environment"}, {"term": "sequencing words", "def": "words showing order, like first and then"}], "id": "c6u5-01-hamara-bharat", "chapter": "c6u5", "kind": "lesson", "minutes": 15}, "c6u5-02-the-kites": {"title": "The Kites: simile, alliteration and a cinquain", "summary": "Read a poem about kites, spot similes and alliteration, and write a cinquain.", "source": {"chapter": "ch05", "sections": ["The Kites", "National War Memorial"], "pages": "32-50"}, "blocks": [{"type": "text", "md": "A child watches kites fly and imagines riding one. You will find similes and alliteration in the poem and write a five-line poem called a **cinquain**."}, {"type": "callout", "kind": "analogy", "md": "A simile is like a bridge between two things: it uses 'like' or 'as' to connect them so you can see one through the other.", "title": "Picture this"}, {"type": "text", "md": "The poet says kites are *like coloured birds* in the sky. The child wishes to be *as light as air*, to climb on a kite, hear the wild wind sing, and look down at park and rooftops while people stare and wish they were up there too.", "title": "What the poem says"}, {"type": "quiz", "id": "c6-ch05-quiz-kites", "title": "Poem check", "questions": [{"type": "single", "q": "The kites are compared to…", "options": ["birds", "clouds", "boats", "flowers"], "answer": 0, "explanation": "Coloured birds.", "hints": ["Like what?"]}, {"type": "single", "q": "Which is a simile?", "options": ["as light as air", "night wins", "the sun played hide-and-seek", "wild wind sings"], "answer": 0, "explanation": "'As light as air'.", "hints": ["Look for as/like."]}, {"type": "truefalse", "q": "The child wants to look at the kite from a rooftop.", "answer": false, "explanation": "The child wants to ride the kite.", "hints": ["The child wants to be on the kite."]}]}, {"type": "text", "md": "**Alliteration** repeats a starting consonant sound: *big bright blue bag*, *funny fan*. In the poem look for pairs of words that begin with the same sound. **Rhyme**: check which stanzas rhyme at line endings.", "title": "Alliteration"}, {"type": "table", "headers": ["Line", "Content of a cinquain"], "rows": [["1", "One noun (the subject): Kite"], ["2", "Two describing words: pretty, colourful"], ["3", "Three action words: flying, floating, soaring"], ["4", "Two words about the actions: quickly, happily"], ["5", "One synonym: paper-bird"]]}, {"type": "quiz", "id": "c6-ch05-quiz-cinq", "title": "Cinquain", "questions": [{"type": "single", "q": "How many lines does a cinquain have?", "options": ["3", "4", "5", "6"], "answer": 2, "explanation": "Five lines.", "hints": ["Cinq = five."]}, {"type": "single", "q": "Line 3 of a cinquain has…", "options": ["one noun", "three action words", "two adverbs", "a synonym"], "answer": 1, "explanation": "Three action words.", "hints": ["See table."]}]}, {"type": "text", "md": "**Movement words**: glide, dive, soar, swoop, circle, float, drift. In the poem the kite *flies* and *drifts*. **Parts of a kite**: nose (tip), spine, cover, kite line, tail, reel.", "title": "Kite vocabulary"}, {"type": "flashcards", "id": "c6-ch05-cards-kite", "title": "Kite parts", "cards": [{"front": "nose", "back": "the tip of a kite"}, {"front": "spine", "back": "the central stick"}, {"front": "cover", "back": "the paper or cloth part"}, {"front": "kite line", "back": "the string"}, {"front": "reel", "back": "what the string is wound on"}, {"front": "tail", "back": "long strip at the end"}]}, {"type": "exercise", "id": "c6-ch05-ex-cinq", "title": "Write your own cinquain", "difficulty": "easy", "minutes": 10, "goal": "Write a five-line cinquain on anything you like.", "behavior": "Follow the pattern: 1 noun; 2 describing words; 3 action words; 2 adverbs; 1 synonym.", "hints": ["Pick a noun.", "Count words per line."], "checklist": ["Five lines", "Correct word counts"], "solution": "Bird\nsmall, bright\nsinging, hopping, flying\nhappily, gracefully\nwinged friend", "solution_lang": "text", "solution_explain": "Each line follows the pattern.", "mode": "selfcheck"}, {"type": "summary", "points": ["Similes compare using 'like' or 'as'.", "Alliteration repeats beginning sounds.", "A cinquain is a five-line poem with a fixed word pattern."]}], "terms": [{"term": "simile", "def": "a comparison using like or as"}, {"term": "cinquain", "def": "a five-line poem with a word pattern"}, {"term": "alliteration", "def": "repeated starting consonant sound"}], "id": "c6u5-02-the-kites", "chapter": "c6u5", "kind": "lesson", "minutes": 20}, "c6u5-03-ila-sachani": {"title": "Ila Sachani: embroidering dreams with her feet", "summary": "Find main ideas, and use synonyms, antonyms and words of quantity.", "source": {"chapter": "ch05", "sections": ["Ila Sachani"], "pages": "51-64"}, "blocks": [{"type": "text", "md": "Ila Sachani, from Gujarat, was born with her hands hanging loose at her sides, yet she became a celebrated embroiderer using her feet. After this lesson you can state the main idea of each paragraph and use synonyms, antonyms and quantity words."}, {"type": "callout", "kind": "analogy", "md": "Main idea and supporting details are like a tree: the idea is the trunk, the details are the branches.", "title": "Picture this"}, {"type": "table", "headers": ["Paragraph", "Main idea"], "rows": [["1", "Introduction to Ila's colourful Kathiawar embroidery"], ["2", "Early challenges and family support"], ["3", "Mother and grandmother teach her embroidery with her feet"], ["4", "She becomes an expert and learns many styles"], ["5", "Her work is admired by family, friends and the village"], ["6", "Recognition at a state exhibition"], ["7", "National exhibitions, awards, the President's Medal"], ["8–9", "Independence, joy, challenges turned into victories"]]}, {"type": "reveal", "prompt": "What does 'art has the power to rise above physical boundaries' mean?", "md": "Art can be created by anyone, whatever their physical limits, and it touches people's hearts."}, {"type": "quiz", "id": "c6-ch05-quiz-ila", "title": "Biography check", "questions": [{"type": "single", "q": "Who first taught Ila embroidery?", "options": ["Her mother and grandmother", "A teacher", "The state government", "A sage"], "answer": 0, "explanation": "Her mother and grandmother.", "hints": ["Paragraph 3."]}, {"type": "single", "q": "What did the exhibition do for Ila?", "options": ["Opened new doors; people bought her work", "Closed her shop", "Made her stop", "Nothing"], "answer": 0, "explanation": "It made her famous.", "hints": ["Paragraph 6."]}, {"type": "single", "q": "'The most important change' for Ila was…", "options": ["new independence", "a bigger house", "moving to Surat", "a new school"], "answer": 0, "explanation": "Independence.", "hints": ["Paragraph 8."]}]}, {"type": "text", "md": "**Synonyms** have similar meanings: *tiny – small, wonderful – fantastic, quiet – silent, task – work, tough – difficult.* **Antonyms** are opposites: *tiny – huge, wonderful – terrible, quiet – noisy, task – pastime, tough – easy.*", "title": "Synonyms and antonyms"}, {"type": "quiz", "id": "c6-ch05-quiz-syn", "title": "Word pairs", "questions": [{"type": "single", "q": "Synonym of *tough*:", "options": ["difficult", "easy", "silent", "happy"], "answer": 0, "explanation": "Difficult.", "hints": ["Similar meaning."]}, {"type": "single", "q": "Antonym of *wonderful*:", "options": ["terrible", "fantastic", "small", "quiet"], "answer": 0, "explanation": "Terrible.", "hints": ["Opposite."]}]}, {"type": "text", "md": "**Words of quantity**: *many* (countable), *much* (uncountable), *lots of*, *some*, *a little*, *few*. *We saw many buses. How much milk do you want? She picked some flowers. I ate a little rice.*", "title": "Words of quantity"}, {"type": "quiz", "id": "c6-ch05-quiz-qty", "title": "Quantity", "questions": [{"type": "single", "q": "*How ___ milk do you want?*", "options": ["many", "much", "few", "several"], "answer": 1, "explanation": "Much.", "hints": ["Milk is uncountable."]}, {"type": "single", "q": "*I need ___ examples.*", "options": ["many", "much", "little", "a little"], "answer": 0, "explanation": "Many.", "hints": ["Examples are countable."]}]}, {"type": "exercise", "id": "c6-ch05-ex-artwork", "title": "Describe your artwork", "difficulty": "easy", "minutes": 10, "goal": "Create something from four or five waste items, then write a paragraph.", "behavior": "Give a title. Use at least two synonyms or adjectives and one quantity word.", "hints": ["Choose items.", "Name your artwork."], "checklist": ["Title", "Two adjectives", "One quantity word"], "solution": "My Paper-Flower Garden\nI used many old cards and some twigs to make flowers. The colours are bright and cheerful. I like it because it is made from waste.", "solution_lang": "text", "solution_explain": "It contains quantity words (many, some) and adjectives.", "mode": "selfcheck"}, {"type": "summary", "points": ["Ila turned a challenge into a victory with hard work and family support.", "Main idea + details organises a text.", "Synonyms, antonyms and words of quantity enrich writing."]}], "terms": [{"term": "synonym", "def": "a word with similar meaning"}, {"term": "antonym", "def": "a word with opposite meaning"}, {"term": "embroidery", "def": "decorative needlework"}], "id": "c6u5-03-ila-sachani", "chapter": "c6u5", "kind": "lesson", "minutes": 15}, "c6u5-99-test": {"title": "Test: Culture and Tradition", "summary": "Check what you learnt in Unit 5.", "kind": "test", "blocks": [{"type": "quiz", "id": "c6-ch05-test", "title": "Unit 5 test", "questions": [{"type": "single", "q": "Aipan is from…", "options": ["Uttarakhand", "Odisha", "Kerala", "Andhra Pradesh"], "answer": 0, "explanation": "Uttarakhand.", "hints": ["Rice paste."]}, {"type": "single", "q": "Dhokra is from…", "options": ["Odisha", "Kerala", "Gujarat", "Bihar"], "answer": 0, "explanation": "Odisha.", "hints": ["Metal craft."]}, {"type": "single", "q": "Which sequencing word starts a list?", "options": ["To begin", "At last", "Finally", "Next"], "answer": 0, "explanation": "To begin.", "hints": ["Beginning."]}, {"type": "single", "q": "*He ___ very loudly.*", "options": ["speak", "speaks", "speaking", "spoke"], "answer": 1, "explanation": "Speaks.", "hints": ["He + -s."]}, {"type": "single", "q": "A simile uses…", "options": ["like or as", "a question mark", "a rhyme", "an apostrophe"], "answer": 0, "explanation": "Like or as.", "hints": ["Comparison words."]}, {"type": "single", "q": "A cinquain has ___ lines.", "options": ["5", "3", "4", "6"], "answer": 0, "explanation": "5.", "hints": ["Five."]}, {"type": "single", "q": "Ila Sachani embroiders with her…", "options": ["feet", "hands", "teeth", "eyes"], "answer": 0, "explanation": "Feet.", "hints": ["Title."]}, {"type": "single", "q": "Synonym of *tiny*:", "options": ["small", "huge", "quiet", "old"], "answer": 0, "explanation": "Small.", "hints": ["Similar."]}, {"type": "single", "q": "*How ___ rice did you eat?*", "options": ["much", "many", "few", "several"], "answer": 0, "explanation": "Much.", "hints": ["Uncountable."]}, {"type": "single", "q": "Kathiawar embroidery comes from…", "options": ["Gujarat", "Punjab", "Goa", "Assam"], "answer": 0, "explanation": "Gujarat.", "hints": ["Moti Vavdi, Bhavnagar."]}], "mode": "test"}], "id": "c6u5-99-test", "chapter": "c6u5", "minutes": 10}, "c7u1-01-river-read": {"title": "The Day the River Spoke: Read and Discuss", "summary": "Read the story of Jahnavi and the River and answer the discussion questions.", "blocks": [{"type": "text", "md": "Welcome to Unit 1, **Learning Together**. Your first story is about a girl who wants to go to school, and a river that gives her courage. First do the two warm-up activities, then read the story (with the **Read aloud** button), then check what you understood."}, {"type": "callout", "kind": "tip", "md": "The story below is **retold in simple words**, scene by scene, so you can follow every event. Read the original in your textbook (English textbook, pp. 2–6) as well; the author is **Kamala Nair** (an extract adapted from *The Day the River Spoke*).", "title": "How to use this lesson"}, {"type": "text", "md": "**Activity I.** Close your eyes for one minute and listen to the sounds around you. Are they trying to tell you something? Do the things around you also listen to you all day long? Share your answers with classmates and the teacher.\n\n**Activity II.** Jahnavi is a bright young girl living with her parents and three brothers in a coastal village in India. Her parents work on the farm. She has a dream. What could it be? How could she make it come true? What is *your* dream, and what can you do to make it come true?", "title": "Before we read"}, {"type": "reveal", "prompt": "Guess first: what do you think Jahnavi's dream is?", "md": "You may have guessed it: she wants to **go to school and learn**. Keep your guess in mind while you read; the River will help her find the courage."}, {"type": "flashcards", "id": "c7-ch01-cards-river-words", "title": "Words from the story (Part I)", "cards": [{"front": "splashed", "back": "fell in drops, making a sound"}, {"front": "slithered", "back": "moved by sliding from side to side"}, {"front": "murmuring", "back": "speaking in a low voice"}, {"front": "startled", "back": "surprised"}, {"front": "thicket", "back": "a dense group of bushes and trees"}, {"front": "shrieked", "back": "made a high-pitched sound"}]}, {"type": "text", "title": "📖 Part I: A voice by the river", "md": "Jahnavi sits by the river and cries. A big, bright tear **splashes** down her nose, and then another. A kingfisher dives past like a blue arrow in the sunlight, and a green lizard **slithers** to the water's edge to bask in the sun.\n\nSuddenly a sleepy, **murmuring** voice says, \"Dear, dear! What's the matter?\"\n\nJahnavi is **startled**. She was sure she was alone. It cannot be the lizard. The kingfisher is up in the bamboo **thicket** eating its fish. It cannot be the parrots, because parrots **shriek**, and this voice is sleepy and soft. She looks around, but there is no one in sight. She is scared and wants to run away.\n\nThe voice goes on: she should not cry, and she should not be scared, because she has been coming here to see it every day, well, almost every day.\n\nShe is puzzled. The voice sounds like the river, but it cannot be the river! Yet it is. The River says, \"Tell me all about it. I have to hurry to reach the sea, you know.\""}, {"type": "text", "title": "📖 Part I (continued): Jahnavi's wish", "md": "Jahnavi explains: **they will not let her go to school**. When she asked her mother why she could not go like her brother Ettan and her sister Meena, Mother said she was too small and should wait. When Jahnavi was five, baby Ramu was born, and Mother still said, \"Maybe next year. Mind your little brother while I go to the fields.\" Now Jahnavi is nearly ten and is minding the youngest, Little Appu. She stops with a sob: \"They don't want me.\"\n\nShe is scared of school and thinks she is too old now. But she **wants** to go. She wants to read like Ettan (it means *elder brother*; his real name is Gopi) and Meena. She wants to know many things: why spiders are yellow in yellow flowers, why bamboo trees **rustle**, why the moon always comes from behind the hills and never the other way, why baby fish in the field water become frogs.\n\n\"Stop!\" says the River. \"So many *whys*! You make me breathless.\" Then it tells her, **conspiratorially** (secretly), where the moon goes: it goes down towards the sea, over the mountains, the same way the river goes."}, {"type": "flashcards", "id": "c7-ch01-cards-river-words2", "title": "Words from the story (Parts I–II)", "cards": [{"front": "rustle", "back": "a light sound made by leaves rubbing against each other"}, {"front": "conspiratorially", "back": "secretly"}, {"front": "clump", "back": "a small group of trees growing together"}, {"front": "rattling", "back": "a noise made by shaking things"}, {"front": "catamaran", "back": "a kind of boat"}, {"front": "wailed", "back": "(here) complained in a loud voice"}]}, {"type": "text", "title": "📖 Part II: The River's advice", "md": "Jahnavi says that even little Ramu goes to school. \"Pity the school isn't by the sea,\" says the River. \"Then I could take you along. But you would get your feet wet, and that would never do!\" There is only **one thing she can do**: it is up to her.\n\nThe River says little girls can do as much as little boys, because they swim as fast as boys. She should slip along one morning, **sit in the school and listen** to what is going on, and maybe the teacher will let her stay.\n\nJahnavi gasps: she could not! They would scare her and chase her out. The River laughs: she is *scared*? She is not afraid of the green lizard, or of the snake in the bamboo clump (Jahnavi is startled, she never knew a snake lived there!), or of the big trains rattling over the bridge. The River adds that trains are noisy; it prefers **ships**.\n\n\"What are ships?\" Jahnavi asks. \"Big boats,\" says the River, \"so big they can carry hundreds of people, and they sail the sea with lights that shine all night.\" Will they come here? No, they are too large. **Chandu's catamaran** is good enough for the River, and Chandu can take her to see a ship someday.\n\n\"They'd never let me!\" wails Jahnavi. \"Try going to school first,\" says the River. \"Remember, it's up to you!\""}, {"type": "text", "title": "📖 Part III: Jahnavi goes to school", "md": "Jahnavi gathers her courage. The next day she runs to school, out of breath, and stands by the door. The teacher is reading a story about a prince called **Ashoka** who became a great king. Little Appu has fallen asleep on her shoulder. She creeps nearer and nearer until she is in the back row, squatting on the earthen floor with the other children. Appu makes no noise and she listens.\n\n\"Where did you spring from, little girl?\" asks the teacher. \"What is your name? You're new.\" A boy says she is Gopi's sister, Gopi is in the next class. Another says her name is Jahnavi. The teacher says, \"If you really, really want to come to my school, we will talk to your father. Don't worry. We'll find a way.\"\n\nThe next evening, while Jahnavi lights the lamp, she sees the teacher climbing the steps to their gate. Her father scratches his cheek the way he does when he is worried, and the teacher nods and talks. Then Mother tells her, \"Girls should learn as much as they want. When I was your age I wanted to go to school, but your grandmother said no. Now I am glad the teacher came.\"\n\nJahnavi tells her mother that when she grows up she will be a **teacher**, go from house to house and invite all the little girls to her school, and teach them everything she learns.\n\nThe next morning she runs along the path between the fields to meet the River. \"I did it! I was scared, but I did it! They're letting me go. I'm going to learn to write my name, do sums, and find out why our little fishes in the rice fields turn into frogs.\" She hears the River's sleepy chuckle: \"Come again, little girl, and I'll tell you all about the ships that sail the sea.\""}, {"type": "callout", "kind": "key", "md": "Courage often means doing the thing that scares you **one small step at a time**. The River did not do it for her, it only said, \"It's up to you.\""}, {"type": "quiz", "id": "c7-ch01-quiz-river-discuss1", "title": "Let us discuss: after Part I", "questions": [{"type": "single", "q": "What is Jahnavi's dream?", "options": ["To sail on a ship right away", "To go to school and learn to read", "To become a kingfisher", "To swim faster than her brothers"], "answer": 1, "explanation": "She repeatedly says she wants to learn to read like Ettan and Meena. The ship is something the River adds later.", "hints": ["Look at what she says she wants to do 'like Ettan and Meena'."]}, {"type": "truefalse", "q": "Jahnavi thinks the voice belongs to a parrot.", "answer": false, "explanation": "She rules out the parrots because they shriek, while this voice is sleepy and soft. In the end she realises it is the River.", "hints": ["Remember how she checks the lizard, the kingfisher and the parrots."]}, {"type": "single", "q": "Do you think the River can help her? What is its main help?", "options": ["It carries her to the school", "It gives her courage and a plan", "It scares her brothers", "It teaches her to read"], "answer": 1, "explanation": "The River cannot walk to school with her. It gives her a plan (go and listen in the class) and the belief that it is up to her.", "hints": ["Think about 'Try going to school first… it's up to you.'"]}]}, {"type": "text", "md": "**Complete the table.** The book asks you to fill Column 1 with Jahnavi's questions and Column 2 with the River's answers. Match them below."}, {"type": "quiz", "id": "c7-ch01-quiz-river-table", "title": "Complete the table: questions and answers", "questions": [{"type": "single", "q": "Jahnavi asks about \"…why the moon always comes from behind the hills…?\" What does the River answer?", "options": ["It goes down towards the sea, over the mountains, like me", "It hides behind the clouds", "It follows the trains", "It goes to sleep in the bamboo"], "answer": 0, "explanation": "The River says it has seen the moon take the same way every time: over the mountains and down to the sea.", "hints": ["The River says the moon is just like itself."]}, {"type": "single", "q": "Jahnavi: \"Can I do something?\" The River's reply says that ______.", "options": ["little girls can do as much as little boys", "girls must stay home", "school is too far", "ships are too big"], "answer": 0, "explanation": "The River uses the fact that girls swim as fast as boys to show they can do as much.", "hints": ["It is about girls and boys being equal."]}, {"type": "single", "q": "Jahnavi: \"What are ships?\" What does the River say?", "options": ["Big boats that carry hundreds of people and shine with lights all night", "Small boats like Chandu's", "Noisy trains on a bridge", "Rafts made of bamboo"], "answer": 0, "explanation": "This is the River's description of a ship.", "hints": ["Think 'big', 'hundreds', 'lights'."]}, {"type": "single", "q": "Jahnavi: \"Will they come here?\" The River says:", "options": ["Yes, tomorrow", "I'm afraid not, they are too large", "Only at night", "Only if you go to school"], "answer": 1, "explanation": "Ships are too large to come up the river; Chandu's catamaran is enough for the River.", "hints": ["The River is polite but says no."]}]}, {"type": "quiz", "id": "c7-ch01-quiz-river-order", "title": "Retell the story in order", "questions": [{"type": "order", "q": "Put the events in order.", "items": ["Jahnavi cries by the river and a sleepy voice speaks", "She tells the River why she cannot go to school", "The River advises her to go and listen in class", "She goes to school and creeps into the back row", "The teacher talks to her father", "She tells the River, \"I did it!\""], "explanation": "This is the order of the three parts of the story.", "hints": ["Part I, then II, then III."]}]}, {"type": "summary", "points": ["Jahnavi wants to go to school, but she has to mind her little brother and she is scared.", "The River speaks to her kindly and tells her it is up to her to try.", "She gathers courage, listens in class, and the teacher persuades her father.", "Her mother, who was once refused school, supports her; Jahnavi dreams of becoming a teacher."]}], "minutes": 25, "terms": [{"term": "thicket", "def": "a dense group of bushes and trees"}, {"term": "conspiratorially", "def": "secretly"}, {"term": "catamaran", "def": "a kind of boat"}, {"term": "wailed", "def": "complained in a loud voice"}], "source": {"chapter": "ch01", "sections": ["Before we read", "Let us read I–III", "Let us discuss"], "pages": "1–6"}, "id": "c7u1-01-river-read", "chapter": "c7u1", "kind": "lesson"}, "c7u1-02-river-reflect": {"title": "The River: Think and Reflect", "summary": "Answer the extract-based and long-answer questions on the story.", "blocks": [{"type": "text", "md": "In this lesson you answer the questions from **Let us think and reflect**. First the two extracts (short answers), then seven longer questions. Try each one yourself before you open the answer."}, {"type": "callout", "kind": "example", "md": "*Extract 1:* The River says Jahnavi should not cry or be scared, since she has been coming to see it every day. She is puzzled, and the River asks her to tell it all, as it must hurry to the sea.", "title": "Extract 1 in short"}, {"type": "quiz", "id": "c7-ch01-quiz-river-ext1", "title": "Extract 1: the voice by the river", "questions": [{"type": "single", "q": "The tone of the River in this extract is ______.", "options": ["assuring", "sympathising"], "answer": 0, "explanation": "The River calms her: don't cry, don't be scared. That is *assuring*. (It does comfort her too, but the lines are mainly reassurance.)", "hints": ["Is it saying 'I feel sorry for you' or 'it will be all right'?"]}, {"type": "fill", "q": "Write a phrase from the extract that shows Jahnavi was a frequent visitor.", "answer": "coming here to see me every day", "explanation": "The River says she has been coming here to see it every day, well, almost every day.", "placeholder": "a phrase from the lines", "hints": ["Look for 'every day'."]}, {"type": "single", "q": "The exclamation mark in 'It couldn't be the river!' expresses ______.", "options": ["excitement", "hesitation", "irritation", "disbelief"], "answer": 3, "explanation": "She cannot believe that a river is speaking, so it is *disbelief*.", "hints": ["How would you feel if a river spoke to you?"]}, {"type": "multi", "q": "Choose three qualities of the River in the extract.", "options": ["affectionate", "forgiving", "thoughtful", "impatient", "kind-hearted"], "answer": [0, 2, 4], "explanation": "The River is affectionate (it calls her 'dear'), thoughtful (it checks why she cries) and kind-hearted. 'Forgiving' and 'impatient' are not shown here.", "hints": ["Choose qualities that show caring."]}]}, {"type": "callout", "kind": "example", "md": "*Extract 2:* \"Can I do something?\" asks Jahnavi. The River says little girls can do as much as little boys since they swim as fast. She can slip into school and listen. Jahnavi says they would scare her and chase her out.", "title": "Extract 2 in short"}, {"type": "quiz", "id": "c7-ch01-quiz-river-ext2", "title": "Extract 2: the River's advice", "questions": [{"type": "fill", "q": "According to the River, there is no difference between girls and boys because ______. (finish the sentence)", "answer": ["they swim as fast as boys", "girls swim as fast as boys", "little girls swim as fast as little boys"], "explanation": "The River gives the example of swimming speed.", "placeholder": "because …", "hints": ["Think of what they do in water."]}, {"type": "truefalse", "q": "The River encourages Jahnavi to have faith in herself and fulfil her desire to go to school.", "answer": true, "explanation": "It tells her to try, and ends with 'it's up to you!'", "hints": ["Does the River do her work for her?"]}, {"type": "single", "q": "When the River says she should 'slip along', she should move ______.", "options": ["quickly", "casually", "quietly", "confidently"], "answer": 2, "explanation": "'Slip' suggests going without being noticed, so *quietly*.", "hints": ["Do you slip into a room noisily?"]}, {"type": "single", "q": "What does the repetition of 'I couldn't' tell us?", "options": ["She is lazy", "She lacks confidence and is very afraid", "She is angry with the River", "She does not like school"], "answer": 1, "explanation": "Repeating the phrase shows her fear and low self-belief.", "hints": ["Is she saying it calmly or in a panic?"]}]}, {"type": "text", "md": "**Long answers.** The questions below ask for a few sentences. Write your own answer first in your notebook, then compare with the model answer."}, {"type": "reveal", "prompt": "1. Why does the writer describe different aspects of nature in great detail at the beginning of the story? Why do you think the writer does this?", "md": "The tear, the kingfisher and the lizard create a calm, real **riverside setting**. It makes the reader feel the scene, and it prepares us for the talking River as part of nature. It also shows that Jahnavi spends many quiet hours here, so the River knows her."}, {"type": "reveal", "prompt": "2. How did the River know so much about Jahnavi?", "md": "She had been coming to the river **almost every day**, sitting by it and crying or dreaming. The River, flowing past, had seen her many times (and the River also knows the snake in the clump, the trains on the bridge and Chandu's catamaran, because it flows through the village)."}, {"type": "reveal", "prompt": "3. Jahnavi says, \"And I'm so old now, they'll never let me go.\" What can you infer?", "md": "She is nearly ten, and she thinks she has missed the age for starting. We can infer that **children in her village start school much younger**, that she believes the family has given up on her studies, and that she feels sad and left behind."}, {"type": "reveal", "prompt": "4. Why did the River laugh when Jahnavi said she would be scared at school?", "md": "Because she was **already brave** in many situations: she was not afraid of the lizard, the snake in the bamboo clump or the noisy trains. The River found it funny that a girl who faces these without fear thinks school is scarier."}, {"type": "reveal", "prompt": "5. Why should Jahnavi follow the River's advice?", "md": "The advice is **practical and safe**: she only has to go and listen. It uses her strengths, it does not force her, and she gets the chance to be seen by the teacher. In the story it works!"}, {"type": "reveal", "prompt": "6. How does the conversation between Jahnavi and the River make the story more appealing?", "md": "The dialogue makes the River a **character** with a sleepy, kind voice and a sense of humour. It is more lively and fun than if the author only told us what happened, and it lets us hear Jahnavi's feelings directly."}, {"type": "reveal", "prompt": "7. What is the main message the writer intends to convey?", "md": "**Every girl has the right to education.** With courage and a little encouragement we can overcome fear and social obstacles, and one person (here the River, then the teacher and mother) can help change attitudes."}, {"type": "exercise", "id": "c7-ch01-ex-river-letter", "title": "Write your own answer: 'Who is your River?'", "difficulty": "easy", "minutes": 8, "goal": "Write 4–5 sentences about a person or thing that gave you courage, like the River did for Jahnavi.", "behavior": "Use the model answers above as your guide: say who or what helped, what they said or did, and how you felt after.", "hints": ["Think of a teacher, friend, family member, or even a book.", "Start with: 'My River is …'", "Finish with what you did that you were scared to do."], "checklist": ["I named the person or thing", "I said what they did or said", "I described how I felt before and after", "I used at least two describing words"], "solution": "My River is my older cousin. When I was afraid to speak in class, she told me, 'Just say the first line, the rest will follow.' I stood up, my voice shook, but I did it. Now I feel braver every time I try.", "solution_lang": "text", "solution_explain": "A good answer names the helper, shows the helper's words or action, and ends with the change in you.", "mode": "selfcheck"}, {"type": "summary", "points": ["The River's tone is assuring and its qualities are affectionate, thoughtful and kind-hearted.", "The River argues that girls can do as much as boys, and it encourages self-belief.", "The repeated 'I couldn't' shows Jahnavi's fear, and the River's laughter shows her hidden bravery.", "The main message is that girls must be allowed to learn, and courage grows by trying."]}], "minutes": 25, "source": {"chapter": "ch01", "sections": ["Let us think and reflect I and II"], "pages": "7–8"}, "id": "c7u1-02-river-reflect", "chapter": "c7u1", "kind": "lesson"}, "c7u1-03-river-language": {"title": "The River: Words and Grammar", "summary": "Capital letter for a personified noun, sound words, loanwords, boats, prepositions and adverbs.", "blocks": [{"type": "text", "md": "This lesson covers the seven parts of **Let us learn**: nouns, sound words, loan words, boats, a crossword, prepositions, and words that can be both prepositions and adverbs."}, {"type": "text", "md": "**I. Why 'River' with a capital letter?** Nouns are naming words. Only **proper nouns** (names of particular persons, places, things) begin with a capital letter. 'River' is a common noun, but the author writes it with a capital because the River is given **human qualities**: it talks, advises, laughs and has feelings. This is called **personification**: the River is treated like a person, so it gets a name-like capital letter.", "title": "I. Capital 'R'"}, {"type": "quiz", "id": "c7-ch01-quiz-river-noun", "title": "Check: proper and common nouns", "questions": [{"type": "single", "q": "Why does the author write 'River' with a capital letter?", "options": ["Because it is the first word of a sentence", "Because the River is treated like a person with human qualities", "Because rivers are always proper nouns", "Because it is a long word"], "answer": 1, "explanation": "It is a common noun, but personification makes it a character.", "hints": ["Think of what the River can do that a river cannot."]}, {"type": "multi", "q": "Which of these are proper nouns?", "options": ["Jahnavi", "river", "Ashoka", "school", "Chandu"], "answer": [0, 2, 4], "explanation": "Names of particular persons are proper nouns; 'river' and 'school' are common nouns here.", "hints": ["Does it name one particular person?"]}]}, {"type": "text", "md": "**II. Sound words.** The story is full of sound words. Match each meaning with a word from the text. (You can try before you open the answers.)", "title": "II. Sound words"}, {"type": "table", "headers": ["#", "Meaning", "Word"], "rows": [["1", "made a high-pitched piercing sound", "shrieked"], ["2", "to cause liquid to strike or fall on something", "splashed"], ["3", "a low continuous background noise", "murmuring"], ["4", "cry with loud uncontrollable gasps", "sob"], ["5", "a soft dry sound, like paper or leaves moving", "rustle"], ["6", "took a short quick breath due to surprise, pain or shock", "gasped"], ["7", "shaking rapidly to make continuous short, sharp sounds", "rattling"], ["8", "making a lot of noise", "noisy"], ["9", "made a long, high cry, usually because of pain or sadness", "wailed"]]}, {"type": "quiz", "id": "c7-ch01-quiz-river-sound", "title": "Fill the paragraph with sound words", "questions": [{"type": "fill", "q": "The classroom grew ______ as the students noticed the teacher carrying the answer papers.", "answer": ["noisy"], "explanation": "Many children talking at once makes a classroom noisy.", "placeholder": "sound word", "hints": ["Use word 8."]}, {"type": "fill", "q": "As the teacher turned the pages with a ______, the children gasped.", "answer": ["rustle"], "explanation": "Turning paper makes a soft dry sound, a rustle.", "placeholder": "sound word", "hints": ["Word 5."]}, {"type": "fill", "q": "The children ______, wondering what comments awaited.", "answer": ["gasped"], "explanation": "A quick breath of nervous surprise: gasped.", "placeholder": "sound word", "hints": ["Word 6."]}, {"type": "fill", "q": "Someone ______ in frustration.", "answer": ["sobbed", "wailed", "sob"], "explanation": "Crying in frustration can be sobbing or wailing. (Either fits.)", "placeholder": "sound word", "hints": ["Words 4 or 9."]}, {"type": "fill", "q": "And the ______ of the students steadily increased.", "answer": ["murmuring", "murmur"], "explanation": "A low continuous background noise: murmuring.", "placeholder": "sound word", "hints": ["Word 3."]}, {"type": "fill", "q": "When the teacher praised them, the students ______ with excitement.", "answer": ["shrieked", "wailed"], "explanation": "A high-pitched excited cry: shrieked.", "placeholder": "sound word", "hints": ["Word 1."]}]}, {"type": "text", "md": "**III. Loan words.** 'Catamaran' comes from the Tamil *kattu maram*, meaning 'tied wood'. English has borrowed many words from Indian languages. Find the meanings and the language each word came from (use a dictionary). Here is a guide:\n\n- **karma** (Sanskrit): action and its result\n- **sahib**: a polite word for 'sir' or 'master' (from Arabic through Urdu/Hindi)\n- **chutney**: a spicy or sweet relish (Hindi)\n- **guru**: teacher or guide (Sanskrit)\n- **verandah**: a covered open area along a house (from Hindi)\n- **jungle**: a thick forest (Hindi, from Sanskrit)\n- **areca**: the palm that gives the betel nut (from Malayalam and Tamil)\n- **palanquin**: a covered seat carried on poles by bearers (from Sanskrit)", "title": "III. Words borrowed from India"}, {"type": "callout", "kind": "note", "md": "Dictionaries sometimes give slightly different origins (a word may travel through Portuguese or Persian first). Check your own dictionary and write what *it* says.", "title": "Note"}, {"type": "quiz", "id": "c7-ch01-quiz-river-loan", "title": "Loan words", "questions": [{"type": "single", "q": "'Catamaran' comes from the Tamil words *kattu maram*. What does it mean?", "options": ["tied wood", "big boat", "sea wave", "fisherman"], "answer": 0, "explanation": "Kattu = tied, maram = wood: logs tied together.", "hints": ["Look at the book's own explanation."]}, {"type": "fill", "q": "'Guru' is from the language ______.", "answer": ["sanskrit"], "explanation": "Guru is a Sanskrit word for teacher.", "placeholder": "language", "hints": ["One of the oldest Indian languages."]}]}, {"type": "text", "md": "**IV. Boats of India.** Chandu the fisherman has a catamaran. Four boats used in different parts of the country are shown in your book: **canoe, catamaran, coracle (a round basket-like boat), shikara (a Kashmir lake boat, shown as a decorated long boat)**. Answer in your notebook: (i) Which one would you like to travel in? (ii) Draw a colourful picture of a boat you would like to travel in.", "title": "IV. Boats"}, {"type": "exercise", "id": "c7-ch01-ex-river-boat", "title": "My dream boat", "difficulty": "easy", "minutes": 6, "goal": "Describe the boat you would like to travel in and say why.", "behavior": "Write 3 sentences: name of boat, what you would see, who comes with you. Draw it if you wish.", "hints": ["Think of water, scenery and company.", "Start with 'I would like to travel in a …'"], "checklist": ["I chose one boat", "I gave a reason", "I described what I would see or hear"], "solution": "I would like to travel in a shikara because it floats slowly on a calm lake. I would see mountains and flowers on the water, and I would sit with my grandmother and drink tea.", "solution_lang": "text", "solution_explain": "Any boat works as long as you give a reason and a picture in words.", "mode": "selfcheck"}, {"type": "text", "md": "**V. Crossword on water transport.** Here are the clues and answers. Try them first!\n\n**Across:** 1. a large vessel for goods or passengers by sea; 2. a small vessel on water, with oars, sails or an engine; 3. a flat floating structure for crossing water; 4. a boat or ship driven by steam.\n\n**Down:** 5. a small, light, narrow boat pointed at both ends, moved with a paddle; 6. a boat with a powerful engine that pulls large ships into and out of port; 7. a boat with sails (rhymes with 'cot').", "title": "V. Crossword"}, {"type": "quiz", "id": "c7-ch01-quiz-river-cross", "title": "Solve the crossword", "questions": [{"type": "fill", "q": "1 Across: a large vessel used for transporting goods or passengers by sea", "answer": ["ship"], "explanation": "The grid starts with S at 1 across.", "placeholder": "word", "hints": ["4 letters."]}, {"type": "fill", "q": "2 Across: a small vessel propelled by oars, sails or an engine", "answer": ["boat"], "explanation": "Letters O and T are given.", "placeholder": "word", "hints": ["4 letters."]}, {"type": "fill", "q": "3 Across: a flat floating structure for travelling across water", "answer": ["raft"], "explanation": "Starts with R.", "placeholder": "word", "hints": ["4 letters."]}, {"type": "fill", "q": "4 Across: a boat or ship driven by steam", "answer": ["steamer"], "explanation": "Ends with M E R in the grid.", "placeholder": "word", "hints": ["7 letters."]}, {"type": "fill", "q": "5 Down: a small, light, narrow boat moved with a paddle", "answer": ["canoe"], "explanation": "Starts with C.", "placeholder": "word", "hints": ["5 letters."]}, {"type": "fill", "q": "6 Down: a boat with a powerful engine used to pull large ships", "answer": ["tugboat", "tug boat", "tug"], "explanation": "The grid starts with T, U, G, B…", "placeholder": "word", "hints": ["7 letters (tugboat)."]}, {"type": "fill", "q": "7 Down: a boat with sails for racing or pleasure (rhymes with 'cot')", "answer": ["yacht"], "explanation": "Starts with Y, the 'ch' is silent.", "placeholder": "word", "hints": ["5 letters."]}]}, {"type": "text", "md": "**VI. Prepositions.** In 'She goes down **towards** the sea… **over** the mountains and **down** to the sea', the highlighted words are **prepositions**: words that show the relationship between nouns or pronouns and other parts of a sentence. They show **direction, location, time** or logical relationships. A preposition is always followed by an object (a noun or pronoun).", "title": "VI. Prepositions"}, {"type": "quiz", "id": "c7-ch01-quiz-river-prep", "title": "Jahnavi's first day at school: choose the preposition", "questions": [{"type": "single", "q": "On her first day ______ school, Jahnavi stood nervously…", "options": ["at", "in", "on"], "answer": 0, "explanation": "'At school' is the usual phrase for a place of study.", "hints": ["'At the market', 'at school'."]}, {"type": "single", "q": "…stood nervously ______ the gate", "options": ["in", "outside", "above"], "answer": 1, "explanation": "She is nervous, so she stands outside the gate.", "hints": ["She has not entered yet."]}, {"type": "single", "q": "The bell rang and she hurried ______ the bustling classroom.", "options": ["outside", "through", "inside"], "answer": 2, "explanation": "She goes inside. (A path through a doorway is also possible.)", "hints": ["She hurried to get in."]}, {"type": "single", "q": "She found a seat ______ two friendly classmates.", "options": ["among", "between", "from"], "answer": 1, "explanation": "Two people: 'between'. 'Among' is for three or more.", "hints": ["How many classmates?"]}, {"type": "single", "q": "The teacher started the lesson ______ numbers.", "options": ["about", "in", "for"], "answer": 0, "explanation": "'A lesson about numbers.'", "hints": ["Topic of a lesson."]}, {"type": "single", "q": "Jahnavi felt excited ______ the new adventure ahead.", "options": ["at", "about", "for"], "answer": 1, "explanation": "'Excited about' something is the usual phrase.", "hints": ["Think: excited ___ the trip."]}]}, {"type": "text", "md": "**VII. Prepositions that are also adverbs.** In 'A kingfisher swept **down**…', *down* describes the verb *swept*, so it is an **adverb**. Words like *on, off, up, down* can be both. Remember: a preposition is always followed by an object (noun), whereas an adverb tells you more about the action (verb).\n\n- She ran **up** the stairs. (preposition: followed by 'the stairs')\n- She rang me **up**. (adverb: describes how she 'rang')", "title": "VII. Preposition or adverb?"}, {"type": "quiz", "id": "c7-ch01-quiz-river-prep2", "title": "Fill in the blanks with a preposition or adverb", "questions": [{"type": "fill", "q": "The cat jumped ______ the table. (preposition)", "answer": ["on", "onto", "over", "off", "under"], "explanation": "Any fitting preposition is accepted, for example on, onto, over.", "placeholder": "word", "hints": ["What can a cat do to a table?"]}, {"type": "fill", "q": "The children played ______ until dark. (adverb)", "answer": ["outside", "out", "around", "about"], "explanation": "An adverb with no object: outside.", "placeholder": "word", "hints": ["No noun follows."]}, {"type": "fill", "q": "She quickly ran ______ the park. (preposition)", "answer": ["through", "across", "around", "into", "to"], "explanation": "For example through, across or around.", "placeholder": "word", "hints": ["Direction."]}, {"type": "fill", "q": "The helicopter was hovering ______. (adverb)", "answer": ["overhead", "above", "around", "nearby", "about"], "explanation": "Adverbs such as overhead, above or around fit.", "placeholder": "word", "hints": ["Where did it hover?"]}, {"type": "fill", "q": "We were just walking ______, chatting. (adverb)", "answer": ["along", "around", "about"], "explanation": "'Walking along' or 'walking around'.", "placeholder": "word", "hints": ["No object follows."]}, {"type": "fill", "q": "
