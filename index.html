ght", "hangs his lamp at the hut door and goes to sleep", "goes back up the line and waves his lamp to the approaching engine"]]}, {"type": "quiz", "id": "c7-ch04-quiz-tunnel-1", "title": "Let us discuss: Part I", "questions": [{"type": "multi", "q": "Suraj compares the train to a magical creature. Which phrases convey this?", "options": ["green, black and gold dragon", "beautiful monster out of Suraj's dreams", "two straight black serpents", "a plume of smoke"], "answer": [0, 1], "explanation": "The dragon and the beautiful monster describe the engine itself ('serpents' describe the rails).", "hints": ["Which phrases describe the engine?"]}, {"type": "fill", "q": "Suraj knew that the train was close by because ______.", "answer": ["he heard the shrill whistle of the engine", "he heard a sound like distant thunder from the tunnel", "he heard the whistle"], "explanation": "He heard the whistle and then the thunder-like sound from the tunnel.", "placeholder": "reason", "hints": ["He could not see it."]}, {"type": "fill", "q": "What did Suraj see inside the tunnel? (damp walls, a bat and a ______)", "answer": ["lizard"], "explanation": "The walls were damp and sticky; a bat flew past; a lizard scuttled between the lines.", "placeholder": "animal", "hints": ["Reptile."]}, {"type": "single", "q": "What does Sunder Singh convey about the tunnel?", "options": ["He has lent it to the Government", "It is damp and sticky inside"], "answer": 0, "explanation": "He says it is truly his tunnel and he has only lent it to the Government.", "hints": ["His playful claim."]}, {"type": "fill", "q": "In the flow chart, daytime with danger found: he walks back and waves a ______ flag.", "answer": ["red"], "explanation": "A red flag by day; a lamp by night.", "placeholder": "colour", "hints": ["Colour."]}]}, {"type": "text", "title": "📖 Part II: The night mail and the leopard", "md": "The next evening, at dusk, flying foxes swoop out of the trees and Suraj goes to the hut. The earth is cooling; a breeze carries the scent of mango blossoms and the promise of rain. Sunder Singh has watered his garden and boils tea: \"There is nothing like a glass of hot tea while waiting for a train.\" They listen to the tailorbird and the noisy **seven sisters** (jungle babblers).\n\nAs twilight fades, the birds fall silent. Sunder Singh lights his lamp and goes to inspect the tunnel. In the dark the trees seem to move closer; Suraj hears the forest's night sounds: a barking deer, a fox, the quaint tonk-tonk of a nightjar, and creakings and whisperings from trees as though stretching their limbs.\n\nInside the tunnel Sunder Singh trims his lamp. He senses a padded footfall and a rustle of dry leaves and stands still. Ten minutes remain before the night mail. Back at the cot, both hear a **rhythmic sawing sound**: \"It's the leopard. I think it's in the tunnel. If we don't drive it out, it will be run over and killed. I can't let that happen.\" Suraj asks if it will attack. \"Not this leopard. It knows me well. It has a weakness for goats and stray dogs, but it will not harm us. Even so, I'll take my axe.\" Suraj insists on going: \"It will be better than sitting here alone in the dark!\"\n\nSunder Singh walks in with his lamp, shouting; Suraj follows, throat too dry to shout. After twenty paces the lamp falls on the leopard, crouching five metres away: lithe, sinewy, baring its teeth and snarling, tail twitching. Both shout together; the leopard, uncertain how many terrifying humans there are, turns and disappears into the dark. They walk the length of the tunnel to be sure. At the entrance the rails begin to hum. Suraj feels the **tremor**, hears the rumble, and the engine comes round the bend hissing, scattering sparks, defying the jungle, charging into the tunnel and thundering past him like the dragon of his dreams. Then silence returns and the forest seems to breathe again.\n\nAlmost a week later Suraj and his father travel in the same night mail. His father, doing accounts, is taking him to Delhi on business, for he complains: \"I don't know where he gets to, most of the time. I think it's time he learnt something about my business.\" Suraj sits at the open window. He hears the rumble over a small bridge and, as the engine whistles shrilly, sees **the lamp**. He cannot see Sunder Singh but knows his friend is there. The train goes through the tunnel and across the endless plains. Suraj thinks of the lonely cutting and the watchman with the lamp, who will always remain **a firefly for those travelling thousands** as he lights up the darkness for steam engines and leopards.\n\n*Ruskin Bond*"}, {"type": "quiz", "id": "c7-ch04-quiz-tunnel-2", "title": "Let us discuss: Part II", "questions": [{"type": "fill", "q": "Sunder Singh knew that the leopard was in the tunnel because ______.", "answer": ["he heard a rhythmic sawing sound", "of the sawing sound", "he heard a sawing sound"], "explanation": "A sawing sound (the leopard's rasping breath/call) and earlier a padded footfall.", "placeholder": "reason", "hints": ["Sound."]}, {"type": "single", "q": "Why do you think Suraj was unable to shout in the tunnel in the beginning?", "options": ["He was afraid of the leopard", "He didn't want to disturb it", "He was listening for it", "He didn't believe Sunder Singh"], "answer": 0, "explanation": "His throat was dry with fear.", "hints": ["Dry throat."]}, {"type": "fill", "q": "What made the leopard disappear into the darkness? Their ______.", "answer": ["shouts", "shouting", "voices"], "explanation": "Their loud shouts frightened it; it was unsure how many humans were there.", "placeholder": "word", "hints": ["Noise."]}, {"type": "single", "q": "How did Suraj know Sunder Singh was at the tunnel?", "options": ["He saw the lamp", "He heard him shout", "He saw the red flag", "He smelt the tea"], "answer": 0, "explanation": "He saw the lamp from the train.", "hints": ["Night signal."]}, {"type": "single", "q": "Why did Suraj's father take him to Delhi?", "options": ["He wanted Suraj to learn about his business", "To visit the leopard", "To buy a train", "For a holiday"], "answer": 0, "explanation": "He complained Suraj wanders about and should learn about his business.", "hints": ["His complaint."]}]}, {"type": "summary", "points": ["Suraj loves steam engines and explores a tunnel; he meets watchman Sunder Singh.", "The watchman uses a red flag or lamp to warn drivers.", "One night they drive a leopard out of the tunnel before the train arrives.", "Later Suraj sees the lamp from the train; Sunder Singh is a 'firefly' in the dark."]}], "minutes": 40, "terms": [{"term": "embankment", "def": "a raised wall of earth or stone that carries a railway"}, {"term": "night mail", "def": "a train that runs at night"}], "source": {"chapter": "ch04", "sections": ["Before we read", "Let us read I–II", "Let us discuss"], "pages": "139–149"}, "id": "c7u4-01-tunnel-read", "chapter": "c7u4", "kind": "lesson"}, "c7u4-02-tunnel-reflect": {"title": "The Tunnel: Reflect", "summary": "Extract questions and long answers.", "blocks": [{"type": "quiz", "id": "c7-ch04-quiz-tunnel-ext1", "title": "Extract 1: inside the tunnel", "questions": [{"type": "truefalse", "q": "Suraj looked back at the opening of the tunnel to check if the train was coming.", "answer": false, "explanation": "He looked back to reassure himself that there was daylight outside.", "hints": ["Dark tunnel."]}, {"type": "single", "q": "Suraj did not stop anywhere in the tunnel because ______.", "options": ["there was nothing to see in the tunnel", "the tunnel was damp and sticky", "he was in a hurry", "another train was due"], "answer": 0, "explanation": "'There was nothing to do in the tunnel and nothing to see.'", "hints": ["His own words."]}, {"type": "single", "q": "'Till then, the cutting belonged to the jungle again' means ______.", "options": ["with no train for hours, the jungle's animals and sounds took over", "the jungle was cut down", "trains stopped forever", "the cutting was sold"], "answer": 0, "explanation": "Between trains, nature reclaims the place.", "hints": ["Who lives here between trains?"]}, {"type": "single", "q": "Suraj wanted to know the inside of the tunnel. This highlights his ______.", "options": ["curiosity and love of adventure", "fear", "laziness", "anger"], "answer": 0, "explanation": "He wants to experience the tunnel.", "hints": ["He walks through just to know."]}]}, {"type": "quiz", "id": "c7-ch04-quiz-tunnel-ext2", "title": "Extract 2: 'Not this leopard'", "questions": [{"type": "fill", "q": "What was the watchman's concern?", "answer": ["the leopard would be run over and killed", "that the leopard would be killed by the train", "the leopard would be killed"], "explanation": "If the leopard stays in the tunnel, it will be run over.", "placeholder": "concern", "hints": ["His reason for going in."]}, {"type": "fill", "q": "Sunder Singh was sure the leopard would not attack because ______.", "answer": ["it knows him well", "they have seen each other many times", "it knew him"], "explanation": "They have seen each other many times.", "placeholder": "reason", "hints": ["His words."]}, {"type": "multi", "q": "Select the TRUE sentences.", "options": ["Suraj wants to see the leopards in the jungle.", "The leopard in the tunnel attacks goats and stray dogs.", "Sunder Singh wants to protect Suraj.", "Sunder Singh knows all about the animals in the jungle."], "answer": [1, 2, 3], "explanation": "The leopard has a weakness for goats and stray dogs; Sunder Singh tells Suraj to stay safe; and he knows the animals well. Nothing says Suraj is hoping to see leopards.", "hints": ["Check each against the text."]}, {"type": "single", "q": "Sunder Singh decides to take his axe. This tells us that he was ______.", "options": ["violent", "cautious", "bold", "afraid"], "answer": 1, "explanation": "He trusts the leopard but is careful all the same.", "hints": ["He said 'even so'."]}]}, {"type": "text", "md": "**Long answers: models.**"}, {"type": "reveal", "prompt": "1. What does Sunder Singh convey by saying he lent his tunnel to the Government?", "md": "He feels **ownership and pride**, since no one else wants the lonely tunnel; the remark is humorous and shows he cares for it as his own."}, {"type": "reveal", "prompt": "2. 'It is safer in the forest than in the town.' What example does he give?", "md": "He was almost run over by a bus in town. It shows he is **comfortable in the jungle** and dislikes town traffic."}, {"type": "reveal", "prompt": "3. He has become part of the jungle life: support.", "md": "He knows the leopard and its habits, naps when the animals rest, grows marigolds and vegetables, knows the birds' calls, and walks safely at night."}, {"type": "reveal", "prompt": "4. What draws Sunder Singh and Suraj together?", "md": "Their **love of the jungle, trains and adventure**, the watchman's loneliness and the boy's curiosity; they trust and respect each other."}, {"type": "reveal", "prompt": "5. Why is Sunder Singh called a 'firefly'?", "md": "His small lamp **glows in the dark** and guides trains safely, like a firefly lighting the night for thousands of passengers who never meet him."}, {"type": "reveal", "prompt": "6. Is Suraj an adventure-loving boy?", "md": "Yes: he cycles out alone, waits for the train, walks through a dark tunnel, goes with the watchman to drive out the leopard and wants to see the night mail."}, {"type": "summary", "points": ["Suraj's curiosity and love of adventure show in the tunnel walk.", "Sunder Singh is cautious, caring and part of the jungle.", "The 'firefly' image shows how a small light can guide many.", "The leopard is driven away to keep it safe."]}], "minutes": 30, "terms": [{"term": "cautious", "def": "careful to avoid danger"}], "source": {"chapter": "ch04", "sections": ["Let us think and reflect"], "pages": "149–151"}, "id": "c7u4-02-tunnel-reflect", "chapter": "c7u4", "kind": "lesson"}, "c7u4-03-tunnel-language": {"title": "The Tunnel: Language Work", "summary": "Phrases, sound words, would and used to, colons and semicolons.", "blocks": [{"type": "text", "md": "In this lesson you practise phrases from the story, sound words, the difference between **would** and **used to**, and two punctuation marks: the **colon** and the **semicolon**."}, {"type": "quiz", "id": "c7-ch04-quiz-tunnel-phrases", "title": "Complete with phrases from the text", "questions": [{"type": "single", "q": "We could hear the ______ of the train long before it came into view at the station.", "options": ["approaching engine", "drifting smoke", "sawing sound", "flickering lights"], "answer": 0, "explanation": "You hear an engine as it approaches.", "hints": ["Sound that comes first."]}, {"type": "single", "q": "The street was dark but the little boy walked home guided by the ______ from the houses.", "options": ["flickering lights", "drifting smoke", "sawing sound", "approaching engine"], "answer": 0, "explanation": "Lights in a dark street.", "hints": ["Guide in the dark."]}, {"type": "single", "q": "The ______ from the carpenter's workshop grew louder every hour.", "options": ["sawing sound", "drifting smoke", "flickering lights", "approaching engine"], "answer": 0, "explanation": "A carpenter saws wood.", "hints": ["Workshop noise."]}, {"type": "single", "q": "From the balcony she watched the ______ from her neighbour's chimney float across the backyard.", "options": ["drifting smoke", "sawing sound", "flickering lights", "approaching engine"], "answer": 0, "explanation": "Smoke floats.", "hints": ["From a chimney."]}]}, {"type": "table", "headers": ["Word", "Meaning"], "rows": [["creaking", "a long low sound when a door or wooden object moves"], ["chatter", "repeated short high sounds made by birds or monkeys"], ["hissing", "a noise like a long 's' sound"], ["rustle", "a soft, low, dry sound of leaves or paper"], ["puffing", "blowing with short, quick blasts, as the wind"]]}, {"type": "quiz", "id": "c7-ch04-quiz-soundwords", "title": "Fill the correct sound word", "questions": [{"type": "fill", "q": "The steam engine reached the station ______ black smoke into the sky.", "answer": ["puffing"], "explanation": "puffing", "placeholder": "word", "hints": ["Short blasts."]}, {"type": "fill", "q": "Suddenly the snake raised its hood and made a ______ noise.", "answer": ["hissing"], "explanation": "hissing", "placeholder": "word", "hints": ["Like 's'."]}, {"type": "fill", "q": "When the wind blew, I heard the ______ of the wooden roof.", "answer": ["creaking"], "explanation": "creaking", "placeholder": "word", "hints": ["Long low sound."]}, {"type": "fill", "q": "He heard a ______ of leaves behind him.", "answer": ["rustle"], "explanation": "rustle", "placeholder": "word", "hints": ["Soft dry sound."]}, {"type": "fill", "q": "I get disturbed by the continuous ______ of the monkeys.", "answer": ["chatter"], "explanation": "chatter", "placeholder": "word", "hints": ["Short high sounds."]}]}, {"type": "text", "md": "**Would and used to.** 'Every day, before the train came through, he **would** walk the length of the tunnel.' **Would** describes repeated, habitual actions in the past. **Used to** also describes past habits, but implies the action doesn't happen any longer; it also works for past states (*I used to paint when I was in Grade 4*). **Would** is not used for states (be, live)."}, {"type": "quiz", "id": "c7-ch04-quiz-usedto", "title": "Used to or would?", "questions": [{"type": "fill", "q": "When I was a child we used to live in a village. Back then we ______ (grow) vegetables in our back garden.", "answer": ["used to grow", "would grow"], "explanation": "A past habit: used to grow or would grow.", "placeholder": "verb form", "hints": ["Past habit."]}, {"type": "fill", "q": "Every day we ______ (get up) early and go for a walk.", "answer": ["would get up", "used to get up"], "explanation": "Repeated action: would get up.", "placeholder": "verb form", "hints": ["Habit."]}, {"type": "fill", "q": "The weather in summer ______ (be) really nice.", "answer": ["used to be"], "explanation": "A state: used to be (not would).", "placeholder": "verb form", "hints": ["State."]}, {"type": "fill", "q": "We ______ (go) there every Sunday for a picnic.", "answer": ["would go", "used to go"], "explanation": "Habit: would go.", "placeholder": "verb form", "hints": ["Repeated."]}, {"type": "fill", "q": "Winters ______ (be) rather cold.", "answer": ["used to be"], "explanation": "A state: used to be.", "placeholder": "verb form", "hints": ["State."]}, {"type": "fill", "q": "In the evenings, my father ______ (tell) us incredible stories.", "answer": ["would tell", "used to tell"], "explanation": "Habit: would tell.", "placeholder": "verb form", "hints": ["Repeated."]}, {"type": "fill", "q": "…and we ______ (listen) with admiration.", "answer": ["would listen", "used to listen"], "explanation": "Habit: would listen.", "placeholder": "verb form", "hints": ["Repeated."]}]}, {"type": "text", "md": "**Punctuation.** A **colon (:)** introduces a list or an explanation: *You need these ingredients to make Ela Ada: ghee, coconut, jaggery and rice flour. He has one goal: to win the championship.* A **semicolon (;)** connects two closely related clauses without a conjunction: *She loves reading; he prefers watching movies.* Now punctuate the paragraph about Charminar."}, {"type": "reveal", "prompt": "Punctuated paragraph", "md": "We explored the busy by-lanes of Charminar, the heart of Hyderabad**;** it was an exciting day. We wanted to do a few things**:** buy bangles, taste biryani and purchase pearl earrings, which are special to this area. As we walked through the lanes, we saw stalls selling spices, clothes and jewellery**;** the market was full of colours. We visited some famous spots**:** Charminar, Golconda Fort, Salar Jung Museum and Chowmahalla Palace**;** each place was beautiful."}, {"type": "quiz", "id": "c7-ch04-quiz-punct", "title": "Colon or semicolon?", "questions": [{"type": "single", "q": "He has one goal ___ to win the championship.", "options": [":", ";"], "answer": 0, "explanation": "The colon introduces an explanation.", "hints": ["Explanation follows."]}, {"type": "single", "q": "She loves reading ___ he prefers watching movies.", "options": [":", ";"], "answer": 1, "explanation": "Two related clauses.", "hints": ["Two clauses."]}, {"type": "single", "q": "You need the following ___ ghee, coconut and jaggery.", "options": [":", ";"], "answer": 0, "explanation": "A list follows.", "hints": ["List."]}]}, {"type": "summary", "points": ["Phrases like 'sawing sound' and 'drifting smoke' paint sensory pictures.", "Sound words: creaking, chatter, hissing, rustle, puffing.", "'Would' and 'used to' describe past habits; use 'used to' for past states.", "A colon introduces a list or explanation; a semicolon joins related clauses."]}], "minutes": 35, "terms": [{"term": "semicolon", "def": "a mark (;) joining two closely related clauses"}, {"term": "colon", "def": "a mark (:) that introduces a list or explanation"}], "source": {"chapter": "ch04", "sections": ["Let us learn I–IV"], "pages": "151–153"}, "id": "c7u4-03-tunnel-language", "chapter": "c7u4", "kind": "lesson"}, "c7u4-04-tunnel-skills": {"title": "The Tunnel: Listen, Speak, Write, Explore", "summary": "A museum treasure hunt, giving directions, a train-journey paragraph, the Atal Tunnel and Indian Railways.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: the museum treasure hunt", "md": "**Audio guide:** Welcome to the City Museum. We start our tour at the entrance hall. Here you will find the information booth and a display about the history of this museum. To the right of the entrance hall you will find the library. On the left is the museum shop. Go straight from the entrance hall till you reach the art gallery. The gallery is famous for its collection of rare paintings from various parts of India. There are three doors that lead out of the art gallery. The first door on the left leads to the decorative art gallery, where you will find jewellery, carvings and textiles from medieval India. The next door is temporarily closed due to renovation work. The third door on the right leads to the weapons room, where you will find an extensive collection of Indian weapons including bows, swords, shields and helmets. From the weapons room take a left turn. You will find the world-famous musical instruments section, with instruments from every country in the world. The second room to the left in this gallery will take you to the auditorium. Hidden here is your treasure! All the best to all. May the best team win!"}, {"type": "quiz", "id": "c7-ch04-quiz-museum", "title": "Mark the rooms on the map", "questions": [{"type": "single", "q": "Room 1 (to the right of the Entrance Hall)", "options": ["library", "auditorium", "weapon room", "art gallery"], "answer": 0, "explanation": "To the right of the entrance hall is the library.", "hints": ["Right side."]}, {"type": "single", "q": "Room 2 (straight ahead from the Entrance Hall)", "options": ["art gallery", "library", "auditorium", "musical instruments hall"], "answer": 0, "explanation": "Go straight to the art gallery.", "hints": ["Straight."]}, {"type": "single", "q": "Room 3 (third door on the right of the Art Gallery)", "options": ["weapon room", "auditorium", "library", "musical instruments hall"], "answer": 0, "explanation": "The weapons room.", "hints": ["Third door."]}, {"type": "single", "q": "Room 4 (a left turn from the weapons room)", "options": ["musical instruments hall", "library", "auditorium", "art gallery"], "answer": 0, "explanation": "The musical instruments section.", "hints": ["Left turn."]}, {"type": "single", "q": "Room 5 (where the treasure is hidden)", "options": ["auditorium", "library", "art gallery", "weapon room"], "answer": 0, "explanation": "The second room to the left in the instruments gallery.", "hints": ["Treasure room."]}]}, {"type": "text", "md": "**Let us speak: giving directions.** Anju is going on a trekking trip with her family. They have reached the railway station and she calls the tour manager for directions to the trekking site. Work in pairs: Student A plays Anju and marks the route on the map (railway station, lassi corner, school, museum, factory, lake and bird sanctuary, trekking site); Student B gives directions. Useful phrases: *turn left, turn right, keep going straight till…, take the next left/right, take the roundabout, take the second left, start from…, on the opposite side, right around the corner, in front of, next to.*", "title": "Let us speak"}, {"type": "exercise", "id": "c7-ch04-ex-directions", "title": "Give directions to the trekking site", "difficulty": "easy", "minutes": 8, "goal": "Give clear directions from the railway station to the trekking site.", "behavior": "Use at least five direction phrases in order.", "hints": ["Name the roundabout and the lake.", "Say 'keep going straight till…'.", "Check by tracing the route."], "checklist": ["Start from the station", "Uses at least five phrases", "Mentions landmarks", "Ends at the trekking site"], "solution": "Start from the railway station and turn right. Keep going straight till the lassi corner, then take the next right. Go along the school and take the roundabout. Take the second exit towards the lake and bird sanctuary. The trekking site is on the opposite side, right around the corner.", "solution_lang": "text", "solution_explain": "Directions need order, landmarks and turning words.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us write.** Write a descriptive paragraph about a **train journey**: sights, sounds and feelings; the people around you, the scenery outside and the atmosphere inside. Hints: how the journey began (boarding, finding your seat); sounds (the whistle, the chatter of passengers, the clatter of wheels); sights (changing scenery, the hustle and bustle inside, interesting moments); feelings (excited, relaxed, curious).", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch04-ex-train-para", "title": "A train journey paragraph", "difficulty": "medium", "minutes": 15, "goal": "Write a vivid paragraph (8–10 lines) about a train journey.", "behavior": "Cover boarding, sounds, sights and feelings.", "hints": ["Use the words clatter, whistle, chatter.", "Describe one person you saw.", "End with how you felt."], "checklist": ["Opening about boarding", "Sounds", "Sights", "Feelings", "At least two sound words"], "solution": "We boarded the evening express with a tangled crowd of bags and voices. The whistle shrieked and the wheels began their steady clatter. Through the window, green fields slipped past and children waved. Inside, the air smelt of tea and hot samosas. I felt excited and sleepy at once, as if the train were rocking me to a dream.", "solution_lang": "text", "solution_explain": "A strong paragraph combines senses and feeling.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. The **Atal Tunnel** (9.02 km) runs under the Rohtang Pass on the Manali–Leh Highway, built in freezing temperatures and difficult terrain; the World Book of Records certified it as the 'World's Longest Highway Tunnel above 10,000 Feet'. II. The first passenger train in India ran on **16 April 1853** between **Bori Bunder (Mumbai) and Thane**, covering 34 km with three locomotives named **Sahib, Sultan and Sindh** and thirteen carriages. In 1864 the North received its first station, **Delhi Junction**, near Chandni Chowk."}, {"type": "quiz", "id": "c7-ch04-quiz-rail-facts", "title": "Facts", "questions": [{"type": "single", "q": "The first passenger train in India ran between ______.", "options": ["Bori Bunder and Thane", "Delhi and Agra", "Chennai and Madurai", "Kolkata and Howrah"], "answer": 0, "explanation": "On 16 April 1853.", "hints": ["Mumbai."]}, {"type": "single", "q": "How long is the Atal Tunnel?", "options": ["9.02 km", "90 km", "0.9 km", "19 km"], "answer": 0, "explanation": "9.02 kilometres.", "hints": ["Under Rohtang Pass."]}, {"type": "single", "q": "The three locomotives were named ______.", "options": ["Sahib, Sultan and Sindh", "Ganga, Yamuna, Kaveri", "Rani, Raja, Mantri", "Surya, Chandra, Tara"], "answer": 0, "explanation": "Sahib, Sultan and Sindh.", "hints": ["Start with S."]}]}, {"type": "summary", "points": ["The audio guide leads from entrance hall to library, art gallery, weapons room, instruments hall and auditorium.", "Directions use turn left/right, keep going straight, take the roundabout.", "A train-journey paragraph uses sights, sounds and feelings.", "The Atal Tunnel and the 1853 train are landmarks of Indian travel."]}], "minutes": 35, "terms": [{"term": "audio guide", "def": "recorded information that guides a visitor"}], "source": {"chapter": "ch04", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "153–156, 176"}, "id": "c7u4-04-tunnel-skills", "chapter": "c7u4", "kind": "lesson"}, "c7u4-05-travel-poem": {"title": "Travel: Read, Discuss and Reflect", "summary": "Edna St. Vincent Millay's poem about the love of trains.", "blocks": [{"type": "text", "md": "**Before you read.** I. Complete the word web on travel: modes of transport (bus, train, ship…), reasons for travel (work, holiday, study…), feelings (joy, curiosity…), adventure activities (exploring, trekking…), destinations (riverside, hills…) and challenges (bad weather, delays…). II. You are going on a trip to an adventure camp with classmates and teacher: how will you travel, what will you take, why go there, what activities, how long? III. Why do people enjoy train journeys?"}, {"type": "callout", "kind": "tip", "md": "I cannot print the poem; read it on p. 159. Retold stanza by stanza. Poet: **Edna St. Vincent Millay**.", "title": "Reading plan"}, {"type": "text", "title": "📖 Travel (retold)", "md": "**Stanza 1.** The railway track is miles away, and the day is loud with voices, yet there is no train that goes by all day without the speaker hearing its whistle shrieking.\n\n**Stanza 2.** All night no train goes by; the night is still for sleep and dreaming. But she sees its red cinders in the sky and hears its engine steaming.\n\n**Stanza 3.** Her heart is warm with the friends she makes, and she will never know better friends. Yet there is no train she wouldn't take, **no matter where it is going**."}, {"type": "quiz", "id": "c7-ch04-quiz-travel-1", "title": "Let us discuss", "questions": [{"type": "single", "q": "Stanza 2's main idea is ______.", "options": ["At night the speaker imagines the train and hears its engine in the quiet", "She wants to take any train", "She hears the whistle during the day"], "answer": 0, "explanation": "Stanza 2 is about night.", "hints": ["Cinders red on the sky."]}, {"type": "single", "q": "Stanza 3's main idea is ______.", "options": ["The speaker feels a strong desire to take any train, no matter where it goes", "At night she imagines the train", "She hears the train in the day"], "answer": 0, "explanation": "No matter where it's going.", "hints": ["Last stanza."]}, {"type": "single", "q": "Stanza 1's main idea is ______.", "options": ["She hears the train whistle during the day even though it is far away", "Night imagination", "Desire to travel anywhere"], "answer": 0, "explanation": "First stanza is about the day.", "hints": ["Miles away."]}, {"type": "fill", "q": "Rhyming words: stanza (i) away–day; speaking–______", "answer": ["shrieking"], "explanation": "speaking–shrieking", "placeholder": "word", "hints": ["Line 2 and 4."]}, {"type": "fill", "q": "Stanza (ii): by–sky; dreaming–______", "answer": ["steaming"], "explanation": "dreaming–steaming", "placeholder": "word", "hints": ["Line 2 and 4."]}, {"type": "fill", "q": "Stanza (iii): make–take; knowing–______", "answer": ["going"], "explanation": "knowing–going", "placeholder": "word", "hints": ["Line 2 and 4."]}, {"type": "single", "q": "The rhyme scheme of the poem is ______.", "options": ["ABAB", "AABB", "ABCA", "ABBC"], "answer": 0, "explanation": "Lines 1/3 and 2/4 rhyme.", "hints": ["Check stanza 1."]}, {"type": "fill", "q": "The word that personifies the train's whistle is ______.", "answer": ["shrieking"], "explanation": "A whistle 'shrieking' sounds like a person screaming.", "placeholder": "word", "hints": ["Verb ending in -ing."]}, {"type": "multi", "q": "Words that describe the poet's tone:", "options": ["excited", "curious", "worried", "thoughtful", "critical", "joyful", "enthusiastic"], "answer": [0, 1, 3, 5, 6], "explanation": "The speaker is excited, curious, thoughtful, joyful and enthusiastic.", "hints": ["Is she worried or critical?"]}, {"type": "multi", "q": "What does the train symbolise for the poet?", "options": ["adventure", "opportunities", "education", "comfort"], "answer": [0, 1], "explanation": "It stands for adventure and new opportunities.", "hints": ["Where could it take her?"]}, {"type": "single", "q": "The poet repeats 'there isn't a train goes by' to ______.", "options": ["highlight the speaker's fascination with the train", "show that the area has many trains"], "answer": 0, "explanation": "Repetition shows fascination.", "hints": ["Why repeat the line?"]}]}, {"type": "text", "md": "**VIII.** The poem contrasts the busy day with the stillness of the night. The **common factor** is that in both the speaker is thinking of the train: she hears it by day and sees and hears it at night.\n\n**IX. Imagery** uses descriptive language to create mental pictures that appeal to the senses. Examples: *day is loud, whistle shrieking, night is still, cinders red on the sky, engine steaming.*"}, {"type": "quiz", "id": "c7-ch04-quiz-travel-ext", "title": "Think and reflect", "questions": [{"type": "single", "q": "'My heart is warm' refers to a heart that is ______.", "options": ["filled with worries", "full of love", "feeling upset", "experiencing anger"], "answer": 1, "explanation": "A warm heart is loving.", "hints": ["Friends."]}, {"type": "single", "q": "'Better friends I'll not be knowing' suggests that the speaker feels ______ about her friends.", "options": ["they are the best she could have and she is fully happy", "she wants new friends", "she doubts them", "she is bored"], "answer": 0, "explanation": "She values them very much.", "hints": ["Better than these? None."]}, {"type": "single", "q": "The tone of these lines is ______.", "options": ["grateful", "content"], "answer": 0, "explanation": "She is thankful and happy with her friends (content also fits).", "hints": ["Warm and thankful."]}]}, {"type": "reveal", "prompt": "Long answers: model answers", "md": "1. **'Cinders red on the sky'**: at night the glowing sparks of the steam engine light up the dark sky, a vivid image of the train.\n2. **Repeated whistle:** it shows her fascination and that the sound lives in her mind.\n3. **'No matter where it's going':** she loves travel for its own sake; the journey and the adventure matter more than the destination.\n4. **Does the poet actually see and hear the train?** No: the track is miles away; she **imagines** it, which shows her longing."}, {"type": "summary", "points": ["The speaker hears and sees the train in her mind day and night.", "She would take any train, no matter where it goes.", "The rhyme scheme is ABAB and the tone is excited and joyful.", "Imagery (day is loud, cinders red) makes the train vivid."]}], "minutes": 30, "terms": [{"term": "imagery", "def": "descriptive language that creates mental pictures"}, {"term": "symbol", "def": "something that stands for an idea"}], "source": {"chapter": "ch04", "sections": ["Before we read", "Let us read", "Let us discuss", "Let us think and reflect"], "pages": "157–160"}, "id": "c7u4-05-travel-poem", "chapter": "c7u4", "kind": "lesson"}, "c7u4-06-travel-skills": {"title": "Travel: Words, Listening, Speaking, Writing, Exploring", "summary": "Expressions, sound words, an announcement, soft and hard 'c', diamante poem, character description and heritage railways.", "blocks": [{"type": "quiz", "id": "c7-ch04-quiz-travel-expr", "title": "Let us learn I: match the expressions", "questions": [{"type": "single", "q": "miles away", "options": ["the distance of the train from the speaker", "the busy atmosphere", "the speaker's affection", "the glow of sparks"], "answer": 0, "explanation": "It shows how far away the train is.", "hints": ["Distance."]}, {"type": "single", "q": "cinders red", "options": ["the glow of the train's sparks lighting up the night sky", "the busy day", "the speaker's affection", "the fast powerful movement"], "answer": 0, "explanation": "Red glowing sparks.", "hints": ["Night."]}, {"type": "single", "q": "heart is warm", "options": ["the speaker's affection for friends", "the fast movement", "the distance", "the loud day"], "answer": 0, "explanation": "Warm = loving.", "hints": ["Friends."]}, {"type": "single", "q": "day is loud", "options": ["the busy and noisy atmosphere during the day", "the glow of sparks", "the distance", "affection"], "answer": 0, "explanation": "A loud day is busy.", "hints": ["Day."]}, {"type": "single", "q": "engine steaming", "options": ["the fast and powerful movement of the train", "affection", "distance", "the busy day"], "answer": 0, "explanation": "Steam shows power.", "hints": ["Engine."]}]}, {"type": "quiz", "id": "c7-ch04-quiz-travel-blanks", "title": "Fill the blanks with the expressions", "questions": [{"type": "fill", "q": "After meeting her old friend, her ______ with the joy of rekindled memories.", "answer": ["heart was warm", "heart is warm"], "explanation": "heart was warm", "placeholder": "expression", "hints": ["Affection."]}, {"type": "fill", "q": "As I arrived at the railway station I could hear the ______.", "answer": ["engine steaming"], "explanation": "engine steaming", "placeholder": "expression", "hints": ["Train sound."]}, {"type": "fill", "q": "The marketplace is bustling, and the ______ with the chatter of shoppers and vendors.", "answer": ["day is loud"], "explanation": "day is loud", "placeholder": "expression", "hints": ["Busy noise."]}, {"type": "fill", "q": "The bonfire glowed brightly, throwing ______ into the dark night sky.", "answer": ["cinders red"], "explanation": "cinders red", "placeholder": "expression", "hints": ["Sparks."]}, {"type": "fill", "q": "The sound of a train could still be heard ______ as the evening grew quiet.", "answer": ["miles away"], "explanation": "miles away", "placeholder": "expression", "hints": ["Distance."]}]}, {"type": "quiz", "id": "c7-ch04-quiz-cry-words", "title": "II. Sound words for voices", "questions": [{"type": "single", "q": "shouting loudly, often in anger or excitement", "options": ["yelling", "wailing", "whimpering", "bawling"], "answer": 0, "explanation": "yelling", "hints": ["Loud shout."]}, {"type": "single", "q": "crying out in fear or excitement", "options": ["screaming", "hollering", "whimpering", "wailing"], "answer": 0, "explanation": "screaming", "hints": ["Fear or excitement."]}, {"type": "single", "q": "crying loudly with grief or sorrow", "options": ["wailing", "yelling", "hollering", "screeching"], "answer": 0, "explanation": "wailing", "hints": ["Sorrow."]}, {"type": "single", "q": "making a high-pitched, piercing sound", "options": ["screeching", "bawling", "whimpering", "hollering"], "answer": 0, "explanation": "screeching", "hints": ["Piercing."]}, {"type": "single", "q": "calling out loudly, often casually", "options": ["hollering", "wailing", "whimpering", "yelling"], "answer": 0, "explanation": "hollering", "hints": ["Informal."]}, {"type": "single", "q": "crying softly in a low, broken voice", "options": ["whimpering", "bawling", "screeching", "yelling"], "answer": 0, "explanation": "whimpering", "hints": ["Soft crying."]}, {"type": "single", "q": "crying loudly and uncontrollably", "options": ["bawling", "whimpering", "hollering", "screeching"], "answer": 0, "explanation": "bawling", "hints": ["Loud, uncontrolled."]}]}, {"type": "reveal", "prompt": "Paragraph answers", "md": "The street was filled with sounds. A shopkeeper was **hollering** to attract customers, while a child nearby was **yelling** at his friend to wait. A toddler was **bawling** uncontrollably after dropping his ice cream, and as his mother calmed him he began **whimpering** softly. In the background, someone's loud **screeching** (or screaming) voice added to the noise of the busy evening."}, {"type": "callout", "kind": "note", "title": "🎧 Listening: a school announcement", "md": "**Principal:** Good morning students! I have some very exciting news. The much-awaited educational trip to the National Science Centre will be held on 16 September, that is in two weeks! It is a fantastic opportunity to explore and learn more about the world around us.\n\nWe will start from school at 8.00 in the morning and return by 5.30 in the evening. All of you must be in proper school uniform. Don't forget your identity cards. Light refreshments will be provided at the museum, but do carry a water bottle and a packed lunch. You are not permitted to wear any jewellery or carry mobile phones. You may carry a notebook and a pen to make notes. Interested students must bring a permission slip signed by your parent and submit it to your class teacher by 10 September. It is going to be a fun trip, so don't miss out. If you have more questions, please contact Mr. Mukherjee, the excursion in-charge."}, {"type": "quiz", "id": "c7-ch04-quiz-announce", "title": "Is the information correct?", "questions": [{"type": "single", "q": "The trip is organised on 15 September.", "options": ["Correct", "Incorrect (16 September)"], "answer": 1, "explanation": "It is 16 September.", "hints": ["Check the date."]}, {"type": "single", "q": "Students will start at 8.00 a.m. and return by 5.00 p.m.", "options": ["Correct", "Incorrect (5.30 p.m.)"], "answer": 1, "explanation": "They return by 5.30.", "hints": ["Evening time."]}, {"type": "single", "q": "Refreshment will not be provided during the trip.", "options": ["Correct", "Incorrect (light refreshments will be provided)"], "answer": 1, "explanation": "Light refreshments will be provided.", "hints": ["Check."]}, {"type": "single", "q": "Students are permitted to carry a phone, a notebook and a pen.", "options": ["Correct", "Incorrect (phones are not permitted)"], "answer": 1, "explanation": "No jewellery or mobile phones.", "hints": ["Phones."]}, {"type": "single", "q": "The permission slip is to be signed by the class teacher.", "options": ["Correct", "Incorrect (by a parent)"], "answer": 1, "explanation": "Signed by your parent.", "hints": ["Who signs?"]}, {"type": "single", "q": "The slip is to be submitted to the class teacher by 10 September.", "options": ["Correct", "Incorrect"], "answer": 0, "explanation": "This is correct.", "hints": ["Date."]}, {"type": "single", "q": "Mr. Mukherjee is the Adventure Club in-charge.", "options": ["Correct", "Incorrect (excursion in-charge)"], "answer": 1, "explanation": "He is the excursion in-charge.", "hints": ["His role."]}]}, {"type": "text", "md": "**Let us speak: the letter c.** Letter **c** is a **soft /s/** sound before **e, i, y** (city, cell, cinders) and a **hard /k/** sound before **a, o, u** or a consonant (cat, cable, cake)."}, {"type": "table", "headers": ["Soft c /s/", "Hard c /k/"], "rows": [["cell, race, decide, receive, circle, bicycle (first c is soft)", "cable, cake, echo, uncle, concert (first c)"]]}, {"type": "quiz", "id": "c7-ch04-quiz-c", "title": "Soft or hard?", "questions": [{"type": "single", "q": "city", "options": ["soft /s/", "hard /k/"], "answer": 0, "explanation": "c before i.", "hints": ["Rule."]}, {"type": "single", "q": "cable", "options": ["soft /s/", "hard /k/"], "answer": 1, "explanation": "c before a.", "hints": ["Rule."]}, {"type": "single", "q": "decide", "options": ["soft /s/", "hard /k/"], "answer": 0, "explanation": "c before i.", "hints": ["Rule."]}, {"type": "single", "q": "echo", "options": ["soft /s/", "hard /k/"], "answer": 1, "explanation": "c before h in 'echo' is /k/.", "hints": ["Sounds like k."]}, {"type": "single", "q": "uncle", "options": ["soft /s/", "hard /k/"], "answer": 1, "explanation": "c is followed by l (consonant).", "hints": ["Rule."]}]}, {"type": "text", "md": "**Let us write I: a diamante poem.** A diamante poem is shaped like a diamond and uses adjectives and -ing words. Pattern for **Reading → Adventure**: line 1: Reading; line 2: two adjectives about reading; line 3: three -ing words about reading; line 4: four nouns or a short phrase linking the topics; line 5: three -ing words about adventure; line 6: two adjectives about adventure; line 7: Adventure. (Example from the book: Day / Bright, sunny / Dancing, playing, running / Out comes the sun, down goes the sun / Resting, listening, dreaming / Quiet, peaceful / Night.)", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch04-ex-diamante", "title": "Write a diamante poem", "difficulty": "easy", "minutes": 8, "goal": "Write a diamante poem connecting Reading and Adventure.", "behavior": "Follow the 7-line pattern.", "hints": ["Think of what reading and adventure share.", "Choose strong adjectives.", "Share it with the class."], "checklist": ["7 lines", "Two adjectives, three -ing words", "A linking line", "Ends with Adventure"], "solution": "Reading\nQuiet, curious\nImagining, turning, wondering\nPages, maps, journeys, dreams\nClimbing, exploring, discovering\nBold, thrilling\nAdventure", "solution_lang": "text", "solution_explain": "A diamante has a fixed shape and connects two ideas.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us write II: describe a character you met while travelling.** Steps: 1 choose the character; 2 draft: name, looks, actions, what kind of person, and a line or incident from the text you like; 3 check spelling; 4 show classmates and ask for suggestions; 5 rewrite with changes."}, {"type": "text", "md": "**Let us explore.** I. The **Mountain Railways of India** are a UNESCO World Heritage Site: the **Darjeeling Himalayan Railway, Nilgiri Mountain Railway and Kalka–Shimla Railway** (Matheran Hill Railway and Kangra Valley Railway are on the tentative list). II. **Vande Bharat Express**, India's first indigenous semi-high-speed train, was flagged off on 15 February 2019 on the New Delhi–Kanpur–Allahabad–Varanasi route at 160 km/h. III. Underwater rail tunnels: the Thames Tunnel (London), Seikan Tunnel (Japan), Channel Tunnel; India's first underwater metro route in Kolkata began in March 2024 beneath the Hooghly River. IV. Which of these trains would be adventurous to travel in? Discuss."}, {"type": "summary", "points": ["Expressions: miles away, cinders red, heart is warm, day is loud, engine steaming.", "Voice words: yelling, screaming, wailing, screeching, hollering, whimpering, bawling.", "Soft c before e, i, y; hard c before a, o, u.", "A diamante poem links two topics in a diamond shape."]}], "minutes": 45, "terms": [{"term": "diamante", "def": "a diamond-shaped poem"}], "source": {"chapter": "ch04", "sections": ["Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "161–165, 177"}, "id": "c7u4-06-travel-skills", "chapter": "c7u4", "kind": "lesson"}, "c7u4-07-summit-read": {"title": "Conquering the Summit: Read and Discuss", "summary": "The true story of Arunima Sinha, the first Indian female amputee to climb Everest.", "blocks": [{"type": "text", "md": "**Before you read.** I. Identify the four activities in the icons: **hang gliding, mountain biking, rock climbing, white-water rafting**. II. Why do people do these? How would they prepare? Which excites you most? III. Complete a word web on the **qualities of a mountaineer** (courage, determination, fitness, patience, teamwork, discipline)."}, {"type": "flashcards", "id": "c7-ch04-cards-summit", "title": "Words from the text", "cards": [{"front": "beacon", "back": "source of inspiration"}, {"front": "resilience", "back": "ability to recover quickly from a difficulty"}, {"front": "amputated", "back": "cut off (a part of the body)"}, {"front": "prosthetic leg", "back": "an artificial leg that helps people move"}, {"front": "feat", "back": "achievement"}, {"front": "harrowing", "back": "extremely disturbing and painful"}, {"front": "rigorous", "back": "severe"}, {"front": "endeavour", "back": "an attempt to do something"}, {"front": "surge", "back": "a sudden and great increase"}, {"front": "endurance", "back": "ability to continue doing something difficult for a long time"}, {"front": "fortitude", "back": "courage over a long period"}, {"front": "adversity", "back": "a difficult situation"}, {"front": "testament", "back": "proof"}, {"front": "conferred", "back": "given an official title or honour"}]}, {"type": "text", "title": "📖 Arunima Sinha: from tragedy to Everest", "md": "This is a story of the triumph of will, courage, determination and dedication. **Arunima Sinha**'s journey from a devastating accident to the highest peak in the world is a **beacon of hope and resilience**.\n\nIn 2011, at 24, Arunima, a national-level volleyball player, met with a life-altering event. As she lay in a hospital bed with one leg amputated, she made a vow many would call impossible: to walk again with a prosthetic leg **and to climb Mount Everest**. In **2013** she did just that, becoming the **first Indian female amputee** to do so. In **2015** she received the **Padma Shri**, the fourth highest civilian award in India, as well as the Tenzing Norgay National Adventure Award and the National Award for Best Female Mountaineer.\n\nArunima is from **Ambedkar Nagar**, Uttar Pradesh. Her father was an army engineer and her mother a health supervisor; sports were a big part of the family's life. After a law degree she wanted a job in the paramilitary forces, to continue sport with a regular income.\n\nOn the night of **11 April 2011** she met with a **train accident**. The hours that followed were harrowing; she never thought she'd survive but did, showing an extraordinary will to live. She received a prosthetic leg and underwent physiotherapy, and during this period, inspired by an article about Mount Everest, resolved to conquer the highest peak.\n\nShe completed a basic mountaineering course at the **Nehru Institute of Mountaineering, Uttarkashi**, followed by **eighteen months of rigorous training**. She approached **Bachendri Pal**, the first Indian woman to summit Everest, for guidance. Bachendri Pal told her: *\"You have conquered the Everest within you; the world will realise it later.\"*\n\nOn **21 May 2013**, after **52 exhausting days**, Arunima reached the summit. She felt a surge of pride, relief and achievement. She displayed the Indian flag and left a photograph of her idol, **Swami Vivekananda**.\n\nBy **July 2016** she had summited **seven peaks** on all continents: Elbrus (Europe), Kilimanjaro (Africa), Kosciuszko (Australia), Aconcagua (South America), Denali (North America), Everest (Asia). In **January 2019** she climbed **Mount Vinson in Antarctica**, becoming the world's first female amputee to do so, completing the **Seven Summits**.\n\nHer story is about mental fortitude and a positive mindset. Her message: *\"Never give up and work hard. Always remember your goal and work on it.\"* Her autobiography, *Born Again on the Mountain: A Story of Losing Everything and Finding It Back*, is a testament to the human spirit. She received an honorary doctorate from the University of Strathclyde, Glasgow, UK. In her words, failure is not falling short of goals; it is not having goals worthy enough."}, {"type": "table", "headers": ["Continent", "Peak"], "rows": [["Asia", "Everest"], ["Africa", "Kilimanjaro"], ["Europe", "Elbrus"], ["North America", "Denali"], ["South America", "Aconcagua"], ["Australia", "Kosciuszko"], ["Antarctica", "Vinson"]]}, {"type": "quiz", "id": "c7-ch04-quiz-summit-facts", "title": "Check the facts", "questions": [{"type": "single", "q": "When did Arunima reach the summit of Everest?", "options": ["21 May 2013", "11 April 2011", "15 August 2015", "January 2019"], "answer": 0, "explanation": "After 52 exhausting days.", "hints": ["Summit date."]}, {"type": "single", "q": "Who guided her?", "options": ["Bachendri Pal", "Tenzing Norgay", "Kalam", "Sushruta"], "answer": 0, "explanation": "The first Indian woman to summit Everest.", "hints": ["First Indian woman."]}, {"type": "single", "q": "Which peak did she climb in Antarctica?", "options": ["Mount Vinson", "Elbrus", "Denali", "Kosciuszko"], "answer": 0, "explanation": "Vinson, in January 2019.", "hints": ["Antarctica."]}, {"type": "single", "q": "The title of her autobiography is ______.", "options": ["Born Again on the Mountain", "Conquering the Summit", "Seven Summits", "Everest Within"], "answer": 0, "explanation": "Born Again on the Mountain: A Story of Losing Everything and Finding It Back.", "hints": ["Book title."]}, {"type": "single", "q": "What did she leave on the summit?", "options": ["a photograph of Swami Vivekananda", "her prosthetic leg", "a medal", "a book"], "answer": 0, "explanation": "Her idol's photograph.", "hints": ["Her idol."]}]}, {"type": "reveal", "prompt": "Let us discuss: explain the statements", "md": "1. **Beacon of hope and resilience:** her recovery and Everest climb inspire others.\n2. **Decided to climb Everest despite losing her leg:** she turned tragedy into a bigger goal.\n3. **Bachendri Pal's guidance** gave confidence and expert direction.\n4. **Beyond physical endurance:** it needed mental fortitude and a positive mind.\n5. **Her autobiography inspires** readers by showing triumph over adversity."}, {"type": "quiz", "id": "c7-ch04-quiz-summit-ext", "title": "Think and reflect", "questions": [{"type": "fill", "q": "Bachendri Pal said Arunima had conquered the Everest within her because ______.", "answer": ["she overcame her fears and limitations", "she decided to climb with a prosthetic leg", "she was determined despite her disability"], "explanation": "She had already won over doubt and the loss of her leg before the climb.", "placeholder": "reason", "hints": ["Inner victory."]}, {"type": "fill", "q": "A phrase showing that reaching the summit was tiring: '52 ______ days'", "answer": ["exhausting"], "explanation": "'after 52 exhausting days'", "placeholder": "word", "hints": ["Adjective."]}, {"type": "single", "q": "After her success, Arunima would most likely have said:", "options": ["I finally realised my dream", "I am confident of my abilities", "I will accomplish this soon", "I am excited to begin this climb"], "answer": 0, "explanation": "Success achieved: she realised her dream.", "hints": ["Past achievement."]}, {"type": "single", "q": "How might she have felt after Bachendri Pal's words?", "options": ["encouraged and confident", "angry", "bored", "jealous"], "answer": 0, "explanation": "A hero's praise lifts confidence.", "hints": ["Encouraging words."]}]}, {"type": "reveal", "prompt": "Long answers: models", "md": "1. **What she did:** completed a basic course, trained rigorously for 18 months, and sought Bachendri Pal's guidance.\n2. **Beacon of hope and resilience:** she survived a harrowing accident, walked with a prosthetic leg, climbed Everest and the Seven Summits.\n3. **Title appropriate:** she 'lost everything' (her leg and her old life) and was 'born again' on the mountain with a new purpose.\n4. **Impact of 'Failure is when we don't have goals worthy enough':** readers will set higher goals and see failure as a lack of ambition, not of success."}, {"type": "summary", "points": ["Arunima Sinha lost a leg in a train accident in 2011.", "She climbed Everest on 21 May 2013 and completed the Seven Summits in 2019.", "Bachendri Pal guided and encouraged her.", "Her message: never give up; keep your goal in mind."]}], "minutes": 35, "terms": [{"term": "resilience", "def": "ability to recover quickly from a difficulty"}, {"term": "fortitude", "def": "courage over a long period"}], "source": {"chapter": "ch04", "sections": ["Before we read", "Let us read", "Let us discuss", "Let us think and reflect"], "pages": "166–170"}, "id": "c7u4-07-summit-read", "chapter": "c7u4", "kind": "lesson"}, "c7u4-08-summit-language": {"title": "Conquering the Summit: Words, Articles, Listening, Speaking, Writing", "summary": "Phrases, word families, articles, adventure opinions, a formal letter and exploring.", "blocks": [{"type": "quiz", "id": "c7-ch04-quiz-summit-phrases", "title": "Let us learn I: match the phrases", "questions": [{"type": "single", "q": "exhausting days (several exhausting days of practice)", "options": ["periods of time filled with tiring and demanding activities", "genuine, sincere efforts", "strength of mind", "a source of inspiration"], "answer": 0, "explanation": "Tiring, demanding days.", "hints": ["Practice days."]}, {"type": "single", "q": "heartfelt attempts", "options": ["genuine, sincere efforts", "strength of mind", "an incident that changes a life", "a source of inspiration"], "answer": 0, "explanation": "Sincere efforts.", "hints": ["From the heart."]}, {"type": "single", "q": "life-altering event", "options": ["an incident or experience that significantly changes a person's life", "strength of mind", "sincere efforts", "a source of encouragement"], "answer": 0, "explanation": "Changes a life.", "hints": ["Moving to a new city."]}, {"type": "single", "q": "mental fortitude", "options": ["strength of mind", "sincere efforts", "tiring days", "inspiration"], "answer": 0, "explanation": "Fortitude = courage/strength.", "hints": ["Marathon."]}, {"type": "single", "q": "beacon of hope", "options": ["a source of inspiration or encouragement", "strength of mind", "tiring days", "sincere efforts"], "answer": 0, "explanation": "A lighthouse for sailors.", "hints": ["Guiding light."]}]}, {"type": "table", "headers": ["Noun", "Adjective", "Verb", "Adverb"], "rows": [["determination", "determined", "determine", "determinedly"], ["relief", "relieved", "relieve", "relievedly"], ["inspiration", "inspiring", "inspire", "inspiringly"], ["resistance", "resistant", "resist", "resistantly"], ["success", "successful", "succeed", "successfully"]]}, {"type": "text", "md": "**Articles.** *A* and *an* are indefinite; *the* is definite. Use **a** before a consonant **sound** and **an** before a vowel **sound** (an hour, a uniform). Use **the** for particular or unique things (the Ganga, the North Star, the highest peak). No article for plural general nouns or abstract nouns such as nature."}, {"type": "quiz", "id": "c7-ch04-quiz-articles", "title": "Fill with a, an, the or x", "questions": [{"type": "single", "q": "We planned (i) ___ adventurous trip", "options": ["a", "an", "the", "x"], "answer": 1, "explanation": "Adventurous begins with a vowel sound.", "hints": ["Vowel."]}, {"type": "single", "q": "…to (ii) ___ remote island", "options": ["a", "an", "the", "x"], "answer": 0, "explanation": "Remote begins with a consonant sound.", "hints": ["Consonant."]}, {"type": "single", "q": "(iii) ___ island was known for its beautiful landscapes", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "The island already mentioned.", "hints": ["Specific."]}, {"type": "single", "q": "…and (iv) ___ diverse wildlife (general)", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "Uncountable and general: no article.", "hints": ["General."]}, {"type": "single", "q": "On (v) ___ first day", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "'The first day' is specific.", "hints": ["Ordinal."]}, {"type": "single", "q": "They explored (vi) ___ island's dense jungle", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "Possessive 'island's': no article.", "hints": ["Possessive."]}, {"type": "single", "q": "(vii) ___ guide led us", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "A particular guide.", "hints": ["Known guide."]}, {"type": "single", "q": "through (viii) ___ thick foliage", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "Uncountable, general.", "hints": ["No article."]}, {"type": "single", "q": "showed us (ix) ___ hidden waterfall", "options": ["a", "an", "the", "x"], "answer": 0, "explanation": "A hidden waterfall; consonant sound.", "hints": ["New item."]}, {"type": "single", "q": "In (x) ___ evening", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "'In the evening'.", "hints": ["Fixed phrase."]}, {"type": "single", "q": "around (xi) ___ campfire", "options": ["a", "an", "the", "x"], "answer": 0, "explanation": "A campfire.", "hints": ["Consonant."]}, {"type": "single", "q": "enjoy (xii) ___ meal we cooked", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "Specific meal.", "hints": ["'we cooked' defines it."]}, {"type": "single", "q": "(xiii) ___ experience was truly unforgettable", "options": ["a", "an", "the", "x"], "answer": 2, "explanation": "The experience just described.", "hints": ["Known."]}, {"type": "single", "q": "we felt (xiv) ___ connection", "options": ["a", "an", "the", "x"], "answer": 0, "explanation": "A connection.", "hints": ["Consonant sound."]}, {"type": "single", "q": "with (xv) ___ nature", "options": ["a", "an", "the", "x"], "answer": 3, "explanation": "Nature in general.", "hints": ["No article."]}]}, {"type": "quiz", "id": "c7-ch04-quiz-article-err", "title": "Correct the error in the underlined article", "questions": [{"type": "single", "q": "We waited for ___ hour before the bus arrived.", "options": ["an", "a"], "answer": 0, "explanation": "'Hour' starts with a vowel sound: an hour.", "hints": ["Silent h."]}, {"type": "single", "q": "The guide insisted on ___ uniform jacket.", "options": ["a", "an"], "answer": 0, "explanation": "'Uniform' starts with the sound 'yoo': a uniform.", "hints": ["Consonant sound."]}, {"type": "single", "q": "Mount K2 is ___ second highest peak in the world.", "options": ["the", "a"], "answer": 0, "explanation": "'The second highest'.", "hints": ["Superlative-like."]}, {"type": "single", "q": "___ Ganga is a sacred river in India.", "options": ["The", "A"], "answer": 0, "explanation": "The Ganga (a unique river).", "hints": ["Unique."]}, {"type": "single", "q": "Challenges are faced with courage by ___ brave.", "options": ["the", "a"], "answer": 0, "explanation": "'The brave' means brave people.", "hints": ["Adjective as a group."]}, {"type": "single", "q": "___ North Star has guided travellers for centuries.", "options": ["The", "A"], "answer": 0, "explanation": "There is only one North Star.", "hints": ["Unique."]}]}, {"type": "callout", "kind": "note", "title": "🎧 Listening: five speakers on adventure sports", "md": "**Speaker (i), a parent:** I fear the risks involved, especially with activities like rock climbing or paragliding. I am quite worried about the safety risks of adventure sports. It is important to consider these risks before letting children participate.\n\n**Speaker (ii), a student:** Adventure sports are thrilling! All my friends agree; it is amazing. It is not just about fun; it is about pushing your limits and experiencing something new. I think it is worth trying, of course with a trainer.\n\n**Speaker (iii), an organiser:** As organisers of adventure camps we take safety very seriously. Our team ensures all equipment is regularly checked. Participants are given thorough training and are always supervised by professionals. We focus on minimising risks while providing an exciting experience.\n\n**Speaker (iv), a school teacher:** At our school we organise adventure camps with trekking and zip-lining. However, we stick to basic sports that are safe and manageable for students. We always prioritise safety. Being careful is what we promote.\n\n**Speaker (v), a sports lover:** In my opinion, sports should be about fitness and enjoyment, like track and field or swimming. Why risk your life for a fleeting moment of thrill? Traditional sports are safer and just as fulfilling!"}, {"type": "quiz", "id": "c7-ch04-quiz-adv-speakers", "title": "Match the statements with the speakers", "questions": [{"type": "single", "q": "Expresses concern about the risks in adventure sports", "options": ["(i)", "(ii)", "(iii)", "(iv)", "(v)"], "answer": 0, "explanation": "The parent.", "hints": ["Fears risks."]}, {"type": "single", "q": "Finds adventure sports thrilling and exciting", "options": ["(i)", "(ii)", "(iii)", "(iv)", "(v)"], "answer": 1, "explanation": "The student.", "hints": ["Amazing!"]}, {"type": "single", "q": "Focuses on the availability of training and supervision", "options": ["(i)", "(ii)", "(iii)", "(iv)", "(v)"], "answer": 2, "explanation": "The organiser.", "hints": ["Professionals."]}, {"type": "single", "q": "Talks about having basic activities in adventure sports", "options": ["(i)", "(ii)", "(iii)", "(iv)", "(v)"], "answer": 3, "explanation": "The school teacher.", "hints": ["Trekking and zip-lining only."]}, {"type": "single", "q": "Finds exposure to risks unnecessary", "options": ["(i)", "(ii)", "(iii)", "(iv)", "(v)"], "answer": 4, "explanation": "The traditional-sports lover.", "hints": ["Why risk your life?"]}], "intro": "Statements 3, 5 and 6 (variety of activities; trekking as a casual sport; applications from first-timers) are the three extras."}, {"type": "text", "md": "**Let us speak: group discussion on Physical Education.** In groups of four choose a role: 1 School student (why PE should be included), 2 Parent (concerns or support), 3 PE teacher (experience and value), 4 Sports camp organiser (safety and benefits). Prompts: *In my opinion… / From my point of view… / One reason for this is… / I disagree with the notion that… / I support this perspective because… / I find it hard to agree because… / I believe that… / I disagree with… / I agree with the idea that…* Vocabulary: precautions, unique experiences, fun, safe, enjoyable, thrilling, builds confidence, concern, explore, overcome fear, participate.", "title": "Let us speak"}, {"type": "text", "md": "**Let us write: a formal letter.** Components: sender's address; date; receiver's address; (school name) ; **subject**; **salutation** (Madam/Sir); **introduction** (*I am Sreelakshmi, a student of Grade 7-C. I am interested in adventure activities like trekking, hiking, rope climbing…*); **expression of interest** (*I would love to be a part of the Adventure Club…*); **statement of request** (*I request you to grant me permission to join the club.*); **complimentary close** (Yours sincerely,); **signature line** (Sreelakshmi). Then write a letter to the Principal requesting her to organise an excursion to a nearby hill station for Grade 7.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch04-ex-hill-letter", "title": "Letter to the Principal: hill station excursion", "difficulty": "medium", "minutes": 15, "goal": "Write a formal letter to the Principal requesting an excursion for Grade 7.", "behavior": "Use the nine components in order.", "hints": ["Mention what students will learn.", "Offer to help organise.", "Be polite."], "checklist": ["Addresses and date", "Subject", "Salutation", "Introduction", "Reason and benefits", "Request", "Close and signature"], "solution": "[Sender's address and date]\nThe Principal\nXYZ School\nSubject: Request to organise an excursion to a hill station\nMadam,\nI am Rekha, a student of Grade 7-A. We would love to visit a nearby hill station, as it will help us learn about mountains and nature. We shall follow all safety rules. I request you to kindly organise an excursion for Grade 7.\nYours sincerely,\nRekha, Class 7-A", "solution_lang": "text", "solution_explain": "A formal letter is polite, structured and specific.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. Find out about **snow skiing, trekking, camping, river rafting and scuba diving** in India and complete: Area, Preferred time of the year, Equipment (e.g. skis and ski suit; trekking pole; tent and torch; scuba suit, mask and fins). II. Prepare an **information booklet with fact sheets of five Indian mountaineers**: name (and photograph), place of birth, profession, accomplishments/awards, training received, sport known for."}, {"type": "summary", "points": ["Phrases: exhausting days, heartfelt attempts, life-altering event, mental fortitude, beacon of hope.", "Articles: a/an by sound; the for specific or unique things; none for general nouns.", "A formal letter has fixed parts: addresses, subject, salutation, body, close, signature.", "Adventure sports opinions differ on risk and safety."]}], "minutes": 45, "terms": [{"term": "article", "def": "a, an or the"}, {"term": "formal letter", "def": "a letter written in respectful, structured language"}], "source": {"chapter": "ch04", "sections": ["Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "171–175, 177–178"}, "id": "c7u4-08-summit-language", "chapter": "c7u4", "kind": "lesson"}, "c7u4-99-test": {"title": "Test: Unit 4 – Travel and Adventure", "kind": "test", "summary": "Check what you learned in this whole unit.", "blocks": [{"type": "quiz", "id": "c7-ch04-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Sunder Singh warns a night train of danger by ______.", "options": ["waving his lamp", "blowing a whistle", "lighting a fire", "ringing a bell"], "answer": 0, "explanation": "A lamp at night; a red flag by day.", "hints": ["Signal."]}, {"type": "single", "q": "Why is Sunder Singh called a 'firefly'?", "options": ["his lamp lights the darkness for trains", "he is small", "he sleeps by day", "he catches insects"], "answer": 0, "explanation": "He guides the trains safely.", "hints": ["Light."]}, {"type": "single", "q": "'Every day he would walk the length of the tunnel.' Here 'would' shows ______.", "options": ["a past habit", "a polite request", "a wish", "a future plan"], "answer": 0, "explanation": "Habitual past.", "hints": ["Repeated."]}, {"type": "single", "q": "Which uses a colon correctly?", "options": ["He has one goal: to win the championship.", "He has: one goal to win.", "He: has one goal.", "He has one: goal to win."], "answer": 0, "explanation": "Colon before an explanation.", "hints": ["Introduces."]}, {"type": "single", "q": "The rhyme scheme of the poem 'Travel' is ______.", "options": ["ABAB", "AABB", "ABBC", "ABCA"], "answer": 0, "explanation": "Lines 1/3, 2/4.", "hints": ["Check stanza."]}, {"type": "single", "q": "In 'cinders', c is pronounced as ______.", "options": ["/s/", "/k/"], "answer": 0, "explanation": "c before i.", "hints": ["Soft c."]}, {"type": "single", "q": "Imagery in 'Travel' includes ______.", "options": ["cinders red on the sky", "a recipe", "a map", "a graph"], "answer": 0, "explanation": "Visual image.", "hints": ["Sky."]}, {"type": "single", "q": "Arunima Sinha reached the summit of Everest on ______.", "options": ["21 May 2013", "11 April 2011", "1 Jan 2019", "15 Feb 2019"], "answer": 0, "explanation": "After 52 days.", "hints": ["Summit."]}, {"type": "single", "q": "Who guided Arunima?", "options": ["Bachendri Pal", "Tenzing Norgay", "Edmund Hillary", "Sunder Singh"], "answer": 0, "explanation": "First Indian woman on Everest.", "hints": ["Mentor."]}, {"type": "single", "q": "Fill the article: 'We waited for ___ hour.'", "options": ["an", "a", "the"], "answer": 0, "explanation": "Silent h.", "hints": ["Vowel sound."]}, {"type": "single", "q": "Fill the article: '___ Ganga is a sacred river.'", "options": ["The", "A", "An"], "answer": 0, "explanation": "Unique river.", "hints": ["Unique."]}, {"type": "single", "q": "The three locomotives of the first train in India were ______.", "options": ["Sahib, Sultan and Sindh", "Ganga, Yamuna, Kaveri", "Rani, Raja, Mantri", "Shatabdi, Rajdhani, Duronto"], "answer": 0, "explanation": "1853.", "hints": ["Start with S."]}, {"type": "truefalse", "q": "A semicolon connects two closely related clauses without a conjunction.", "answer": true, "explanation": "Yes.", "hints": ["Punctuation."]}], "mode": "test"}], "id": "c7u4-99-test", "chapter": "c7u4", "minutes": 10}, "c7u5-01-homage-read": {"title": "A Homage to Our Brave Soldiers: Read and Discuss", "summary": "Soumya's letter to Ananda about the National War Memorial.", "blocks": [{"type": "text", "md": "**Before you read.** *Homage* means something said or done to show respect publicly for someone. Whom should every Indian pay homage to? Complete the table with three ways to celebrate soldiers' **victories** and three ways to honour their **sacrifices** (example: visiting a war memorial)."}, {"type": "table", "headers": ["Celebrating their victories", "Honouring their sacrifices"], "rows": [["visiting a war memorial", "lighting a lamp or laying wreaths"], ["telling stories of their victories in school", "observing a two-minute silence on Remembrance days"], ["celebrating Armed Forces/Vijay Diwas", "writing letters of thanks and supporting soldiers' families"]]}, {"type": "callout", "kind": "tip", "md": "Two friends exchange letters. The text is retold here (original pp. 180–191). Guess: which memorial does Soumya visit?", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch05-cards-homage", "title": "Words from the letters", "cards": [{"front": "territorial integrity", "back": "safeguarding the nation's borders"}, {"front": "envisioned", "back": "visualised"}, {"front": "iconic", "back": "celebrated"}, {"front": "tribute", "back": "showing respect, gratitude"}, {"front": "etched", "back": "engraved"}, {"front": "gallantry", "back": "exceptional courage, especially in battle"}, {"front": "posthumously", "back": "after death"}, {"front": "citation", "back": "a statement of meritorious performance of duty"}, {"front": "awestruck", "back": "amazed"}, {"front": "commemorates", "back": "remembers officially and shows respect"}, {"front": "obelisk", "back": "a tapering stone pillar"}, {"front": "wreaths", "back": "circular arrangements of flowers as a mark of respect"}, {"front": "interminable", "back": "everlasting"}, {"front": "murals", "back": "large paintings on a wall"}, {"front": "discourses", "back": "serious discussions on different topics"}, {"front": "edifice", "back": "a large and impressive building"}, {"front": "valiant", "back": "very brave"}, {"front": "memoir", "back": "an account of one's personal life and experiences"}]}, {"type": "text", "title": "📖 Letter I: Soumya to Ananda (14 April, Bengaluru)", "md": "Soumya writes to her friend **Ananda**, recalling their talk about war and peace and how India struggled for Independence and then fought several wars to protect borders, **territorial integrity** and people. She wondered who these brave people were, and got answers on a school trip to **New Delhi**.\n\nShe asks Ananda to guess the monument: its construction began in **April 2018**, was completed in **February 2019**, and it was inaugurated by the Prime Minister. It is spread over **40 acres near India Gate**: the **National War Memorial**, a long-desired aspiration fulfilled.\n\nThe teacher explained that even after Independence India has fought wars, and the freedom and security we enjoy come from the many men and women of the Armed Forces. Memorials make sure we never forget the cost of freedom. Each brick is a **tablet** with the names of soldiers who made the supreme sacrifice in wars since 1947, including 1962, the Indo-Pak wars of 1965 and 1971 and **Kargil 1999**: **29,000 tablets** with **more than 26,000 names**.\n\nThe government honours bravery with awards: the **Param Vir Chakra (PVC)**, India's highest wartime gallantry medal, awarded to **21 bravehearts**, as well as the Maha Vir Chakra, Kirti Chakra, Vir Chakra and Shaurya Chakra. **Major Somnath Sharma** received the first PVC, posthumously, for the Battle of Badgam in 1947. Others won PVCs in 1962, 1965 and UN peacekeeping in Congo. In 1971 PVCs went posthumously to **Lance Naik Albert Ekka, Flying Officer Nirmal Jit Singh Sekhon, Second Lieutenant Arun Khetarpal and Major Hoshiar Singh**; Navy personnel including **Captain Mahendra Nath Mulla** got the MVC for courage and leadership.\n\n**Albert Ekka's citation** (in summary): in an attack at Gangasagar on the eastern front, his company faced heavy fire from a well-fortified enemy position. Ekka, ignoring his own safety, charged a bunker, silenced a light machine gun, then, though seriously wounded, kept clearing bunkers. When a medium machine gun fired from a building's upper storey, he crawled forward, threw a grenade, then scaled the wall and silenced the gun, saving his company and ensuring the attack's success. He died of his wounds after the objective was captured. The teacher's reading left Soumya awestruck and humbled, and she wishes to be as courageous when she joins the army.\n\n**Amar Jawan Jyoti.** The immortal flame, once under the arch of India Gate (January 1972, to commemorate the 1971 victory), is now part of the memorial's obelisk surrounded by four Chakras. The Prime Minister lit a new flame and the old one was merged with it. Wreaths surround the obelisk, and the lighting changes the monument's look from dawn to dusk. The flame is a metaphor for eternal stories of courage and valour.\n\n**The four Chakras** (four concentric circles around a 15-metre-tall obelisk):\n- **Amar Chakra** (Circle of Immortality): the obelisk and eternal flame.\n- **Veerta Chakra** (Circle of Bravery): a covered gallery with six bronze murals of battle actions.\n- **Tyag Chakra** (Circle of Sacrifice): concentric walls like the ancient **Chakravyuh**, with granite tablets, one for each fallen hero, names etched in gold.\n- **Raksha Chakra** (Circle of Protection): a row of trees, each representing a soldier guarding the nation.\n\nThey spent the whole day at the memorial and the lawns of Kartavyapath; the solemn atmosphere moved her, and talk of the devastation of wars brought tears. She felt motivated to live a life worthy of the heroes' sacrifice. The class will make presentations and share with the school assembly. Soumya will present **Major Padmapani Acharya**, MVC (Kargil, 1999), whose citation says that on 28 June 1999, as Company Commander of 2 Rajputana Rifles, he was to capture a heavily fortified position; when enemy artillery hit the leading platoon he led the reserve platoon through shellfire, crawled up and lobbed grenades, and, severely injured and unable to move, ordered his men to leave him and charge while he kept firing. The position was captured and he died of his injuries. Before battle he wrote to his father that he was not afraid, quoting the Bhagavad Gita (2.37): fight with determination; either you are slain and attain heaven or you win and enjoy the earth. She ends by sharing the website and saying she misses Ananda's mother's chhole bhature. *Your friend, Soumya*"}, {"type": "table", "headers": ["Hero", "War / Achievement", "Award"], "rows": [["Major Somnath Sharma", "Battle of Badgam, 1947 (first PVC)", "Param Vir Chakra (posthumous)"], ["Captain Mahendra Nath Mulla", "1971 war (Navy): exemplary courage and leadership", "Maha Vir Chakra"], ["Lance Naik Albert Ekka", "1971 war, Gangasagar (eastern front): silenced machine guns", "Param Vir Chakra (posthumous)"], ["Major Padmapani Acharya", "Kargil War 1999: led a charge up a rock face", "Maha Vir Chakra (posthumous)"]]}, {"type": "quiz", "id": "c7-ch05-quiz-homage-1", "title": "Let us discuss: letter I", "questions": [{"type": "single", "q": "Which is India's highest gallantry award?", "options": ["Param Vir Chakra", "Maha Vir Chakra", "Kirti Chakra", "Padma Shri"], "answer": 0, "explanation": "The PVC is the highest wartime gallantry medal.", "hints": ["The first PVC went to Major Somnath Sharma."]}, {"type": "single", "q": "How many tablets are in the National War Memorial?", "options": ["29,000", "2,900", "2,00,000", "9,000"], "answer": 0, "explanation": "29,000 tablets with over 26,000 names.", "hints": ["Number in the text."]}, {"type": "single", "q": "The Circle of Sacrifice is called the ______.", "options": ["Tyag Chakra", "Veerta Chakra", "Amar Chakra", "Raksha Chakra"], "answer": 0, "explanation": "Tyag = sacrifice.", "hints": ["Walls like Chakravyuh."]}, {"type": "single", "q": "The row of trees in the memorial represents ______.", "options": ["soldiers who ensure territorial integrity", "poets", "wreaths", "tourists"], "answer": 0, "explanation": "Raksha Chakra, the Circle of Protection.", "hints": ["Outermost circle."]}, {"type": "single", "q": "Soumya's feelings in the letter include ______.", "options": ["wonder, pride, sadness, gratitude and inspiration", "only anger", "boredom", "fear only"], "answer": 0, "explanation": "She is awestruck, proud, saddened and motivated.", "hints": ["Re-read the passages on the flame and the discourses."]}, {"type": "truefalse", "q": "Do you think Soumya enjoyed writing the letter? (She wrote a long, excited letter.)", "answer": true, "explanation": "Yes: she says she could not help sharing this inspiring experience.", "hints": ["The end of her letter."]}]}, {"type": "reveal", "prompt": "II. Which paragraph shows each feeling? (a guide)", "md": "**Wonder:** 'We were awestruck and humbled by his bravery.' **Heartening:** 'It was heartening to know that our government has recognised the sacrifice…' **Motivation:** 'It motivated me to live a life worthy of the sacrifices of our heroes.' **Pride:** the Amar Jawan Jyoti paragraph ('filled me with pride for our nation'). **Visually inspiring:** 'The overall environment created an emotive experience that was visually inspiring.' **Sadness:** 'brought tears to my eyes'. **Gratitude:** the opening about the sacrifices that let us lead our lives in peace. **Inspiration:** Albert Ekka's citation. Ananda will feel **ins
