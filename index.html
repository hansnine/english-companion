"back": "(here) the language that birds speak"}, {"front": "countryside", "back": "rural area"}, {"front": "cellar", "back": "a room below ground level, often used for storage"}]}, {"type": "text", "title": "📖 Part I: Polynesia's secret", "md": "Doctor Dolittle is in his kitchen talking with the **Cat's-food-Man**, who has come with a stomach-ache. The man says: \"Why don't you give up being a people's doctor and be an animal doctor? You know much more about animals than the vets. Your book about cats is wonderful. I can't read, but my wife Theodosia is a scholar and read it to me. You might have been a cat yourself.\"\n\nPolynesia the parrot, who has been singing a sailor song at the window, starts listening. When the man goes, she flies to the table and says he has sense: the Doctor should be an animal doctor, because people are silly if they cannot see he is the best doctor in the world. The Doctor says there are plenty of animal doctors. \"None of them are any good,\" says Polynesia. \"Did you know that animals can talk?\"\n\nThe Doctor knows that parrots can talk. \"We parrots speak two languages: people's language and bird language,\" says Polynesia proudly. She says something in bird language, 'Ka-ka oi-ee, fee-fee?', which means \"Is the porridge hot yet?\" The Doctor is amazed: \"You never talked that way to me before!\" \"What would have been the good? You wouldn't have understood me,\" says Polynesia, dusting cracker crumbs off her wing.\n\nExcited, the Doctor fetches a book and pencil and writes the **Birds' A.B.C.** all afternoon while it rains.\n\n**Body language.** When Jip the dog comes in at teatime, the parrot says he is talking. The Doctor thinks he is only scratching his ear. Polynesia explains: animals talk with their ears, feet, tails and everything; sometimes they do not want to make noise. Jip twitches one side of his nose, which means \"Can't you see it has stopped raining?\" Dogs use their noses for asking questions. With the parrot's help the Doctor learns animal language so well that he can talk to animals himself, and he gives up being a people's doctor."}, {"type": "quiz", "id": "c7-ch02-quiz-dolittle-1", "title": "Let us discuss: after Part I", "questions": [{"type": "single", "q": "The Cat's-food-Man suggests the Doctor become an animal doctor because he believes Dolittle ______.", "options": ["earns less by treating humans", "enjoys animals as they speak less", "dislikes human patients", "knows more about animals than the local vets"], "answer": 3, "explanation": "He praises the Doctor's cat book and says he knows more than the vets.", "hints": ["Look at what the man says about vets."]}, {"type": "fill", "q": "The Doctor reacts to Polynesia's information with excitement and ______ (certainty/curiosity).", "answer": ["curiosity"], "explanation": "He wants to learn more, so he is curious, not certain.", "placeholder": "word", "hints": ["He keeps asking for more words."]}, {"type": "fill", "q": "He rushes to ______ (write/memorise) the bird words she provides.", "answer": ["write"], "explanation": "He takes a book and pencil.", "placeholder": "word", "hints": ["He fetches a pencil."]}, {"type": "truefalse", "q": "Do you think Doctor Dolittle would be famous as an animal doctor? (He is clever, kind and understands animals.)", "answer": true, "explanation": "Yes: he can talk to animals, so he can understand their pain, which no ordinary vet can do.", "hints": ["Think about what makes him different."]}]}, {"type": "text", "title": "📖 Part II: The green spectacles and the special doors", "md": "As soon as the Cat's-food-Man tells everyone that John Dolittle will treat animals, old ladies bring pet pugs and poodles that have eaten too much cake, and farmers come many miles with sick cows and sheep.\n\nOne day a plough horse arrives, delighted to find a man who speaks horse language. The vet over the hill has treated him for six weeks with big pills, but never looked at his eyes. \"What I need is **spectacles**,\" says the horse. \"I'm going blind in one eye. Why shouldn't horses wear glasses like people? And I'd like green ones to keep the Sun out of my eyes when I plough.\" \"Certainly,\" says the Doctor. The horse adds that anybody thinks they can doctor animals just because animals don't complain; but it takes a much cleverer man to be a good animal doctor than a good people's doctor. \"Well, well!\" says the Doctor, and promises the glasses next Tuesday.\n\nThe Doctor gets a big pair of green spectacles and the horse can see as well as ever. Soon it is a common sight in the countryside around Puddleby to see **farm animals wearing glasses**, and a blind horse is a thing unknown.\n\nAnimals now tell where it hurts, so the Doctor cures them easily. They tell friends and brothers, and mice, badgers and bats all come to his house at the edge of the town until his big garden is crowded. He has **special doors made**: HORSES over the front door, COWS on the side door, SHEEP on the kitchen door, and a tiny tunnel into the cellar for the mice, who wait patiently in rows.\n\nIn a few years every living creature for miles knows John Dolittle, M.D. The birds who fly to other countries in winter tell animals abroad about the man who understands their language. So he becomes **famous among animals all over the world**, and he is happy.\n\n*Hugh Lofting*"}, {"type": "quiz", "id": "c7-ch02-quiz-dolittle-2", "title": "Let us discuss: after Part II", "questions": [{"type": "single", "q": "What became a common sight in Puddleby after Doctor Dolittle began treating animals?", "options": ["Humans talking to farm animals", "Farm animals wearing glasses", "Farm animals learning bird language", "Birds riding on farm animals"], "answer": 1, "explanation": "He gave the plough horse spectacles and soon many farm animals wore them.", "hints": ["Think of the horse's need."]}, {"type": "truefalse", "q": "The Doctor needs only one door for all his animal patients.", "answer": false, "explanation": "He had special doors made for different kinds of animals, and a tunnel for mice.", "hints": ["Remember the HORSES, COWS and SHEEP signs."]}, {"type": "order", "q": "Arrange the events in the correct order (the book gives you the first two).", "items": ["A man with a stomach-ache suggests he treat animals", "Polynesia encourages him and reveals that animals can talk", "Polynesia teaches him animal languages", "He decides to stop being a people's doctor", "Word spreads and people bring sick pets and farm animals", "A plough horse gets green spectacles", "His ability to talk to animals helps him treat them well", "Animals from near and far crowd his garden", "He installs special doors for different animals", "He becomes famous among animals worldwide"], "explanation": "This is the story order from the book's list (items 3, 6, 4, 1, 10, 5, 8, 2, 7, 9).", "hints": ["Start with the man with the stomach-ache."]}]}, {"type": "reveal", "prompt": "II. What challenges might Doctor Dolittle face if more and more animals come? How might he overcome them?", "md": "Challenges: **too many patients**, different languages, lack of space and time, tiredness. He could keep fixed hours, use separate doors/rooms, train helpers, keep records, and ask animals to wait in turn. (Think of how he already built separate doors.)"}, {"type": "summary", "points": ["A man and a parrot persuade the Doctor to become an animal doctor.", "Polynesia teaches him bird and animal language, including body language.", "The plough horse's spectacles make him famous, and he builds special doors.", "He becomes happy and famous among animals all over the world."]}], "minutes": 30, "terms": [{"term": "scholar", "def": "a learned person"}, {"term": "countryside", "def": "rural area"}], "source": {"chapter": "ch02", "sections": ["Before we read", "Let us read I–II", "Let us discuss"], "pages": "43–50"}, "id": "c7u2-01-dolittle-read", "chapter": "c7u2", "kind": "lesson"}, "c7u2-02-dolittle-reflect-learn": {"title": "Dr. Dolittle: Reflect and Learn", "summary": "Extract questions, compound words, palindromes and tenses.", "blocks": [{"type": "quiz", "id": "c7-ch02-quiz-dolittle-ext1", "title": "Think and reflect: Extract 1 (Polynesia and bird language)", "questions": [{"type": "single", "q": "'Good Gracious!' can be replaced by ______!", "options": ["bravo", "gosh", "alas", "hurray"], "answer": 1, "explanation": "'Good Gracious' and 'gosh' both express surprise.", "hints": ["Both show surprise."]}, {"type": "single", "q": "Why had Polynesia never used bird language with the Doctor earlier?", "options": ["He wouldn't have understood her, so there was no use", "She was shy", "She did not know it", "She did not like him"], "answer": 0, "explanation": "She says, 'What would have been the good? You wouldn't have understood me.'", "hints": ["Her own explanation."]}, {"type": "truefalse", "q": "Polynesia had been munching on a food item while talking to the Doctor.", "answer": true, "explanation": "She dusts cracker crumbs off her wing.", "hints": ["Look at what she dusts off."]}, {"type": "single", "q": "How did the Doctor feel in this extract?", "options": ["anxious", "surprised", "angry", "relaxed"], "answer": 1, "explanation": "He cries 'Good Gracious!' and 'You don't say so!'.", "hints": ["How do you react to big news?"]}]}, {"type": "quiz", "id": "c7-ch02-quiz-dolittle-ext2", "title": "Extract 2 (the plough horse)", "questions": [{"type": "fill", "q": "Complete the analogy: digging : flower bed :: ______ : field", "answer": ["ploughing", "plowing"], "explanation": "Digging is done in a flower bed as ploughing is done in a field.", "placeholder": "word", "hints": ["Look at what the horse does."]}, {"type": "single", "q": "Doctor Dolittle's attitude in the extract is ______.", "options": ["respectful", "sentimental", "understanding", "careful"], "answer": 0, "explanation": "He takes the horse's request seriously: 'Of course… Green ones you shall have.' (Understanding also fits; discuss with your teacher.)", "hints": ["He treats the horse like an equal."]}, {"type": "fill", "q": "Doctors take animals for granted because ______.", "answer": ["animals don't complain", "they do not complain", "animals cannot speak", "they can't tell what is wrong"], "explanation": "The horse says anyone thinks he can doctor animals just because the animals don't complain.", "hints": ["The horse's words."]}, {"type": "truefalse", "q": "It takes a cleverer man to be a good animal doctor than a good people's doctor (the horse's opinion). Do you agree? Yes/no with a reason is your task; the horse's reason is that animals can't describe their problems.", "answer": true, "explanation": "The horse believes a doctor must guess or learn the animal's language; Dolittle can talk to them and so avoids guesses.", "hints": ["Think about how a patient who cannot speak is treated."]}]}, {"type": "text", "md": "**Long answers: model answers**"}, {"type": "reveal", "prompt": "1. How can we say Polynesia was a good trainer of animal language?", "md": "She taught the Doctor patiently **all afternoon**, gave words slowly so he could write them, explained body language (ears, feet, tails, noses) and gave examples (Jip)."}, {"type": "reveal", "prompt": "2. Explain how the Doctor gave equal and individual attention to each animal.", "md": "He listened to every animal in its **own language**, gave the horse green spectacles as asked, made **separate doors** for each kind and let even the mice wait in rows in the cellar."}, {"type": "reveal", "prompt": "3. How does the Doctor's readiness to follow the parrot's advice show the importance of listening to different viewpoints?", "md": "He listened to Polynesia and to the Cat's-food-Man even though he was a respected people's doctor; this opened a new career. **Listening to others can show us new possibilities.**"}, {"type": "reveal", "prompt": "4. Which qualities made him famous?", "md": "**Kindness, curiosity, humility and skill**: he learned animal language, took each patient seriously, and cured them."}, {"type": "reveal", "prompt": "5. What if everyone could understand animals like the Doctor?", "md": "People would be **kinder** to animals, protect wildlife and pets better, and many misunderstandings would end; perhaps farming and zoos would change."}, {"type": "text", "md": "**Let us learn I: compound words.** Cat's-food-Man, bird language and flowerpots are made by combining words. Compound words are formed by combining two words of different parts of speech to create a new word with a new meaning. They are of three types: **hyphenated** (Cat's-food-Man), **open** (bird language) and **closed** (flowerpots).", "title": "Compound words"}, {"type": "table", "headers": ["Hyphenated", "Open", "Closed"], "rows": [["check-in, well-bred", "sailor song, plough horse, harvest mice", "teatime, windowsill"]]}, {"type": "quiz", "id": "c7-ch02-quiz-compound", "title": "Make compound words", "questions": [{"type": "fill", "q": "fun + ______ (loving)", "answer": ["loving"], "explanation": "fun-loving", "placeholder": "word", "hints": ["Hyphenated."]}, {"type": "fill", "q": "high + ______", "answer": ["flying"], "explanation": "high-flying", "placeholder": "word", "hints": ["Adjective."]}, {"type": "fill", "q": "never + ______", "answer": ["ending"], "explanation": "never-ending", "placeholder": "word", "hints": ["Adjective."]}, {"type": "fill", "q": "early + ______", "answer": ["risers"], "explanation": "early-risers", "placeholder": "word", "hints": ["People who wake early."]}, {"type": "fill", "q": "song + ______", "answer": ["birds"], "explanation": "songbirds", "placeholder": "word", "hints": ["Closed compound."]}, {"type": "fill", "q": "over + ______", "answer": ["head"], "explanation": "overhead", "placeholder": "word", "hints": ["Closed compound."]}, {"type": "fill", "q": "tree + ______", "answer": ["tops"], "explanation": "treetops", "placeholder": "word", "hints": ["Closed compound."]}]}, {"type": "text", "md": "The paragraph about the dolphins reads: *After being treated by Doctor Dolittle, the **fun-loving** dolphins danced playfully in his sanctuary. The **never-ending** chatter of monkeys echoed through the **treetops**, their ailments cured. **High-flying** eagles soared gracefully **overhead**, their health restored. **Early risers** among the **songbirds** chirped joyfully from the branches. All creatures were happy with Doctor Dolittle's care.*"}, {"type": "text", "md": "**III. Hidden animals.** Underline the names of animals hidden across words. Answers: 1. eatin**g oat**meal → **goat**; 2. be**gan t**o → **ant**; 3. auth**or se**es the → **horse**; 4. fro**m ice** → **mice**; 5. **came l**ate → **camel** (the ship of the desert).\n\n**IV. Palindromes.** A word, phrase or sentence that reads the same backwards and forwards is a palindrome, e.g. 'Madam, I'm Adam' (ignoring spaces and punctuation).", "title": "Hidden animals and palindromes"}, {"type": "quiz", "id": "c7-ch02-quiz-palindrome", "title": "Which are palindromes?", "questions": [{"type": "multi", "q": "Palindrome words in the sentences:", "options": ["Naman", "race car", "Nitin", "Malayalam", "rotator", "radar", "engineer"], "answer": [0, 1, 2, 3, 4, 5], "explanation": "All of these read the same backwards; 'engineer' does not.", "hints": ["Reverse the letters."]}, {"type": "truefalse", "q": "'Step on no pets.' is a palindrome sentence.", "answer": true, "explanation": "Reversed: step on no pets.", "hints": ["Ignore spaces."]}, {"type": "truefalse", "q": "'Eva, can I see bees in a cave?' is a palindrome sentence.", "answer": true, "explanation": "Reading letters backwards gives the same sentence.", "hints": ["Ignore spaces and punctuation."]}]}, {"type": "text", "md": "**V. Tenses.** *He is asking you a question.* and *I am going blind in one eye.* are **present continuous**. *There are plenty of animal doctors.* and *anybody thinks he can doctor animals* are **simple present**.\n\n**VI. Present perfect** (has/have + V3) is used for a recently completed action, or a past action relevant now: *That man's got sense. It has stopped raining.*"}, {"type": "quiz", "id": "c7-ch02-quiz-presperf", "title": "Present perfect: fill the blanks", "questions": [{"type": "fill", "q": "Since becoming an animal doctor, Dolittle ______ (learn) to communicate with all animals.", "answer": ["has learned", "has learnt"], "explanation": "has + learned.", "placeholder": "verb", "hints": ["has/have + V3."]}, {"type": "fill", "q": "He ______ (treat) countless farm animals and pets.", "answer": ["has treated"], "explanation": "has treated.", "placeholder": "verb", "hints": ["has + V3."]}, {"type": "fill", "q": "The parrot ______ (teach) him bird-language.", "answer": ["has taught"], "explanation": "has taught.", "placeholder": "verb", "hints": ["Irregular verb."]}, {"type": "fill", "q": "He ______ (write) books about his adventures.", "answer": ["has written"], "explanation": "has written.", "placeholder": "verb", "hints": ["Irregular verb."]}, {"type": "fill", "q": "Many people ______ (bring) their sick animals to his door.", "answer": ["have brought"], "explanation": "have brought (many people → have).", "placeholder": "verb", "hints": ["Plural subject."]}, {"type": "fill", "q": "Over the years, Dolittle ______ (become) renowned worldwide.", "answer": ["has become"], "explanation": "has become.", "placeholder": "verb", "hints": ["Singular subject."]}]}, {"type": "summary", "points": ["Compound words can be hyphenated, open or closed.", "A palindrome reads the same backwards and forwards.", "Present continuous: is/am/are + -ing; present perfect: has/have + V3.", "Model answers use evidence from the text."]}], "minutes": 35, "terms": [{"term": "compound word", "def": "two words joined to make a new word"}, {"term": "palindrome", "def": "a word or sentence that reads the same backwards"}, {"term": "present perfect", "def": "has/have + past participle"}], "source": {"chapter": "ch02", "sections": ["Let us think and reflect", "Let us learn I–VI"], "pages": "50–55"}, "id": "c7u2-02-dolittle-reflect-learn", "chapter": "c7u2", "kind": "lesson"}, "c7u2-03-dolittle-skills": {"title": "Dr. Dolittle: Listen, Speak, Write, Explore", "summary": "An announcement, a doctor-patient conversation, a notice and animal-welfare tasks.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: the clinic announcement", "md": "**Announcer:** Greetings and attention everyone! We are excited to announce the opening of Dr. John Dolittle's new clinic in the town of Woodstock. The clinic is located at 12, Rose Lane. It will be open Monday to Friday from 9 a.m. to 5 p.m. Special timings for birds are on Saturdays from 11 a.m. to 2 p.m. Dr. Dolittle is renowned for his ability to communicate with animals and shall ensure that they receive the best care possible. All animals are welcome, from horses and cows to pets and wild animals. For the best veterinary care, visit Dr. John Dolittle's new clinic in Woodstock. Thank you."}, {"type": "quiz", "id": "c7-ch02-quiz-clinic", "title": "Listen and answer", "questions": [{"type": "truefalse", "q": "Dr. Dolittle's new clinic presents an offer of free medicines.", "answer": false, "explanation": "Nothing is said about free medicines.", "hints": ["Listen for 'offer'."]}, {"type": "fill", "q": "The new clinic is located in the town of ______.", "answer": ["woodstock"], "explanation": "Woodstock.", "placeholder": "word", "hints": ["A town name."]}, {"type": "fill", "q": "The address is 12, ______ Lane.", "answer": ["rose"], "explanation": "Rose Lane.", "placeholder": "word", "hints": ["A flower."]}, {"type": "fill", "q": "The clinic is open Monday to Friday from ______ a.m. to 5 p.m.", "answer": ["9", "9:00", "nine"], "explanation": "9 a.m.", "placeholder": "number", "hints": ["A morning number."]}, {"type": "fill", "q": "Special timings for ______ are on Saturdays from 11 a.m. to 2 p.m.", "answer": ["birds"], "explanation": "Birds.", "placeholder": "word", "hints": ["Polynesia's kind."]}, {"type": "fill", "q": "Dr. Dolittle will ensure that animals get the ______ care possible.", "answer": ["best"], "explanation": "Best.", "placeholder": "word", "hints": ["Superlative."]}, {"type": "fill", "q": "All animals: horses, cows, ______, wild animals and others are welcome.", "answer": ["pets"], "explanation": "Pets.", "placeholder": "word", "hints": ["Animals at home."]}]}, {"type": "text", "md": "**Let us speak: doctor and patient.** Use the problems and cue cards. Take turns as doctor and patient.\n\n- **Cough and cold:** ginger and honey mix; drink warm fluids and rest.\n- **Dry lips:** apply ghee; stay hydrated, avoid wetting your lips.\n- **Sore throat:** gargle with warm salt water; drink herbal teas, avoid cold drinks.\n- **Fatigue:** ensure adequate sleep and a balanced diet; take short walks.", "title": "Let us speak"}, {"type": "table", "headers": ["Doctor", "Patient"], "rows": [["Greet the patient", "Respond to the greeting"], ["Enquire about the problem", "Tell your problem"], ["Ask about symptoms", "Describe the symptoms"], ["Make a diagnosis and give solution", "Ask for clarification"], ["Provide additional advice", "Acknowledge the information and ask about the next appointment"], ["Share details of next appointment", "Express agreement and thank the doctor"]]}, {"type": "exercise", "id": "c7-ch02-ex-doctor-talk", "title": "Doctor and patient role-play", "difficulty": "easy", "minutes": 10, "goal": "Role-play a conversation on one health problem with a partner.", "behavior": "Follow the six cue cards in order. Change roles afterwards.", "hints": ["Use 'I have a… since…'.", "Doctor: 'I suggest…', 'You should…'", "Patient: 'Thank you, doctor.'"], "checklist": ["Greeting", "Problem and symptoms", "Diagnosis and solution", "Extra advice", "Next appointment", "Thanks"], "solution": "Doctor: Good morning. What is the problem? Patient: I have a sore throat since yesterday. Doctor: Do you have a fever? Patient: No. Doctor: Gargle with warm salt water and drink herbal tea. Avoid cold drinks. Come again on Monday. Patient: Thank you, doctor.", "solution_lang": "text", "solution_explain": "The conversation follows greeting → problem → advice → next step.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us write: a notice.** A notice is formal communication to a group about an event, announcement, instruction or appeal. Write a notice (about 50 words) about the **Annual Health Check-up** for students of Grades 6–8. Remind students to collect their health check-up cards from the class teacher. Include date, time and venue.\n\nUse these words: inform, queries, health card, health check-up, assembly hall, Grades 6–8, please contact, Thursday and Friday.\n\n**Remember:** mention a heading; use formal language in the third person; mention the reason for writing and other details (whom to contact, when, where); write the notice in a box.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch02-ex-notice", "title": "Write the health check-up notice", "difficulty": "medium", "minutes": 12, "goal": "Complete the notice about the Annual Health Check-up.", "behavior": "Name of school, heading NOTICE, date, subject, body, name and designation.", "hints": ["Use the box words.", "Keep to about 50 words.", "Write in a box."], "checklist": ["School name and 'NOTICE'", "Date at the top", "Date, time, venue of the check-up", "Reminder to bring the health card", "Contact person", "Name and post at the end"], "solution": "**Name of the School**\n**NOTICE**\n12 July 20XX\n**Annual Health Check-up**\nThis is to inform all the students of Grades 6–8 about the Annual Health Check-up.\nDate: Thursday and Friday, 27 and 28 July 20XX\nTime: 9:00 a.m. to 12:15 p.m.\nVenue: Assembly Hall\nAll students are requested to bring their health card for the check-up. For queries or further details please contact the undersigned.\nAsma\nIn-charge", "solution_lang": "text", "solution_explain": "A notice is short, formal and complete.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. 'Goshala' means 'cowshed' (Sanskrit *go* = cow, *shala* = shed or hall). Plan a visit to a goshala with the teacher and find out how cows are cared for.\n\nII. **Ayurveda** is the oldest existing medical system in India. Animals received good medicinal care in ancient India; texts like the *Charaka Samhita*, *Sushruta Samhita* and *Harita Samhita* mention animal care. Find out the names of organisations that work for animal welfare.\n\nIII. What is the best way to take care of stray and abandoned animals? 1. Provide food and water. 2. Take them to an animal shelter. 3. Adopt them. Give reasons for your responses."}, {"type": "summary", "points": ["Listening for details: place, address, timings and special groups.", "A doctor-patient role-play follows greeting, problem, advice, next appointment.", "A notice has a heading, date, subject, body and the writer's name and post.", "Care for animals can mean feeding, sheltering or adopting."]}], "minutes": 35, "source": {"chapter": "ch02", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "55–58, 88"}, "id": "c7u2-03-dolittle-skills", "chapter": "c7u2", "kind": "lesson"}, "c7u2-04-funnyman-read": {"title": "A Funny Man: Read, Discuss and Reflect", "summary": "A nonsense poem by Natalie Joan about a very strange visitor.", "blocks": [{"type": "text", "md": "**Before you read.** Look around you for things or people that make you laugh. Write them in the 'Things I Find Funny' bubbles and share your reasons with classmates and the teacher."}, {"type": "callout", "kind": "tip", "md": "I cannot print the poem word for word. Read it in your book (p. 60) and use this retelling stanza by stanza. The author is **Natalie Joan**.", "title": "Reading plan"}, {"type": "text", "title": "📖 The funny man (retold)", "md": "**Stanza 1.** One day a funny man walks down the street. He wears a shoe on his head and hats on his feet.\n\n**Stanza 2.** He lifts the shoe and smiles at the poet. His manners are polite, but she has never seen such a funny *sounding* sight.\n\n**Stanza 3.** He says, \"Allow me to present Your Highness with a rose,\" and takes out a currant bun and holds it to her nose.\n\n**Stanza 4.** She staggers back against the wall and says she never saw a rose with such a funny looking smell.\n\n**Stanza 5.** He sings a song and sits on the ground; she has never heard such a funny *feeling* sound.\n\n**Stanza 6.** She asks, \"My friend, why do you wear two hats on your feet?\" He turns the other way about and **hops home on his head**."}, {"type": "flashcards", "id": "c7-ch02-cards-funnyman", "title": "Poem words", "cards": [{"front": "currant", "back": "a small seedless raisin"}, {"front": "staggered", "back": "moved unsteadily"}, {"front": "inversion", "back": "changing the usual word order to keep the rhythm"}, {"front": "nonsense verse", "back": "a poem full of silly, impossible things"}]}, {"type": "quiz", "id": "c7-ch02-quiz-funny-true", "title": "Let us discuss I: true or false?", "questions": [{"type": "truefalse", "q": "The poet says she had never heard such an amusing song.", "answer": true, "explanation": "She says she never heard such a 'funny feeling sound'.", "hints": ["Stanza 5."]}, {"type": "truefalse", "q": "The funny man was quite ill-mannered.", "answer": false, "explanation": "His manners were polite.", "hints": ["Stanza 2."]}, {"type": "truefalse", "q": "The funny man wore two hats on his feet.", "answer": true, "explanation": "Hats upon his feet.", "hints": ["Stanza 1."]}, {"type": "truefalse", "q": "The funny man hopped on his head to reach home.", "answer": true, "explanation": "The last stanza says he hopped home on his head.", "hints": ["Last stanza."]}, {"type": "truefalse", "q": "The funny man gave a rose to the poet.", "answer": false, "explanation": "He gave a currant bun and called it a rose.", "hints": ["Stanza 3."]}, {"type": "truefalse", "q": "The funny man smiled at the poet.", "answer": true, "explanation": "He raised the shoe and smiled.", "hints": ["Stanza 2."]}]}, {"type": "quiz", "id": "c7-ch02-quiz-funny-words", "title": "II. Word puzzles", "questions": [{"type": "fill", "q": "a small seedless raisin: C _ R _ _ _ T", "answer": ["currant"], "explanation": "Currant.", "placeholder": "word", "hints": ["A fruit in the bun."]}, {"type": "fill", "q": "moved unsteadily: S _ _ G G _ _ _ D", "answer": ["staggered"], "explanation": "Staggered.", "placeholder": "word", "hints": ["How the poet moved back."]}]}, {"type": "text", "md": "**III. Complete with a reason.** Tone: **humorous / playful**, because the man does silly, impossible things. Rhyme scheme: **ABCB** (lines 2 and 4 rhyme, e.g. street/feet), which gives a **musical, sing-song** quality. The word 'funny' is repeated to **stress how odd and amusing** everything is.\n\n**IV.** 1. The poem uses vivid imagery to create a **humorous and nonsensical** scene. 2. It is in **dialogue** form (the poet and the man speak to each other). 3. 'Sounding sight' and 'hopped home' are examples of **alliteration**.\n\n**V. Inversion.** Poets change word order to keep the rhythm. Rewrite in correct order: *But I had never seen such a funny sounding sight before.* Why 'funny sounding sight' and 'funny feeling sound'? The poet **mixes the senses** (sound for a sight, feeling for a sound) to make nonsense and humour.\n\n**VI.** Real-life examples: clowns, street performers, comedy shows, mime artists."}, {"type": "quiz", "id": "c7-ch02-quiz-funny-lit", "title": "Check your literary ideas", "questions": [{"type": "single", "q": "The tone of the poem is ______.", "options": ["humorous", "sad", "angry", "serious"], "answer": 0, "explanation": "Silly actions make it funny.", "hints": ["What does the funny man do?"]}, {"type": "single", "q": "The rhyme scheme is ______.", "options": ["ABCB", "AABB", "ABAB", "ABBA"], "answer": 0, "explanation": "Lines 2 and 4 of each stanza rhyme.", "hints": ["Check street/feet."]}, {"type": "single", "q": "'Sounding sight' and 'hopped home' are examples of ______.", "options": ["alliteration", "simile", "metaphor", "rhyme"], "answer": 0, "explanation": "Repeated s and h sounds.", "hints": ["Same first sounds."]}]}, {"type": "text", "md": "**Let us think and reflect: extract 1 and 2.**"}, {"type": "quiz", "id": "c7-ch02-quiz-funny-ext", "title": "Extracts", "questions": [{"type": "single", "q": "Why does the funny man address the poet as 'Your Highness'?", "options": ["To show playful, exaggerated respect", "Because she is a queen", "Because he is scared", "Because he is rude"], "answer": 0, "explanation": "It is mock politeness that adds to the humour.", "hints": ["He gives a bun as a 'rose'."]}, {"type": "fill", "q": "A phrase that indicates a polite request: ______", "answer": ["allow me to present", "allow me"], "explanation": "'Allow me to present…' is polite.", "placeholder": "phrase", "hints": ["Starts with 'Allow'."]}, {"type": "single", "q": "The poet says 'Well!' to express surprise because ______.", "options": ["he offered a bun and called it a rose", "she liked the rose", "she was hungry", "he sang"], "answer": 0, "explanation": "A bun is not a rose.", "hints": ["What did he hold to her nose?"]}, {"type": "single", "q": "The poet calls the funny man 'my friend' because ______.", "options": ["she is friendly and curious despite his oddness", "she knows him", "he gave a gift", "he is her brother"], "answer": 0, "explanation": "She is polite and not afraid.", "hints": ["Her tone is warm."]}, {"type": "single", "q": "The last line makes readers feel ______.", "options": ["dreamy", "impatient", "worried", "cheerful"], "answer": 3, "explanation": "The silly ending makes us laugh.", "hints": ["Hopping on his head!"]}]}, {"type": "reveal", "prompt": "II. Answer the questions: model answers", "md": "1. Favourite trait: his **playfulness** or **politeness** (any, with a reason).\n2. His odd acts make the mood **light, silly and cheerful**.\n3. Alternative title: *The Upside-Down Man*, since everything is reversed.\n4. Dialogues make the poem **lively** and let us hear the characters.\n5. The poet shows that **imagination and fun** can be more important than logic; it is okay to be different."}, {"type": "summary", "points": ["A funny man does impossible things: shoes on head, hats on feet, a bun for a rose.", "The poem is humorous nonsense verse with ABCB rhyme.", "Mixed senses and inversion create humour and rhythm.", "Dialogue makes the poem lively."]}], "minutes": 30, "terms": [{"term": "inversion", "def": "changing normal word order for rhythm"}, {"term": "nonsense verse", "def": "playful poetry full of silly ideas"}], "source": {"chapter": "ch02", "sections": ["Before we read", "Let us read", "Let us discuss", "Let us think and reflect"], "pages": "59–63"}, "id": "c7u2-04-funnyman-read", "chapter": "c7u2", "kind": "lesson"}, "c7u2-05-funnyman-skills": {"title": "A Funny Man: Phrasal Verbs, Listening, Limericks", "summary": "Phrasal verbs, ways of walking, a funny listening story, a joke, limerick and explore tasks.", "blocks": [{"type": "text", "md": "**Phrasal verbs** combine a verb with a preposition or adverb to form a single unit, often with a new meaning: *walking down, taking out, sat down.* The same verb with different words gives different meanings."}, {"type": "quiz", "id": "c7-ch02-quiz-phrasal", "title": "Match 'take' phrasal verbs", "questions": [{"type": "single", "q": "take up = ______", "options": ["begin to study, practise or do something", "resemble", "understand", "assume control"], "answer": 0, "explanation": "She took up painting.", "hints": ["Starting a hobby."]}, {"type": "single", "q": "take after = ______", "options": ["resemble a family member", "become popular", "begin", "understand"], "answer": 0, "explanation": "Sheela takes after her father.", "hints": ["Looks like."]}, {"type": "single", "q": "take in = ______", "options": ["understand or comprehend", "assume control", "resemble", "succeed"], "answer": 0, "explanation": "I couldn't take in the lesson.", "hints": ["Understand."]}, {"type": "single", "q": "take over = ______", "options": ["assume control or responsibility", "resemble", "begin a hobby", "become popular"], "answer": 0, "explanation": "The new boss took over.", "hints": ["Control."]}, {"type": "single", "q": "take off = ______", "options": ["become successful quickly", "resemble", "understand", "begin"], "answer": 0, "explanation": "The product took off in sales.", "hints": ["Like an aeroplane."]}]}, {"type": "quiz", "id": "c7-ch02-quiz-phrasal2", "title": "Fill in with the right phrasal verb", "questions": [{"type": "fill", "q": "The new technology is set to ______ traditional methods of communication.", "answer": ["take over"], "explanation": "It will assume control.", "placeholder": "phrasal verb", "hints": ["Replace."]}, {"type": "fill", "q": "I tried hard to ______ what the writer wanted to say.", "answer": ["take in"], "explanation": "Understand.", "placeholder": "phrasal verb", "hints": ["Comprehend."]}, {"type": "fill", "q": "Arjun decided to ______ painting as a hobby.", "answer": ["take up"], "explanation": "Begin.", "placeholder": "phrasal verb", "hints": ["Start a hobby."]}, {"type": "fill", "q": "The smartphone quickly ______ in the market (sales).", "answer": ["took off"], "explanation": "Became successful.", "placeholder": "phrasal verb", "hints": ["Past tense."]}, {"type": "fill", "q": "Sheela ______ her father; they have the same smile.", "answer": ["takes after"], "explanation": "Resembles.", "placeholder": "phrasal verb", "hints": ["Family likeness."]}]}, {"type": "table", "headers": ["Verb", "Particle", "Meaning"], "rows": [["look", "after", "take care of"], ["look", "for", "search"], ["look", "up", "search in a dictionary"], ["run", "away", "escape"], ["run", "into", "meet by chance"], ["put", "on", "wear"], ["put", "off", "postpone"], ["break", "down", "stop working"], ["break", "out", "start suddenly"], ["call", "off", "cancel"], ["call", "for", "need or require"]]}, {"type": "exercise", "id": "c7-ch02-ex-phrasal-sentences", "title": "Five phrasal verb sentences", "difficulty": "easy", "minutes": 8, "goal": "Write five sentences using five different phrasal verbs from the table.", "behavior": "One sentence per phrasal verb; the meaning must be clear.", "hints": ["Pick familiar ones first (look after, put on).", "Check the table for meaning."], "checklist": ["5 sentences", "5 different phrasal verbs", "Correct tense"], "solution": "I look after my little brother. The match was called off because of rain. Please put on your jacket. The car broke down. I looked up the word in a dictionary.", "solution_lang": "text", "solution_explain": "Each sentence shows the new meaning.", "mode": "selfcheck"}, {"type": "quiz", "id": "c7-ch02-quiz-walk", "title": "Ways of moving: slowest to fastest", "questions": [{"type": "order", "q": "Arrange in increasing order of pace.", "items": ["stagger", "walk", "hop", "jog", "trot", "run", "sprint"], "explanation": "Stagger is unsteady and slow, walk is normal, hop is a jump, then jog, trot, run, sprint.", "hints": ["Slow to fast."]}]}, {"type": "callout", "kind": "note", "title": "🎧 Listening: a funny incident", "md": "**Girl:** Hello. This is quite a funny incident. One day I was so preoccupied with preparing for my presentation. After a long day of studying at a friend's place, I finally came home. Exhausted, I removed my shoes at the door and headed straight to the kitchen for some lunch. I served myself dal-chawal and ate it, still thinking about all the topics I needed to cover. Once I finished my lunch, I got up to put my shoes away in my room and place my plate in the kitchen. However, being so preoccupied, I ended up doing the opposite! I walked to my room with my plate in hand and left it on my desk. Then I took my shoes and placed them in the kitchen! As I stood there confused, I realised what I had done. I couldn't help but laugh at myself. I shook my head, recovered my shoes from the kitchen and kept the plate in the kitchen."}, {"type": "quiz", "id": "c7-ch02-quiz-incident", "title": "Order the events", "questions": [{"type": "order", "q": "Arrange the events in order.", "items": ["Prepared for the presentation", "Took off shoes", "Ate lunch", "Placed the plate in the room", "Laughed at the mistake", "Put the plate in the kitchen", "Put shoes in the room"], "explanation": "This is the order suggested by the script. (The book also asks you to pick the picture that matches; use the objects: shoes, plate, room, kitchen.)", "hints": ["Start with studying."]}]}, {"type": "text", "md": "**Let us speak: a joke.** *A man is talking to God. 'God, how long is a million years?' 'For me, it's about a minute.' 'How much is a million rupees?' 'It's less than a rupee for me.' The man quickly requests, 'God, may I have a rupee?' God promptly says, 'Wait a minute.'* Tell it in pairs: narrator in your own voice (matter-of-fact), the man in a louder, respectful voice, God in a deep, pleasant voice. Then create and tell your own joke.", "title": "Let us speak"}, {"type": "text", "md": "**Let us write: limericks.** A limerick is a nonsensical, funny five-line verse. Edward Lear's limerick about an old man with a beard that owls, a hen, larks and a wren made their nests in has the rhyme scheme **AABBA**. Lines 1, 2 and 5 rhyme; lines 3 and 4 rhyme (shorter lines). Structure: **Line 1** introduces a person or place ('There was a child from ___'); **lines 2–4** a silly story; **line 5** an unexpected ending.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch02-ex-limerick", "title": "Write a limerick", "difficulty": "medium", "minutes": 10, "goal": "Write your own limerick.", "behavior": "Five lines, rhyme AABBA, silly story, surprise ending.", "hints": ["Choose a rhyme word for line 1 first (Pune: moon, tune).", "Lines 3–4 are shorter.", "The last line repeats line 1's rhyme."], "checklist": ["Line 1 introduces a person or place", "Rhyme AABBA", "Funny story in lines 2–4", "Unexpected ending"], "solution": "There was a boy from Pune,\nWho tried to catch the moon.\nHe climbed on a chair,\nWith a net in the air,\nAnd fell down into a balloon.", "solution_lang": "text", "solution_explain": "A limerick needs the AABBA pattern and a silly twist.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. Humorous characters in Indian stories: **Tenali Rama, Birbal, Mullah Nasruddin, Vikramaditya and Betal**. Read one story and share it. II. The funny man's acts are like street performers, clowns, performance art or abstract theatre and children's comedy shows: all about humour, imagination and defying logic. III. **Sukumar Ray** wrote similar nonsense poems in *Abol Tabol*; share one in your own language. IV. 'My Lost Pencil' (p. 69) is a light poem in which the speaker looks everywhere for a lost pencil, says he has lost fifty this year, and promises to tie the next one with string or tape; read it for fun."}, {"type": "summary", "points": ["Phrasal verbs change meaning with the particle: take up, take after, take off.", "Pace words: stagger, walk, hop, jog, trot, run, sprint.", "A limerick has five lines with AABBA rhyme.", "Humour in India includes Tenali Rama, Birbal and Sukumar Ray."]}], "minutes": 35, "terms": [{"term": "phrasal verb", "def": "a verb plus a preposition or adverb with a special meaning"}, {"term": "limerick", "def": "a funny five-line poem rhyming AABBA"}], "source": {"chapter": "ch02", "sections": ["Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "63–69, 88"}, "id": "c7u2-05-funnyman-skills", "chapter": "c7u2", "kind": "lesson"}, "c7u2-06-play-read": {"title": "Say the Right Thing: Read and Discuss", "summary": "A humorous play by G. C. Thornley.", "blocks": [{"type": "text", "md": "**Before you read.** I. Work in pairs. 'Athithi Devo Bhava' means *the guest is like God*. Why is it important to be polite to guests? II. Polite behaviour with guests: offer water (1), enquire about their well-being (2), accompany them to the door (5). Impolite: asking when they will leave (3), criticising their habits (4). III. In groups, share at least three ways to handle friends who are rude when disagreeing (stay calm, listen first, use polite words, take a break, ask a teacher to help)."}, {"type": "flashcards", "id": "c7-ch02-cards-play", "title": "Play words", "cards": [{"front": "hilariously", "back": "in a very funny way"}, {"front": "blunders", "back": "careless mistakes"}, {"front": "embarrasses", "back": "makes someone uncomfortable"}, {"front": "stage direction", "back": "words in brackets telling actors how to act"}]}, {"type": "callout", "kind": "tip", "md": "The play is retold; read the original dialogue on pp. 71–77. **Characters:** Mary Shaw (a young girl), Mrs. Shaw (her mother), Mrs. Harding (wife of the wealthy Mr. Harding), Mrs. Lee (Mr. Harding's married sister).", "title": "Reading plan"}, {"type": "text", "title": "📖 Scene I: Mrs. Shaw prepares Mary", "md": "Mrs. Shaw tells Mary to put her coat in her bedroom because Mrs. Harding and Mrs. Lee are about to visit. Mary complains that she is always being told to put things away and says she is not a child. Mrs. Shaw explains that Mrs. Harding is the wife of a wealthy man who has just bought a big house in Lanfield (they lived in London), and Mrs. Lee is Mr. Harding's sister, staying with them. She met Mrs. Harding in a shop and invited her.\n\nMary says she can talk very well and wants to stay. Mrs. Shaw says she talks too much and suggests she go for a walk, because she may not say the right thing. Mary insists she knows the right things to say: 'Good afternoon', 'How are you?'. Mrs. Shaw agrees, because she wants Mrs. Harding as a friend in Lanfield, and gives advice: be kind, say pleasing things, laugh and make them laugh, say something if everyone stops talking, and when guests want to leave, look **sorry** and say, \"Must you go? Can't you stay?\" Mary repeats it to remember. Mrs. Shaw tells her to change into a clean dress and not to say anything that makes the guests angry."}, {"type": "table", "headers": ["Speaker", "Words of the speaker", "Reason"], "rows": [["Mrs. Shaw", "The room looks cleaner now. Put that coat away.", "To instruct Mary to keep the room tidy"], ["Mary", "You're always telling me to put things away.", "She is annoyed at being told again and again"], ["Mary", "I'm not a child!", "She wants to be treated as grown-up"], ["Mrs. Shaw", "You'll always be right if you're kind to people.", "To highlight the importance of being kind so Mary says the right things"]]}, {"type": "reveal", "prompt": "II. Do you think Mary will follow her mother's advice?", "md": "Probably **not**: she is over-confident, talks too much and does not think before speaking; she only memorised one line. (You will see in Scene II!)"}, {"type": "text", "title": "📖 Scene II: The visit", "md": "Mrs. Shaw says she is glad Mrs. Harding likes Lanfield. Mrs. Harding says it is not the same as London but they have found nice people and a good house. When there is silence, Mrs. Shaw looks at Mary.\n\nMary says what beautiful children Mrs. Harding has. Mrs. Harding says she has **no children** (not pleased). Mary insists she has seen them. Mrs. Shaw quietly says they must be someone else's and mentions Mr. Best. Mary says he works in London, goes by train every day and \"lives in trains\", reads two newspapers and never a book, and is only a banker, and bankers can't think. Mrs. Lee says her brother is a banker who goes to London by train and reads newspapers. Mary: \"Oh, I'm sorry. I didn't know.\"\n\nMrs. Shaw mentions Mrs. Best. Mary says she wears a blue dress with a red coat. Mrs. Harding says she does too; Mrs. Shaw quickly says she likes blue dresses and red coats. Mary mentions Mrs. Cotter, who stays in bed in the morning and keeps calling the doctor; Mrs. Harding stays in bed in the morning herself, Mrs. Lee often goes to the doctor. Mary says Mrs. Grantley is talkative and uninteresting; Mrs. Lee's mother is very talkative.\n\nLooking out of the window Mary says a dirty dog is always near their house and asks why people keep dogs. It is **Towzer, Mrs. Harding's dog**. Then she criticises Mr. Pomeroy for riding a horse and practising shooting; Mrs. Lee says her brother does the same, and that is why he bought a house here.\n\nMrs. Harding says it is getting late and they must go. Mrs. Shaw says, \"Please stay a little longer.\" Mary, unable to say the right thing even now, says: \"Oh, must you **stay**? Can't you **go**?\"\n\n*G. C. Thornley*"}, {"type": "quiz", "id": "c7-ch02-quiz-play-false", "title": "Let us discuss: correct the false statements", "questions": [{"type": "single", "q": "'Mrs. Harding states that they do not like London as it is not the same as Lanfield.' Correct version:", "options": ["They like Lanfield very much even though it is not the same as London", "They hate Lanfield", "They live in London", "Lanfield is bigger"], "answer": 0, "explanation": "This is the book's example.", "hints": ["What she really says."]}, {"type": "single", "q": "'Mrs. Harding was pleased to know that Mary was familiar with her children.' Correct version:", "options": ["She was not pleased and said she had no children", "She was thrilled", "She introduced them", "She laughed"], "answer": 0, "explanation": "She says she has no children, not pleased.", "hints": ["Her reaction."]}, {"type": "single", "q": "'Mrs. Shaw shared that she liked Mrs. Best as she read a lot of newspapers.' Correct version:", "options": ["She liked Mrs. Best because she is a nice woman (newspapers were about bankers like Mr. Best)", "She disliked her", "She never met her", "She read for her"], "answer": 0, "explanation": "Mrs. Shaw says Mrs. Best is a nice woman.", "hints": ["Who reads newspapers?"]}, {"type": "single", "q": "'Mrs. Harding and Mrs. Shaw agree that a blue dress with a red coat is unfashionable.' Correct version:", "options": ["Mrs. Harding says she wears the same; Mrs. Shaw says she likes it", "Both laughed at it", "Both disliked it", "Neither noticed"], "answer": 0, "explanation": "They defend the outfit politely.", "hints": ["Mrs. Harding's reply."]}, {"type": "single", "q": "'Mary shares that she finds the dog outside the window cute.' Correct version:", "options": ["She says the dog looks dirty and she doesn't like dogs", "She loves dogs", "She wants a dog", "She feeds it"], "answer": 0, "explanation": "She says it always looks very dirty.", "hints": ["Towzer!"]}]}, {"type": "summary", "points": ["Mrs. Shaw advises Mary to be kind and say pleasing things.", "Mary offends the guests by insulting people they love.", "At the end she says the opposite of what her mother taught.", "The humour comes from the gap between what Mary says and what she should say."]}], "minutes": 30, "terms": [{"term": "blunder", "def": "a careless mistake"}, {"term": "embarrass", "def": "make someone uncomfortable"}], "source": {"chapter": "ch02", "sections": ["Before we read", "Scenes I and II", "Let us discuss"], "pages": "70–77"}, "id": "c7u2-06-play-read", "chapter": "c7u2", "kind": "lesson"}, "c7u2-07-play-reflect-learn": {"title": "Say the Right Thing: Reflect and Learn", "summary": "Extract questions, suffixes, say/tell and similar words, tenses and kinds of sentences.", "blocks": [{"type": "quiz", "id": "c7-ch02-quiz-play-ext1", "title": "Extract 1: Mary wants to stay", "questions": [{"type": "single", "q": "What does Mrs. Shaw imply by 'One day you'll have to go to some of these houses yourself and talk to the people there'?", "options": ["She wants Mary to develop social skills for the future", "She thinks Mary is ready now", "She hopes Mary avoids people", "Mary should start visiting"], "answer": 0, "explanation": "She is thinking of Mary's future manners.", "hints": ["Look at 'one day'."]}, {"type": "single", "q": "Mrs. Shaw and Mary are discussing how to ______.", "options": ["have a polite conversation", "get to know people better"], "answer": 0, "explanation": "They talk about what to say to guests.", "hints": ["What is the purpose of the advice?"]}, {"type": "single", "q": "Why did Mary insist on staying?", "options": ["She was overconfident and wanted to show she could talk well", "She was scared", "She liked tea", "She wanted to help clean"], "answer": 0, "explanation": "'I can talk very well when I like.'", "hints": ["Her attitude."]}, {"type": "single", "q": "Mary is ______ and Mrs. Shaw is ______.", "options": ["eager/inexperienced; cautious", "cautious; eager", "inexperienced; eager", "rude; kind"], "answer": 0, "explanation": "Mary: eager and inexperienced. Mrs. Shaw: cautious.", "hints": ["Who worries?"]}]}, {"type": "quiz", "id": "c7-ch02-quiz-play-ext2", "title": "Extract 2: Mrs. Cotter", "questions": [{"type": "fill", "q": "Mary could spot Mrs. Cotter in the street because ______.", "answer": ["she met her in the street", "she saw her in the street"], "explanation": "She says she saw her in the street that afternoon.", "placeholder": "reason", "hints": ["She says where she met her."]}, {"type": "single", "q": "Mary's comment about Mrs. Cotter suggests ______.", "options": ["she cannot understand why people need medical help", "she worries about Mrs. Cotter", "she thinks Mrs. Cotter is lonely", "Mrs. Cotter is right to rest"], "answer": 0, "explanation": "She says she has never been to a doctor.", "hints": ["Her own experience."]}, {"type": "fill", "q": "How can we say Mary enjoyed good health? She has ______.", "answer": ["never been to a doctor", "never gone to a doctor"], "explanation": "She has never been to a doctor in her life.", "placeholder": "reason", "hints": ["Her own words."]}, {"type": "truefalse", "q": "Mary might have unintentionally offended Mrs. Harding.", "answer": true, "explanation": "Mrs. Harding herself stays in bed in the morning.", "hints": ["Her reply."]}]}, {"type": "text", "md": "**Long answers: models.**"}, {"type": "reveal", "prompt": "1. What does Mary's comment about Mr. Best reveal about her view of bankers?", "md": "She thinks bankers' lives are dull (living in trains, only newspapers, no books) and that **bankers can't think**: a hasty, prejudiced opinion."}, {"type": "reveal", "prompt": "2. What can we infer about Mary's understanding of polite conversation?", "md": "She thinks talking a lot is enough. She does not realise that **being kind and tactful** matters more than speaking."}, {"type": "reveal", "prompt": "3. What does 'no one speaks' indicate?", "md": "An **awkward, uncomfortable** silence after each of Mary's remarks."}, {"type": "reveal", "prompt": "4. How does Mary's attitude change?", "md": "She begins **confident and boastful**, and ends in **embarrassment** ('with a red face'); yet she still fails, showing she has not learned."}, {"type": "reveal", "prompt": "5. What do the guests' responses reveal?", "md": "Mrs. Harding and Mrs. Lee are **patient and polite**; they hide anger, answer calmly and only leave when it becomes too much."}, {"type": "reveal", "prompt": "6. How does the play show the importance of polite conversation?", "md": "Mary's blunders show how words can **hurt and embarrass**. Politeness, thinking before speaking and kindness build friendships."}, {"type": "text", "md": "**Suffixes.** hilarious**ly**, humor**ous**, com**ing**, beauti**ful** are made by adding endings called **suffixes** to root words (humour + -ous; hilarious + -ly; come + -ing, dropping the e; beauty + -ful, y becomes i). Root + suffix: glad + ly; bank + er; guide + ance; quiet + ly; walk + ing.", "title": "Suffixes"}, {"type": "table", "headers": ["Word", "Suffix", "Purpose", "Example"], "rows": [["Biology", "-logy", "a study of", "Sociology"], ["tolerance", "-ance", "change to a noun", "importance"], ["stopped", "-ed", "change to past tense", "walked"], ["backward", "-ward", "in a certain direction", "homeward"], ["courageous", "-ous", "change to adjective", "dangerous"], ["quietly", "-ly", "change to adverb", "slowly"], ["toughest", "-est", "change to superlative", "tallest"], ["tomatoes", "-es", "change to plural", "boxes"]]}, {"type": "quiz", "id": "c7-ch02-quiz-suffix", "title": "Add the suffix", "questions": [{"type": "fill", "q": "To communicate ______ (effective)", "answer": ["effectively"], "explanation": "effective + ly", "placeholder": "word", "hints": ["Adverb."]}, {"type": "fill", "q": "choose your words and topics ______ (wise)", "answer": ["wisely"], "explanation": "wise + ly", "placeholder": "word", "hints": ["Adverb."]}, {"type": "fill", "q": "Avoid ______ (discuss) things you don't know", "answer": ["discussing"], "explanation": "discuss + ing", "placeholder": "word", "hints": ["After 'avoid'."]}, {"type": "fill", "q": "be ______ (respect) towards others", "answer": ["respectful"], "explanation": "respect + ful", "placeholder": "word", "hints": ["Adjective."]}, {"type": "fill", "q": "express your ______ (appreciate)", "answer": ["appreciation"], "explanation": "appreciate → appreciation", "placeholder": "word", "hints": ["Noun."]}, {"type": "fill", "q": "be ______ (response) by replying promptly", "answer": ["responsive"], "explanation": "response → responsive", "placeholder": "word", "hints": ["Adjective."]}]}, {"type": "text", "md": "**Say and tell.** 'Say' focuses on the message and does not always need a listener; 'tell' focuses on who receives the message and always needs a listener. Other pairs: **fetch** (go and bring back) / **bring** (take with you); **see** (view) / **look** (pay attention); **live** (permanent home) / **stay** (temporary); **study** (formal learning) / **learn** (gain knowledge); **speak** (formal) / **talk** (informal); **hear** (unintentional) / **listen** (intentional).", "title": "Say / tell"}, {"type": "quiz", "id": "c7-ch02-quiz-saytell", "title": "Choose the right word", "questions": [{"type": "fill", "q": "I ______ at the photo, but I didn't ______ anyone familiar. (past, then base)", "answer": ["looked see", "looked, see"], "explanation": "looked (paid attention), see (view).", "placeholder": "two words", "hints": ["Look/see."]}, {"type": "fill", "q": "I'd better go and ______ my mother from the station, and then ______ her home.", "answer": ["fetch bring", "fetch, bring"], "explanation": "fetch then bring.", "placeholder": "two words", "hints": ["Go and get / take with."]}, {"type": "fill", "q": "I need to ______ for my maths exam, so I hope to ______ new concepts.", "answer": ["study learn", "study, learn"], "explanation": "study, learn.", "placeholder": "two words", "hints": ["Formal then gain."]}, {"type": "fill", "q": "I can ______ the music from next door, but I need to ______ carefully.", "answer": ["hear listen", "hear, listen"], "explanation": "hear, listen.", "placeholder": "two words", "hints": ["Unintentional then intentional."]}, {"type": "fill", "q": "'Could I ______ to Mrs. Kalpana, who is going to ______ to us about gardening?' (formal then informal)", "answer": ["speak talk", "speak, talk"], "explanation": "speak, talk.", "placeholder": "two words", "hints": ["Formal then informal."]}, {"type": "fill", "q": "I ______ in a small town, but I often ______ with relatives in the city.", "answer": ["live stay", "live, stay"], "explanation": "live (permanent), stay (temporary).", "placeholder": "two words", "hints": ["Permanent/temporary."]}]}, {"type": "text", "md": "**Tenses.** 'They **lived** in London before' and 'I **met** her… and **asked** her' are **simple past**. 'She **has been staying** with them for a while' is **present perfect continuous** (has/have + been + verb-ing): the duration of an action that began in the past and continues now, or an ongoing recent action whose result is visible now ('Mrs. Shaw has been cleaning since morning; the room looks spotless')."}, {"type": "quiz", "id": "c7-ch02-quiz-prescont", "title": "Fill: present continuous / present perfect continuous", "questions": [{"type": "fill", "q": "The students ______ (organise) a play and setting up the stage.", "answer": ["are organising", "are organizing"], "explanation": "Now: present continuous.", "placeholder": "verb", "hints": ["Happening now."]}, {"type": "fill", "q": "They ______ (prepare) for weeks.", "answer": ["have been preparing"], "explanation": "for weeks: present perfect continuous.", "placeholder": "verb", "hints": ["Duration."]}, {"type": "fill", "q": "The performers ______ (rehearse) every day.", "answer": ["have been rehearsing"], "explanation": "Ongoing for some time.", "placeholder": "verb", "hints": ["Duration."]}, {"type": "fill", "q": "Their excitement ______ (grow).", "answer": ["is growing"], "explanation": "Present continuous.", "placeholder": "verb", "hints": ["Now."]}, {"type": "fill", "q": "The sound in-charge ______ (test) the microphones.", "answer": ["is testing"], "explanation": "Present continuous.", "placeholder": "verb", "hints": ["Now."]}, {"type": "fill", "q": "Everyone ______ (work) hard.", "answer": ["is working"], "explanation": "Present continuous.", "placeholder": "verb", "hints": ["Now."]}, {"type": "fill", "q": "The place ______ (buzz) with energy.", "answer": ["is buzzing"], "explanation": "Present continuous.", "placeholder": "verb", "hints": ["Now."]}]}, {"type": "text", "md": "**Kinds of sentences:** **Declarative** (states, ends with a full stop), **Interrogative** (asks, question mark), **Exclamatory** (strong feeling, exclamation mark), **Imperative** (order or request, full stop)."}, {"type": "quiz", "id": "c7-ch02-quiz-kinds", "title": "Name the kind of sentence", "questions": [{"type": "single", "q": "The meeting starts at 10.00 a.m. in the conference room.", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 0, "explanation": "States information.", "hints": ["Ends with a full stop."]}, {"type": "single", "q": "What an exciting adventure it was!", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 2, "explanation": "Strong feeling.", "hints": ["Starts with What an…"]}, {"type": "single", "q": "How did you solve the problem so quickly?", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 1, "explanation": "Asks a question.", "hints": ["Question mark."]}, {"type": "single", "q": "What is the weather forecast today?", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 1, "explanation": "Question.", "hints": ["Question mark."]}, {"type": "single", "q": "How beautiful is the rainbow!", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 2, "explanation": "Exclamation of feeling.", "hints": ["Ends with !"]}, {"type": "single", "q": "Clean up your room before dinner.", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 3, "explanation": "A command.", "hints": ["Order."]}, {"type": "single", "q": "The children are planning a surprise party for their mom.", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 0, "explanation": "States a fact.", "hints": ["Full stop."]}, {"type": "single", "q": "Turn off the music.", "options": ["declarative", "interrogative", "exclamatory", "imperative"], "answer": 3, "explanation": "A command or request.", "hints": ["Order."]}]}, {"type": "summary", "points": ["Mary is eager and inexperienced; Mrs. Shaw is cautious.", "Suffixes change a word's class: -ly (adverb), -ous (adjective), -ance (noun), -ed (past).", "Say vs tell, speak vs talk, live vs stay, hear vs listen differ in meaning.", "The four sentence kinds: declarative, interrogative, exclamatory, imperative."]}], "minutes": 40, "terms": [{"term": "suffix", "def": "an ending added to a root word"}, {"term": "imperative sentence", "def": "a sentence that gives a command or request"}], "source": {"chapter": "ch02", "sections": ["Let us think and reflect", "Let us learn I–IV"], "pages": "78–83"}, "id": "c7u2-07-play-reflect-learn", "chapter": "c7u2", "kind": "lesson"}, "c7u2-08-play-skills": {"title": "Say the Right Thing: Listen, Speak, Write, Explore", "summary": "Manners conversation, sentence stress and intonation, rewriting the play as a story, and exploring.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: a mother and son talk about manners", "md": "**Mother:** Why were you getting impatient in the grocery store?\n\n**Son:** Was I really? I just didn't like waiting so long.\n\n**Mother:** I know waiting can be boring, but we always stand in queues and wait for our turn. It's fair for everyone, right?\n\n**Son:** Hmm, I guess. Even if it takes a lot of time?\n\n**Mother:** That's when we practise patience. And when it's our turn, what do we say to the shopkeeper?\n\n**Son:** We say 'Thank you', and 'Please' if we ask for something.\n\n**Mother:** Yes! Those are polite words. Why are they important?\n\n**Son:** Maybe because they make people feel respected?\n\n**Mother:** Exactly! It shows gratitude and kindness. And yesterday, when you bumped into the lady in the blue sari?\n\n**Son:** I said sorry right away. You always tell me it's important to apologise.\n\n**Mother:** Why is it important?\n\n**Son:** So people know I didn't mean to and that I care?\n\n**Mother:** Yes, it shows you're responsible. And in places like the library, what kind of voice should we use?\n\n**Son:** We speak softly so we don't bother others.\n\n**Mother:** Right again! It's called an 'inside voice'.\n\n**Son:** I also know that we should cover our mouth when we yawn, sneeze or cough in a public place.\n\n**Mother:** Very good. You are turning into a polite young man."}, {"type": "quiz", "id": "c7-ch02-quiz-manners", "title": "Listen and answer", "questions": [{"type": "single", "q": "How did the son behave in the grocery queue?", "options": ["strangely", "impatiently", "politely"], "answer": 1, "explanation": "The mother asks why he was getting impatient.", "hints": ["First line."]}, {"type": "single", "q": "The mother finally refers to her son as a ______.", "options": ["polite young man", "responsible son", "grateful person"], "answer": 0, "explanation": "She says he is turning into a polite young man.", "hints": ["Last line."]}, {"type": "truefalse", "q": "The mother uses the incident to teach patience and fairness.", "answer": true, "explanation": "She talks about queues and waiting for one's turn.", "hints": ["Early lines."]}, {"type": "truefalse", "q": "The son understands that apologising shows he notices others.", "answer": true, "explanation": "He says it shows he cares.", "hints": ["Middle."]}, {"type": "truefalse", "q": "The mother discourages speaking softly in public.", "answer": false, "explanation": "She praises speaking softly (inside voice).", "hints": ["Library."]}, {"type": "truefalse", "q": "The son thinks covering his mouth is important only at home.", "answer": false, "explanation": "He says in a gathering or public place.", "hints": ["His words."]}, {"type": "truefalse", "q": "The son receives all advice readily.", "answer": false, "explanation": "He first shows impatience and asks 'Even if it takes a lot of time?'", "hints": ["Early lines."]}, {"type": "truefalse", "q": "The mother uses praise to support polite behaviour.", "answer": true, "explanation": "'Exactly!', 'Right again!', 'Very good'.", "hints": ["Her responses."]}], "intro": "True statements 1, 2, 3 and 7 are the four correct picks in the book's list; the others are false."}, {"type": "text", "md": "**Let us speak: sentence stress and intonation.** **Intonation** is the rise and fall of the pitch of the voice. **Sentence stress** is laying emphasis on certain words. **Content words** (book, run, beautiful, quickly) are stressed more than **function words** (she, in, is). Stress means *more emphasis*, not *louder*. Declarative sentences usually have **falling intonation** at the end.\n\nPractise: *I saw Mrs. Cotter this afternoon.* (stress 'Mrs. Cotter'). Then *The room looks cleaner now. You always talk too much. You leave your clothes all over the house.* with falling intonation. With **rising intonation** the same sentence sounds like a question: *I saw Mrs. Cotter this afternoon?*", "title": "Let us speak"}, {"type": "table", "headers": ["Stress this word in 'I didn't hurt anyone today'", "Meaning"], "rows": [["I", "I, specifically, did not hurt anyone (someone else might have)"], ["didn't", "The action of hurting did not occur"], ["hurt", "I might have done other things but did not hurt anyone"], ["anyone", "I may have said many things but no single person was hurt"], ["today", "I might usually cause hurt, but not on this day"]]}, {"type": "quiz", "id": "c7-ch02-quiz-stress", "title": "Stress changes meaning", "questions": [{"type": "single", "q": "'I didn't hurt anyone today.' (stress on **today**)", "options": ["I might cause hurt usually, but not anyone on this day", "Someone else did it", "I did not do it at all", "I hurt nobody ever"], "answer": 0, "explanation": "Stress on today contrasts with other days.", "hints": ["Which word is stressed?"]}, {"type": "single", "q": "'I didn't hurt anyone today.' (stress on **I**)", "options": ["I did not hurt anyone, but someone else might have", "The act did not occur", "Not a single person was hurt", "Not today"], "answer": 0, "explanation": "It points to the speaker.", "hints": ["Who is being contrasted?"]}]}, {"type": "text", "md": "**Let us write.** Rewrite the play 'Say the Right Thing' as a **short story** about Mary, her mother and the guests. Capture main events, emotions and humorous moments; use paragraphs and descriptive language.\n\nHints: 1. Introduction: Mary and Mrs. Shaw, their relationship, the setting. 2. Mrs. Shaw's instructions and Mary's confidence. 3. The visit: Mary's remarks and the guests' reactions. 4. Key humorous and awkward moments. 5. Conclusion: how the visit ended and Mary's impact.", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch02-ex-play-story", "title": "Rewrite the play as a story", "difficulty": "hard", "minutes": 20, "goal": "Write a short story (about 15 sentences) based on the play.", "behavior": "Use the five hints as five paragraphs.", "hints": ["Change dialogue to narration, keep a few quotes.", "Describe feelings: 'Mrs. Harding's face tightened'.", "End with Mary's wrong goodbye."], "checklist": ["Introduction", "Instructions before the visit", "The visit and blunders", "Humorous moments", "Ending"], "solution": "Mary Shaw was a cheerful girl who loved to talk. On a sunny afternoon her mother, Mrs. Shaw, hurried about tidying the room… (Continue: advice, the guests' arrival, the remarks about the children, bankers, the dog Towzer, and the final line 'Must you stay? Can't you go?')", "solution_lang": "text", "solution_explain": "A good story keeps events in order and shows feelings and humour.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. In groups, **enact your favourite part** of the play. Give each member a role (director, narrator, characters) and include the actions and expressions given in brackets. II. Find out how people greet guests at home in different languages (e.g. Hindi *Namaste, swagat hai*; Tamil *Vaanga*; Bengali *Aashun*). III. **Vasudhaiva Kuṭumbakam** is a Sanskrit phrase meaning *the world is one family* (*vasudha* = Earth, *eva* = is thus, *kutumbakam* = family). It comes from ancient texts such as the Maha Upanishad and the Hitopadesha and was the theme of the G20 Summit hosted by India, promoting global unity, cooperation, kindness and empathy."}, {"type": "summary", "points": ["A polite conversation includes patience, please, thank you, apologising and a soft voice.", "Stress and intonation change meaning.", "A play can be rewritten as a story by turning dialogue into narration.", "Vasudhaiva Kutumbakam means the world is one family."]}], "minutes": 40, "terms": [{"term": "intonation", "def": "the rise and fall of the voice"}, {"term": "sentence stress", "def": "emphasis on certain words"}], "source": {"chapter": "ch02", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore", "Transcripts"], "pages": "84–89"}, "id": "c7u2-08-play-skills", "chapter": "c7u2", "kind": "lesson"}, "c7u2-99-test": {"title": "Test: Unit 2 – Wit and Humour", "kind": "test", "summary": "Check what you learned in this whole unit.", "blocks": [{"type": "quiz", "id": "c7-ch02-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Why did the Cat's-food-Man suggest Dolittle become an animal doctor?", "options": ["He knew more about animals than vets", "He disliked people", "Animals paid more", "He was sick"], "answer": 0, "explanation": "He praised the cat book.", "hints": ["His first speech."]}, {"type": "single", "q": "What does the plough horse need?", "options": ["green spectacles", "big pills", "a new door", "more food"], "answer": 0, "explanation": "He was going blind in one eye.", "hints": ["His request."]}, {"type": "single", "q": "'Cat's-food-Man' is a ______ compound word.", "options": ["hyphenated", "open", "closed"], "answer": 0, "explanation": "Words joined with hyphens.", "hints": ["Look at the punctuation."]}, {"type": "single", "q": "'Step on no pets' is a ______.", "options": ["palindrome", "metaphor", "limerick", "compound word"], "answer": 0, "explanation": "Reads the same backwards.", "hints": ["Reverse it."]}, {"type": "fill", "q": "'She has been staying' is in the present perfect ______ tense.", "answer": ["continuous"], "explanation": "has been + verb-ing.", "placeholder": "word", "hints": ["Ongoing."]}, {"type": "single", "q": "The rhyme scheme of 'A Funny Man' is ______.", "options": ["ABCB", "AABBA", "AABB"], "answer": 0, "explanation": "Lines 2 and 4 rhyme.", "hints": ["Check street/feet."]}, {"type": "single", "q": "'take after' means ______.", "options": ["resemble", "begin", "understand", "cancel"], "answer": 0, "explanation": "Sheela takes after her father.", "hints": ["Family likeness."]}, {"type": "single", "q": "A limerick has the rhyme scheme ______.", "options": ["AABBA", "ABAB", "ABCB", "AABB"], "answer": 0, "explanation": "Five lines, AABBA.", "hints": ["Lear's limerick."]}, {"type": "single", "q": "Mary offends Mrs. Harding by saying that ______.", "options": ["she has beautiful children", "the dog looks dirty (it is Towzer)", "her house is small", "she likes London"], "answer": 1, "explanation": "Towzer is Mrs. Harding's dog.", "hints": ["Window scene."]}, {"type": "single", "q": "Which suffix changes 'quiet' to an adverb?", "options": ["-ly", "-ous", "-ance", "-est"], "answer": 0, "explanation": "quietly.", "hints": ["Adverb ending."]}, {"type": "single", "q": "'Close the door.' is a(n) ______ sentence.", "options": ["imperative", "declarative", "exclamatory", "interrogative"], "answer": 0, "explanation": "A command.", "hints": ["Order."]}, {"type": "single", "q": "Mary's final line shows ______.", "options": ["she still cannot say the right thing", "she learned her lesson", "she was angry", "she was kind"], "answer": 0, "explanation": "She says 'Must you stay? Can't you go?'", "hints": ["Opposite of her mother's words."]}, {"type": "truefalse", "q": "Stress means saying a word louder than others.", "answer": false, "explanation": "Stress means more emphasis, not necessarily louder.", "hints": ["Definition."]}], "mode": "test"}], "id": "c7u2-99-test", "chapter": "c7u2", "minutes": 10}, "c7u3-01-invention-read": {"title": "My Brother's Great Invention: Read and Discuss", "summary": "Anita tells how her brother Anand's burglar alarm and time machine cause chaos.", "blocks": [{"type": "text", "md": "**Before you read.** I. Guess the invention. 1. *I am a concept invented by ancient Indian mathematicians. I add value to numbers. Without me, calculations in the digital world would be impossible.* 2. *I am an ancient Indian practice, now popular globally, for physical and mental well-being.* II. In groups of four, discuss what the world would be like without inventions and discoveries. III. Fill the grid to complete words that show the qualities of an inventor."}, {"type": "quiz", "id": "c7-ch03-quiz-guess", "title": "Warm-up answers", "questions": [{"type": "single", "q": "Who am I? 'I am a concept invented by ancient Indian mathematicians. I add value to numbers.'", "options": ["zero", "yoga", "algebra", "abacus"], "answer": 0, "explanation": "Zero (shunya) gives place value and made modern calculation possible.", "hints": ["It is a number that means nothing, yet means everything."]}, {"type": "single", "q": "An ancient Indian practice for physical and mental well-being, now popular worldwide:", "options": ["yoga", "chess", "kabaddi", "rangoli"], "answer": 0, "explanation": "Yoga.", "hints": ["Think of asanas."]}, {"type": "fill", "q": "Complete: C R E A T I V I T Y. Missing letters of 'C _ R _ A T _ V _ T _' gives the word ______.", "answer": ["creativity"], "explanation": "Creativity.", "placeholder": "word", "hints": ["Quality of new ideas."]}, {"type": "fill", "q": "'C U _ I _ S I T Y' → ______", "answer": ["curiosity"], "explanation": "Curiosity.", "placeholder": "word", "hints": ["Wanting to know."]}, {"type": "fill", "q": "'R I S K - T A K I N G' → ______", "answer": ["risk-taking", "risk taking"], "explanation": "Risk-taking.", "placeholder": "word", "hints": ["Daring to try."]}, {"type": "fill", "q": "'D E T E R M I N A T I O N' → ______", "answer": ["determination"], "explanation": "Determination.", "placeholder": "word", "hints": ["Never giving up."]}, {"type": "fill", "q": "'I M A G I N A T I O N' → ______", "answer": ["imagination"], "explanation": "Imagination.", "placeholder": "word", "hints": ["Picturing new things."]}]}, {"type": "callout", "kind": "tip", "md": "The story is by **Anita Rau Badami**. It is retold in simple words (original pp. 93–98). Words: racket, sopping, scowling, rigged up, tinkering, dynamos, elaborate, clanging, smugly, stealthily, sceptical, frantic, crestfallen, offended, groggily, ruffianly, gasped, brandishing, cudgel, muffled, eerie, clattering, unison, hastily, peering, indulgently, intruders, dismantled, niggling.", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch03-cards-invention", "title": "Story words", "cards": [{"front": "racket", "back": "a loud and disturbing noise"}, {"front": "sopping", "back": "soaking"}, {"front": "scowling", "back": "having an angry, frowning expression"}, {"front": "rigged up", "back": "assembled something temporarily"}, {"front": "tinkering", "back": "experimenting or fiddling"}, {"front": "dynamo", "back": "an electric generator"}, {"front": "stealthily", "back": "quietly, so as not to be seen or heard"}, {"front": "sceptical", "back": "doubtful"}, {"front": "crestfallen", "back": "sad and disappointed"}, {"front": "brandishing", "back": "waving"}, {"front": "cudgel", "back": "a short thick stick used as a weapon"}, {"front": "eerie", "back": "strange"}, {"front": "unison", "back": "together"}]}, {"type": "text", "title": "📖 Part I: The burglar alarm and the time machine", "md": "\"Who put that water bag here?\" Papa roars from the front doorstep. \"Your burglar alarm,\" the narrator hisses to her brother Anand, who is getting ready to disappear. Ma rushes in and finds Papa standing sopping wet and scowling. \"I think it's supposed to be a burglar alarm,\" says Ma soothingly. Anand vanishes and returns only after dinner when Papa has cooled down.\n\nThe narrator is **Anita**, fourteen. Her brother **Anand** is a year younger and thinks he is a scientist. He loves tinkering with electrical gadgets, tools, dynamos and planks of wood, and his 'inventions' never work as planned. After a rush of thefts in the colony, he decides to build a burglar alarm. As soon as Papa leaves for the office and Ma for the market, he starts. Anita, who would rather finish her novel, warns him not to bring her in if he gets a shelling.\n\nAnand shows a **blueprint** of doors, wires and bells. When the door opens the alarm clangs, and a water bag drops on the thief's head; then they call the police. How does the alarm know it's a burglar? Anand says it works only when the door is opened **gently**, as a thief does. Anita is sceptical and says she is not involved. Papa, who always opens the door softly, gets soaked. For a week Anand tries nothing new.\n\nThen the family sees the film *Back to the Future* and Anand decides to build a **time machine**. Papa locks his tool box and hides the key; Ma keeps a wary eye on her oven and mixer, since Anand takes apart household gadgets for parts. There is hammering, sawing and clattering; his room becomes a network of wires, springs, levers and bulbs, with a big switchboard panel. He does not even comb his hair. After a fortnight of frantic activity, he announces at lunch that they can try it that night.\n\nPapa says firmly, \"When I say NO, I mean NO.\" Anand looks crestfallen; Ma says, \"At least let's take a look at it,\" and Papa sighs, \"If the house falls, it's your fault.\" The test cannot happen that day because next day Papa and Ma go to **Kharagpur** for a wedding, one night away. Ma makes Anand promise sternly not to try the machine till they return; he promises half-heartedly, offended by the lack of respect for his creation."}, {"type": "quiz", "id": "c7-ch03-quiz-cause", "title": "Complete the cause-and-effect table", "questions": [{"type": "single", "q": "Cause: Anand set up his burglar alarm to work when the door was opened softly. Effect:", "options": ["Papa, who opens the door softly, got drenched", "The thief was caught", "The alarm broke", "Ma was drenched"], "answer": 0, "explanation": "Papa always opens doors softly, so he became th
