that…", "options": ["she was skilled at studying and noticing things about cosmic rays", "she had a medical problem with her eye", "she disliked rays"], "answer": 0, "explanation": "A skilled researcher.", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "(i) Why is mentioning Patrick M.S. Blackett significant?", "md": "It shows that Bibha worked under a world-famous Nobel Laureate, so her work was of high standard and recognised."}, {"type": "text", "md": "**Extract 2** — the journey from Bibha’s era to today’s women scientists has been long and arduous but inspiring; Bibha’s legacy lives on and she will always guide the way.", "title": "Extract 2"}, {"type": "quiz", "id": "u5c3-q-e2", "title": "Extract 2", "questions": [{"type": "single", "q": "(i) What can be inferred about today’s challenges compared to Bibha’s era?", "options": ["No barriers now", "The challenges remain, but progress has been made", "Struggles are harder now", "Same as before"], "answer": 1, "explanation": "B.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iv) ‘Bibha Chowdhuri was the beacon … whose story continues to inspire young women.’ Fact or opinion?", "options": ["fact", "opinion"], "answer": 1, "explanation": "Calling her ‘the beacon’ is a judgement.", "hints": ["Can it be proved?"]}]}, {"type": "reveal", "prompt": "(ii) ‘Bibha Chowdhuri’s legacy lives on’ suggests… (iii) Why ‘beacon’ and ‘beam of light’?", "md": "(ii) Her work and example are still remembered and inspire others.\n\n(iii) Like a beacon or beam of light, she guided and inspired others; her name Bibha also means beam of light, and a star bears it."}, {"type": "text", "md": "Long questions.", "title": "Answer the following"}, {"type": "reveal", "prompt": "1. Why is she considered a pioneer?", "md": "She was India’s first woman physicist and the first Indian woman to excel in high-energy particle physics; she broke into a male-dominated field."}, {"type": "reveal", "prompt": "2. What does Schrödinger’s nomination tell us?", "md": "It shows that a Nobel-winning physicist recognised her exceptional talent."}, {"type": "reveal", "prompt": "3. She never worked for awards. Evidence.", "md": "She received no awards in her lifetime yet continued working tirelessly; her work went on quietly."}, {"type": "reveal", "prompt": "4. Renaming a star: literal and symbolic recognition", "md": "Literal: a real star carries her name (HD 86081 → ‘Bibha’). Symbolic: she is a ‘star’ and a beam of light for Indian science."}, {"type": "reveal", "prompt": "5. How do women in ISRO reflect changing attitudes?", "md": "They are now leaders, not just participants — Ritu Karidhal, over 50 women on Chandrayaan-3 — showing society accepts women in STEM more."}, {"type": "reveal", "prompt": "6. The writer’s purpose?", "md": "To honour Bibha, show how far women in science have come, and inspire young readers."}, {"type": "reveal", "prompt": "7. How might this text shape perceptions of women in other male-dominated fields?", "md": "It shows determination can break barriers, so readers may see women as capable in any field."}, {"type": "summary", "points": ["Inference: the press title showed doubt about women scientists.", "Fact = provable; opinion = judgement.", "Bibha is a role model."]}], "source": {"chapter": "u5c3", "pages": "237-239"}, "id": "c8u5c3-03-reflect", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-04-learn": {"title": "Let us learn: antonyms, suffixes, acronyms, clipping and the passive", "summary": "Build vocabulary and practise passive voice.", "minutes": 35, "blocks": [{"type": "text", "md": "In this lesson you will use antonyms, suffixes -ship/-ment/-hood, acronyms, clipping and the passive.", "title": "Goal"}, {"type": "quiz", "id": "u5c3-q-ant", "title": "Antonyms (crossword clues)", "questions": [{"type": "fill", "q": "core ↔ ______ (across 4)", "answer": ["periphery"], "explanation": "periphery", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "dependent ↔ ______ (across 5)", "answer": ["autonomous"], "explanation": "autonomous", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "extinguish ↔ ______ (across 7)", "answer": ["ignite"], "explanation": "ignite", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "effortless ↔ ______ (down 1)", "answer": ["arduous"], "explanation": "arduous", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "weakness ↔ ______ (down 2)", "answer": ["tenacity"], "explanation": "tenacity", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "trivial ↔ ______ (down 6)", "answer": ["notable"], "explanation": "notable", "hints": ["Look for the exact word."]}], "intro": "Other clues: neglect (down 3) and terrestrial (across 8) — find antonyms in the text and your grid (for example *acclaim* for neglect, *cosmic* for terrestrial)."}, {"type": "quiz", "id": "u5c3-q-sub", "title": "Substitute the underlined phrase", "questions": [{"type": "fill", "q": "the first people to start the online markets", "answer": ["pioneers"], "explanation": "pioneers", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "a scientist who studies matter, energy, light", "answer": ["physicist"], "explanation": "physicist", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "friends who are my age", "answer": ["peers"], "explanation": "peers", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "famous and important people", "answer": ["luminaries"], "explanation": "luminaries", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "continuous efforts and determination", "answer": ["persistence"], "explanation": "persistence", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "things that block our way", "answer": ["barriers"], "explanation": "barriers", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u5c3-q-suf", "title": "Add -ship, -ment or -hood", "questions": [{"type": "fill", "q": "member + ______ = membership", "answer": ["ship"], "explanation": "ship", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "govern + ______ = government", "answer": ["ment"], "explanation": "ment", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "partner + ______ = partnership", "answer": ["ship"], "explanation": "ship", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "child + ______ = childhood", "answer": ["hood"], "explanation": "hood", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "citizen + ______ = citizenship", "answer": ["ship"], "explanation": "ship", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "entertain + ______ = entertainment", "answer": ["ment"], "explanation": "ment", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "brother + ______ = brotherhood", "answer": ["hood"], "explanation": "hood", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "agree + ______ = agreement", "answer": ["ment"], "explanation": "ment", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u5c3-q-acr", "title": "Acronyms", "questions": [{"type": "single", "q": "National Aeronautics and Space Administration", "options": ["NASA", "AIIMS", "WHO"], "answer": 0, "explanation": "NASA", "hints": ["Think about the text again."]}, {"type": "single", "q": "All India Institute of Medical Sciences", "options": ["AIIMS", "AYUSH", "NIPER"], "answer": 0, "explanation": "AIIMS", "hints": ["Think about the text again."]}, {"type": "single", "q": "Ayurveda, Yoga and Naturopathy, Unani, Siddha, Homoeopathy", "options": ["AYUSH", "NASA", "WHO"], "answer": 0, "explanation": "AYUSH", "hints": ["Think about the text again."]}, {"type": "single", "q": "National Institute of Pharmaceutical Education and Research", "options": ["NIPER", "AIIMS", "NASA"], "answer": 0, "explanation": "NIPER", "hints": ["Think about the text again."]}, {"type": "single", "q": "World Health Organization", "options": ["WHO", "NASA", "AYUSH"], "answer": 0, "explanation": "WHO", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Clipping** shortens words. Back clipping: *exam, ad, gas, memo, gym, photo*. Front clipping: *phone, net, bike*. Middle clipping: *flu, fridge*.", "title": "Clipping"}, {"type": "quiz", "id": "u5c3-q-clip", "title": "Clipping type", "questions": [{"type": "single", "q": "exam (examination)", "options": ["back", "front", "middle"], "answer": 0, "explanation": "End removed.", "hints": ["Think about the text again."]}, {"type": "single", "q": "phone (telephone)", "options": ["front", "back", "middle"], "answer": 0, "explanation": "Start removed.", "hints": ["Think about the text again."]}, {"type": "single", "q": "fridge (refrigerator)", "options": ["middle", "back", "front"], "answer": 0, "explanation": "Both ends removed.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Active voice**: the subject does the action. **Passive voice**: the subject receives it (*the foundation was laid by pioneers*). Use passive when the action is more important than the doer, the doer is obvious, or the doer is unknown.", "title": "Passive voice"}, {"type": "quiz", "id": "u5c3-q-pass", "title": "News report", "questions": [{"type": "fill", "q": "advancements ______ (record) in leading medical journals", "answer": ["were recorded"], "explanation": "were recorded", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "a new vaccine for malaria ______ (discover)", "answer": ["was discovered"], "explanation": "was discovered", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "The vaccine ______ (test) through clinical trials", "answer": ["was tested"], "explanation": "was tested", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "results ______ (publish) in those journals", "answer": ["were published"], "explanation": "were published", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "blood samples ______ (take) regularly", "answer": ["were taken"], "explanation": "were taken", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "the amount of antibodies ______ (measure) carefully", "answer": ["was measured"], "explanation": "was measured", "hints": ["Look for the exact word."]}]}, {"type": "exercise", "id": "u5c3-ex-passive", "title": "Rewrite the experiment report in passive", "difficulty": "medium", "minutes": 15, "goal": "Rewrite the plant-growth report using passive verbs.", "behavior": "Begin: An experiment was conducted to investigate the effects of light on plant growth.", "hints": ["Who does the action?", "Which tense?", "Is the subject singular or plural?"], "checklist": ["Used passive where needed", "Verb agrees with subject", "Meaning unchanged"], "solution": "An experiment was conducted to investigate the effects of light on plant growth. Various plants were placed under different light conditions and their growth was measured over several weeks. Data was recorded daily to track the height of each plant. At the end the results were analysed and it was found that plants exposed to natural light grew significantly taller. It was concluded that sunlight plays a crucial role in plant development. The findings were presented to the class, highlighting…", "solution_lang": "text", "solution_explain": "Move the object to the front and use *be + past participle*.", "mode": "selfcheck"}, {"type": "quiz", "id": "u5c3-q-chandra", "title": "Chandrayaan landing in passive", "questions": [{"type": "single", "q": "First, the spacecraft ______ towards the Moon.", "options": ["launched", "were launched", "was launched", "is launched"], "answer": 3, "explanation": "Present passive for steps of a process: is launched.", "hints": ["Instructions in the present."]}, {"type": "single", "q": "it ______ to enter the Moon’s orbit.", "options": ["position", "was positioned", "is positioned", "has positioned"], "answer": 2, "explanation": "is positioned", "hints": ["Think about the text again."]}, {"type": "single", "q": "the path ______ for landing.", "options": ["adjusted", "was adjusted", "is adjusted", "were adjusted"], "answer": 2, "explanation": "is adjusted", "hints": ["Think about the text again."]}, {"type": "single", "q": "the spacecraft ______ as it nears the surface.", "options": ["slowed down", "was slowed down", "is slowed down", "were slowed down"], "answer": 2, "explanation": "is slowed down", "hints": ["Think about the text again."]}, {"type": "single", "q": "the rover ______ to explore.", "options": ["is released", "has released", "were released", "was released"], "answer": 0, "explanation": "is released", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["Antonyms, suffixes and clipping grow your vocabulary.", "Passive = be + past participle.", "Acronyms are pronounced as words."]}], "source": {"chapter": "u5c3", "pages": "239-244"}, "id": "c8u5c3-04-learn", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-05-listen-speak": {"title": "Let us listen and speak", "summary": "Listen to an AI podcast and hold a panel discussion.", "minutes": 25, "blocks": [{"type": "text", "md": "Press **🎧 Play audio**. *(Original script.)* Answer the five questions.", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 Tech Talks podcast on AI (listen first)", "md": "Hello and welcome to Tech Talks! Today we look at how artificial intelligence benefits humankind. Segment one: healthcare. AI analyses medical data faster and more accurately than humans, which means quicker diagnoses and personalised treatments. AI-powered robots assist in surgery, and during the global pandemic AI helped speed up the discovery of new medicines. Segment two: the environment. AI helps predict natural disasters and manage water and farming resources. In renewable energy it improves the performance of wind turbines and solar panels. Segment three: education. AI offers personalised learning to students, and it helps teachers analyse student performance and handle administrative tasks. Segment four: accessibility. AI improves speech recognition, text-to-speech and voice commands for people with disabilities. AI is a powerful force for good, but we must use it responsibly. Thanks for listening, stay curious and keep exploring!", "listen": true}, {"type": "quiz", "id": "u5c3-q-listen", "title": "Podcast questions", "questions": [{"type": "single", "q": "One key benefit of AI in healthcare:", "options": ["Helps doctors communicate faster", "Provides personalised treatments and faster diagnoses", "Focuses on cosmetic surgery"], "answer": 1, "explanation": "Quicker diagnoses and personalised treatments.", "hints": ["Think about the text again."]}, {"type": "single", "q": "AI’s crucial role in the pandemic:", "options": ["AI robots monitored patients", "AI assisted in speeding up discovery of new medicines", "AI developed vaccines by itself"], "answer": 1, "explanation": "It sped up medicine discovery.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Example of AI in renewable energy:", "options": ["optimising turbine and panel placement in cities", "promoting alternative energy", "improving the performance of wind turbines and solar panels"], "answer": 2, "explanation": "Improving performance.", "hints": ["Think about the text again."]}, {"type": "single", "q": "What AI offers teachers:", "options": ["Assign grades quicker", "Communicate better", "Analyse student performance"], "answer": 2, "explanation": "Analyse performance.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A feature AI enhances for people with disabilities:", "options": ["finding jobs", "speech recognition and voice commands", "training to interact with robots"], "answer": 1, "explanation": "Speech recognition and voice commands.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Panel discussion:** ‘Evaluating the Impact of Mobile Phones — Beneficial or Harmful’. Roles: **Moderator** (opens, invites speakers, sums up, thanks), **Principal** (opposed — discipline in school), **Teacher** (partly in favour — educational use with limits), **Parent** (opposed — health and social effects on children), **Student** (in favour — connectivity and learning). Cues: Principal: ‘As a Principal, I strongly believe mobile phones are largely disruptive because…’; Parent: ‘As a parent, I’m concerned that mobile phones pose certain risks…’; Teacher: ‘From an educator’s perspective, I think mobile phones can be valuable but…’; Student: ‘As a student, I feel mobile phones are essential because…’", "title": "Let us speak"}, {"type": "exercise", "id": "u5c3-ex-panel", "title": "Panel discussion", "difficulty": "medium", "minutes": 20, "goal": "Hold the panel discussion in a group of five.", "behavior": "Each member speaks in role for about one minute; the Moderator opens and closes.", "hints": ["Prepare two points for your role.", "Listen to others.", "Use polite phrases."], "checklist": ["Moderator opens", "Each role speaks", "Reasons and examples", "Moderator sums up"], "solution": "Moderator: Welcome… Principal: As a Principal, I strongly believe… Student: As a student, I feel mobile phones are essential because they help me research. Moderator: Thank you all; we heard both sides…", "solution_lang": "text", "solution_explain": "Use cue phrases and give reasons.", "mode": "selfcheck"}, {"type": "summary", "points": ["Listen for main ideas in each segment.", "A panel discussion needs roles and polite turns."]}], "source": {"chapter": "u5c3", "pages": "244-246, 251-252"}, "id": "c8u5c3-05-listen-speak", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-06-write-explore": {"title": "Let us write and explore", "summary": "Write a report and explore AR/VR, awards and women pioneers.", "minutes": 30, "blocks": [{"type": "text", "md": "Your school hosted the Zonal Science Exhibition with teams from 25 schools. As student editor write a report for the school magazine using these cues: organiser and host; date, time and place; purpose; participants; Chief Guest; competitions (Science Quiz, Science Models…); topics of models; the team that got the trophy for the best exhibit; observations of the Chief Guest and visitors. **Write in past tense, passive voice and third person, with a headline, reporter’s name and three paragraphs.**", "title": "Let us write: a report"}, {"type": "exercise", "id": "u5c3-ex-report", "title": "Report on the Zonal Science Exhibition", "difficulty": "medium", "minutes": 25, "goal": "Write the magazine report.", "behavior": "Headline, reporter’s name, three paragraphs, passive voice.", "hints": ["Answer who, when, where, why.", "Keep the order logical.", "End with the Chief Guest’s remarks."], "checklist": ["Headline", "Reporter’s name", "Three paragraphs", "Passive voice", "Past tense"], "solution": "ZONAL SCIENCE EXHIBITION A GRAND SUCCESS — By Reporter\nThe Zonal Science Exhibition was organised by the Education Department and hosted by our school on 12 August from 9 a.m. in the school hall. Teams from 25 schools were welcomed… A Science Quiz and Science Models competition were held. Models on water purification, solar energy and waste recycling were exhibited… The trophy for the best exhibit was awarded to… The Chief Guest was impressed by the creativity of the students.", "solution_lang": "text", "solution_explain": "Past passive: was/were + past participle.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** (I) **Augmented reality (AR)** adds digital elements to what you see through a phone camera; **virtual reality (VR)** replaces the real world with a simulated one. NCERT’s e-Pathshala AR app helps students experiment and learn beyond books, in line with Digital India. (II) **Rashtriya Vigyan Puraskar**: Vigyan Ratna (lifetime achievement), Vigyan Shri (distinguished contributions), Vigyan Yuva–Shanti Swarup Bhatnagar (young scientists up to 45 years) and Vigyan Team (teams of three or more). (III) Women pioneers: Kadambini Ganguly, Mary Poonen Lukose, Bibha Chowdhuri, E.K. Janaki Ammal, Kamala Sohonie and Asima Chatterjee, and more recent women leaders in science.", "title": "Let us explore"}, {"type": "quiz", "id": "u5c3-q-explore", "title": "Explore check", "questions": [{"type": "single", "q": "AR stands for…", "options": ["augmented reality", "artificial radio", "applied research"], "answer": 0, "explanation": "Augmented reality.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Which award recognises lifetime achievement?", "options": ["Vigyan Ratna", "Vigyan Shri", "Vigyan Team"], "answer": 0, "explanation": "Vigyan Ratna.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Kamala Sohonie was the first Indian woman to…", "options": ["receive a PhD in a scientific discipline", "fly to space", "win an Olympic medal"], "answer": 0, "explanation": "She was the first Indian woman PhD in a scientific discipline.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["A report is written in past passive and third person.", "AR adds to reality, VR replaces it.", "Many Indian women are science pioneers."]}], "source": {"chapter": "u5c3", "pages": "246-248"}, "id": "c8u5c3-06-write-explore", "chapter": "c8u5c3", "kind": "lesson"}, "c8u5c3-99-test": {"title": "Test: Bibha Chowdhuri", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u5c3-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Bibha Chowdhuri was born in…", "options": ["1913", "1923", "1945"], "answer": 0, "explanation": "1913.", "hints": ["Think about the text again."]}, {"type": "single", "q": "She studied cosmic rays under…", "options": ["Patrick Blackett", "Homi Bhabha", "Vikram Sarabhai"], "answer": 0, "explanation": "Blackett.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Her most notable discovery:", "options": ["pi-mesons", "the electron", "radio waves"], "answer": 0, "explanation": "Pi-mesons.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Who nominated her for the Nobel Prize?", "options": ["Erwin Schrödinger", "Einstein", "Bose"], "answer": 0, "explanation": "Schrödinger.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Her star is named…", "options": ["Bibha", "Leo", "Sarabhai"], "answer": 0, "explanation": "HD 86081 named Bibha.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "core ↔ ______", "answer": ["periphery"], "explanation": "periphery", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "child + hood = ______", "answer": ["childhood"], "explanation": "childhood", "hints": ["Look for the exact word."]}, {"type": "single", "q": "‘fridge’ is…", "options": ["middle clipping", "back clipping", "front clipping"], "answer": 0, "explanation": "Middle.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Choose the passive:", "options": ["The report was written by the editor.", "The editor wrote the report."], "answer": 0, "explanation": "was written.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘The sun rises in the east’ — future time can be shown by simple present for…", "options": ["timetables", "wishes", "past"], "answer": 0, "explanation": "Schedules.", "hints": ["Think about the text again."]}, {"type": "order", "q": "Order:", "items": ["Born in 1913", "Manchester 1945", "TIFR 1949", "Star named 2019"], "explanation": "Chronological.", "hints": ["Think about what happens first."]}], "mode": "test"}], "kind": "test", "id": "c8u5c3-99-test", "chapter": "c8u5c3"}}, "glossary": [{"term": "potion", "def": "a liquid with magical properties", "lesson": "c6u1-01-bottle-of-dew"}, {"term": "homophones", "def": "words that sound the same but have different spellings and meanings", "lesson": "c6u1-01-bottle-of-dew"}, {"term": "connector", "def": "a word that joins two parts of a sentence, such as 'because' or 'before'", "lesson": "c6u1-01-bottle-of-dew"}, {"term": "fable", "def": "a short story, often with animals, that teaches a lesson", "lesson": "c6u1-02-raven-and-fox"}, {"term": "alliteration", "def": "repetition of the same starting consonant sound in nearby words", "lesson": "c6u1-02-raven-and-fox"}, {"term": "rhyme", "def": "words that end with the same sound", "lesson": "c6u1-02-raven-and-fox"}, {"term": "antonym", "def": "a word with the opposite meaning", "lesson": "c6u1-02-raven-and-fox"}, {"term": "contraction", "def": "a shortened word with an apostrophe, like 'I'm'", "lesson": "c6u1-03-rama-to-the-rescue"}, {"term": "present progressive", "def": "tense for an action happening now: am/is/are + verb-ing", "lesson": "c6u1-03-rama-to-the-rescue"}, {"term": "adverb", "def": "a word that tells how, when or where an action happens", "lesson": "c6u1-03-rama-to-the-rescue"}, {"term": "exclamatory sentence", "def": "a sentence that shows strong feeling and ends with !", "lesson": "c6u1-03-rama-to-the-rescue"}, {"term": "interrogative sentence", "def": "a sentence that asks a question and ends with ?", "lesson": "c6u1-03-rama-to-the-rescue"}, {"term": "unlikely", "def": "not expected", "lesson": "c6u2-01-unlikely-best-friends"}, {"term": "mahout", "def": "an elephant trainer", "lesson": "c6u2-01-unlikely-best-friends"}, {"term": "past perfect", "def": "had + third form, for an earlier completed action", "lesson": "c6u2-01-unlikely-best-friends"}, {"term": "prefix", "def": "letters added at the start of a word, e.g. un-", "lesson": "c6u2-01-unlikely-best-friends"}, {"term": "prayer", "def": "a wish made with a full heart", "lesson": "c6u2-02-a-friends-prayer"}, {"term": "blessed", "def": "feeling lucky and thankful", "lesson": "c6u2-02-a-friends-prayer"}, {"term": "loyal", "def": "faithful to someone", "lesson": "c6u2-02-a-friends-prayer"}, {"term": "root word", "def": "the main part of a word", "lesson": "c6u2-03-the-chair"}, {"term": "suffix", "def": "letters added at the end of a word", "lesson": "c6u2-03-the-chair"}, {"term": "adjective", "def": "a word that describes a noun", "lesson": "c6u2-03-the-chair"}, {"term": "compound word", "def": "a word made from two words", "lesson": "c6u3-01-neem-baba"}, {"term": "personification", "def": "giving human qualities to non-human things", "lesson": "c6u3-01-neem-baba"}, {"term": "neem", "def": "a tree used in medicine, farming and daily life", "lesson": "c6u3-01-neem-baba"}, {"term": "stanza", "def": "a group of lines in a poem", "lesson": "c6u3-02-what-a-bird-thought"}, {"term": "spice", "def": "plant part used to give taste or colour to food", "lesson": "c6u3-03-spices-that-heal"}, {"term": "modal verb", "def": "a helping verb such as may, should, can, must", "lesson": "c6u3-03-spices-that-heal"}, {"term": "herb", "def": "a plant used for flavour or medicine", "lesson": "c6u3-03-spices-that-heal"}, {"term": "sporting spirit", "def": "being fair and respecting each player", "lesson": "c6u4-01-change-of-heart"}, {"term": "opponent", "def": "someone you compete with", "lesson": "c6u4-01-change-of-heart"}, {"term": "creek", "def": "a small body of water", "lesson": "c6u4-02-the-winner"}, {"term": "yoga", "def": "a practice that joins body, mind and spirit", "lesson": "c6u4-03-yoga-way-of-life"}, {"term": "asana", "def": "a yoga posture", "lesson": "c6u4-03-yoga-way-of-life"}, {"term": "practise", "def": "verb: do repeatedly to improve", "lesson": "c6u4-03-yoga-way-of-life"}, {"term": "folk art", "def": "art made by ordinary people from a region's traditions", "lesson": "c6u5-01-hamara-bharat"}, {"term": "biodegradable", "def": "something that will not harm the environment", "lesson": "c6u5-01-hamara-bharat"}, {"term": "sequencing words", "def": "words showing order, like first and then", "lesson": "c6u5-01-hamara-bharat"}, {"term": "simile", "def": "a comparison using like or as", "lesson": "c6u5-02-the-kites"}, /* English Companion by Hans — class selection landing page. Runs BEFORE app.js:

(function () {
  "use strict";
  const C = window.COURSE; if (!C) return;
  const KEY = "ec-class";
  const get = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const set = v => { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} };
  const CLASSES = {
    c6: { n: 6, en: "Class 6", te: "6వ తరగతి", color: "#2f9e6e" },
    c7: { n: 7, en: "Class 7", te: "7వ తరగతి", color: "#3b6fd8" },
    c8: { n: 8, en: "Class 8", te: "8వ తరగతి", color: "#c0561f" }
  };
  const all = C.chapters.slice();
  const of = id => String(id).slice(0, 2);
  let sel = get(); if (!CLASSES[sel] || !all.some(c => of(c.id) === sel)) sel = null;

  window.ECChangeClass = function () { set(null); try { speechSynthesis.cancel(); } catch (e) {} location.hash = "#/home"; location.reload(); };
  window.ECClassName = sel ? CLASSES[sel].en : "";

  if (sel) {                                   /* keep only the chosen class */
    C.chapters = all.filter(c => of(c.id) === sel);
    const keep = {}; C.chapters.forEach(c => c.lessons.forEach(id => { keep[id] = C.lessons[id]; }));
    C.lessons = keep;
    C.glossary = (C.glossary || []).filter(g => !g.lesson || keep[g.lesson]);
    C.meta = Object.assign({}, C.meta, { subtitle: CLASSES[sel].en + " · " + CLASSES[sel].te + " · English textbook (APSCERT / NCERT)" });
    const top = document.querySelector(".topbar"), theme = document.getElementById("themeBtn");
    if (top) {
      const b = document.createElement("button"); b.type = "button"; b.className = "icon-btn class-btn";
      b.textContent = "🎓 Change class · తరగతి మార్చు (" + CLASSES[sel].n + ")"; b.title = "Change class (తరగతి మార్చండి)";
      b.onclick = window.ECChangeClass;
      top.insertBefore(b, document.getElementById("brand").nextSibling);
    }
    return;
  }

  const wrap = document.createElement("div"); wrap.id = "landing"; wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-label", "Choose your class");

      '<span class="lc-num">' + cl.n + '</span><span class="lc-en">' + cl.en + '</span><span class="lc-te" lang="te">' + cl.te + '</span>' +
      '<span class="lc-meta">' + chs.length + ' chapters · ' + lessons + ' lessons<br><span lang="te">' + chs.length + ' అధ్యాయాలు · ' + lessons + ' పాఠాలు</span></span>' +
      '<ul class="lc-list">' + li + '</ul><span class="lc-go">Start · ప్రారంభించు →</span></button>';
  }).join("");

  document.body.appendChild(wrap); document.body.classList.add("landing-open");

  const READ_TITLE = /^(📖|Reading\b|Part \d|Part I+ \(\d\)|Part II$|Scene\b|Stanzas?\b|The beginning|The sage|What happens|What the poem says|The story|Facts:|What is yoga)/;

})();

  const UI = { check: "సరిచూడు", checkTest: "పరీక్ష సరిచూడు", retry: "మళ్లీ ప్రయత్నించు", hint: "సూచన", showAnswer: "జవాబు చూపు", reveal: "జవాబు చూపు",
    next: "తరువాత", prev: "వెనుకకు", startCourse: "ప్రారంభించు", cont: "కొనసాగించు", finishLesson: "పాఠం పూర్తి", nextLesson: "తరువాతి పాఠం",
    know: "నాకు తెలుసు", notYet: "ఇంకా లేదు", correct: "సరైనది!", wrong: "ఇంకా కాదు.", passed: "ఉత్తీర్ణత", failed: "ఉత్తీర్ణత కాలేదు",
    home: "హోమ్", glossary: "పదకోశం", tTrue: "నిజం", tFalse: "అబద్ధం", showSolution: "పరిష్కారం చూపు", markDone: "పూర్తయింది", test: "అధ్యాయ పరీక్ష", quiz: "చిన్న క్విజ్", flashcards: "ఫ్లాష్‌కార్డులు", summary: "ముఖ్యాంశాలు" };
  /* Buttons are plain text nodes, so we add the Telugu word after rendering */
  const btnWords = Object.entries(UI).map(([k, v]) => [k, v]);
  const BTN = {}; // english label -> telugu (filled lazily from the player's own strings)
  function learnLabels() {
    const L = (window.COURSE && window.COURSE.ui) || null; if (!L) return;
    btnWords.forEach(([k, v]) => { if (L[k]) BTN[String(L[k]).trim()] = v; });
  }

  const tag = (txt, cls) => { const d = document.createElement("div"); d.className = "te-hint " + (cls || ""); d.lang = "te"; d.innerHTML = txt; return d; };
  function annotate(root) {
    if (!root) return;
    /* lesson-level hint under the title */
    const h1 = root.querySelector(":scope > h1, :scope > .lesson-head h1, h1");
    const lessonId = (location.hash.match(/#\/lesson\/(.+)$/) || [])[1];
    if (lessonId && h1 && !root.querySelector(".te-lesson") && !root.dataset.teL) {
      const les = window.COURSE && window.COURSE.lessons && window.COURSE.lessons[lessonId];
      let msg = LESSON_DEFAULT;
      if (les && les.kind === "test") msg = null;
      else { const title = (les && les.title) || h1.textContent; const hit = LESSON.find(r => r[0].test(title)); if (hit) msg = hit[1]; }
      if (msg) { const el = tag("🇮🇳 <b>తెలుగులో సూచన:</b> " + msg, "te-lesson"); h1.after(el); }
    }
    /* block-level hints */
    const add = (sel, txt, key) => root.querySelectorAll(sel).forEach(el => {
      if (el.dataset.te) return; el.dataset.te = "1";
      const t = el.querySelector(":scope > .block-title, :scope > h3");
      const hint = tag(txt); if (t) t.after(hint); else el.prepend(hint);
    });
    add(".block.quiz:not(.is-test)", T.quiz); add(".block.quiz.is-test", T.test);
    add(".block.flash", T.flash); add(".block.exercise", T.exercise); add(".block.summary", T.summary); add(".block.tablewrap", T.table);
    root.querySelectorAll(".block.reveal").forEach(el => {
      if (el.dataset.te) return; el.dataset.te = "1"; const note = el.querySelector(".note-small"); const hint = tag(T.reveal); if (note) note.after(hint); else el.prepend(hint);
    });
    root.querySelectorAll(".ra-bar").forEach(bar => {
      if (bar.dataset.te) return; bar.dataset.te = "1";
      bar.after(tag(bar.closest(".ra-listen") ? T.listenCallout : T.listenText));
    });
    /* callout labels: add Telugu word to default titles (Tip, Note, Remember…) */
    root.querySelectorAll("aside.callout").forEach(el => {
      if (el.dataset.teC) return; el.dataset.teC = "1";
      const kind = ["tip", "note", "key", "example", "analogy", "warning"].find(k => el.classList.contains(k));
      const ct = el.querySelector(".c-title"); if (kind && ct && !/[\u0C00-\u0C7F]/.test(ct.textContent)) { const s = document.createElement("span"); s.className = "te-inline"; s.lang = "te"; s.textContent = " · " + T[kind]; ct.appendChild(s); }
    });
    /* Telugu words on buttons */
    root.querySelectorAll("button, a.btn").forEach(b => {
      if (b.dataset.teB || b.children.length > 0) return; const k = b.textContent.trim().replace(/\s*→$/, ""); if (!BTN[k]) return;
      b.dataset.teB = "1"; const s = document.createElement("span"); s.className = "te-inline"; s.lang = "te"; s.textContent = " · " + BTN[k]; b.appendChild(s);
    });
    /* home page guide */
    if (/^#?\/?(home)?$/.test(location.hash) && root.querySelector(".hero") && !root.querySelector(".te-home")) {
      const box = document.createElement("section"); box.className = "block te-home te-hint"; box.lang = "te";
      box.innerHTML = "<h3>తెలుగులో మార్గదర్శి</h3><ul>" + HOME.map(x => "<li>" + x + "</li>").join("") + "</ul>";
      root.querySelector(".hero").after(box);
    }
  }

  /* ───────── 4. Class grouping in sidebar and on the home page ───────── */
  const GROUP = { c6: "Class 6 · 6వ తరగతి", c7: "Class 7 · 7వ తరగతి", c8: "Class 8 · 8వ తరగతి" };
  const groupOf = id => GROUP[String(id).slice(0, 2)];
  function group() {
    const C = window.COURSE; if (!C) return;
    if (new Set(C.chapters.map(c => String(c.id).slice(0, 2))).size < 2) return;   /* one class selected: no group headings */
    const sb = $("#sidebar");
    if (sb) { let last = null; sb.querySelectorAll("details.nav-ch").forEach(d => { const g = groupOf(d.dataset.ch); const prev = d.previousElementSibling; if (g && g !== last && !(prev && prev.classList.contains("grp"))) { const hd = document.createElement("div"); hd.className = "grp"; hd.textContent = g; d.before(hd); } if (g) last = g; }); }
    const cards = document.querySelectorAll("#content section.ch-card");
    if (cards.length === C.chapters.length) { let last = null; cards.forEach((c, i) => { const g = groupOf(C.chapters[i].id); if (g && g !== last && !(c.previousElementSibling && c.previousElementSibling.classList.contains("grp-big"))) { const hd = document.createElement("h2"); hd.className = "grp-big"; hd.textContent = g; c.before(hd); } if (g) last = g; }); }
  }

  /* ───────── 5. "Change class" buttons in sidebar and on home page ───────── */
  function changeBtns() {
    if (!window.ECChangeClass) return;
    const mk = cls => { const b = document.createElement("button"); b.type = "button"; b.className = "btn change-class " + cls; b.innerHTML = "🎓 Change class <span class=\"te-inline\" lang=\"te\">· తరగతి మార్చు</span>"; b.onclick = window.ECChangeClass; return b; };
    const sb = $("#sidebar"); if (sb && !sb.querySelector(".change-class")) sb.insertBefore(mk("cc-side"), sb.firstChild);
    const hero = $("#content .hero"); if (hero && !hero.querySelector(".change-class")) { const b = mk("ghost cc-home"); b.title = "You are in " + window.ECClassName; hero.appendChild(b); }
  }

  /* ───────── run on every re-render ───────── */
  let busy = false;
  const run = () => { if (busy) return; busy = true; try { learnLabels(); annotate($("#content")); group(); changeBtns(); } finally { setTimeout(() => { busy = false; }, 0); } };
  const mo = new MutationObserver(() => run());
  const start = () => { mo.observe(document.body, { childList: true, subtree: true }); run(); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();

</script>
</body>
