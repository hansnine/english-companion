hush fell over / cast a shadow / rippled through / stormed off).", "answer": ["hush fell over"], "explanation": "A *hush fell over* the room means everything became suddenly quiet.", "placeholder": "expression", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Laughter ______ the gathering.", "answer": ["rippled through"], "explanation": "*Rippled through* shows laughter spreading like waves.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "The person who started the argument ______.", "answer": ["stormed off"], "explanation": "*Stormed off* means left angrily.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Everyone disapproved and a ______ (murmur swept through the room / mind raced back).", "answer": ["murmur swept through the room"], "explanation": "A low noise of many voices *swept through the room*.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "My ______ to how mother saved other situations.", "answer": ["mind raced back"], "explanation": "*Mind raced back* = I quickly remembered.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Without her, such moments would have ______ over the gatherings.", "answer": ["cast a shadow"], "explanation": "*Cast a shadow* = made things gloomy.", "hints": ["Look for the exact word."]}], "intro": "Box: cast a shadow · murmur swept through the room · hush fell over · mind raced back · stormed off · rippled through"}, {"type": "text", "md": "B. The writer uses sound words such as *roared* and *murmur*. Use the box: murmur, sighed, mumble, gasped, snickers, thud, groan, rattle, roared, whispered.", "title": "Part II — Sound words"}, {"type": "table", "headers": ["Blank", "Sound word"], "rows": [["a ____ of excitement spread through the classroom", "murmur"], ["Anaya ____ in relief", "sighed"], ["the teacher began to ____", "mumble"], ["a few students ____", "gasped"], ["some exchanged ____", "snickers"], ["tapped her book with a small ____", "thud"], ["stretching with a ____", "groan"], ["the breeze made the windows ____", "rattle"], ["the students ____, voices full of playful enthusiasm", "roared"], ["Anaya ____, ‘Sometimes the trickiest questions have the simplest answers.’", "whispered"]]}, {"type": "callout", "kind": "tip", "md": "Sound words (onomatopoeia-like words) help the reader *hear* the scene. When you write, replace plain *said* with *whispered*, *roared*, *murmured*."}, {"type": "text", "md": "C. A **compound word** joins two or more words into one new word. Types: closed (*sunlight*, *courtroom*), hyphenated (*well-planned*) and open (*paddy seeds*). Match Column 1 and 2.", "title": "Part III — Compound words"}, {"type": "table", "headers": ["Column 1", "Column 2", "Compound"], "rows": [["quick", "G witted", "quick-witted"], ["soft", "C spoken", "soft-spoken"], ["common", "F sense", "common sense"], ["house", "H hold", "household"], ["book", "E store", "bookstore"], ["ill", "B tempered", "ill-tempered"], ["sky", "D blue", "sky-blue"], ["dance", "A hall", "dance hall"]]}, {"type": "quiz", "id": "u1c1-q-compound", "title": "Ravi and Arun story", "questions": [{"type": "fill", "q": "Ravi was ______, always speaking calmly even in arguments.", "answer": ["soft-spoken", "soft spoken"], "explanation": "*Soft-spoken* = speaking quietly and gently.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "He grew up in a lively ______.", "answer": ["household"], "explanation": "*Household* = a family living together.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Arun was ______ and often lost his patience.", "answer": ["ill-tempered", "ill tempered"], "explanation": "*Ill-tempered* = easily angry.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Arun admired Ravi’s ______ thinking.", "answer": ["quick-witted", "quick witted"], "explanation": "*Quick-witted* = clever and fast.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "‘It’s ______ that it’s not from a bakery but bookshop!’", "answer": ["common sense"], "explanation": "*Common sense* = plain good judgement.", "hints": ["Look for the exact word."]}]}, {"type": "text", "md": "D. **If-clauses (conditionals).** Three patterns from the story:", "title": "Part IV — If-clauses"}, {"type": "table", "headers": ["Type", "Example", "Meaning"], "rows": [["Simple present + will/can", "If you like, I will try my best to resolve this matter.", "real possibility in the future"], ["Simple past + would", "If, by chance, something were to go wrong, our farmers would suffer.", "imaginary / hypothetical situation"], ["Past perfect + would have + past participle", "If I had known this would happen, I would have chosen another day.", "a past situation that cannot be changed"]]}, {"type": "text", "md": "In sentence 2 the **if-clause (subordinate)** is *If, by chance, something were to go wrong* and the **main clause** is *our farmers would suffer*. In sentence 3 the if-clause is *If I had known this would happen* and the main clause is *I would have chosen another day*."}, {"type": "quiz", "id": "u1c1-q-if", "title": "Match if-clauses with main clauses", "questions": [{"type": "single", "q": "If I had a magic wand,", "options": ["I would give myself wings.", "We will go to the theatre.", "You would have solved the puzzle."], "answer": 0, "explanation": "Imaginary present → *would*.", "hints": ["Is the wand real?"]}, {"type": "single", "q": "If it rains tomorrow,", "options": ["We will stay indoors and play board games.", "I would sneak into the secret room.", "The boys would have woken up on time."], "answer": 0, "explanation": "Possible future → *will*.", "hints": ["Tomorrow is a real possibility."]}, {"type": "single", "q": "If you had listened carefully,", "options": ["You would have solved the puzzle.", "We will go to the theatre.", "I would give myself wings."], "answer": 0, "explanation": "Past unreal → *would have + participle*.", "hints": ["The listening is in the past."]}, {"type": "single", "q": "If you finish your homework,", "options": ["We will go to the theatre.", "I would sneak into the secret room.", "The boys would have woken up on time."], "answer": 0, "explanation": "Real future condition → *will*.", "hints": ["Which main clause is a promise?"]}, {"type": "single", "q": "If I were invisible,", "options": ["I would sneak into the secret room.", "We will go to the theatre.", "You would have solved the puzzle."], "answer": 0, "explanation": "Imaginary → *would*.", "hints": ["Can you be invisible?"]}, {"type": "single", "q": "If the alarm had rung,", "options": ["The boys would have woken up on time.", "I would give myself wings.", "We will stay indoors."], "answer": 0, "explanation": "Past unreal → *would have woken*.", "hints": ["Past perfect pairs with would have."]}]}, {"type": "exercise", "id": "u1c1-ex-if", "title": "Finish the sentences", "difficulty": "easy", "minutes": 15, "goal": "Complete if-sentences with your own ideas.", "behavior": "Write at least 6 sentences: complete 1–6 from Part V and 2–5 from Part VI of the book.", "hints": ["Which time are you talking about: real future, imagined, or past?", "For past regrets use *had …ed* in the if-part.", "Read your sentence aloud — does it sound right?"], "checklist": ["Used the correct tense pattern in each sentence", "Each sentence makes sense", "Spelling and punctuation are right"], "solution": "1. Your teacher will be unhappy if you do not finish your homework.\n2. They would have caught the train if they had left earlier.\n3. You will be tired if you continue to stay up late every night.\n4. If she knew the answer, she would tell us.\n5. She would have passed if she had studied harder.\n6. If I had a million rupees, I would build a library for my village.\nVI: If I were the Head Teacher, I would start a reading hour. If I were a bird, I would fly over the mountains. If I were a magician, I would make hunger disappear. If I had studied harder, I would have scored better.", "solution_lang": "text", "solution_explain": "Notice the pairing: present/real → will; imagined → *were/knew … would*; past regret → *had + participle … would have + participle*.", "mode": "selfcheck"}, {"type": "summary", "points": ["Expressions like *hush fell over* and *stormed off* make writing vivid.", "Sound words help readers hear the scene.", "Compound words can be closed, hyphenated or open.", "If-clauses have three common patterns: real, imaginary, past-unreal."]}], "terms": [{"term": "compound word", "def": "a word made by joining two or more words"}, {"term": "conditional", "def": "a sentence with an *if* clause and a main clause"}, {"term": "subordinate clause", "def": "the *if* part that depends on the main clause"}], "source": {"chapter": "u1c1", "pages": "9-12"}, "id": "c8u1c1-04-learn", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-05-listen-speak": {"title": "Let us listen and speak", "summary": "Listen to a story, order events, and practise intonation and question words.", "minutes": 25, "blocks": [{"type": "text", "md": "Press **🎧 Play audio** below. Listen first; then answer. Press *Reveal* to read the script only after you try. *(This is an original script that tells the same story as the book’s transcript.)*", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 Story: Tenali Rama and the proud scholar (listen before you reveal)", "md": "Hello everybody! Today's story is about a quick-witted courtier in Vijayanagara. A famous scholar, proud of his learning, visited the kingdom. He wanted to challenge the scholars in King Krishnadeva Raya's court. The court scholars were afraid. They feared losing to him, and they also feared the king's anger if they refused. So they went to Tenali Rama, and Rama said he would accept the challenge. Next day, Rama sat facing the visitor, with a bundle wrapped in silk beside him. Placing his hand on it, he said, let us begin by discussing the merits of tila-kashta-mahisha-bandhana. The scholar was taken aback. He had read thousands of books, but never heard of this one. He had nothing to say, admitted defeat, and left the palace ashamed. The king was curious about the great work. Rama smiled and removed the silk. Inside was a bundle of sticks tied with a thick rope. The king asked for an explanation. Rama said: til means sesame, kashta means stick, so tila-kashta means sesame sticks. And mahisha means buffalo, bandhana means tying, so this is the rope used to tie a buffalo. The king burst out laughing. The visitor had been scared by a difficult-sounding name, and Rama had taught the arrogant scholar a lesson.", "listen": true}, {"type": "quiz", "id": "u1c1-q-listen", "title": "Listening questions", "questions": [{"type": "single", "q": "The rope tying the bundle of sticks was ______.", "options": ["loose", "thick", "short"], "answer": 1, "explanation": "Rama showed a bundle tied with a thick rope.", "hints": ["Listen for the word describing the rope."]}, {"type": "single", "q": "The scholar is finally referred to as ______.", "options": ["irritable", "mischievous", "arrogant"], "answer": 2, "explanation": "The story ends by calling him the arrogant scholar.", "hints": ["Which word means too proud?"]}, {"type": "order", "q": "Put the events in order.", "items": ["The visitor wanted to show he was better than others in the palace", "The court scholars were afraid of the king’s anger", "Rama accepted the challenge", "Rama came with a bundle tied in silk", "The great scholar was ashamed because he did not know what to say", "The king wanted to know more about the work", "Rama showed a bundle of sticks tied with a rope", "The king laughed at the explanation"], "explanation": "Challenge → fear → Rama accepts → silk bundle → scholar ashamed → king curious → sticks revealed → king laughs.", "hints": ["Start with why the scholar came."]}]}, {"type": "text", "md": "**Intonation** is the rise and fall of your voice. *Yes/No questions rise at the end* (Are you coming home? ↗). *Wh-questions fall at the end* (When will you come home? ↘).", "title": "Let us speak — Part I: Intonation"}, {"type": "quiz", "id": "u1c1-q-into", "title": "Rising or falling?", "questions": [{"type": "single", "q": "Is this your cat?", "options": ["rising ↗", "falling ↘"], "answer": 0, "explanation": "A yes/no question rises.", "hints": ["Can you answer yes or no?"]}, {"type": "single", "q": "What is the name of your cat?", "options": ["rising ↗", "falling ↘"], "answer": 1, "explanation": "A wh-question falls.", "hints": ["It begins with *What*."]}, {"type": "single", "q": "Will you be going to your village?", "options": ["rising ↗", "falling ↘"], "answer": 0, "explanation": "Yes/no → rising.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Why are you going to your village?", "options": ["rising ↗", "falling ↘"], "answer": 1, "explanation": "Wh → falling.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Is this where you live?", "options": ["rising ↗", "falling ↘"], "answer": 0, "explanation": "Yes/no → rising.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Where do you live?", "options": ["rising ↗", "falling ↘"], "answer": 1, "explanation": "Wh → falling.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Can I meet your parents?", "options": ["rising ↗", "falling ↘"], "answer": 0, "explanation": "Yes/no → rising.", "hints": ["Think about the text again."]}, {"type": "single", "q": "How are your parents?", "options": ["rising ↗", "falling ↘"], "answer": 1, "explanation": "Wh → falling.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Do you have any plans for tomorrow?", "options": ["rising ↗", "falling ↘"], "answer": 0, "explanation": "Yes/no → rising.", "hints": ["Think about the text again."]}, {"type": "single", "q": "What are you going to do tomorrow?", "options": ["rising ↗", "falling ↘"], "answer": 1, "explanation": "Wh → falling.", "hints": ["Think about the text again."]}]}, {"type": "callout", "kind": "tip", "md": "Say each of the ten questions aloud with a partner. Say each question aloud with a partner: one asks, the other answers, then swap."}, {"type": "text", "md": "**Question words:** What, Why, When, How, Where, Who. Keep word order correct: *Who is the cleverest character in the story?* ✓  *Who the cleverest character is…* ✗.", "title": "Part II: Question words"}, {"type": "quiz", "id": "u1c1-q-order", "title": "Correct word order", "questions": [{"type": "single", "q": "Which question is correct?", "options": ["Where you are going for the trip?", "Where are you going for the trip?"], "answer": 1, "explanation": "In questions the helping verb comes before the subject.", "hints": ["Check the position of *are*."]}, {"type": "single", "q": "Which is correct?", "options": ["How you will travel?", "How will you travel?"], "answer": 1, "explanation": "Question word + helping verb + subject.", "hints": ["Think about the text again."]}]}, {"type": "exercise", "id": "u1c1-ex-speak", "title": "Pair talk: a planned trip, then a witty character", "difficulty": "easy", "minutes": 15, "goal": "Ask and answer questions with a partner using correct intonation.", "behavior": "Ask about: destination (Where), purpose (Why), transport (How), duration (When), companions (Who), activities (What). Then ask about a witty folktale character: name (Who), why wit is important (Why), most famous trick (What), time/setting (When), how intelligence solved a problem (How), place (Where).", "hints": ["Begin each question with the right question word.", "Practise aloud twice.", "Swap roles."], "checklist": ["I used rising tone for yes/no questions and falling tone for wh-questions", "My word order was correct", "I answered in full sentences"], "solution": "Where are you planning to go? — To Hampi. Why are you going there? — To see the old Vijayanagara ruins. How will you travel? — By train and bus. When will you go? — For four days in December. Who is coming with you? — My cousins. What will you do there? — Visit temples and take photos.", "solution_lang": "text", "solution_explain": "Question word + helping verb + subject, then end with the right tone.", "mode": "selfcheck"}, {"type": "summary", "points": ["Yes/no questions rise; wh-questions fall.", "Listening for details helps answer questions.", "Keep correct word order in questions."]}], "source": {"chapter": "u1c1", "pages": "12-14, 46"}, "id": "c8u1c1-05-listen-speak", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-06-write-explore": {"title": "Let us write and explore", "summary": "Study a narrative essay, write your own, and explore limericks and stories.", "minutes": 35, "blocks": [{"type": "text", "md": "A **narrative essay** tells a personal or imagined experience to share a lesson, reflection or idea. It has an **introduction, body and conclusion**, uses *I* and a personal tone.", "title": "Let us write"}, {"type": "text", "md": "The sample essay in the book, *A Lesson in Responsibility*, tells how a student was proud of being organised one Monday, was surprised by a Science quiz, forgot to revise, scored low, and learned from Mrs. Rao that consistent small efforts matter. After that the narrator revised every day. The message: responsibility is being ready for the unexpected.", "title": "Sample essay (summary)"}, {"type": "quiz", "id": "u1c1-q-essay", "title": "Which feature is present in the sample essay?", "questions": [{"type": "truefalse", "q": "It begins with a clear and engaging opening.", "answer": true, "explanation": "It opens with a bright Monday morning and birds chirping.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "It includes a challenge or turning point.", "answer": true, "explanation": "The surprise quiz is the turning point.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "It uses first-person narration.", "answer": true, "explanation": "It says *I*, *my*.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "It states a lesson at the end.", "answer": true, "explanation": "The final lines state the message about responsibility.", "hints": ["Re-read the story."]}, {"type": "truefalse", "q": "It is written in third person.", "answer": false, "explanation": "It is in first person.", "hints": ["Re-read the story."]}]}, {"type": "callout", "kind": "key", "md": "Checklist for your essay — Introduction: engaging opening, context, clear idea. Body: logical order, descriptive details, characters and setting, your feelings, a challenge. Conclusion: outcome and lesson. Style: personal, first person. Language: simple, correct grammar and spelling."}, {"type": "exercise", "id": "u1c1-ex-essay", "title": "Write a narrative essay", "difficulty": "medium", "minutes": 25, "goal": "Write about: ‘The Day I Learnt the Value of Teamwork’ OR ‘A Small Act of Kindness that Made a Difference’.", "behavior": "Write 3–4 paragraphs: introduction, body with a challenge, conclusion with a lesson.", "hints": ["Pick one real or imagined moment.", "What was the problem or turning point?", "End with what you learnt."], "checklist": ["Engaging opening", "Events in order", "Feelings shared", "Lesson stated", "Correct grammar"], "solution": "Model opening: ‘On Sports Day our relay team was last after the first round. I felt like giving up…’ Body: describe the problem, how teammates encouraged each other, the final run. Conclusion: ‘That day I learnt that no one wins alone.’", "solution_lang": "text", "solution_explain": "Good narrative = story + feeling + lesson.", "mode": "selfcheck"}, {"type": "text", "md": "**Limericks** are five-line funny poems with a twist in the last line. The book gives one about a boy named Raju, his kite and a crow who ends up enjoying the ride. Create your own: lines 1, 2 and 5 rhyme with each other; lines 3 and 4 are shorter and rhyme with each other.", "title": "Let us explore — I: Limericks"}, {"type": "exercise", "id": "u1c1-ex-limerick", "title": "Create a limerick", "difficulty": "easy", "minutes": 10, "goal": "Write your own five-line limerick with a twist.", "behavior": "Use the rhyme pattern AABBA.", "hints": ["Choose a funny character.", "Find rhyming words first.", "Make line 5 unexpected."], "checklist": ["5 lines", "Rhyme AABBA", "Funny twist in last line"], "solution": "A cat sat on a mat in the sun, / Dreaming of fish and of fun. / A mouse crept along, / Humming a song, / And the cat said, ‘I’m full—you may run!’", "solution_lang": "text", "solution_explain": "The surprise in the last line makes it a limerick.", "mode": "selfcheck"}, {"type": "text", "md": "**II. Library task:** read a story of your choice and share its theme and interesting parts with classmates. **III. Chart task:** list stories of wit, humour and wisdom (for example Tenali Rama, Birbal, Gopal the Jester, Panchatantra) on a chart paper; each student reads at least one new story from the list.", "title": "Let us explore — II & III"}, {"type": "summary", "points": ["A narrative essay has introduction, body and conclusion and uses ‘I’.", "A limerick has five lines and a twist ending.", "Reading more stories of wit and wisdom builds your imagination."]}], "source": {"chapter": "u1c1", "pages": "15-16"}, "id": "c8u1c1-06-write-explore", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-99-test": {"title": "Test: The Wit That Won Hearts", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u1c1-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Who was the queen in the story?", "options": ["Thirumalambal", "Kamala", "Meera", "Sita"], "answer": 0, "explanation": "The queen is Thirumalambal.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Why did the queen yawn?", "options": ["She disliked the poem", "She was exhausted", "She was bored of the king", "She was ill"], "answer": 1, "explanation": "She was tired after a long day.", "hints": ["Think about the text again."]}, {"type": "single", "q": "What did Rama say about the seeds?", "options": ["They are old", "They give three times the yield", "They need no water", "They are from Mars"], "answer": 1, "explanation": "He claimed three times the harvest.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "The courtiers praised Rama’s seeds.", "answer": false, "explanation": "They mocked him.", "hints": ["Re-read the story."]}, {"type": "fill", "q": "A group of eight poets in the king’s court was called the ________.", "answer": ["Ashtadiggajas"], "explanation": "The *Ashtadiggajas*.", "hints": ["Look for the exact word."]}, {"type": "single", "q": "‘Stormed off’ means…", "options": ["left angrily", "slept", "sang", "laughed"], "answer": 0, "explanation": "To storm off is to leave in anger.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Which is a closed compound word?", "options": ["well-planned", "paddy seeds", "courtroom", "quick-witted"], "answer": 2, "explanation": "*Courtroom* is written as one word.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Choose the correct sentence.", "options": ["If I had known, I would have chosen another day.", "If I would know, I had chosen another day."], "answer": 0, "explanation": "Past perfect + would have + participle.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Wh-questions end with a…", "options": ["rising tone", "falling tone"], "answer": 1, "explanation": "Wh → falling.", "hints": ["Think about the text again."]}, {"type": "order", "q": "Order: ", "items": ["Quarrel", "Queen asks Rama", "Seeds in court", "Yawn joke", "Apology"], "explanation": "Story order.", "hints": ["Think about what happens first."]}, {"type": "multi", "q": "Which are qualities of Tenali Rama in the story?", "options": ["witty", "patient", "stubborn", "wise"], "answer": [0, 1, 3], "explanation": "He was witty, patient and wise, not stubborn.", "hints": ["Check each option against the text."]}], "mode": "test"}], "kind": "test", "id": "c8u1c1-99-test", "chapter": "c8u1c1"}, "c8u1c2-01-warm-up": {"title": "Before we read: the garden", "summary": "Name garden items, imagine your own garden and think about the title.", "minutes": 12, "blocks": [{"type": "text", "md": "Match each picture-word from the book with its meaning. Words: garden hose, sapling, hedge, flower beds, flower pot, pebbles, rockery, fence, vine, wheelbarrow."}, {"type": "quiz", "id": "u1c2-q-garden", "title": "Garden words", "questions": [{"type": "single", "q": "A row of closely planted bushes that forms a boundary is a…", "options": ["hedge", "vine", "rockery"], "answer": 0, "explanation": "A *hedge* is a line of bushes.", "hints": ["It is green and trimmed."]}, {"type": "single", "q": "A young small plant is a…", "options": ["sapling", "pebble", "fence"], "answer": 0, "explanation": "*Sapling* = young tree or plant.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A one-wheeled cart used to carry soil or plants is a…", "options": ["wheelbarrow", "garden hose", "flower pot"], "answer": 0, "explanation": "A *wheelbarrow*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A pipe for watering plants is a…", "options": ["garden hose", "vine", "hedge"], "answer": 0, "explanation": "A *garden hose*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A garden made with arranged rocks and small plants is a…", "options": ["rockery", "flower bed", "fence"], "answer": 0, "explanation": "A *rockery*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A climbing plant with long stems is a…", "options": ["vine", "sapling", "pebbles"], "answer": 0, "explanation": "A *vine* climbs.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Small smooth stones are…", "options": ["pebbles", "flower beds", "hedges"], "answer": 0, "explanation": "*Pebbles*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A wooden or metal barrier around a garden is a…", "options": ["fence", "vine", "sapling"], "answer": 0, "explanation": "A *fence*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "A ceramic container for a plant is a…", "options": ["flower pot", "wheelbarrow", "hose"], "answer": 0, "explanation": "A *flower pot*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Ground prepared for planting flowers in rows is a…", "options": ["flower bed", "fence", "pebble"], "answer": 0, "explanation": "*Flower beds*.", "hints": ["Think about the text again."]}], "intro": "Look at the ten pictures in your book and write each name beside its picture."}, {"type": "text", "md": "**Group of four:** What kind of garden would you like? Mention features and reasons, and share with the class.\n\n**Title talk:** The word *concrete* can mean (1) the hard grey building material, and (2) *real and clear, not vague*, as in a *concrete example*. Which meaning do you think the poet plays with?", "title": "Discuss"}, {"type": "reveal", "prompt": "Your guess about ‘A Concrete Example’", "md": "Both! The garden is full of hard stone (like concrete), and the poem gives a clear, real example of how someone can love a garden that has hardly any plants. This double meaning is a **pun**."}, {"type": "summary", "points": ["Learn the names of garden items.", "‘Concrete’ has a literal and a figurative meaning."]}], "terms": [{"term": "hedge", "def": "a line of bushes forming a boundary"}, {"term": "rockery", "def": "a garden of arranged rocks with small plants"}], "source": {"chapter": "u1c2", "pages": "17"}, "id": "c8u1c2-01-warm-up", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-02-read-listen": {"title": "Read and listen: the poem", "summary": "Understand the poem stanza by stanza (in simple words).", "minutes": 15, "blocks": [{"type": "text", "md": "The poem is by **Reginald Arkell**. It is copyrighted, so open your textbook (page 18) to read it in its original words. Below, each stanza is explained in simple words. Press 🔊 Listen to hear each explanation.", "title": "About this lesson"}, {"type": "text", "md": "**Stanza 1.** The speaker’s next-door neighbour, Mrs. Jones, has a garden that is full of stones instead of plants. There is a crazy, uneven path, a lily pond, a rockery and, further on, a sundial with an odd-looking device. Mrs. Jones thinks it is quite nice.", "title": "Stanza 1"}, {"type": "text", "md": "**Stanza 2.** Mrs. Jones puts tiny plants in the gaps between the stones. They are so small and delicate that they seem to mean nothing at all. The speaker jokes that he can’t imagine how she gets them there, unless she plants them with a pin.", "title": "Stanza 2"}, {"type": "text", "md": "**Stanza 3.** Once Mrs. Jones invites the speaker to see her stones. They talk about a flower for about a quarter of an hour. At last the speaker cries out, asking where this lovely flower is. She replies calmly that he is standing on it.", "title": "Stanza 3"}, {"type": "text", "md": "The poem repeats the same opening line, the name of the neighbour, in every stanza. The poet is playful: the speaker’s polite surprise and Mrs. Jones’ calm pride create the humour.", "title": "What makes it funny?"}, {"type": "quiz", "id": "u1c2-q-read", "title": "Poem check", "questions": [{"type": "truefalse", "q": "Mrs. Jones’ garden is full of flowers.", "answer": false, "explanation": "It is full of stones with tiny plants between them.", "hints": ["Re-read the story."]}, {"type": "single", "q": "Where does Mrs. Jones put her little plants?", "options": ["in pots", "between the stones", "in the pond", "on the sundial"], "answer": 1, "explanation": "Between the stones.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Where is the flower the speaker was looking for?", "options": ["in the pond", "under his feet", "on the path far away", "on the sundial"], "answer": 1, "explanation": "He was standing on it.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["The poem describes a stone garden.", "Tiny plants grow between stones.", "The speaker was standing on the flower all along."]}], "source": {"chapter": "u1c2", "pages": "18"}, "id": "c8u1c2-02-read-listen", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-03-discuss": {"title": "Let us discuss, think and reflect", "summary": "Complete a summary, study poetic devices and answer questions.", "minutes": 30, "blocks": [{"type": "quiz", "id": "u1c2-q-summary", "title": "Complete the summary with exact words from the poem", "questions": [{"type": "fill", "q": "Mrs. Jones has a garden filled with ______.", "answer": ["stones"], "explanation": "The poem says her garden is full of stones.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "A peculiar ______ (path), a pond, and a rockery.", "answer": ["path"], "explanation": "A crazy path.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "An unusual ______ she finds charming.", "answer": ["sundial"], "explanation": "A sundial with a strange device.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "tiny, ______ plants", "answer": ["delicate"], "explanation": "Delicate and small.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "planted with a ______", "answer": ["pin"], "explanation": "A pin!", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "they discuss a ______", "answer": ["flower"], "explanation": "They talk about a flower.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Where is this ______ flower?", "answer": ["lovely"], "explanation": "The speaker calls it a lovely thing.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "the speaker has been ______ on it", "answer": ["standing"], "explanation": "You’re standing on it.", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u1c2-q-mc", "title": "Select the correct options", "questions": [{"type": "single", "q": "The tone of the poem is…", "options": ["(i), (ii) and (iii) — mocking, humorous, mournful", "(i), (ii) and (v) — mocking, humorous, light-hearted", "(ii), (iii) and (iv) — humorous, mournful, amusing", "(ii), (iv) and (v) — humorous, amusing, light-hearted"], "answer": 3, "explanation": "Humorous, amusing and light-hearted (D). It is not mournful or mocking.", "hints": ["Is the poem sad?"]}, {"type": "single", "q": "The speaker in the poem is…", "options": ["Mrs. Jones", "the poet", "a gardener", "a child"], "answer": 1, "explanation": "The speaker is the poet, talking about his neighbour.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The rhyme scheme is…", "options": ["AABBCC", "ABABCC", "AABCAC", "ABBACC"], "answer": 0, "explanation": "Couplets: Jones/stones, pond/beyond, device/nice — AABBCC.", "hints": ["Check the last words of lines 1 and 2."]}, {"type": "single", "q": "The word ‘stones’ appears in every stanza to emphasise…", "options": ["her obsession with a stony garden", "her pride in gardening skills"], "answer": 0, "explanation": "Repetition shows her obsession with stones.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Imagery helps readers…", "options": ["understand Mrs. Jones’ love for plants", "visualise the garden’s peculiar nature"], "answer": 1, "explanation": "Images like the crazy path and sundial help us picture the garden.", "hints": ["Think about the text again."]}]}, {"type": "callout", "kind": "note", "md": "**Alliteration** is repeating the same starting sound: e.g. *quite a quarter of an hour*, *strange … sundial*. **Refrain**: a repeated line — here the line naming Mrs. Jones, the next-door neighbour, at the start of each stanza. **Situational irony**: the outcome is not what you expect — the speaker hunts for a lovely flower and is told he is standing on it. **Pun**: word play with two meanings — ‘concrete’ means stone-hard and also clear and real.", "title": "Poetic devices"}, {"type": "quiz", "id": "u1c2-q-dev", "title": "Devices", "questions": [{"type": "single", "q": "Which line shows situational irony?", "options": ["‘Where is this lovely thing?’ / ‘You’re standing on it’", "‘A crazy path, a lily pond’", "‘Which Mrs. Jones thinks rather nice’"], "answer": 0, "explanation": "He expects a flower to see, but it is under his feet.", "hints": ["Where is the surprise?"]}, {"type": "single", "q": "Which is the refrain?", "options": ["My next-door neighbour, Mrs. Jones", "They are so delicate and small", "We stood and talked about a flower"], "answer": 0, "explanation": "It starts each stanza.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘The word concrete can refer to ____ in Mrs. Jones’ garden.’", "options": ["the stones and hard surface", "the flower pots", "the pond water"], "answer": 0, "explanation": "Concrete = hard stone-like material, i.e. the stones.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The title’s symbolic meaning: the poem gives a clear example of Mrs. Jones’ ____ gardening habits.", "options": ["stony / unusual", "fancy", "careless"], "answer": 0, "explanation": "A *concrete* (clear) example of her unusual stony style.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "The book’s pun examples: *I tried arguing with my pencil but it kept making sharp points* (sharp pencil point / strong argument points) and *My pencil and I had a disagreement but we finally got to the point* (the point of an argument / the pencil tip).", "title": "Pun"}, {"type": "text", "md": "Extract: the first stanza (crazy path, lily pond, rockery, sundial with a strange device).", "title": "Let us think and reflect"}, {"type": "quiz", "id": "u1c2-q-ext", "title": "Extract questions", "questions": [{"type": "single", "q": "(i) What can be inferred from a garden ‘full of stones’?", "options": ["Mrs. Jones has an unusual, unconventional taste in gardening", "She hates plants", "She cannot afford plants"], "answer": 0, "explanation": "The garden is unusual and reflects her taste.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "(ii) The garden helps reveal more about Mrs. Jones herself.", "answer": true, "explanation": "A person’s garden shows her taste and personality.", "hints": ["Re-read the story."]}, {"type": "single", "q": "(iv) A sundial with a ‘strange device’ suggests Mrs. Jones…", "options": ["has a fascination with unusual items", "prefers traditional decorations", "is uninterested in her garden’s looks", "likes modern and expensive items"], "answer": 0, "explanation": "A (fascination with unusual items).", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "(iii) What does the poet mean by ‘crazy path’?", "md": "A path laid in an irregular, uneven way — zig-zag, winding or made of odd-shaped stones — not a straight neat path."}, {"type": "text", "md": "Answer the five long questions.", "title": "Answer the following questions"}, {"type": "reveal", "prompt": "1. How does Mrs. Jones feel about her garden? Evidence?", "md": "She is proud and pleased. She thinks the sundial is ‘rather nice’, invites the speaker to see her stones, and talks about a flower for a quarter of an hour, calmly saying he is standing on it."}, {"type": "reveal", "prompt": "2. Why does the speaker say the plants could be planted with a pin?", "md": "It is humorous exaggeration — the plants are so tiny and delicate they look hard to plant and almost invisible."}, {"type": "reveal", "prompt": "3. What do we learn about Mrs. Jones from her style and talk with the speaker?", "md": "She is creative, proud, cheerful and has a quiet sense of humour. She loves her own way of gardening even if it is different."}, {"type": "reveal", "prompt": "4. ‘The poem portrays Mrs. Jones in a positive light.’ Support.", "md": "She is shown as friendly (invites a neighbour), proud of her work, creative with an unusual garden, and gently witty in her reply. The speaker teases kindly, not meanly."}, {"type": "reveal", "prompt": "5. What does the poem say about how differently people see the world?", "md": "One person sees a garden full of stones; another sees flowers in every gap. What we notice depends on our point of view and interests."}, {"type": "summary", "points": ["Tone: humorous and light-hearted. Rhyme: AABBCC.", "Devices: refrain, alliteration, irony, pun, imagery.", "People see the world differently."]}], "source": {"chapter": "u1c2", "pages": "19-21"}, "id": "c8u1c2-03-discuss", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-04-learn": {"title": "Let us learn: synonyms, instruments and word changes", "summary": "Replace words with synonyms, sort tools and equipment, and change first letters.", "minutes": 20, "blocks": [{"type": "quiz", "id": "u1c2-q-syn", "title": "Replace the underlined word", "questions": [{"type": "single", "q": "A sundial with a **strange** device", "options": ["unusual", "new", "external"], "answer": 0, "explanation": "*Strange* ≈ unusual, peculiar (not ‘new’ or ‘external’).", "hints": ["Which word means odd?"]}, {"type": "single", "q": "…which Mrs. Jones thinks rather **nice**", "options": ["pleasant", "superior", "gentle"], "answer": 0, "explanation": "*Nice* ≈ pleasant / agreeable / charming.", "hints": ["Think about the text again."]}, {"type": "single", "q": "They are so **delicate**", "options": ["fragile", "delicious", "weak"], "answer": 0, "explanation": "*Delicate* ≈ fragile / dainty.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘Where is this lovely thing?’ I **cried**", "options": ["exclaimed", "wept", "whispered"], "answer": 0, "explanation": "Here *cried* means exclaimed, not wept.", "hints": ["He is surprised, not sad."]}]}, {"type": "text", "md": "The word *device* in the poem means a **tool or small machine made for a purpose**. English has many words for such things.", "title": "Instruments"}, {"type": "table", "headers": ["Word", "Meaning", "Examples"], "rows": [["implement", "something that works by being moved by hand", "spade, knife, ploughs, rake"], ["tool", "something used by hand to make or repair", "hammer, screwdriver, pliers"], ["equipment", "a set of necessary items for a purpose", "cricket bat, helmet, gloves, camping gear"], ["appliance", "electrical, used for work in the house", "mixer grinder, washing machine, fan"], ["gadget", "something small, mechanical or electronic", "mobile phone, laptop, smart watch"]]}, {"type": "quiz", "id": "u1c2-q-inst", "title": "Which word fits?", "questions": [{"type": "single", "q": "a washing machine", "options": ["appliance", "tool", "implement"], "answer": 0, "explanation": "Electrical, for work in the house.", "hints": ["Think about the text again."]}, {"type": "single", "q": "a screwdriver", "options": ["tool", "appliance", "equipment"], "answer": 0, "explanation": "Used by hand to repair things.", "hints": ["Think about the text again."]}, {"type": "single", "q": "a smart watch", "options": ["gadget", "implement", "equipment"], "answer": 0, "explanation": "Small electronic.", "hints": ["Think about the text again."]}, {"type": "single", "q": "a hockey stick, pads and a ball", "options": ["equipment", "gadget", "appliance"], "answer": 0, "explanation": "A set of items for a sport.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "Change only the **first letter** to make new words. *nice → dice*.", "title": "Word changes"}, {"type": "quiz", "id": "u1c2-q-word", "title": "Change the first letter", "questions": [{"type": "fill", "q": "nice → ______ (grain that we cook)", "answer": ["rice"], "explanation": "n→r.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "nice → ______ (plural of mouse)", "answer": ["mice"], "explanation": "n→m.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "nice → ______ (bad habit)", "answer": ["vice"], "explanation": "n→v.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "soil → ______ (heat something)", "answer": ["boil"], "explanation": "s→b.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "soil → ______ (work very hard)", "answer": ["toil"], "explanation": "s→t.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "soil → ______ (length of wire in a circle)", "answer": ["coil"], "explanation": "s→c.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "soil → ______ (sheets to wrap food)", "answer": ["foil"], "explanation": "s→f.", "hints": ["Look for the exact word."]}]}, {"type": "flashcards", "id": "u1c2-cards", "title": "Instrument words", "cards": [{"front": "implement", "back": "hand-moved instrument, e.g. a spade"}, {"front": "tool", "back": "used by hand to make or repair"}, {"front": "equipment", "back": "a set of items for a purpose"}, {"front": "appliance", "back": "electrical item for housework"}, {"front": "gadget", "back": "small electronic/mechanical item"}]}, {"type": "summary", "points": ["Synonyms keep meaning but change the word.", "Implements, tools, equipment, appliances and gadgets are different things.", "Changing one letter can create a new word."]}], "terms": [{"term": "device", "def": "a tool or small machine made for a purpose"}], "source": {"chapter": "u1c2", "pages": "21-23"}, "id": "c8u1c2-04-learn", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-05-listen-speak": {"title": "Listen: the Rock Garden · Speak: apologies", "summary": "Listen for facts about Nek Chand’s Rock Garden and practise apologising.", "minutes": 25, "blocks": [{"type": "text", "md": "Press **🎧 Play audio**. Answer using one to three words from what you hear.", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 The Rock Garden of Chandigarh (listen first)", "md": "Hello everyone! The Rock Garden in Chandigarh is a huge open-air exhibition and a proof of what human creativity can do with waste. It was started in 1957 by Nek Chand, and so people also call it Nek Chand's Rock Garden. In 1983 the garden appeared on an Indian postage stamp, and a year later Nek Chand received the Padma Shri. The garden is spread over about forty acres, and it is full of colourful sculptures and mosaics. It is divided into three phases, and each phase has its own collection: terracotta pots, light fixtures and even broken toilet pots turned into wonderful art. Around five thousand statues line its borders. It truly celebrates the best from waste, and I recommend you visit this national treasure.", "listen": true}, {"type": "quiz", "id": "u1c2-q-listen", "title": "Listening answers", "questions": [{"type": "fill", "q": "Where was Nek Chand’s Rock Garden featured?", "answer": ["postage stamp", "on a postage stamp", "an indian postage stamp", "indian postage stamp"], "explanation": "It was featured on an Indian postage stamp in 1983.", "placeholder": "1–3 words", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "What kind of sculptures does it have?", "answer": ["colourful", "colorful", "colourful sculptures"], "explanation": "Colourful sculptures and mosaic art pieces.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "How is the Rock Garden divided?", "answer": ["three phases", "three distinct phases", "into three phases"], "explanation": "Into three distinct phases.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Name one thing transformed into art.", "answer": ["terracotta pots", "light fixtures", "broken toilet pots", "toilet pots"], "explanation": "Terracotta pots, light fixtures, or broken toilet pots.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "About how many statues border the garden?", "answer": ["5,000", "5000", "five thousand", "around 5,000"], "explanation": "Around 5,000.", "hints": ["Look for the exact word."]}]}, {"type": "text", "md": "When you make a mistake, say sorry. With friends and family use **informal** language; with a principal or teacher use **formal** language.", "title": "Let us speak: apologies"}, {"type": "table", "headers": ["Informal apology", "Reply", "Formal apology", "Reply"], "rows": [["I’m sorry about…", "That’s alright.", "I’m extremely sorry for… I promise it won’t happen again.", "I accept your apology. Please ensure you…"], ["I’m really sorry…", "It’s no big deal.", "I owe you an apology for… I’ll do my best not to repeat it.", "I appreciate you saying this, but…"], ["Please forgive me for…", "No problem.", "I really regret… I assure you this will never happen again.", "I’m glad you realised your mistake…"], ["Sorry, I didn’t mean to…", "These things happen.", "", ""]]}, {"type": "quiz", "id": "u1c2-q-apol", "title": "Formal or informal?", "questions": [{"type": "single", "q": "‘I owe you an apology for not submitting my project.’ Who is it said to?", "options": ["a friend", "the Principal / a teacher"], "answer": 1, "explanation": "That is formal.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘Sorry, I didn’t mean to.’ is…", "options": ["informal", "formal"], "answer": 0, "explanation": "Casual, to a friend or family.", "hints": ["Think about the text again."]}]}, {"type": "exercise", "id": "u1c2-ex-apol", "title": "Role-play apologies", "difficulty": "easy", "minutes": 15, "goal": "Practise informal and formal apologies with a partner.", "behavior": "Informal: (i) you ate your brother’s sweets; (ii) broke your sister’s flower craft; (iii) spilled ink on mother’s documents; (iv) forgot a borrowed notebook. Formal: (i) assignment not brought; (ii) late three days, meeting the Principal; (iii) project not submitted.", "hints": ["Say what you did.", "Say sorry.", "Say how you will fix it."], "checklist": ["Used informal language with family/friends", "Used formal language with teacher/Principal", "Partner responded politely"], "solution": "Informal: ‘I’m really sorry I ate your sweets. Please forgive me, I’ll buy you more.’ — ‘It’s no big deal.’  Formal: ‘I’m extremely sorry for being late. I promise it won’t happen again.’ — ‘I accept your apology. Please ensure you come on time.’", "solution_lang": "text", "solution_explain": "Match language to the person: friendly for family, polite for authority.", "mode": "selfcheck"}, {"type": "summary", "points": ["Listening for numbers and nouns gives quick answers.", "Formal apologies are more polite and complete.", "Always say sorry, explain, and promise to improve."]}], "source": {"chapter": "u1c2", "pages": "23-24, 47"}, "id": "c8u1c2-05-listen-speak", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-06-write-explore": {"title": "Let us write and explore", "summary": "Draft a notice and explore gardens, herbariums and a poem about foliage.", "minutes": 25, "blocks": [{"type": "text", "md": "A **notice** is a short formal message in a box, written in third person with formal language. Include: name of organisation, the word NOTICE, date, title, body (purpose, date, time, venue, whom to contact), then name, signature and class.", "title": "Let us write: a notice"}, {"type": "exercise", "id": "u1c2-ex-notice", "title": "Notice for the Herb Garden inauguration", "difficulty": "easy", "minutes": 15, "goal": "As a member of the Nature Club, inform students of Grades 6–8 about the Herb Garden inauguration.", "behavior": "Use a box; formal; third person; give purpose, date, time, venue, contact person.", "hints": ["Where does the organisation name go?", "Have you used the third person?", "Did you add a contact?"], "checklist": ["Name of club", "The word NOTICE", "Date", "Clear title", "Purpose, date, time, venue, contact", "Name, signature, class"], "solution": "SUNSHINE SCHOOL — NATURE CLUB\nNOTICE\n10 March 2026\nInauguration of the Herb Garden\nAll students of Grades 6–8 are informed that the Nature Club will inaugurate the school Herb Garden on 15 March 2026 at 10:00 a.m. near the Science Block. The Chief Guest will plant the first sapling. Interested students may contact the Club Secretary before 12 March.\nName: Anita Rao\nSignature: —\nClass: 8 B", "solution_lang": "text", "solution_explain": "Formal, short, complete: who, what, when, where, whom to contact.", "mode": "selfcheck"}, {"type": "text", "md": "**I. Amrit Udyan** is a garden of about 15 acres around Rashtrapati Bhavan in New Delhi. It has Bal Vatika for children, a treehouse, nature’s classroom, and Bonsai, Herbal-I, Herbal-II, Tactile, Arogya Vanam and Circular Gardens. Find out about popular gardens in your region and share. A virtual tour link is in your book: https://virtualtour.rashtrapatibhavan.gov.in/", "title": "Let us explore"}, {"type": "text", "md": "**II. Herbarium:** a collection of dried, pressed plant samples mounted on paper. Collect fallen flowers and leaves, fold them in newspaper, press under a pile of books for a week, then make a card, wall hanging or artwork.", "title": "Herbarium activity"}, {"type": "text", "md": "**III. ‘A Sea of Foliage’ by Toru Dutt** (see page 26 of your book). In this sonnet the poet describes a garden surrounded by a sea of leaves — not dull green but full of colour contrasts. She mentions light-green tamarinds among darker mango trees, palms like grey pillars, and red seemul trees by quiet pools. The loveliest sight is bamboos to the east when the moon looks through them and turns the white lotus into a silver cup. The poet says one might swoon with beauty, or gaze at a first, primeval Eden.", "title": "Poem explored (summary)"}, {"type": "quiz", "id": "u1c2-q-foliage", "title": "Think about the sonnet", "questions": [{"type": "single", "q": "The poet says the garden is not…", "options": ["dull unvaried green", "full of colour", "surrounded by foliage"], "answer": 0, "explanation": "She describes contrasts of colour, not dull green.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The moon turns the white lotus into…", "options": ["a cup of silver", "a golden bowl", "a red flower"], "answer": 0, "explanation": "A cup of silver (moonlight).", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["A notice is short, formal and complete.", "A herbarium is pressed plants kept for study.", "Poems can describe nature with colour images."]}], "source": {"chapter": "u1c2", "pages": "25-26"}, "id": "c8u1c2-06-write-explore", "chapter": "c8u1c2", "kind": "lesson"}, "c8u1c2-99-test": {"title": "Test: A Concrete Example", "summary": "Check what you learned in this chapter.", "minutes": 12, "blocks": [{"type": "quiz", "id": "u1c2-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "The poem was written by…", "options": ["Reginald Arkell", "Toru Dutt", "Walter de la Mare", "Arthur Clarke"], "answer": 0, "explanation": "Reginald Arkell.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The tone of the poem is…", "options": ["humorous and light-hearted", "mournful", "angry"], "answer": 0, "explanation": "Humorous.", "hints": ["Think about the text again."]}, {"type": "single", "q": "The rhyme scheme is…", "options": ["AABBCC", "ABABAB", "ABCABC"], "answer": 0, "explanation": "AABBCC.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "The refrain is the repeated line about the next-door neighbour.", "answer": true, "explanation": "It opens each stanza.", "hints": ["Re-read the story."]}, {"type": "single", "q": "Situational irony in the poem:", "options": ["He is standing on the flower he is looking for", "The garden has a pond", "She has a sundial"], "answer": 0, "explanation": "Expectation vs outcome.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "The word that has both literal and symbolic meaning in the title is ______.", "answer": ["concrete"], "explanation": "Concrete.", "hints": ["Look for the exact word."]}, {"type": "single", "q": "A device with a mixer grinder is an…", "options": ["appliance", "implement", "equipment"], "answer": 0, "explanation": "Electrical house item.", "hints": ["Think about the text again."]}, {"type": "fill", "q": "nice → ______ (bad habit)", "answer": ["vice"], "explanation": "v replaces n.", "hints": ["Look for the exact word."]}, {"type": "single", "q": "For a Principal you apologise in…", "options": ["formal language", "slang"], "answer": 0, "explanation": "Formal.", "hints": ["Think about the text again."]}, {"type": "multi", "q": "A notice should include…", "options": ["date", "contact person", "long story", "title"], "answer": [0, 1, 3], "explanation": "A notice is short and complete, not a story.", "hints": ["Check each option against the text."]}, {"type": "single", "q": "Number of phases of the Rock Garden:", "options": ["two", "three", "five"], "answer": 1, "explanation": "Three.", "hints": ["Think about the text again."]}], "mode": "test"}], "kind": "test", "id": "c8u1c2-99-test", "chapter": "c8u1c2"}, "c8u1c3-01-warm-up": {"title": "Before we read: knowledge or wisdom?", "summary": "Think about advice from elders and sort knowledge from wisdom.", "minutes": 12, "blocks": [{"type": "text", "md": "**Why do we ask elders for advice?** Because they have lived through many situations and can show good judgement, not only facts. **Knowledge** is learning facts and information. **Wisdom** is using that knowledge with good judgement."}, {"type": "quiz", "id": "u1c3-q-kw", "title": "Knowledge or wisdom?", "questions": [{"type": "single", "q": "Riya’s understanding of plant care helped her grow a healthy vegetable garden.", "options": ["knowledge", "wisdom"], "answer": 0, "explanation": "Knowing facts about plants = knowledge.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Mr. Kumar values time with family over chasing wealth.", "options": ["knowledge", "wisdom"], "answer": 1, "explanation": "A good judgement about what matters = wisdom.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Karuna’s expertise in programming helped her develop a successful app.", "options": ["knowledge", "wisdom"], "answer": 0, "explanation": "Skill/information = knowledge.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Rohan understood the value of time management and made a timetable.", "options": ["knowledge", "wisdom"], "answer": 1, "explanation": "Using understanding to organise his work sensibly = wisdom.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Ramesh chose to forgive his friend for a misunderstanding.", "options": ["knowledge", "wisdom"], "answer": 1, "explanation": "A wise choice.", "hints": ["Think about the text again."]}, {"type": "single", "q": "Ms. Vaijayanthi delivered a lecture on Indian classical music.", "options": ["knowledge", "wisdom"], "answer": 0, "explanation": "Sharing information = knowledge.", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "Look at the picture on page 27 (a cat in a tree, a monkey on a roof, damaged house, four villagers). What might have happened?", "md": "Possible answer: a monkey (or a storm) damaged the thatched roof; the cat is stuck in the tree; the villagers are wondering who is responsible. Any sensible guess is fine."}, {"type": "summary", "points": ["Knowledge = facts; wisdom = good judgement.", "Elders give advice from experience."]}], "terms": [{"term": "knowledge", "def": "facts and information"}, {"term": "wisdom", "def": "using knowledge with good judgement"}], "source": {"chapter": "u1c3", "pages": "27"}, "id": "c8u1c3-01-warm-up", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-02-read-listen": {"title": "Read and listen: the play", "summary": "Follow Scene I (the road) and Scene II (the court) in simple words.", "minutes": 25, "blocks": [{"type": "text", "md": "The play *Wisdom Paves the Way* is copyrighted. Read the original dialogue in your textbook (pages 28–36). Here is the story in simple words for you to listen to with 🔊 Listen.", "title": "About this lesson"}, {"type": "table", "headers": ["Character", "Who"], "rows": [["The King of Ujjain", "a young king"], ["Ram Datt, Shiv Datt, Har Datt, Dev Datt", "four young men looking for work"], ["The Merchant", "a man who has lost his camel"], ["Two Sentries", "palace guards"]]}, {"type": "text", "md": "Four young men — Ram Datt, Shiv Datt, Har Datt and Dev Datt — walk on a dusty road to Ujjain. They have travelled for ten days and still have no work. Ram Datt is sure the King of Ujjain would notice their talents if they could meet him. Har Datt says meeting the king is not easy and they need a strategy; Dev Datt says they can plan when they reach the gates.", "title": "Scene I — The road to Ujjain (1)"}, {"type": "text", "md": "On the way they see fresh camel tracks and study them carefully as they walk. Each of them quietly notices something peculiar, and Dev Datt smiles that his own discovery is different from theirs. Then a worried merchant comes running. He has lost a camel and asks if they have seen it.", "title": "Scene I (2)"}, {"type": "text", "md": "Before he says anything about the animal, they describe it: it is lame in one leg, blind in the right eye, and has a short tail. Dev Datt adds that it has had a stomach ache. The merchant is amazed and thinks they must be healers, but they say they do not know where it is. The merchant refuses to believe them, calls them thieves, and forces them to go with him to the king.", "title": "Scene I (3)"}, {"type": "text", "md": "At the king’s court the sentry says the merchant accuses four travellers of stealing his camel. The merchant argues that nobody could know so much without having seen it. The king asks each young man to explain.", "title": "Scene II — The King’s court (1)"}, {"type": "text", "md": "Ram Datt noticed only three feet left clear prints; the fourth was faint, so the camel limps. Shiv Datt saw that leaves were eaten only on the left side of the road, so the camel could not see with its right eye. Har Datt noticed small drops of blood along the track from mosquito bites; a camel with a long tail could have brushed pests away, so the tail must be short. Dev Datt noticed deep forefoot prints and a faint hind print, as if the camel were pulling up its hind leg to protect its belly from pain.", "title": "Scene II (2)"}, {"type": "text", "md": "The king is impressed and says their reasoning is flawless. He tells the merchant his accusation is baseless, and the merchant leaves in shame. The king offers the four men the honour of becoming his advisers. They accept humbly and gratefully, and the court applauds as the king welcomes his new advisers.", "title": "Scene II (3)"}, {"type": "flashcards", "id": "u1c3-cards-words", "title": "Words from the play", "cards": [{"front": "adorned", "back": "beautified"}, {"front": "resolute", "back": "determined"}, {"front": "tapestries", "back": "heavy decorative fabrics woven with pictures or patterns"}, {"front": "bustling", "back": "busy"}, {"front": "eludes", "back": "is difficult to obtain"}, {"front": "devise", "back": "to think of a plan"}, {"front": "deliberate", "back": "to think carefully"}, {"front": "scrutinise", "back": "to look carefully at"}, {"front": "in haste", "back": "in a hurry"}, {"front": "pursued", "back": "chased"}, {"front": "countenance", "back": "facial expression"}, {"front": "distressed", "back": "worried"}, {"front": "astray", "back": "away from the correct path"}, {"front": "indignant", "back": "angry"}, {"front": "yonder", "back": "over there"}, {"front": "draperies", "back": "long thick curtains"}, {"front": "canopy", "back": "a decorative cover over a seat"}, {"front": "grievance", "back": "a complaint"}, {"front": "accusations", "back": "claims that someone has done wrong"}, {"front": "deduce", "back": "to find out by reasoning"}, {"front": "discern", "back": "to see or notice"}, {"front": "foliage", "back": "green leaves"}, {"front": "fended off", "back": "guarded against"}, {"front": "insight", "back": "deep understanding"}, {"front": "sound", "back": "healthy"}, {"front": "intimately", "back": "in a detailed way"}, {"front": "flawless", "back": "perfect"}, {"front": "chastened", "back": "felt sorry"}, {"front": "counsel", "back": "advice"}, {"front": "beacon", "back": "guiding light"}]}, {"type": "quiz", "id": "u1c3-q-read", "title": "Play check", "questions": [{"type": "order", "q": "Order of how the young men noticed the camel’s problems as they told the king.", "items": ["Ram Datt — lame", "Shiv Datt — blind in right eye", "Har Datt — short tail", "Dev Datt — stomach pain"], "explanation": "They spoke in the same order as in the court.", "hints": ["Ram Datt spoke first."]}, {"type": "single", "q": "How did Shiv Datt know the camel was blind in its right eye?", "options": ["It ate leaves only on the left of the road", "It bumped into trees", "It limped", "The merchant said so"], "answer": 0, "explanation": "Only the left foliage was nibbled.", "hints": ["Think about the text again."]}, {"type": "single", "q": "How did Har Datt know the tail was short?", "options": ["Blood drops from mosquito bites along the track", "He saw the camel", "The merchant told him", "Footprints"], "answer": 0, "explanation": "A long tail would have fended off pests.", "hints": ["Think about the text again."]}, {"type": "truefalse", "q": "The four men had seen the camel.", "answer": false, "explanation": "They only read the tracks and signs.", "hints": ["Re-read the story."]}]}, {"type": "summary", "points": ["The young men reasoned from small clues.", "The king rewarded their wisdom with a job.", "Observation + reasoning = wisdom in action."]}], "source": {"chapter": "u1c3", "pages": "28-36"}, "id": "c8u1c3-02-read-listen", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-03-discuss": {"title": "Let us discuss, think and reflect", "summary": "Give reasons, arrange events, and answer extract and long questions.", "minutes": 30, "blocks": [{"type": "text", "md": "Complete with reasons.", "title": "Part I — Because…"}, {"type": "reveal", "prompt": "Dev Datt: ‘We ought to be united in this hope. That is why we press on towards Ujjain.’ Why?", "md": "They all hope to get work from the king; being united keeps them moving together despite the long journey."}, {"type": "reveal", "prompt": "Har Datt: ‘A camel has passed this way. The tracks are fresh.’ Why? (note: the book assigns it to Har Datt, but Shiv Datt speaks the line in the text)", "md": "The tracks looked new, so a camel had passed recently; it began their observation of clues."}, {"type": "reveal", "prompt": "Shiv Datt: ‘It appears to be a merchant, running as if pursued by trouble.’ Why?", "md": "The man was running fast, panting and looked distressed, like someone who has lost something valuable."}, {"type": "reveal", "prompt": "The merchant: ‘Surely you are a healer!’ Why?", "md": "They knew the camel had a stomach problem for two weeks; only someone with medical skill would know that."}, {"type": "reveal", "prompt": "Dev Datt: ‘If the King desires our presence, we shall be waiting under that banyan tree yonder.’ Why?", "md": "They were calm and innocent; they had nothing to hide and trusted the king’s justice."}, {"type": "quiz", "id": "u1c3-q-order", "title": "Scene II events in order", "questions": [{"type": "order", "q": "Arrange the events.", "items": ["The King asks the merchant to clearly state his accusation", "The merchant accuses the four men of knowing a lot about his missing camel", "Ram Datt explains how he inferred the camel was lame", "Shiv Datt reveals the camel was blind in its right eye", "Har Datt clarifies how he knew the camel has a short tail", "Dev Datt explains the camel’s pain and careful movement", "The King praises the young men and dismisses the merchant’s accusation", "The King makes the four young men his advisers"], "explanation": "This is the order in Scene II.", "hints": ["The king first asks the merchant to speak."]}]}, {"type": "text", "md": "**Extract 1** — the young men talk on the road: Dev Datt says ten days is short and more roads may lie ahead; Ram Datt is confident the king would recognise their talents; Har Datt says they need a strategy.", "title": "Think and reflect — Extract 1"}, {"type": "quiz", "id": "u1c3-q-e1", "title": "Extract 1", "questions": [{"type": "single", "q": "(i) Which statement is false?", "options": ["A. Dev Datt believes finding employment is an easy task.", "B. Ram Datt is confident the King would recognise their talents."], "answer": 0, "explanation": "A is false — Dev Datt says they may wander many more roads before finding work.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iii) ‘press on’ means…", "options": ["walking with heavy steps", "moving forward with determination", "slowing down to rest", "stopping briefly"], "answer": 1, "explanation": "To press on is to continue with determination.", "hints": ["Think about the text again."]}, {"type": "single", "q": "(iv) Har Datt’s ‘We need to devise a strategy’ shows he is…", "options": ["doubtful and wants to give up", "eager to rush without preparation", "cautious and thoughtful, preferring to plan", "dependent on others"], "answer": 2, "explanation": "He plans ahead.", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "(ii) What does Ram Datt’s confidence tell us about him?", "md": "He is self-confident, optimistic and believes in his talents."}, {"type": "text", "md": "**Extract 2** — the king praises the four men’s intelligence and offers them the honour of becoming advisers; Ram Datt says it is an honour they had not dared to dream of.", "title": "Extract 2"}, {"type": "quiz", "id": "u1c3-q-e2", "title": "Extract 2", "questions": [{"type": "single", "q": "(i) (A) The Merchant left the court feeling humbled and ashamed. (R) The King commanded that the four wise men join his court.", "options": ["Both true, R explains A", "Both true, R does not explain A", "A true, R false", "A false, R true"], "answer": 2, "explanation": "The merchant was ashamed (true), but the king *offered* them the post; he did not command them (R false).", "hints": ["Think about the text again."]}, {"type": "single", "q": "(ii) ‘See beyond the obvious’ means the men could…", "options": ["challenge common beliefs with reasoning", "interpret in traditional ways", "notice details others might overlook", "predict the future"], "answer": 2, "explanation": "C.", "hints": ["Think about the text again."]}]}, {"type": "reveal", "prompt": "(iii) Ram Datt called the offer ‘an honour we had not dared to dream of’ because… (iv) How does the king’s offer reflect his values?", "md": "(iii) They were poor travellers looking for any job; being advisers to a king was far beyond their hopes.\n\n(iv) The king values intelligence, careful observation and fairness over wealth or status, listens to evidence, and rewards talent."}, {"type": "text", "md": "Answer the long questions.", "title": "Part II"}, {"type": "reveal", "prompt": "1. What does the dusty road tell about the journey?", "md": "It shows the journey was long (ten days), tiring and uncertain; the men were travel-worn yet determined."}, {"type": "reveal", "prompt": "2. Why was the merchant suspicious? What does it say about him?", "md": "They described his camel exactly though they claimed not to have seen it. He is hasty and jumps to conclusions without thinking."}, {"type": "reveal", "prompt": "3. How do the observations serve as a turning point?", "md": "They turn the story from an accusation of theft into proof of the young men’s intelligence, and lead to their getting jobs."}, {"type": "reveal", "prompt": "4. Why did the king believe the young men?", "md": "Their explanations were logical and based on evidence from tracks, while the merchant only had suspicion."}, {"type": "reveal", "prompt": "5. How does their capability make them suitable as advisers?", "md": "They observe closely, reason carefully, stay calm under pressure and explain clearly — useful qualities for advisers."}, {"type": "reveal", "prompt": "6. Why does the merchant feel ashamed? (own words)", "md": "He wrongly accused honest men in front of the king and was told to be careful whom he accuses; he realised he acted rashly."}, {"type": "summary", "points": ["Characters’ lines show their feelings.", "The king’s choice shows he values wisdom.", "The merchant’s mistake was jumping to conclusions."]}], "source": {"chapter": "u1c3", "pages": "32-39"}, "id": "c8u1c3-03-discuss", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-04-learn": {"title": "Let us learn: nouns, expressions, face/bear and modals", "summary": "Build noun forms, learn expressions, multiple meanings and modal verbs.", "minutes": 30, "blocks": [{"type": "quiz", "id": "u1c3-q-noun", "title": "Noun forms", "questions": [{"type": "fill", "q": "Some word games need a lot of thought and ______. (deduce)", "answer": ["deduction"], "explanation": "deduce → deduction", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Close ______ of animals. (observe)", "answer": ["observation", "observations"], "explanation": "observe → observation", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "A detailed ______ of the documents. (scrutinise)", "answer": ["scrutiny"], "explanation": "scrutinise → scrutiny", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "false ______ against anyone. (accuse)", "answer": ["accusation", "accusations"], "explanation": "accuse → accusation", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "in ______ of her contribution. (recognise)", "answer": ["recognition"], "explanation": "recognise → recognition", "hints": ["Look for the exact word."]}]}, {"type": "quiz", "id": "u1c3-q-expr", "title": "Expressions", "questions": [{"type": "single", "q": "with all our hearts", "options": ["complete sincerity", "surprised"], "answer": 0, "explanation": "Sincerely.", "hints": ["Think about the text again."]}, {"type": "single", "q": "to be precise", "options": ["exact and accurate", "starts cheering"], "answer": 0, "explanation": "Exactly.", "hints": ["Think about the text again."]}, {"type": "single", "q": "gain an audience with", "options": ["meeting or hearing someone", "hidden information"], "answer": 0, "explanation": "To meet someone important.", "hints": ["Think about the text again."]}, {"type": "single", "q": "catch his breath", "options": ["to pause or rest for some time", "to be angry"], "answer": 0, "explanation": "Rest after running.", "hints": ["Think about the text again."]}, {"type": "single", "q": "erupts in applause", "options": ["starts cheering together", "is surprised"], "answer": 0, "explanation": "Claps suddenly.", "hints": ["Think about the text again."]}, {"type": "single", "q": "grand scheme of things", "options": ["overall plan of life in a larger context", "a plan for a party"], "answer": 0, "explanation": "The bigger picture.", "hints": ["Think about the text again."]}, {"type": "single", "q": "taken aback", "options": ["surprised", "delighted"], "answer": 0, "explanation": "Shocked.", "hints": ["Think about the text again."]}, {"type": "single", "q": "more than meets the eye", "options": ["hidden information that is not obvious", "very small"], "answer": 0, "explanation": "There is more than what we see.", "hints": ["Think about the text again."]}]}, {"type": "exercise", "id": "u1c3-ex-sent", "title": "Use five expressions", "difficulty": "easy", "minutes": 10, "goal": "Make five sentences using any five expressions from the list.", "behavior": "Write one sentence for each of five expressions.", "hints": ["Pick the five easiest.", "Think of a real situation.", "Read it aloud."], "checklist": ["Five sentences", "Each uses an expression correctly", "Meaning is clear"], "solution": "I was taken aback when the teacher announced a surprise test. The crowd erupted in applause. To be precise, it was 10:15. In the grand scheme of things, one bad mark is not a disaster. The runner stopped to catch his breath.", "solution_lang": "text", "solution_explain": "Use the expression whole, not partly.", "mode": "selfcheck"}, {"type": "text", "md": "Some words have several meanings. **face** (n.) front of the head — *She has a round, smiling face*; (v.) be positioned towards — *Ravi turned to face his father*; (v.) deal with a difficult situation — *We should be ready to face life’s challenges*; (n.) front surface — *The face of the clock was painted red and blue*. **bear** (v.) tolerate — *I can’t bear the sound of honking*; (v.) accept — *Riya agreed to bear the responsibilities*; (n.) the animal — *I spotted a bear on a safari*; (v.) produce — *The trees took long to bear fruit*.", "title": "Face and bear"}, {"type": "quiz", "id": "u1c3-q-fb", "title": "Which meaning?", "questions": [{"type": "single", "q": "‘Face the problem bravely.’", "options": ["deal with", "front surface", "be positioned towards"], "answer": 0, "explanation": "Deal with a difficult situation.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘The mango tree will bear fruit.’", "options": ["produce", "tolerate", "animal"], "answer": 0, "explanation": "Produce.", "hints": ["Think about the text again."]}, {"type": "single", "q": "‘I cannot bear this noise.’", "options": ["tolerate", "accept", "produce"], "answer": 0, "explanation": "Tolerate.", "hints": ["Think about the text again."]}]}, {"type": "text", "md": "**Modal verbs** show ability, possibility, necessity, advice, obligation, etc.", "title": "Modals"}, {"type": "table", "headers": ["Sentence", "Modal", "Function"], "rows": [["I will gladly pay your fee", "will", "willingness"], ["You must have stolen it", "must", "logical conclusion"], ["You shall come with me", "shall", "command"], ["How could you possibly know?", "could", "expression of disbelief"], ["he would recognise our talents", "would", "prediction"], ["A camel would have fended off pests", "would have", "imagined possibility"], ["They may tell us more", "may", "possibility"], ["May your wisdom shine", "may", "wish or hope"], ["we ought to be united", "ought to", "moral obligation / advice"], ["We need to devise a strategy", "need to", "necessity"], ["you dare to claim", "dare to", "challenge"]]}, {"type": "quiz", "id": "u1c3-q-modal", "title": "Wise old man story — choose modals", "questions": [{"type": "fill", "q": "How ______ I become wise like you? (ability)", "answer": ["can"], "explanation": "*Can* shows ability.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Wisdom ______ be earned through patience. (necessity)", "answer": ["must"], "explanation": "*Must* shows necessity.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "You ______ listen more than you speak. (suggestion)", "answer": ["should"], "explanation": "*Should* = suggestion.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "It ______ take years, but I’ll try. (weak possibility)", "answer": ["might"], "explanation": "*Might* = weak possibility.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "You ______ learn from your mistakes too. (obligation)", "answer": ["need to"], "explanation": "*Need to* = obligation.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "Wisdom ______ come slowly. (possibility)", "answer": ["may"], "explanation": "*May* = possibility.", "hints": ["Look for the exact word."]}, {"type": "fill", "q": "He knew he ______ become wise. (ability)", "answer": ["could"], "explanation": "*Could* = past ability.", "hints": ["Look for the exact word."]}], "intro": "Box: may, must, should, can, might, could, need to"}, {"type": "quiz", "id": "u1c3-q-rewrite", "title": "Rewrite with a modal", "questions": [{"type": "single", "q": "It is unnecessary to worry about things beyond your control.", "options": ["You need not worry about things beyond your control.", "You must worry …"], "answer": 0, "explanation": "Unnecessary → *need not*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "It is not possible for a person to gain experience without taking risks.", "options": ["A person cannot gain experience without taking risks.", "A person must gain …"], "answer": 0, "explanation": "Not possible → *cannot*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "It is essential to treat others with kindness.", "options": ["You must treat others with kindness.", "You may treat …"], "answer": 0, "explanation": "Essential → *must*.", "hints": ["Think about the text again."]}, {"type": "single", "q": "It is not allowed to interrupt when someone else is speaking.", "options": ["You must not interrupt when someone else is speaking.", "You can interrupt …"], "answer": 0, "explanation": "Not allowed → *must not*.", "hints": ["Think about the text again."]}]}, {"type": "summary", "points": ["Nouns can be formed from verbs (deduce → deduction).", "Face and bear have several meanings.", "Modals show ability, possibility, necessity, advice and more."]}], "terms": [{"term": "modal verb", "def": "a helping verb such as can, may, must, should that shows ability, possibility, necessity"}], "source": {"chapter": "u1c3", "pages": "39-42"}, "id": "c8u1c3-04-learn", "chapter": "c8u1c3", "kind": "lesson"}, "c8u1c3-05-listen-speak": {"title": "Let us listen and speak", "summary": "Match speakers’ opinions and practise word stress and intonation.", "minutes": 22, "blocks": [{"type": "text", "md": "Four people explain why they enjoy witty characters in stories. Press **🎧 Play audio**, then match speakers (i)–(iv) with statements. Two statements are extra. *(Original script.)*", "title": "Let us listen"}, {"type": "reveal", "prompt": "🎧 Four speakers (listen first)", "md": "Speaker one: I love witty characters because they take a tense moment and make it lighter. They never panic. They think fast and calm things down with a clever reply. Speaker two: For me, witty heroes show that a sharp mind
