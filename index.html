pired, proud and grateful**."}, {"type": "summary", "points": ["The National War Memorial honours 26,000+ fallen soldiers with tablets in four Chakras.", "The Param Vir Chakra is the highest wartime gallantry award; Albert Ekka and Padmapani Acharya are examples of bravery.", "Amar Jawan Jyoti, the immortal flame, symbolises the nation never forgetting.", "Soumya feels pride, sadness and motivation."]}], "minutes": 45, "terms": [{"term": "posthumously", "def": "after death"}, {"term": "gallantry", "def": "exceptional courage in battle"}], "source": {"chapter": "ch05", "sections": ["Before we read", "Let us read I", "Let us discuss"], "pages": "178–188"}, "id": "c7u5-01-homage-read", "chapter": "c7u5", "kind": "lesson"}, "c7u5-02-homage-reflect-learn": {"title": "A Homage: Letter II, Reflect and Learn", "summary": "Ananda's reply, extract questions, prefixes, words for brave, clauses.", "blocks": [{"type": "text", "title": "📖 Letter II: Ananda to Soumya (24 April, Chandigarh)", "md": "Ananda enjoyed Soumya's letter and says she has an **eye for detail** and captured the emotions of the memorial. Some see a war memorial as just a monument, an edifice to celebrate war heroes or victory, but to Ananda it is also an expression of **deep gratitude** for the supreme sacrifice of soldiers defending the **sovereignty and integrity** of the country. She feels motivated and is seriously thinking of joining the Armed Forces. She thinks it is our duty to periodically honour the valiant soldiers whose sacrifices let us walk freely without fear, and congratulates Soumya's class on the presentation idea.\n\nThe letter reminds her of a visit to Chandigarh's **Bougainvillea Garden in Sector 3**, where people were offering flowers and prayers at the war memorial in the heart of the garden. It reminded her of the poem **'Pushp ki Abhilasha'** (A Flower's Wish) by **Makhanlal Chaturvedi**, in which a flower says it does not want to be in a jewellery garland, a lover's necklace, an emperor's coffin or on the head of gods, but asks the gardener to pluck it and throw it on the path where many brave soldiers walk to offer their heads for the motherland.\n\nShe was inspired by the idea of presenting stories of soldiers. She read in a newspaper that **Captain Anuj Nayyar** (17 Jat) was posthumously awarded the **Maha Vir Chakra**, India's second highest gallantry award, for valour in Kargil 1999. His mother Meena Nayyar wrote a memoir, *Tiger of Drass*, and says writing about the smallest things about her son used to shake her, but she did it so that the world would know of Anuj's sacrifice. Ananda's friends want to visit the memorial; they found the mobile app **'National War Memorial and Museum'**, which answers queries in **21 languages**. She will share the idea of a **collage** of inspiring lives with her class. She collects stamps, a hobby called **philately**, and loves the beautiful stamps on Soumya's envelopes; the latest one celebrated India's independence. They had idlis for breakfast and remembered her. *Best wishes, Ananda*"}, {"type": "quiz", "id": "c7-ch05-quiz-homage-2", "title": "Let us discuss: letter II", "questions": [{"type": "single", "q": "Why was Ananda reminded of the poem 'Pushp ki Abhilasha'?", "options": ["Because people offered flowers at the war memorial in her city, like the flower in the poem wishes to be offered to the soldiers' path", "Because she likes gardens", "Because the poem is about stamps", "Because Soumya wrote a poem"], "answer": 0, "explanation": "The poem's flower wants to be thrown on the path of brave soldiers.", "hints": ["Flowers, prayers, soldiers."]}, {"type": "single", "q": "How does Soumya's letter help Ananda with her hobby?", "options": ["The stamps on Soumya's envelopes add to her collection and she learns the word philately", "She sells stamps", "She makes new stamps", "It doesn't"], "answer": 0, "explanation": "She gets a new stamp celebrating independence.", "hints": ["Hobby = philately."]}, {"type": "multi", "q": "Actions Ananda intends to take:", "options": ["visit the National War Memorial", "use the mobile app", "share the idea with her class", "create a collage", "join the Armed Forces", "go to Kargil"], "answer": [0, 1, 2, 3, 4], "explanation": "All except going to Kargil; the website link is also shared.", "hints": ["Check the end of her letter."]}]}, {"type": "quiz", "id": "c7-ch05-quiz-homage-ext1", "title": "Think and reflect: Extract 1 (the Amar Jawan Jyoti)", "questions": [{"type": "fill", "q": "flame : valour :: wreath : ______ (a word from the extract)", "answer": ["respect"], "explanation": "Wreaths are placed as a mark of respect.", "placeholder": "word", "hints": ["What do wreaths show?"]}, {"type": "single", "q": "It truly is a majestic site… is a ______.", "options": ["fact", "opinion"], "answer": 1, "explanation": "'Majestic' is a personal judgement.", "hints": ["Can it be proved?"]}, {"type": "single", "q": "What does the everlasting flame suggest?", "options": ["eternal stories of courage and valour; soldiers are never forgotten", "a fire hazard", "a lamp for tourists", "time"], "answer": 0, "explanation": "It is a metaphor for eternal courage.", "hints": ["Never burns out."]}, {"type": "single", "q": "The tone of the writer in this extract is ______.", "options": ["modest", "light-hearted", "admiring", "nostalgic"], "answer": 2, "explanation": "She is awed and proud.", "hints": ["She admires the site."]}]}, {"type": "quiz", "id": "c7-ch05-quiz-homage-ext2", "title": "Extract 2: 'Some people might see a war memorial as just a monument…'", "questions": [{"type": "fill", "q": "A line showing Ananda knew about the memorial:", "answer": ["i have heard a lot about it"], "explanation": "'I have heard a lot about it.'", "placeholder": "line", "hints": ["Her first sentences."]}, {"type": "fill", "q": "We conduct special competitions at school to ______ our Independence day.", "answer": ["commemorate"], "explanation": "Commemorate = remember officially.", "placeholder": "word", "hints": ["Same word as in the text."]}, {"type": "fill", "q": "A phrase showing she is expressing an opinion:", "answer": ["in my view"], "explanation": "'In my view…'", "placeholder": "phrase", "hints": ["Opinion marker."]}, {"type": "single", "q": "Ananda calls the sacrifice 'supreme' because ______.", "options": ["soldiers give their lives, the highest sacrifice one can make", "they get medals", "it is expensive", "they travel"], "answer": 0, "explanation": "Giving one's life is the ultimate sacrifice.", "hints": ["Highest."]}, {"type": "single", "q": "People may consider a war memorial just a monument because ______.", "options": ["from outside it looks like a statue or building", "it is old", "it is cheap", "it is closed"], "answer": 0, "explanation": "It is an impressive structure.", "hints": ["Appearance."]}]}, {"type": "reveal", "prompt": "Long answers: models", "md": "1. **Significance:** it honours the fallen, makes us remember the cost of freedom, and inspires patriotism.\n2. **Albert Ekka:** he ignored his own safety, silenced two machine-gun posts despite serious wounds, and died after saving his company: selfless, determined and brave.\n3. **The app:** it gives information in 21 languages, with murals and stories, spreading awareness to people who cannot visit.\n4. **Duty to pay homage:** because they sacrifice their lives so that we live safely and freely.\n5. **Main idea:** gratitude to soldiers; the title 'A Homage' fits since the letters pay tribute to them.\n6. **Awestruck and humbled:** they were amazed by Ekka's courage and felt small in comparison to such sacrifice."}, {"type": "text", "md": "**Let us learn: prefixes.** Disregard, inconsequential, immortal and undaunted are made by adding **prefixes** (word beginnings) dis-, in-, im-, un- to regard, consequential, mortal, daunted. Match the prefixes: **re-** do again; **mal-** badly, wrongly; **un-** lacking, not; **anti-** opposed to, against; **extra-** beyond, outside; **ex-** former; **de-** remove.", "title": "Prefixes"}, {"type": "table", "headers": ["Prefix", "Meaning", "Root", "New word"], "rows": [["re-", "do again", "define", "redefine"], ["mal-", "badly, wrongly", "functioning", "malfunctioning"], ["un-", "lacking, not", "questionable", "unquestionable"], ["anti-", "opposed to, against", "social", "antisocial"], ["extra-", "beyond, outside", "ordinary", "extraordinary"], ["ex-", "former", "service", "ex-service"], ["de-", "remove", "activate", "deactivate"]]}, {"type": "quiz", "id": "c7-ch05-quiz-prefix", "title": "Complete the paragraph", "questions": [{"type": "fill", "q": "They learn to ______ explosives.", "answer": ["deactivate"], "explanation": "de + activate", "placeholder": "word", "hints": ["Remove the activity."]}, {"type": "fill", "q": "…and handle ______ equipment with precision.", "answer": ["malfunctioning"], "explanation": "mal + functioning", "placeholder": "word", "hints": ["Badly working."]}, {"type": "fill", "q": "They stand against ______ elements.", "answer": ["antisocial", "anti-social"], "explanation": "anti + social", "placeholder": "word", "hints": ["Against society."]}, {"type": "fill", "q": "…displaying ______ bravery.", "answer": ["unquestionable"], "explanation": "un + questionable", "placeholder": "word", "hints": ["Not to be questioned."]}, {"type": "fill", "q": "______ members often share their experiences.", "answer": ["ex-service", "ex service", "exservice"], "explanation": "ex + service", "placeholder": "word", "hints": ["Former service."]}, {"type": "fill", "q": "Their service can continually ______ the essence of commitment.", "answer": ["redefine"], "explanation": "re + define", "placeholder": "word", "hints": ["Define again."]}]}, {"type": "text", "md": "**II. Words for brave** (fill the missing vowels): V_L__NT → **valiant**; C__R_G__S → **courageous**; V_L__R → **valour**; G_LL_NT → **gallant**; H_R__C → **heroic**; F__RL_SS → **fearless**; B_LD → **bold**; _ND__NT_D → **undaunted**; D_R_NG → **daring**.\n\n**III. Opposites of brave:** cowardly, timid, fear, afraid."}, {"type": "quiz", "id": "c7-ch05-quiz-brave-opp", "title": "Fill the opposites", "questions": [{"type": "single", "q": "Ajay's ______ refusal to stand up for his friend was disappointing.", "options": ["cowardly", "timid", "fear", "afraid"], "answer": 0, "explanation": "Adjective for an act.", "hints": ["Not brave."]}, {"type": "single", "q": "The ______ child hid behind his mother.", "options": ["timid", "cowardly", "fear", "afraid"], "answer": 0, "explanation": "Shy and nervous.", "hints": ["Too scared to meet teacher."]}, {"type": "single", "q": "Anjali's ______ of heights prevented her from climbing.", "options": ["fear", "timid", "cowardly", "afraid"], "answer": 0, "explanation": "A noun is needed.", "hints": ["'of heights'."]}, {"type": "single", "q": "Sushma felt ______ as she entered the dark building alone.", "options": ["afraid", "fear", "cowardly", "timid"], "answer": 0, "explanation": "After 'felt': adjective.", "hints": ["Feeling."]}]}, {"type": "text", "md": "**IV. Main and subordinate clauses.** A **main clause** gives complete meaning and is independent; a **subordinate clause** depends on the main clause. Connecting words such as **when, because, though, so that, unless, where** are **subordinating conjunctions**: they show time, reason, contrast or purpose. Example: *I aspire to be courageous like him* (main) | *when I join the army!* (subordinate)."}, {"type": "quiz", "id": "c7-ch05-quiz-clause", "title": "V. Combine with the right conjunction", "questions": [{"type": "fill", "q": "Wasi burst into tears. He heard the good news. (when)", "answer": ["wasi burst into tears when he heard the good news"], "explanation": "Time: when.", "placeholder": "sentence", "hints": ["Combine with 'when'."]}, {"type": "fill", "q": "Himani was very nervous. She delivered a great presentation. (though)", "answer": ["himani was very nervous though she delivered a great presentation", "though she was very nervous, himani delivered a great presentation", "himani delivered a great presentation though she was very nervous"], "explanation": "Contrast: though.", "placeholder": "sentence", "hints": ["Combine with 'though'."]}, {"type": "fill", "q": "This is the place. I was born. (where)", "answer": ["this is the place where i was born"], "explanation": "Place: where.", "placeholder": "sentence", "hints": ["Combine with 'where'."]}, {"type": "fill", "q": "The students performed very well. They studied diligently. (because)", "answer": ["the students performed very well because they studied diligently"], "explanation": "Reason: because.", "placeholder": "sentence", "hints": ["Combine with 'because'."]}, {"type": "fill", "q": "Water the plants. They will die. (unless)", "answer": ["water the plants unless they will die", "unless you water the plants, they will die", "they will die unless you water the plants"], "explanation": "Condition: unless you water the plants, they will die.", "placeholder": "sentence", "hints": ["Combine with 'unless'."]}]}, {"type": "exercise", "id": "c7-ch05-ex-clauses", "title": "Finish the sentences", "difficulty": "easy", "minutes": 8, "goal": "Complete five of the sentences from the book with your own clauses.", "behavior": "e.g. Farheen was late to work because…; The dog started barking when…; She completed the marathon although…; We waited in the car until…; Abhishek received a promotion after…", "hints": ["Because gives a reason.", "Although gives contrast.", "Until gives a time limit."], "checklist": ["Each sentence has a main and a subordinate clause", "The conjunction makes sense", "Grammar correct"], "solution": "Farheen was late to work because her bus broke down. The dog started barking when the postman arrived. She completed the marathon although her knee hurt. We waited in the car until the rain stopped. Abhishek received a promotion after he completed the project.", "solution_lang": "text", "solution_explain": "Each completion must fit the conjunction's meaning.", "mode": "selfcheck"}, {"type": "summary", "points": ["Letter II shows gratitude, the poem 'Pushp ki Abhilasha' and a mobile app about the memorial.", "Prefixes (re-, mal-, un-, anti-, extra-, ex-, de-) change meaning.", "Valiant, courageous, gallant, heroic, fearless and bold describe bravery.", "Subordinating conjunctions join a main and a subordinate clause."]}], "minutes": 45, "terms": [{"term": "prefix", "def": "a word beginning that changes meaning"}, {"term": "subordinating conjunction", "def": "a word like when, because, though that joins a dependent clause"}], "source": {"chapter": "ch05", "sections": ["Letter II", "Let us discuss", "Let us think and reflect", "Let us learn I–VI"], "pages": "188–196"}, "id": "c7u5-02-homage-reflect-learn", "chapter": "c7u5", "kind": "lesson"}, "c7u5-03-homage-skills": {"title": "A Homage: Listen, Speak, Write, Explore", "summary": "Gunjan's speech, talking about professions, a letter on peacetime service, and mottos.", "blocks": [{"type": "callout", "kind": "note", "title": "🎧 Listening: why I want to join the Armed Forces", "md": "**Gunjan:** Good morning, respected teachers and my dear friends. Today I, Gunjan of Grade 7-C, stand before you to share why I dream of joining the Indian Armed Forces when I grow up.\n\nServing our country is the most honourable job one can have. It means protecting and securing our nation, even if it means risking one's life. The thought of wearing the uniform, which can only be earned through hard work, fills me with pride and a strong desire to serve India.\n\nThe Armed Forces teach you to live a disciplined and organised life. This keeps both the mind and body active. Soldiers are always ready to face challenges because of this discipline. Additionally, regular exercise and training keep soldiers physically fit and ready for any situation.\n\nLastly, being a soldier means having new experiences and adventures every day. Each day brings new challenges, teaching important lessons and helping one grow. The Armed Forces offer a life filled with honour, self-respect, safety and security for both the soldier and their families. It is a life that teaches loyalty, duty, service and honesty. This is why I want to join the Indian Armed Forces. Thank you."}, {"type": "quiz", "id": "c7-ch05-quiz-gunjan", "title": "Answer in two or three exact words", "questions": [{"type": "fill", "q": "What type of job does Gunjan think the Armed Forces is?", "answer": ["most honourable job", "the most honourable job", "honourable"], "explanation": "The most honourable job.", "placeholder": "words", "hints": ["Her opening."]}, {"type": "fill", "q": "What feature fills Gunjan with pride?", "answer": ["wearing the uniform", "the uniform", "uniform"], "explanation": "The thought of wearing the uniform.", "placeholder": "words", "hints": ["Earned through hard work."]}, {"type": "fill", "q": "How does the disciplined life affect the body and mind?", "answer": ["keeps both active", "active", "mind and body active"], "explanation": "It keeps both the mind and body active.", "placeholder": "words", "hints": ["Discipline."]}, {"type": "fill", "q": "One aspect that helps someone grow:", "answer": ["new experiences", "new challenges", "adventures"], "explanation": "New experiences and adventures; each day brings new challenges.", "placeholder": "words", "hints": ["Lastly…"]}, {"type": "multi", "q": "Two things life in the Armed Forces teaches:", "options": ["loyalty", "duty", "laziness", "fame"], "answer": [0, 1], "explanation": "Loyalty, duty, service and honesty.", "hints": ["Final lines."]}]}, {"type": "text", "md": "**Let us speak.** Work in pairs: identify the professions in the picture (soldier, doctor, teacher, farmer, scientist, pilot, etc.). Say which you wish to pursue, why, and what preparation you need. Prompts: *I would like to become… because… For this I would have to first… / I dream of working as a… as… This would involve… / To become a… has been a childhood dream. This is so because… In order to become a… I would have to… / One day, I hope to become… Then I would be able to… However, first I would need to… / It would be great if I could work as… as it would let me… For this I would have to…*", "title": "Let us speak"}, {"type": "text", "md": "**Let us write.** The Armed Forces also serve in **peace time**. Write a letter to your friend about how they contribute during **natural calamities** (floods, earthquakes), **infrastructure development** (building bridges in remote areas) and **welfare initiatives** (medical camps, libraries).", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch05-ex-peace-letter", "title": "Letter on the Armed Forces in peace time", "difficulty": "medium", "minutes": 15, "goal": "Write a letter (10–12 lines) to a friend.", "behavior": "Cover calamities, infrastructure and welfare, with address, date, greeting and close.", "hints": ["Mention floods and earthquakes.", "Mention bridges and roads in remote areas.", "Mention medical camps."], "checklist": ["Address and date", "Greeting", "Calamities", "Infrastructure", "Welfare", "Closing"], "solution": "Dear Ravi,\nDid you know soldiers also serve in peace time? During floods and earthquakes they rescue people and give food and shelter. They build bridges and roads in remote areas. They organise medical camps and set up libraries in border villages. I am proud of them.\nYours,\nAnu", "solution_lang": "text", "solution_explain": "A strong letter has all three kinds of service with examples.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. Every branch has a motto: **Indian Army** *Sevā Paramo Dharmaḥ* (Service Before Self); **Indian Air Force** *Nabhaḥ Spr̥śaṁ Dīptam* (Touch the Sky with Glory); **Indian Navy** *Sham No Varunah* (Be Auspicious Unto Us, Oh Varuna). II. Find out about other Forces such as the **CRPF**. III. In groups of four make a **collage** about a person who inspires you. IV. Discuss women in the Armed Forces with examples."}, {"type": "quiz", "id": "c7-ch05-quiz-motto", "title": "Mottos", "questions": [{"type": "single", "q": "'Service Before Self' is the motto of the ______.", "options": ["Indian Army", "Indian Navy", "Indian Air Force", "CRPF"], "answer": 0, "explanation": "Sevā Paramo Dharmaḥ.", "hints": ["Land forces."]}, {"type": "single", "q": "'Touch the Sky with Glory' is the motto of the ______.", "options": ["Indian Air Force", "Indian Army", "Indian Navy", "Border Security Force"], "answer": 0, "explanation": "Nabhaḥ Spr̥śaṁ Dīptam.", "hints": ["Sky."]}, {"type": "single", "q": "'Sham No Varunah' belongs to the ______.", "options": ["Indian Navy", "Indian Army", "Indian Air Force", "CRPF"], "answer": 0, "explanation": "Varuna is the god of the sea.", "hints": ["Sea."]}]}, {"type": "summary", "points": ["Gunjan wants to join the Forces for honour, discipline and adventure.", "Use the prompts to speak about your dream career.", "The Armed Forces help in calamities, infrastructure and welfare in peace time.", "Each branch has a Sanskrit motto."]}], "minutes": 40, "terms": [{"term": "motto", "def": "a short phrase that states a group's ideals"}], "source": {"chapter": "ch05", "sections": ["Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "196–198, 223"}, "id": "c7u5-03-homage-skills", "chapter": "c7u5", "kind": "lesson"}, "c7u5-04-soldiers-poem": {"title": "My Dear Soldiers: Read, Discuss and Reflect", "summary": "A tribute poem by Dr. A.P.J. Abdul Kalam.", "blocks": [{"type": "text", "md": "**Before you read.** I. Look around: who contributes selflessly to your life with a risk to their own life (soldiers, firefighters, doctors, police, sanitation workers)? II. In pairs, discuss three questions you would like to ask them."}, {"type": "callout", "kind": "tip", "md": "I cannot print the poem; read it on p. 200 of your book. Retold below. Note: 'great sons' means **all soldiers, men and women**.", "title": "Reading plan"}, {"type": "text", "title": "📖 My Dear Soldiers (retold)", "md": "The poet addresses the **defenders of borders**, great sons of the land. While everyone sleeps they still hold on to their duty. Whether it is the windy season, snowy days or scorching sun with sweltering rays, they are there, guarding and awake, treading lonely expanses like yogis. They climb heights and stride valleys, defend deserts and guard marshes, keep watch in the seas and secure the air. They have given the **prime of their youth** to the nation. The wind chimes of the land vibrate in praise of their feat, and the poet prays for these brave men and asks that the Lord bless them all."}, {"type": "quiz", "id": "c7-ch05-quiz-soldiers-sum", "title": "Complete the summary", "questions": [{"type": "fill", "q": "The poem is a tribute to the soldiers of the ______ (example given) who defend the ______ of their country.", "answer": ["borders"], "explanation": "borders", "placeholder": "word", "hints": ["Defenders of…"]}, {"type": "fill", "q": "The soldiers remain vigilant whether it's windy, snowy or ______ hot.", "answer": ["scorching"], "explanation": "scorching", "placeholder": "word", "hints": ["Sun's…"]}, {"type": "fill", "q": "They walk on ______ stretches of land like the yogis.", "answer": ["lonely expanses", "lonely"], "explanation": "lonely expanses", "placeholder": "words", "hints": ["Treading…"]}, {"type": "fill", "q": "Their duty takes them to mountains, valleys, ______ and marshes.", "answer": ["deserts"], "explanation": "deserts", "placeholder": "word", "hints": ["Defending the…"]}, {"type": "fill", "q": "They gave a major part of their ______ to protect the nation.", "answer": ["youth"], "explanation": "youth (prime of your youth)", "placeholder": "word", "hints": ["Prime of…"]}, {"type": "fill", "q": "The wind chimes show respect to the soldiers' ______.", "answer": ["feat"], "explanation": "feat", "placeholder": "word", "hints": ["Vibrate your…"]}, {"type": "single", "q": "The theme of the poem is ______.", "options": ["patriotism and sacrifice", "heroism and awareness", "nature and hardship", "seasons and terrains"], "answer": 0, "explanation": "It honours soldiers' sacrifice for the country.", "hints": ["Love of nation."]}, {"type": "single", "q": "The tone is ______ (choose the best combination).", "options": ["admiring, respectful, grateful and prayerful", "only sad", "only prayerful", "sad, respectful and prayerful"], "answer": 0, "explanation": "The poet admires, respects, thanks and prays for the soldiers.", "hints": ["Four tones."]}]}, {"type": "reveal", "prompt": "III. Why the poetic devices? (models)", "md": "1. **Imagery** (windy season, snowy days, scorching sun) helps us picture the harsh conditions.\n2. **Simile:** the soldiers are likened to **yogis** (calm, focused, enduring).\n3. **Metaphor:** the **wind chimes** of the land stand for the nation's respect and gratitude.\n4. **Repetition of 'you' and 'we':** it separates the soldiers from the citizens and shows the bond between the two.\n5. **Alliteration** such as 'season or snowy' and 'sun's sweltering' creates rhythm and musical effect."}, {"type": "quiz", "id": "c7-ch05-quiz-soldiers-ext", "title": "Think and reflect", "questions": [{"type": "multi", "q": "An opposite pair in the extract:", "options": ["asleep / awake", "windy / snowy", "lonely / guarding"], "answer": [0], "explanation": "'Asleep' and 'awake' are opposites.", "hints": ["Sleep and wake."]}, {"type": "single", "q": "'Still hold on to your deed' refers to the soldiers' attitude of ______.", "options": ["steadfast commitment to duty", "laziness", "anger", "pride only"], "answer": 0, "explanation": "They keep doing their duty.", "hints": ["Hold on."]}, {"type": "truefalse", "q": "The soldiers walk across the deserted stretches of land.", "answer": true, "explanation": "'Treading the lonely expanses'.", "hints": ["Lonely."]}, {"type": "fill", "q": "Evidence of harsh weather:", "answer": ["scorching sun's sweltering rays", "windy season or snowy days", "windy season", "snowy days"], "explanation": "The poet names wind, snow and burning heat.", "placeholder": "phrase", "hints": ["Season words."]}, {"type": "single", "q": "The quality highlighted is ______.", "options": ["modesty", "optimism", "simplicity", "dedication"], "answer": 3, "explanation": "Guarding day and night: dedication.", "hints": ["Awake while we sleep."]}]}, {"type": "reveal", "prompt": "Long answers: models", "md": "1. **Speaker:** a citizen (the poet) who says 'we' and 'my land' and prays for the soldiers.\n2. **Imagery:** windy season, snowy days, scorching sun, deserts and marshes show the hardships.\n3. **Commitment:** they stay awake when we sleep, guard in all seasons and terrains.\n4. **'Prime of your youth':** they give the best years of their life for the nation: the greatest sacrifice.\n5. **Prayer:** because we are safe due to them; prayer is gratitude and shows we care."}, {"type": "summary", "points": ["The poem salutes soldiers who guard borders in every season and terrain.", "Devices: imagery, simile (yogis), metaphor (wind chimes), repetition, alliteration.", "Theme: patriotism and sacrifice; tone: admiring, respectful, grateful, prayerful.", "The poet ends with a prayer for their well-being."]}], "minutes": 30, "terms": [{"term": "tribute", "def": "an act of respect"}, {"term": "vigilant", "def": "watchful"}], "source": {"chapter": "ch05", "sections": ["Before we read", "Let us read", "Let us discuss", "Let us think and reflect"], "pages": "199–202"}, "id": "c7u5-04-soldiers-poem", "chapter": "c7u5", "kind": "lesson"}, "c7u5-05-soldiers-skills": {"title": "My Dear Soldiers: Learn, Listen, Speak, Write, Explore", "summary": "Terrains, collocations, A Soldier's Pride, recitation, an acrostic and a badge of honour.", "blocks": [{"type": "quiz", "id": "c7-ch05-quiz-terrain", "title": "Terrains (physical features of land)", "questions": [{"type": "multi", "q": "Which are terrains? (two words are not needed)", "options": ["ghats", "river", "plateau", "delta", "bay", "peninsula", "mountains"], "answer": [0, 2, 3, 5, 6], "explanation": "River and bay are water bodies; the rest are land features.", "hints": ["Land features only."]}]}, {"type": "text", "md": "**Collocations** are word pairs that frequently come together: *scorching sun, climbing the heights, treading the lonely expanses.*"}, {"type": "quiz", "id": "c7-ch05-quiz-colloc", "title": "Choose the word that collocates", "questions": [{"type": "single", "q": "The hikers reached the ______ of the mountain.", "options": ["summit", "peak"], "answer": 0, "explanation": "'Reached the summit' is the usual collocation.", "hints": ["Top."]}, {"type": "single", "q": "The ______ landscape of the desert made it nearly impossible to find water.", "options": ["empty", "barren"], "answer": 1, "explanation": "Barren landscape.", "hints": ["Dry land."]}, {"type": "single", "q": "In the rainforest, the ______ forest provides a habitat for wildlife.", "options": ["heavy", "dense"], "answer": 1, "explanation": "Dense forest.", "hints": ["Thick."]}, {"type": "single", "q": "Chitra is a very ______ person and enjoys mountain climbing.", "options": ["heroic", "adventurous"], "answer": 1, "explanation": "Adventurous person.", "hints": ["Likes adventure."]}, {"type": "single", "q": "I'll try to get back in time, but I'm not ______ any promises.", "options": ["doing", "making"], "answer": 1, "explanation": "Make promises.", "hints": ["Promises are made."]}]}, {"type": "callout", "kind": "note", "title": "🎧 Listening: A Soldier's Pride (complete the poem)", "md": "**Reader:** In fields so vast, our soldiers stand, with hearts so brave and firm command. They guard our land both night and day, to keep our fears and foes at bay. With every dawn and setting sun, their duty calls, it must be done. Through stormy skies and blazing heat, they march along with steady feet. For love of land, they fight and strive, to keep our hopes and dreams alive. With pride and honour, they defend our India till the very end."}, {"type": "callout", "kind": "note", "md": "The book's poem *A Soldier's Pride* is a simple practice rhyme read by the teacher; your task is to guess the missing rhyming words, then listen and check. The words are: command, day, sun, stormy, march, fight, dreams, end.", "title": "Answers"}, {"type": "quiz", "id": "c7-ch05-quiz-pride", "title": "Complete the poem", "questions": [{"type": "fill", "q": "With hearts so brave, and firm ______", "answer": ["command"], "explanation": "command (rhymes with stand)", "placeholder": "word", "hints": ["Rhyme."]}, {"type": "fill", "q": "They guard our land both night and ______", "answer": ["day"], "explanation": "day (rhymes with bay)", "placeholder": "word", "hints": ["Opposite of night."]}, {"type": "fill", "q": "With every dawn and setting ______", "answer": ["sun"], "explanation": "sun (rhymes with done)", "placeholder": "word", "hints": ["Dawn and…"]}, {"type": "fill", "q": "Through ______ skies and blazing heat", "answer": ["stormy"], "explanation": "stormy", "placeholder": "word", "hints": ["Weather."]}, {"type": "fill", "q": "They ______ along with steady feet", "answer": ["march"], "explanation": "march", "placeholder": "word", "hints": ["Soldiers' walk."]}, {"type": "fill", "q": "For love of land, they ______ and strive", "answer": ["fight"], "explanation": "fight (rhymes with might/light)", "placeholder": "word", "hints": ["They defend."]}, {"type": "fill", "q": "To keep our hopes and ______ alive", "answer": ["dreams"], "explanation": "dreams", "placeholder": "word", "hints": ["Hopes and…"]}, {"type": "fill", "q": "Our beloved India, till the very ______", "answer": ["end"], "explanation": "end (rhymes with defend)", "placeholder": "word", "hints": ["Final word."]}]}, {"type": "text", "md": "**Let us speak: reciting 'My Dear Soldiers'.** Practise in pairs, pausing briefly at the slashes: *Oh! Defenders / of borders / You are great sons / of my land…* Count 1-2-3 silently before reciting, then recite in groups of 8–10. **Remember:** use volume to add emotion (softer for tenderness and solemnity, louder for strength and pride); keep a steady pace; use facial expressions; stand tall with confident posture.", "title": "Let us speak"}, {"type": "text", "md": "**Let us write I: an acrostic poem.** In an acrostic, the first letters of each line spell a word when read vertically. Example from the book spells **PATRIOT** (*Proud of motherland / Always alert I stand / Time, my concern never / Respect to her, forever / In worse times or better / Our love has no end / To me, my country is my friend*). Compose your own acrostic on **SOLDIER**.\n\n**II.** Draft a **note of gratitude** to soldiers (50 words), beginning: *Dear Bravehearts, I would like to…*", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch05-ex-acrostic", "title": "Acrostic: SOLDIER", "difficulty": "easy", "minutes": 10, "goal": "Write an acrostic poem on SOLDIER (7 lines).", "behavior": "Each line must begin with the next letter: S, O, L, D, I, E, R.", "hints": ["Think of words like Strong, Over borders, Loyal, Duty, India, Eternal, Ready.", "Keep lines short."], "checklist": ["Seven lines", "First letters spell SOLDIER", "Lines related to bravery"], "solution": "Strong at every border,\nOver mountains, through the snow,\nLoyal to the nation,\nDuty first wherever they go,\nIndia is in their heart,\nEver watchful, day and night,\nReady to protect our light.", "solution_lang": "text", "solution_explain": "The first letters must spell SOLDIER.", "mode": "selfcheck"}, {"type": "exercise", "id": "c7-ch05-ex-gratitude", "title": "A 50-word gratitude note", "difficulty": "easy", "minutes": 6, "goal": "Write a note of 50 words thanking soldiers.", "behavior": "Begin with 'Dear Bravehearts, I would like to…'.", "hints": ["Mention courage and sacrifice.", "End with 'Jai Hind'."], "checklist": ["About 50 words", "Begins as asked", "Names two qualities", "Says thank you"], "solution": "Dear Bravehearts, I would like to thank you for guarding our borders day and night. Your courage and sacrifice let us sleep in peace. When it is cold or burning hot, you stand firm for us. We are proud of you and promise to be good citizens. Jai Hind!", "solution_lang": "text", "solution_explain": "A good note is short, warm and specific.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** I. Design a **badge of honour** for soldiers by hand or digitally, with a self-designed logo and slogan. II. Find a poem or story in your mother tongue about the bravery and sacrifice of soldiers and present it in class."}, {"type": "summary", "points": ["Ghats, plateau, delta, peninsula and mountains are land terrains; river and bay are not.", "Collocations: summit, barren, dense, adventurous, make a promise.", "Recite with pauses, steady pace and emotion.", "An acrostic spells a word with the first letters of its lines."]}], "minutes": 40, "terms": [{"term": "collocation", "def": "a pair of words that often go together"}, {"term": "acrostic", "def": "a poem whose first letters spell a word"}], "source": {"chapter": "ch05", "sections": ["Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "202–205, 224"}, "id": "c7u5-05-soldiers-skills", "chapter": "c7u5", "kind": "lesson"}, "c7u5-06-abbakka-read": {"title": "Rani Abbakka: Read and Discuss", "summary": "A comic-strip story of the warrior queen of Ullal.", "blocks": [{"type": "text", "md": "**Before you read.** I. Solve the riddle: *She was a queen who led the fight, she fought for her country and her right. With a shining sword in her hand, her son on her back in a cloth band… Who is she?* (**Rani Abbakka**). II. Think of other women warriors in India's struggle for Independence and share."}, {"type": "callout", "kind": "tip", "md": "This selection is a **comic strip** (pp. 207–212). The retelling below follows the pictures and speech balloons in order.", "title": "Reading plan"}, {"type": "flashcards", "id": "c7-ch05-cards-abbakka", "title": "Words to learn", "cards": [{"front": "vassal", "back": "a country controlled by a more powerful country that pays money when needed"}, {"front": "coronation", "back": "a ceremony at which a person is made king or queen"}, {"front": "successor", "back": "a person who succeeds another"}, {"front": "rash", "back": "acting without thinking about the consequences"}, {"front": "sovereign country", "back": "a country with complete authority over itself"}, {"front": "league", "back": "an association or partnership"}, {"front": "wrath", "back": "extreme anger"}, {"front": "seize", "back": "take hold of suddenly or forcibly"}, {"front": "resolve", "back": "determination"}, {"front": "raged", "back": "happened in a violent way"}, {"front": "decisive", "back": "able to make decisions effectively"}, {"front": "apprehended", "back": "captured"}, {"front": "dauntless", "back": "fearless"}, {"front": "avenge", "back": "take revenge for"}]}, {"type": "text", "title": "📖 The story of Rani Abbakka", "md": "**Ullal had been captured by the Portuguese**, and the old queen lies helpless, mourning. Her successor **Abbakka** says, \"Hush, Mother, you must not tire yourself. I am here, and I will not rest till I have driven them out of the west coast! I need your wholehearted cooperation to make Ullal stronger, secure, free.\"\n\nAbbakka announces that she will **stop paying tribute** to the Portuguese and **will not sell them spices**. Her husband, **Veera Narsimha** of Bangadi, thinks it is a rash decision and a dangerous one for him, because the Portuguese might think he is in league with her and Bangadi may face their wrath. He decides to make her change her mind. Abbakka says, \"You may be afraid of the Portuguese, but I refuse to be cowed by them.\" He orders his soldiers to seize her, but **such was the spell cast by the brave queen** that not a soldier stirred; they chose to follow their brave leader.\n\nAbbakka addresses a **meeting of rajas** and says if they unite and fight, they can drive the Portuguese out. The rajas think it is impossible and advise her not to provoke the Portuguese, fearing their wrath. Their reactions only strengthen her resolve: she will **fight them alone, single-handed if need be**.\n\nNext day a **Portuguese envoy** reminds her that the annual tribute from Ullal is long overdue. She replies: \"We are a **sovereign country**. We don't pay tribute to Portugal and we don't take orders from the Portuguese!\" Abbakka orders **merchant ships** to be built and, in alliance with the **Zamorin of Kozhikode**, defies the Portuguese and establishes a hugely profitable trade with Arabia. The merchants say to the Arabians, \"Visit us again, brother.\"\n\nOn their return the ships are **apprehended by the Portuguese navy**. They fight bravely and all return except Abbakka's commander's ship, which angers the queen deeply. The sailors say the commander kept the Portuguese busy while they escaped, and his ship must have been captured. The Portuguese reply by attacking: cannons boom from across the river as Abbakka watches. She says, \"So the Portuguese have replied! Mother, bless me. The time to **avenge your defeat** has come!\" She unleashes her forces and they **attack the Portuguese fort**; the commander **Ribero escapes with his life**.\n\nWhen Ribero brings the news of the fall of Fort Mangalore, the Portuguese Governor of Goa reacts sharply: \"What! A mere woman defeating the mighty Portuguese?\" Ribero says he will get help from Goa. The dauntless Abbakka addresses her men: \"My brave soldiers, this shall be the **decisive war**; let us fight with all our might and defeat the Portuguese once and for all.\" The Portuguese rally their forces and attack Ullal; **for four days the battle rages**, but the forces of Ullal prove enough. The Portuguese beat a hasty retreat, **never to trouble Ullal again**. Abbakka's dream has come true: **Ullal is free!**\n\nLater, Abbakka helps **Venkatappa Nayak, king of Keladi**, to take the fort of Mangalore, and the Portuguese are eventually driven completely out of Mangalore by **Shivappa Nayak**, the greatest of the Keladi kings."}, {"type": "quiz", "id": "c7-ch05-quiz-abbakka-words", "title": "Let us discuss I: match the words", "questions": [{"type": "single", "q": "vassal", "options": ["a country controlled by a more powerful country that pays money when needed", "extreme anger", "fearless", "a ceremony to crown a king"], "answer": 0, "explanation": "Ullal had to pay tribute.", "hints": ["Controlled and pays."]}, {"type": "single", "q": "coronation", "options": ["a ceremony at which a person is made king or queen", "capture", "revenge", "partnership"], "answer": 0, "explanation": "Crown ceremony.", "hints": ["Crown."]}, {"type": "single", "q": "successor", "options": ["a person who succeeds another", "determination", "fearless", "a violent event"], "answer": 0, "explanation": "One who follows.", "hints": ["Abbakka succeeded the old queen."]}, {"type": "single", "q": "rash", "options": ["acting without thinking about the consequences", "fearless", "capture", "partnership"], "answer": 0, "explanation": "Veera Narsimha called her decision rash.", "hints": ["Hasty."]}, {"type": "single", "q": "sovereign country", "options": ["a country with a government having complete authority", "a vassal state", "an alliance", "a fort"], "answer": 0, "explanation": "Self-governing.", "hints": ["Abbakka's claim."]}, {"type": "single", "q": "league", "options": ["association or partnership", "revenge", "capture", "a king"], "answer": 0, "explanation": "'In league with her'.", "hints": ["Alliance."]}, {"type": "single", "q": "wrath", "options": ["extreme anger", "fearless", "determination", "capture"], "answer": 0, "explanation": "Wrath = rage.", "hints": ["Portuguese anger."]}, {"type": "single", "q": "seize", "options": ["take hold of suddenly or forcibly", "fearless", "a ceremony", "extreme anger"], "answer": 0, "explanation": "'Seize her!'", "hints": ["Grab."]}, {"type": "single", "q": "resolve", "options": ["determination", "revenge", "capture", "partnership"], "answer": 0, "explanation": "Her resolve was strengthened.", "hints": ["Strong will."]}, {"type": "single", "q": "raged (the battle raged)", "options": ["happened in a violent way", "stopped", "was quiet", "was planned"], "answer": 0, "explanation": "A fierce battle.", "hints": ["Violent."]}, {"type": "single", "q": "decisive", "options": ["showing the ability to make decisions effectively", "fearless", "capture", "rash"], "answer": 0, "explanation": "The decisive war settles it.", "hints": ["Final."]}, {"type": "single", "q": "apprehended", "options": ["captured", "freed", "hid", "praised"], "answer": 0, "explanation": "The ships were captured.", "hints": ["Caught."]}, {"type": "single", "q": "dauntless", "options": ["fearless", "timid", "angry", "rash"], "answer": 0, "explanation": "The dauntless Abbakka.", "hints": ["Cannot be daunted."]}, {"type": "single", "q": "avenge", "options": ["take revenge for", "forgive", "build", "pay"], "answer": 0, "explanation": "Avenge your defeat.", "hints": ["Revenge."]}]}, {"type": "table", "headers": ["Cause", "Effect"], "rows": [["Ullal had been captured by the Portuguese.", "Ullal had to pay a tribute to the colonial power."], ["Abbakka decided to stop paying tribute and selling spices.", "Her husband Veera Narsimha felt it was a hasty decision."], ["Abbakka said she would not be frightened by the Portuguese.", "Veera Narsimha ordered his soldiers to stop her."], ["Abbakka addressed a meeting of rajas.", "They felt they would be no match for the Portuguese army and power."], ["The Portuguese attacked with cannons (after capturing her commander's ship).", "Abbakka in turn attacked the Portuguese fort."]]}, {"type": "quiz", "id": "c7-ch05-quiz-abbakka-ext", "title": "Think and reflect", "questions": [{"type": "single", "q": "'Tribute' in this context means ______.", "options": ["money regularly paid by a weaker ruler to a stronger one", "a gift", "a monument", "praise"], "answer": 0, "explanation": "Annual payment to the Portuguese.", "hints": ["Ullal's payment."]}, {"type": "fill", "q": "Rani Abbakka says 'We are a sovereign country' because ______.", "answer": ["ullal is independent", "they have complete authority over themselves", "they are not ruled by portugal"], "explanation": "Ullal governs itself and owes nothing to Portugal.", "placeholder": "reason", "hints": ["Her argument."]}, {"type": "truefalse", "q": "The Portuguese envoy threatened Rani Abbakka.", "answer": true, "explanation": "He said, 'You will regret your stand.'", "hints": ["His last line."]}, {"type": "single", "q": "'She defied the Portuguese': replace 'defied' with ______.", "options": ["defeated", "disobeyed"], "answer": 1, "explanation": "Defy = openly disobey.", "hints": ["She refused orders."]}, {"type": "single", "q": "Qualities of Rani Abbakka in the extract:", "options": ["bold, capable and determined", "thoughtful, generous and determined", "bold, thoughtful and determined", "thoughtful, capable and generous"], "answer": 0, "explanation": "She is bold, capable (builds ships, trade) and determined.", "hints": ["Look at her actions."]}]}, {"type": "reveal", "prompt": "Long answers: models", "md": "1. **Words to her mother on her deathbed** (to drive the Portuguese out): they would have given her mother peace, hope and pride.\n2. **Support of Ullal's people and soldiers** shows they trusted, loved and respected their queen and shared her patriotism.\n3. **People of Ullal's feelings after victory:** joyful, relieved, proud, and free.\n4. **Inspiration to other rulers:** her success proved that the mighty Portuguese could be defeated, giving courage to others to resist foreign power."}, {"type": "summary", "points": ["Rani Abbakka of Ullal refused to pay tribute to the Portuguese.", "She built ships, traded with Arabia and fought back when the Portuguese attacked.", "After a four-day battle the Portuguese retreated and Ullal was free.", "Her bravery inspired other rulers."]}], "minutes": 40, "terms": [{"term": "tribute", "def": "money paid by a weaker ruler to a stronger one"}, {"term": "sovereign", "def": "having complete authority over oneself"}], "source": {"chapter": "ch05", "sections": ["Before we read", "Let us read", "Let us discuss", "Let us think and reflect"], "pages": "206–215"}, "id": "c7u5-06-abbakka-read", "chapter": "c7u5", "kind": "lesson"}, "c7u5-07-abbakka-language": {"title": "Rani Abbakka: Spelling, Speech, Listening, Speaking, Writing", "summary": "ie/ei spelling, silent letters, laugh expressions, reported speech, Rani Gaidinliu and more.", "blocks": [{"type": "text", "md": "**Spelling rule:** 'i' before 'e', except after 'c' (receive, deceive); exceptions include *seize, sovereign, their, weight*."}, {"type": "quiz", "id": "c7-ch05-quiz-spell", "title": "Fill in ie or ei", "questions": [{"type": "fill", "q": "c___ling", "answer": ["ei"], "explanation": "ceiling (after c: ei)", "placeholder": "ie/ei", "hints": ["After c."]}, {"type": "fill", "q": "bel___ve", "answer": ["ie"], "explanation": "believe", "placeholder": "ie/ei", "hints": ["i before e."]}, {"type": "fill", "q": "th___f", "answer": ["ie"], "explanation": "thief", "placeholder": "ie/ei", "hints": ["i before e."]}, {"type": "fill", "q": "ach___ve", "answer": ["ie"], "explanation": "achieve", "placeholder": "ie/ei", "hints": ["i before e."]}, {"type": "fill", "q": "perc___ve", "answer": ["ei"], "explanation": "perceive (after c)", "placeholder": "ie/ei", "hints": ["After c."]}, {"type": "fill", "q": "prot___n", "answer": ["ei"], "explanation": "protein (exception)", "placeholder": "ie/ei", "hints": ["Exception."]}, {"type": "fill", "q": "soc___ty", "answer": ["ie"], "explanation": "society", "placeholder": "ie/ei", "hints": ["i before e."]}, {"type": "fill", "q": "sh___ld", "answer": ["ie"], "explanation": "shield", "placeholder": "ie/ei", "hints": ["i before e."]}, {"type": "fill", "q": "w___ght", "answer": ["ei"], "explanation": "weight (exception)", "placeholder": "ie/ei", "hints": ["Exception."]}, {"type": "fill", "q": "fr___nd", "answer": ["ie"], "explanation": "friend", "placeholder": "ie/ei", "hints": ["i before e."]}]}, {"type": "text", "md": "**Silent letters:** in 'wrath' the w is not pronounced. More examples: campaign, knowledge, pneumonia, honour, calm, knife, gnome, psalm, castle, listen, island. Find more in your dictionary.\n\n**Expressions with 'laugh'.** *laughing stock* (a person everyone laughs at); *last laugh* (success after others doubted you). Meanings: **burst out laughing** = suddenly begin to laugh loudly; **don't make me laugh** = I find that idea ridiculous; **laugh until you cry** = laugh so much that tears come; **have a good laugh** = enjoy something funny. Use each in a sentence of your own."}, {"type": "text", "md": "**Direct and indirect speech.** Direct: *Rani Abbakka said, \"I will make them pay for this.\"* Indirect: *Rani said that she would make them pay for that.* Orders/requests become *told/requested/advised/instructed + to + verb*.\n\n**Tense changes:** present → past; past → past perfect; past perfect → no change; present continuous → past continuous; past continuous → past perfect continuous; present perfect → past perfect; will/can → would/could.\n\n**Pronouns:** I → she/he; you → she/he/they; we → they; my → her/his; our → their; me → her/him; us → them.\n\n**Time and place:** now → then; ago → before; today → that day; tomorrow → the next day; yesterday → the day before; next week → the following week; here → there; this → that; these → those."}, {"type": "quiz", "id": "c7-ch05-quiz-reported", "title": "Rewrite in indirect speech", "questions": [{"type": "fill", "q": "The teacher said, \"Women of valour have made significant contributions throughout history.\" The teacher remarked that ______", "answer": ["women of valour had made significant contributions throughout history"], "explanation": "Present perfect → past perfect.", "placeholder": "reported clause", "hints": ["has/have → had."]}, {"type": "fill", "q": "\"I enjoy reading historical novels,\" said Smitha. Smitha shared that ______", "answer": ["she enjoyed reading historical novels"], "explanation": "Present → past; I → she.", "placeholder": "reported clause", "hints": ["enjoy → enjoyed."]}, {"type": "fill", "q": "The captain said to the coach, \"Our team won the championship last year.\" The captain told the coach that ______", "answer": ["their team had won the championship the previous year", "their team had won the championship the year before"], "explanation": "Past → past perfect; our → their; last year → the previous year.", "placeholder": "reported clause", "hints": ["Three changes."]}, {"type": "fill", "q": "The class teacher said, \"Please turn off the lights when you leave.\" The class teacher requested ______", "answer": ["them to turn off the lights when they left"], "explanation": "A request: requested + them + to…", "placeholder": "reported clause", "hints": ["'You' → them."]}, {"type": "fill", "q": "\"Finish the work before dinner,\" said mother to Ravi. Mother advised ______", "answer": ["ravi to finish the work before dinner"], "explanation": "An order or advice: advised + Ravi + to.", "placeholder": "reported clause", "hints": ["Infinitive."]}, {"type": "fill", "q": "The vet said to the pet owner, \"Take the dog for a walk.\" The vet instructed ______", "answer": ["the pet owner to take the dog for a walk"], "explanation": "instructed + object + to.", "placeholder": "reported clause", "hints": ["Infinitive."]}]}, {"type": "reveal", "prompt": "V. The captain and the team (model answer)", "md": "The Captain remarked that **they needed to focus on their strategy for the final match**. To which one of the players replied that **he had some ideas on how they could improve their strategy**. The Captain advised the player to **make sure to share those ideas with the team during practice**."}, {"type": "callout", "kind": "note", "title": "🎧 Listening: Rani Gaidinliu", "md": "**Teacher:** Hello children, you have all read about Rani Abbakka. Let me share details about one more braveheart: Rani Gaidinliu. Gaidinliu was born on 26 January 1915 in the present-day Tamenglong district of Manipur. She was a Naga leader who led an armed uprising against the British in Manipur, Nagaland and Assam. She belonged to the Rongmei tribe, also known as the Kabui tribe. In 1927, at the age of 13, Gaidinliu joined the Heraka movement, which aimed at the revival of the Naga tribal religion and the establishment of self-rule for the Nagas, ending British rule. She was arrested in 1932 when she was just 16 and sentenced to life imprisonment. Between 1932 and 1947 she was kept in several prisons across the Northeast. After being released in 1947, she continued to work for the betterment of her community. The then Prime Minister described her as the 'Daughter of the Hills' and gave her the title 'Rani' for her courage. She was also awarded the Padma Bhushan in 1982. In 1991 she returned to her birthplace, where she died on 17 February 1993 at the age of 78. She was conferred the Birsa Munda Award posthumously. The State Government has developed a park along with a statue to honour her in Silchar, Assam. The Government of India issued a postal stamp in her honour in 1996 and a commemorative coin in 2015. What a braveheart indeed!"}, {"type": "quiz", "id": "c7-ch05-quiz-gaidinliu", "title": "Complete the bio-table", "questions": [{"type": "fill", "q": "Date of birth: January ______ 1915", "answer": ["26"], "explanation": "26 January 1915.", "placeholder": "date", "hints": ["Republic Day date."]}, {"type": "fill", "q": "Place of birth: Tamenglong district, ______", "answer": ["manipur"], "explanation": "Manipur.", "placeholder": "state", "hints": ["State."]}, {"type": "fill", "q": "Age when she joined the Heraka Movement:", "answer": ["13"], "explanation": "13 (in 1927).", "placeholder": "age", "hints": ["Teen."]}, {"type": "fill", "q": "Year of arrest:", "answer": ["1932"], "explanation": "1932.", "placeholder": "year", "hints": ["Imprisonment began."]}, {"type": "fill", "q": "Age of arrest:", "answer": ["16"], "explanation": "16.", "placeholder": "age", "hints": ["Just a teenager."]}, {"type": "fill", "q": "Title given: 'Daughter of the Hills', '______'", "answer": ["rani"], "explanation": "Rani.", "placeholder": "title", "hints": ["Queen."]}, {"type": "fill", "q": "Award: ______, Birsa Munda Award", "answer": ["padma bhushan"], "explanation": "Padma Bhushan (1982).", "placeholder": "award", "hints": ["1982."]}, {"type": "fill", "q": "Honour in Silchar, Assam: Park and ______", "answer": ["statue"], "explanation": "A park and a statue.", "placeholder": "word", "hints": ["Monument."]}, {"type": "fill", "q": "Commemorative coin issued in:", "answer": ["2015"], "explanation": "2015.", "placeholder": "year", "hints": ["Year."]}]}, {"type": "text", "md": "**Let us speak: pronunciation and stress.** Single-syllable words have no stress. **vassal** (va-sul; /a/ as in van; rhymes with apple); **successor** (suhk·seh·suh; final r not pronounced); **rash** (/a/ as in rat); **league** (leeg, long ee); **wrath** (roth; w is silent); **seize** (seez, not 'size'); **resolve** (ri-zolv; s becomes /z/)."}, {"type": "text", "md": "**Let us write: a conversation.** Write a conversation of about six to eight sentences each between two students, **Pratap and Tarana**, on the role played by women in forming India's identity as a strong nation. Start: *Pratap: Tarana, I have a lot of respect for women like… / Tarana: I believe in the capabilities of women. Did you…?*", "title": "Let us write"}, {"type": "exercise", "id": "c7-ch05-ex-pratap-tarana", "title": "Pratap and Tarana", "difficulty": "medium", "minutes": 12, "goal": "Write the dialogue (6–8 lines each).", "behavior": "Name women such as Rani Abbakka, Kalpana Chawla, Captain Lakshmi Sahgal.", "hints": ["Use 'Did you know…?'", "Respond to each other."], "checklist": ["Starts as given", "Mentions at least two women", "Gives their contribution", "Closing remark"], "solution": "Pratap: Tarana, I have a lot of respect for women like Rani Abbakka. Tarana: I believe in the capabilities of women. Did you know she built ships and traded with Arabia? Pratap: Yes! And Kalpana Chawla went to space. Tarana: Women are shaping India everywhere, and they inspire us every day.", "solution_lang": "text", "solution_explain": "A good dialogue takes turns and gives facts.", "mode": "selfcheck"}, {"type": "text", "md": "**Let us explore.** In groups of five, find facts about a brave woman (Rani Chennamma of Kittur, Rani Durgavati, Ahilyabai Holkar, Jhalkari Bai, Captain Lakshmi Sahgal, Kanaklata Barua, Kalpana Chawla…) and present: 1 childhood; 2 training/education; 3 achievements; 4 contributions; 5 what you have learnt from her."}, {"type": "summary", "points": ["Spelling: i before e except after c; exceptions: seize, weight, protein.", "Indirect speech shifts tense, pronouns, time and place; commands use told/advised + to.", "Rani Gaidinliu led the Heraka movement and was imprisoned 1932–1947.", "Silent letters, e.g. w in wrath."]}], "minutes": 50, "terms": [{"term": "indirect speech", "def": "reporting what someone said without quoting"}, {"term": "silent letter", "def": "a letter that is written but not pronounced"}], "source": {"chapter": "ch05", "sections": ["Let us learn", "Let us listen", "Let us speak", "Let us write", "Let us explore"], "pages": "215–222, 224"}, "id": "c7u5-07-abbakka-language", "chapter": "c7u5", "kind": "lesson"}, "c7u5-99-test": {"title": "Test: Unit 5 – Bravehearts", "kind": "test", "summary": "Check what you learned in this whole unit.", "blocks": [{"type": "quiz", "id": "c7-ch05-test", "pass_score": 0.7, "questions": [{"type": "single", "q": "Which is India's highest wartime gallantry award?", "options": ["Param Vir Chakra", "Maha Vir Chakra", "Shaurya Chakra", "Vir Chakra"], "answer": 0, "explanation": "PVC.", "hints": ["Highest."]}, {"type": "single", "q": "The Circle of Bravery in the National War Memorial is the ______.", "options": ["Veerta Chakra", "Tyag Chakra", "Amar Chakra", "Raksha Chakra"], "answer": 0, "explanation": "Six bronze murals.", "hints": ["Veer = brave."]}, {"type": "single", "q": "'Posthumously' means ______.", "options": ["after death", "before war", "in public", "with honour"], "answer": 0, "explanation": "After death.", "hints": ["Post."]}, {"type": "single", "q": "The prefix in 'malfunctioning' means ______.", "options": ["badly", "again", "former", "against"], "answer": 0, "explanation": "mal- = badly.", "hints": ["Prefix."]}, {"type": "single", "q": "In 'He stayed because he was tired', 'because he was tired' is the ______ clause.", "options": ["subordinate", "main"], "answer": 0, "explanation": "It depends on the main clause.", "hints": ["Reason."]}, {"type": "single", "q": "'Scorching sun' is an example of a ______.", "options": ["collocation", "palindrome", "binomial only", "prefix"], "answer": 0, "explanation": "Words that go together.", "hints": ["Pair."]}, {"type": "single", "q": "In 'My Dear Soldiers', soldiers are likened to ______.", "options": ["yogis", "kings", "birds", "children"], "answer": 0, "explanation": "Simile.", "hints": ["Treading lonely expanses."]}, {"type": "single", "q": "Rani Abbakka refused to ______ to the Portuguese.", "options": ["pay tribute", "sell flowers", "give land", "send ships"], "answer": 0, "explanation": "Annual tribute.", "hints": ["Ullal."]}, {"type": "single", "q": "Indirect speech: 'I enjoy reading,' said Smitha → Smitha said that ______.", "options": ["she enjoyed reading", "I enjoy reading", "she enjoys reading", "I enjoyed reading"], "answer": 0, "explanation": "Present → past; I → she.", "hints": ["Backshift."]}, {"type": "single", "q": "Spelling: ______ (the opposite of 'lose' as a noun) 'ach_ _ve'", "options": ["achieve", "acheive"], "answer": 0, "explanation": "i before e.", "hints": ["Rule."]}, {"type": "single", "q": "The Indian Army's motto is ______.", "options": ["Service Before Self", "Touch the Sky with Glory", "Be Auspicious Unto Us", "Unity in Diversity"], "answer": 0, "explanation": "Sevā Paramo Dharmaḥ.", "hints": ["Army."]}, {"type": "single", "q": "Rani Gaidinliu was arrested at the age of ______.", "options": ["16", "13", "26", "78"], "answer": 0, "explanation": "In 1932.", "hints": ["Teen."]}, {"type": "truefalse", "q": "An acrostic poem's first letters of each line spell a word.", "answer": true, "explanation": "E.g. PATRIOT or SOLDIER.", "hints": ["Definition."]}], "mode": "test"}], "id": "c7u5-99-test", "chapter": "c7u5", "minutes": 10}, "c8u1c1-01-warm-up": {"title": "Before we read: qualities, riddles and talk", "summary": "Name qualities of witty people, solve four riddles and talk about disagreements.", "minutes": 15, "blocks": [{"type": "text", "md": "Welcome to **Unit 1: Wit and Wisdom**. *Wit* means being quick, clever and often funny with words and ideas. In this chapter a witty poet helps a king and queen make peace. First, warm up your mind."}, {"type": "quiz", "id": "u1c1-q-qualities", "title": "Which qualities fit a person who uses wit?", "questions": [{"type": "multi", "q": "Choose the qualities a witty person usually has.", "options": ["wise", "stubborn", "clever", "humorous", "observant", "punctual"], "answer": [0, 2, 3, 4], "explanation": "Wit needs a quick mind (clever), a sense of humour, careful noticing (observant) and good judgement (wise). Being stubborn or punctual does not make someone witty. Other choices such as *creative*, *charming* and *confident* can also be argued — the book asks you to give reasons.", "hints": ["Wit is about thinking quickly and cleverly."]}], "intro": "The book lists: wise, serious, clever, powerful, humorous, stubborn, courageous, observant, charming, creative, punctual, confident, energetic. Pick and justify with a partner."}, {"type": "reveal", "prompt": "Activity I: Which TWO more qualities would you add from the box, and why?", "md": "Good answers: **creative** (a witty person finds new ideas), **charming** (humour makes people like them), **confident** (you need courage to speak cleverly in front of a king). Always give a reason: *'Creative, because Rama invented a new way to explain things.'*"}, {"type": "text", "md": "Now try four **riddles** with a partner. Say your answer aloud before you press *Reveal*.", "title": "Activity II: Riddles"}, {"type": "reveal", "prompt": "Riddle 1: I can be a friend or a foe, depending on how you use me. I can bring both joy or pain. What am I?", "md": "**Words.** Kind words give joy; harsh words hurt."}, {"type": "reveal", "prompt": "Riddle 2: What is always in front of you but can’t be seen?", "md": "**The future.**"}, {"type": "reveal", "prompt": "Riddle 3: I can be measured, but I cannot be touched. I can be spent, but I cannot be saved. What am I?", "md": "**Time.** You can measure it in hours, spend it, but never save it for later."}, {"type": "reveal", "prompt": "Riddle 4: What has to be shared before you can keep it?", "md": "**A secret.**"}, {"type": "text", "md": "**Talk in pairs (four questions):**\n1. Why are humour and wit important in a person?\n2. Why did kings and queens like to keep witty people in their courts?\n3. If you had to settle an argument between two people, what would you do?\n4. Have you seen a small misunderstanding become a big problem? How was it solved?", "title": "Discuss in pairs"}, {"type": "reveal", "prompt": "Model answers to the four discussion questions", "md": "1. Humour lightens tense moments and helps us see problems from a new side.\n2. Witty advisers could tell the truth gently, give clever solutions and cheer up the court.\n3. Listen to both sides calmly, find the real cause, then help each person see the other's view.\n4. Example: a friend did not reply to a message and I thought she was angry; we talked, and she had lost her phone. (Use your own example.)"}, {"type": "summary", "points": ["Wit is quick, clever thinking, often with humour.", "The riddle answers are words, the future, time and a secret.", "Witty people can calm quarrels and solve problems with kindness."]}], "terms": [{"term": "wit", "def": "the ability to say or think clever, funny things quickly"}, {"term": "riddle", "def": "a puzzling question with a clever answer"}], "source": {"chapter": "u1c1", "pages": "1-2"}, "id": "c8u1c1-01-warm-up", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-02-read-listen": {"title": "Read and listen: The Wit That Won Hearts", "summary": "Follow the story of Tenali Rama, King Krishnadeva Raya and Queen Thirumalambal.", "minutes": 25, "blocks": [{"type": "text", "md": "Press **🔊 Listen** on each part to hear it. This is a retelling in simple words of the story in your textbook; open your textbook beside it to enjoy the original wording.", "title": "How to use this lesson"}, {"type": "text", "md": "**Part 1 — A golden age.** The Vijayanagara Empire was famous for its glory, wealth and culture. Its most respected ruler, King Krishnadeva Raya, ruled from 1509 to 1529 CE. People call his time the Golden Era because art, literature and architecture grew and flourished. He loved learning, was a brave warrior and was also a gifted poet. His great works include the epic *Amuktamalyada* and the Sanskrit play *Jambavati Parinayam*.", "title": "Reading — Part 1"}, {"type": "text", "md": "**Part 2 — The court of poets.** The king’s court had eight celebrated poets called the *Ashtadiggajas*. Two of them were Allasani Peddana and Tenali Ramakrishna. Rama became special because of his quick wit and humour. He was both a poet and a clever adviser, and he found clever answers to problems that looked impossible. That made him loved in the empire’s history.", "title": "Reading — Part 2"}, {"type": "text", "md": "**Part 3 — The quarrel.** Even wise rulers argue. One day the king quarrelled with Queen Thirumalambal over something small. For weeks he did not speak to her and stopped visiting her. The palace corridors, once cheerful, became quiet and lonely. The queen was upset. She tried to fix things but could not, so she went to Tenali Rama for help.", "title": "Reading — Part 3"}, {"type": "text", "md": "**Part 4 — The queen’s story.** She explained: the king wrote a poem full of vague words about the sun, moon, stars and sky, but it did not make much sense. When he recited it to his ministers, they all made excuses and avoided him. Late in the evening he came to her to recite it. She was very tired after a long day and yawned, again and again. The king thought she was insulting his poem and stormed off. She said she would have chosen another day if she had known, and she begged Rama to help the king understand.", "title": "Reading — Part 4"}, {"type": "text", "md": "**Part 5 — Rama’s plan.** Rama said he would try, but he needed a well-planned strategy and some time. The queen thanked him warmly. Next morning the court was busy and full of people, with carved pillars and sunlight on rich rugs, yet the air felt tense. The king sat on his throne looking stern; the quarrel still bothered him.", "title": "Reading — Part 5"}, {"type": "text", "md": "**Part 6 — The magic seeds.** The court was discussing how to grow more paddy. Ministers suggested bigger irrigation networks and better manure. Rama watched quietly, smiling. When the king called him, he came with a plate of paddy seeds and said these new seeds would give three times the harvest. Courtiers whispered sarcastically that they must be magic seeds, maybe from the moon! The king frowned: such a crop would need special soil, manure and pest control, and farmers might suffer if it failed. Rama replied calmly that the real problem was not the seeds but the person who sows them.", "title": "Reading — Part 6"}, {"type": "text", "md": "**Part 7 — The yawn.** The king roared at him to speak clearly. Rama said that if the sower yawns while sowing, the seeds would scatter unevenly. The whole court burst into laughter. The king, surprised, sighed and yawned himself. Rama asked gently: is there anyone in the world who does not yawn? It is as natural as breathing. The king’s face changed. He remembered scolding the queen for yawning, and he understood how unfair he had been.", "title": "Reading — Part 7"}, {"type": "text", "md": "**Part 8 — Peace.** That evening the king went to the queen gently. He said he had been foolish, that his pride had blinded him, and he was sorry. The queen, who had longed for this moment, smiled. She suggested they leave the quarrel behind and said she would love to hear his poem. The royal couple later gave Rama valuable gifts. Their bond was restored and the palace was full of joy and laughter again.", "title": "Reading — Part 8"}, {"type": "text", "md": "Tip: the book calls the harder words in the story *renowned*, *illustrious*, *patron*, *eminent*, *insurmountable*, *trivial*, *forlorn*, *distraught*, *vague*, *strategy*, *profusely*, *bustling*, *intricately*, *exquisite*, *ornate*, *gnawed*, *yield*, *sarcasm*, *snickers*, *absurd*, *unfazed*, *furrowed*, *sceptical*, *keenly*, *gesture*, *orchestrated* and *brimmed*. Learn them with the cards below.", "title": "Word list"}, {"type": "flashcards", "id": "u1c1-cards-words", "title": "Vocabulary from the story", "cards": [{"front": "renowned", "back": "well known"}, {"front": "illustrious", "back": "respected and famous"}, {"front": "patron", "back": "a supporter"}, {"front": "eminent", "back": "famous"}, {"front": "insurmountable", "back": "undefeatable; too big to overcome"}, {"front": "trivial", "back": "unimportant"}, {"front": "forlorn", "back": "lonely"}, {"front": "distraught", "back": "very upset"}, {"front": "vague", "back": "unclear"}, {"front": "strategy", "back": "a plan"}, {"front": "profusely", "back": "in large amounts"}, {"front": "bustling", "back": "busy"}, {"front": "intricately", "back": "in a detailed way"}, {"front": "exquisite", "back": "fine and attractive"}, {"front": "ornate", "back": "decorative"}, {"front": "gnawed", "back": "(here) bothered"}, {"front": "yield", "back": "(here) harvest"}, {"front": "sarcasm", "back": "mockery"}, {"front": "snickers", "back": "suppressed laughter"}, {"front": "absurd", "back": "illogical"}, {"front": "unfazed", "back": "not worried"}, {"front": "furrowed", "back": "wrinkled"}, {"front": "sceptical", "back": "doubtful"}, {"front": "keenly", "back": "intensely"}, {"front": "gesture", "back": "a movement of the hand or head to express an idea"}, {"front": "orchestrated", "back": "arranged"}, {"front": "brimmed", "back": "overflowed"}]}, {"type": "quiz", "id": "u1c1-q-read", "title": "Check your reading", "questions": [{"type": "order", "q": "Put the events in order.", "items": ["The king and queen quarrel", "The queen asks Rama for help", "Rama brings paddy seeds to court", "Courtiers laugh at the yawning joke", "The king apologises to the queen"], "explanation": "This is the order of the story: quarrel → help → seeds → laughter and realisation → apology.", "hints": ["Start with the quarrel."]}, {"type": "single", "q": "Why did the king stop speaking to the queen?", "options": ["She had criticised his poem aloud", "She yawned while he recited and he felt insulted", "She refused to listen to Rama", "She laughed at the ministers"], "answer": 1, "explanation": "The queen was exhausted and yawned. The king took it as disrespect, but it was only tiredness.", "hints": ["Think about the evening of the recital."]}, {"type": "truefalse", "q": "Rama directly told the king he was wrong.", "answer": false, "explanation": "Rama used a funny story about yawning so the king would realise it himself — a wise, gentle method.", "hints": ["Re-read the story."]}], "intro": "Short check before the detailed questions."}, {"type": "summary", "points": ["King Krishnadeva Raya ruled a golden age of art and learning.", "A yawn caused a quarrel because the king misunderstood it.", "Rama used humour and the paddy-seed story to make the king see the truth.", "The king apologised and the palace was happy again."]}], "source": {"chapter": "u1c1", "pages": "2-7"}, "id": "c8u1c1-02-read-listen", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-03-think-reflect": {"title": "Let us discuss, think and reflect", "summary": "Rectify false statements and answer the extract and long questions about the story.", "minutes": 25, "blocks": [{"type": "text", "md": "Five statements below are **false**. Say what is true. Then answer questions about two extracts.", "title": "Let us discuss"}, {"type": "quiz", "id": "u1c1-q-rectify", "title": "Rectify the false statements", "questions": [{"type": "single", "q": "‘The queen insulted the king by speaking against his poem.’ What is true?", "options": ["She yawned from tiredness and the king misunderstood", "She hid the poem", "She wrote a better poem", "She left the palace"], "answer": 0, "explanation": "The queen never criticised the poem. Her yawns came from exhaustion.", "hints": ["Why did she yawn?"]}, {"type": "single", "q": "‘Tenali Rama immediately went to the king and convinced him.’ What is true?", "options": ["He said he needed time to plan a strategy and acted next morning", "He sent a letter", "He refused to help", "He asked the ministers to talk"], "answer": 0, "explanation": "Rama promised to help but wanted a well-planned approach first.", "hints": ["Remember the conversation with the queen."]}, {"type": "single", "q": "‘The courtiers admired the king’s poem.’ What is true?", "options": ["They avoided him and made excuses", "They clapped loudly", "They copied it", "They sang it"], "answer": 0, "explanation": "His ministers avoided hearing it because it was vague and confusing.", "hints": ["What did the ministers do when he tried to recite?"]}, {"type": "single", "q": "‘The ministers were eager to hear Rama’s paddy idea.’ What is true?", "options": ["They were sarcastic and doubtful and snickered", "They cheered", "They ignored him", "They asked for the seeds"], "answer": 0, "explanation": "Courtiers joked that the seeds were magic or from the moon.", "hints": ["Recall the sarcastic whispers."]}, {"type": "single", "q": "‘The king never realised his mistake.’ What is true?", "options": ["He realised it, felt regret and apologised that evening", "He stayed angry", "He banished Rama", "He wrote a new poem"], "answer": 0, "explanation": "Rama’s yawning joke made the king understand; he apologised.", "hints": ["Look at the end of the story."]}]}, {"type": "text", "md": "**Extract 1** — the queen says the king thought she was disrespecting his poem and stormed off; she begs Rama to help; Rama says he needs a well-planned approach and time.", "title": "Think and reflect: Extract 1"}, {"type": "quiz", "id": "u1c1-q-ext1", "title": "Extract 1 questions", "questions": [{"type": "single", "q": "(ii) The queen says she would have chosen another day if she had known. This suggests that…", "options": ["She is angry at the king for overreacting.", "She regrets the unintended misunderstanding.", "She believes the poem was not worth listening to.", "She is worried the king might punish her."], "answer": 1, "explanation": "She did not mean to hurt him; she is sorry about the misunderstanding (B).", "hints": ["Is she angry or sorry?"]}, {"type": "fill", "q": "(iv) The king’s reaction shows he is sensitive and ______ in his poetry. (has a lot of faith / takes great pride)", "answer": ["takes great pride"], "explanation": "His strong reaction shows pride in his poetry.", "placeholder": "has a lot of faith / takes great pride", "hints": ["Look for the exact word."]}]}, {"type": "reveal", "prompt": "(i) Why does the queen believe only Tenali Rama can help? (iii) How does Rama’s response show wisdom?", "md": "(i) Rama is brilliant and witty, a trusted adviser known for solving hard problems with cleverness, and the king respects him.\n\n(iii) He does not rush. He asks for time to plan, listens patiently, and chooses a gentle, indirect strategy rather than blaming anyone — that shows patience, wisdom and good problem-solving."}, {"type": "text", "md": "**Extract 2** — the king says he has been foolish, overreacted and let pride blind him; the queen says they can leave the quarrel behind and she would love to hear his poem.", "title": "Extract 2"}, {"type": "quiz", "id": "u1c1-q-ext2", "title": "Extract 2 questions", "questions": [{"type": "single", "q": "(iii) The king acknowledges his pride clouded his judgement. This shows…", "options": ["intelligence and courage", "maturity and self-awareness"], "answer": 1, "explanation": "Admitting a mistake shows maturity and self-awareness.", "hints": ["Which quality is about knowing yourself?"]}]}, {"type": "reveal", "prompt": "(i) ‘I let my pride blind me’ means… (ii) Why does the queen say ‘If you like, we can leave this quarrel behind us’? (iv) One quality of the queen shown by her reply.", "md": "(i) …his pride stopped him from seeing the truth and being fair to the queen.\n\n(ii) She is polite and respectful, wants peace, and lets the king decide; it shows she holds no anger.\n\n(iv) She is forgiving (also kind, gracious, loving)."}, {"type": "text", "md": "Answer in 3–5 sentences each. Use the model answers to check.", "title": "Answer the following questions"}, {"type": "reveal", "prompt": "1. Why was Krishnadeva Raya’s reign called the ‘Golden Era’?", "md": "Art, literature and architecture flourished. The king was a patron of learning and a poet himself, and his court was home to eight great poets."}, {"type": "reveal", "prompt": "2. How did Tenali Ramakrishna gain a special place in the court?", "md": "Through his quick wit and humour, as a poet and a witty adviser. His clever solutions to seemingly impossible problems made him loved."}, {"type": "reveal", "prompt": "3. How did the quarrel affect the palace?", "md": "The king stopped speaking to and visiting the queen. A shadow fell on the palace; the cheerful corridors turned quiet and lonely, and the queen was distraught."}, {"type": "reveal", "prompt": "4. What strategy did Rama use?", "md": "He pretended to present magic paddy seeds, then said the real problem was the sower who yawns. The laugh and the remark that everyone yawns made the king see that yawning is natural, not disrespect."}, {"type": "reveal", "prompt": "5. How did the courtiers react to the ‘special’ seeds?", "md": "They were sarcastic: whispered that the seeds were magic or from the moon, snickered, and doubted him. The king frowned and called the idea absurd."}, {"type": "reveal", "prompt": "6. How does the story conclude and what lesson can be learnt?", "md": "The king apologised, the queen forgave him, and Rama was rewarded. Lessons: do not judge others in anger; misunderstandings are solved by patience, humour and honest talk; pride can blind us."}, {"type": "summary", "points": ["False statements can be corrected using details from the story.", "The queen’s words show regret and forgiveness.", "The king’s apology shows maturity.", "Rama’s method: plan, humour, let the person realise it himself."]}], "source": {"chapter": "u1c1", "pages": "7-9"}, "id": "c8u1c1-03-think-reflect", "chapter": "c8u1c1", "kind": "lesson"}, "c8u1c1-04-learn": {"title": "Let us learn: words, sounds, compounds and if-clauses", "summary": "Practise expressions, sound words, compound words and conditional sentences.", "minutes": 30, "blocks": [{"type": "text", "md": "A. Complete the paragraph with expressions from the story.", "title": "Part I — Expressions"}, {"type": "quiz", "id": "u1c1-q-expr", "title": "Fill the paragraph", "questions": [{"type": "fill", "q": "At a family dinner an argument began and a ______ fell over the room (pick:
